<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Masuk · Sistem Kerja Pokama</title>
<meta name="robots" content="noindex">
<link rel="icon" href="pokama-logo.png">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#F3F5F8;color:#1F2933;font:15px/1.45 Nunito,system-ui,sans-serif;padding:24px 16px}
.card{width:100%;max-width:420px;background:#fff;border:1px solid #E3E6EB;border-radius:22px;padding:36px 32px;display:flex;flex-direction:column;gap:16px;box-shadow:0 20px 50px rgba(29,49,73,.08)}
.logo{height:40px;align-self:flex-start}
h1{margin:8px 0 0;font-size:26px;font-weight:900}
.sub{margin:-8px 0 4px;color:#5B6573;font-size:14px}
label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:800;color:#3B4250}
input{height:48px;border:1px solid #D3D7DE;border-radius:12px;padding:0 14px;font:inherit;font-size:15px}
input:focus{outline:2px solid #09BEAF;outline-offset:1px;border-color:#09BEAF}
.btn{height:50px;border-radius:12px;border:0;font:inherit;font-size:15px;font-weight:900;cursor:pointer;width:100%}
.pri{background:#09BEAF;color:#1D3149}
.sec{background:#fff;color:#1D3149;border:1px solid #1D3149;display:flex;align-items:center;justify-content:center;gap:10px}
.or{display:flex;align-items:center;gap:10px;color:#8A94A3;font-size:12px;font-weight:700}.or::before,.or::after{content:"";flex:1;height:1px;background:#E3E6EB}
.links{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.link{border:0;background:none;padding:6px 0;font:inherit;font-weight:800;color:#067A70;cursor:pointer}
.link.mute{color:#5B6573;font-weight:700}
.err{display:none;margin:0;font-size:13px;color:#9A3F0A;background:#FCEBDD;border-radius:10px;padding:10px 12px}
.ok{display:none;margin:0;font-size:13px;color:#067A70;background:#DDF5F2;border-radius:10px;padding:10px 12px}
.step{display:none;flex-direction:column;gap:14px}.step.on{display:flex}
.wa{display:flex;align-items:center;height:48px;border:1px solid #D3D7DE;border-radius:12px;overflow:hidden}.wa span{padding:0 12px;height:100%;display:flex;align-items:center;background:#F3F5F8;font-weight:800;color:#3B4250}.wa input{border:0;height:100%;flex:1;border-radius:0}
.foot{text-align:center;font-size:12px;color:#8A94A3;margin-top:4px}
</style>
</head>
<body>
<main class="card" aria-label="Masuk">
<img class="logo" src="pokama-logo.png" alt="Pokama">
<h1>Masuk</h1>
<p class="sub">Sistem Kerja Harian · PT Popo Karya Investama</p>

<div class="step on" id="s-main">
<button class="btn sec" type="button" id="g"><svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.5l6.7-6.7C35.6 2.4 30.2 0 24 0 14.6 0 6.6 5.4 2.6 13.2l7.8 6.1C12.3 13.6 17.6 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4 7.1-10 7.1-17.5z"/><path fill="#FBBC05" d="M10.4 28.7c-.5-1.4-.8-3-.8-4.7s.3-3.2.8-4.7l-7.8-6.1C1 16.5 0 20.1 0 24s1 7.5 2.6 10.8l7.8-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.5-5.8c-2.1 1.4-4.9 2.3-8.4 2.3-6.4 0-11.7-4.1-13.6-9.8l-7.8 6.1C6.6 42.6 14.6 48 24 48z"/></svg>Masuk dengan akun Google</button>
<div class="or">atau</div>
<form id="f" style="display:flex;flex-direction:column;gap:14px" autocomplete="on">
<label>Username<input id="u" type="text" autocomplete="username" placeholder="misalnya wiranata" required></label>
<label>Password<input id="p" type="password" autocomplete="current-password" placeholder="••••••••" required></label>
<p class="err" id="e">Isi username dan password.</p>
<button class="btn pri" type="submit">Masuk</button>
</form>
<div class="links"><button class="link" type="button" id="w">Masuk dengan kode WhatsApp</button><button class="link mute" type="button" id="fg">Lupa password?</button></div>
<p class="ok" id="fo">Tautan reset dikirim ke email dan WhatsApp yang terdaftar.</p>
</div>

<div class="step" id="s-wa">
<label>Nomor WhatsApp<span class="wa"><span>+62</span><input id="ph" type="tel" inputmode="numeric" placeholder="853 1132 4738"></span></label>
<button class="btn pri" type="button" id="send">Kirim kode</button>
<button class="link mute" type="button" data-back>Kembali</button>
</div>

<div class="step" id="s-code">
<label>Kode 6 angka<input id="code" type="text" inputmode="numeric" maxlength="6" placeholder="••••••" style="font-size:22px;letter-spacing:.4em"></label>
<p class="sub" id="sent" style="margin:0"></p>
<button class="btn pri" type="button" id="enter">Masuk</button>
<button class="link mute" type="button" data-back>Ganti nomor</button>
</div>

<p class="foot">Staf cabang masuk lewat Rentalaja App.</p>
</main>
<script>
(function(){
  var mobile = function(){ return window.matchMedia('(max-width: 700px)').matches; };
  var LAND = { intifa: 'Review.dc.html', reza: 'UnitBisnis.dc.html', keuangan: 'UnitBisnis.dc.html' };
  function go(user){
    var u = (user || '').trim().toLowerCase().split(/[\s.@]/)[0];
    try { localStorage.setItem('pokama-user', u); } catch (e) {}
    location.href = mobile() ? 'KKHHp.dc.html' : (LAND[u] || 'Main.dc.html');
  }
  function show(id){ ['s-main','s-wa','s-code'].forEach(function(s){ document.getElementById(s).classList.toggle('on', s === id); }); }
  document.getElementById('g').onclick = function(){ go('ghozy'); };
  document.getElementById('f').onsubmit = function(ev){
    ev.preventDefault();
    var u = document.getElementById('u').value, p = document.getElementById('p').value;
    if (!u.trim() || !p) { document.getElementById('e').style.display = 'block'; return; }
    go(u);
  };
  document.getElementById('fg').onclick = function(){ document.getElementById('fo').style.display = 'block'; };
  document.getElementById('w').onclick = function(){ show('s-wa'); document.getElementById('ph').focus(); };
  document.getElementById('send').onclick = function(){
    var ph = document.getElementById('ph').value.replace(/\D/g, '');
    if (ph.length < 8) { document.getElementById('ph').focus(); return; }
    document.getElementById('sent').textContent = 'Kode dikirim ke WhatsApp +62 ' + ph + '.';
    show('s-code'); document.getElementById('code').focus();
  };
  document.getElementById('enter').onclick = function(){
    if (document.getElementById('code').value.replace(/\D/g, '').length < 6) { document.getElementById('code').focus(); return; }
    go('');
  };
  Array.prototype.forEach.call(document.querySelectorAll('[data-back]'), function(b){ b.onclick = function(){ show('s-main'); }; });
})();
</script>
</body>
</html>
