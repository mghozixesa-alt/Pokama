<div style="display: flex; gap: 6px"><button type="button" onClick="{{p.fix}}" style="flex: 1 1 0; height: 44px; border-radius: 10px; border: 0; background: #1D3149; color: #FFFFFF; font: inherit; font-size: 13px; font-weight: 800; cursor: pointer">Sudah diperbaiki</button><button type="button" onClick="{{p.disagree}}" style="flex: 1 1 0; height: 44px; border-radius: 10px; border: 1px solid #E3E6EB; background: #FFFFFF; color: #3B4250; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer">Tidak setuju</button></div>
</sc-if>
<sc-if value="{{p.revCan}}" hint-placeholder-val="{{false}}">
<div style="display: flex; gap: 6px"><button type="button" onClick="{{p.accept}}" style="flex: 1 1 0; height: 44px; border-radius: 10px; border: 0; background: #DDF5F2; color: #067A70; font: inherit; font-size: 13px; font-weight: 900; cursor: pointer">Terima</button><button type="button" onClick="{{p.reopen}}" style="flex: 1 1 0; height: 44px; border-radius: 10px; border: 1px solid #F0C2A3; background: #FFFFFF; color: #9A3F0A; font: inherit; font-size: 13px; font-weight: 800; cursor: pointer">Masih kurang</button></div>
</sc-if>
</div>
</sc-for>
</div></div>
<footer style="flex-shrink: 0; background: #FFFFFF; border-top: 1px solid #E3E6EB; padding: 10px 14px 14px; display: flex; flex-direction: column; gap: 6px">
<sc-if value="{{d.canResubmit}}" hint-placeholder-val="{{false}}"><button type="button" onClick="{{d.resubmit}}" style="height: 50px; border-radius: 12px; border: 0; background: #1D3149; color: #FFFFFF; font: inherit; font-size: 15px; font-weight: 900; cursor: pointer">Ajukan ulang ke reviewer</button></sc-if>
<sc-if value="{{d.canApprove}}" hint-placeholder-val="{{false}}"><button type="button" onClick="{{d.approve}}" style="height: 50px; border-radius: 12px; border: 0; background: #09BEAF; color: #1D3149; font: inherit; font-size: 15px; font-weight: 900; cursor: pointer">Setujui · pekerjaan selesai</button></sc-if>
<sc-if value="{{d.canSendBack}}" hint-placeholder-val="{{false}}"><button type="button" onClick="{{d.sendBack}}" style="height: 50px; border-radius: 12px; border: 0; background: #C2410C; color: #FFFFFF; font: inherit; font-size: 15px; font-weight: 900; cursor: pointer">Kirim revisi · tenggat 2 hari kerja</button></sc-if>
<span style="font-size: 12px; font-weight: 700; color: #5B6573; text-align: center">{{d.lock}}</span>
</footer>
</sc-if>
</div>
</script>
<script>

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tab: 'pic', sel: null, pts: {}, st: {}, drafts: {} };
  }
  renderVals() {
    const I = [
      { id: 'tr', mine: 'pic', title: 'Restrukturisasi TripinAja', unit: 'TRIPINAJA', who: 'Reviewer Intifa (Kepala Staf)', ver: 'v1', round: 1, st: 'rev', due: 'Lewat 2 hari', late: 2, kkh: 'Slot revisi: KKH hari ini 11.00', pts: [['Pisahkan rekening operasional dan dana titipan tamu', 'open', ''], ['Tambahkan SOP pembatalan dan refund trip', 'open', '']] },
      { id: 'hb', mine: 'pic', title: 'Paket Halaman Belakang Kebon', unit: 'TRIPINAJA', who: 'Reviewer Intifa (Kepala Staf)', ver: 'v2', round: 1, st: 'wait', due: 'Diajukan 25 Okt', late: 0, kkh: '', pts: [['Harga paket weekend dan weekday dipisah', 'fixed', 'Paket v2, halaman 2']] },
      { id: 'ar', mine: 'rev', title: 'SOP pembatalan & refund trip', unit: 'TRIPINAJA · PIC ARIQ', who: 'PIC Ariq', ver: 'v2', round: 1, st: 'wait', due: 'Cek sebelum Rab 28 Okt', late: 0, kkh: '', pts: [['Batas refund penuh H-3', 'fixed', 'SOP v2, poin 2'], ['Refund ke rekening dana titipan, bukan operasional', 'fixed', 'SOP v2, poin 5'], ['Biaya admin 10% dihapus', 'disagree', 'Biaya admin tetap untuk menutup biaya transfer; dijelaskan di halaman 3']] },
      { id: 'ny', mine: 'rev', title: 'Kalender konten Desember', unit: 'TRIPINAJA · PIC NAYLA', who: 'PIC Nayla', ver: 'v1', round: 1, st: 'rev', due: 'Tenggat Kam 29 Okt', late: 0, kkh: '', pts: [['Tambahkan 4 konten paket villa', 'open', '']] }
    ];
    const P = { open: ['Terbuka', '#FCEBDD', '#9A3F0A'], fixed: ['Diperbaiki · cek', '#FDF3D7', '#7A5200'], disagree: ['Tidak setuju · cek', '#E5EEF9', '#1E5AA8'], ok: ['Diterima', '#DDF5F2', '#067A70'] };
    const ST = { rev: ['Perlu revisi', '#FCEBDD', '#9A3F0A', '#C2410C'], wait: ['Menunggu review', '#FDF3D7', '#7A5200', '#D99A00'], done: ['Selesai', '#DDF5F2', '#067A70', '#09BEAF'] };
    const { tab, sel, pts, st, drafts } = this.state;
    const full = I.map(it => ({ ...it, st0: it.st, st: st[it.id] || it.st, list: it.pts.map((p, i) => { const o = pts[it.id + '|' + i]; return { text: p[0], s: o ? o.s : p[1], ans: o ? o.a : p[2] }; }) }));
    const items = full.filter(it => it.mine === tab).map(it => {
      const s = ST[it.st], okN = it.list.filter(p => p.s === 'ok').length;
      return { title: it.title, who: it.who, ver: it.ver, due: it.due, dueFg: it.late ? '#9A3F0A' : '#3B4250', st: s[0], stBg: s[1], stFg: s[2], bar: s[3], pct: Math.round(okN / it.list.length * 100) + '%', pt: okN + '/' + it.list.length + ' diterima', open: () => this.setState({ sel: it.id }) };
    });
    const c = full.find(it => it.id === sel);
    let d = { title: '', unit: '', facts: [], points: [], hasAlert: false, alert: '', alertBg: '', alertFg: '', canResubmit: false, canApprove: false, canSendBack: false, lock: '', resubmit: () => {}, approve: () => {}, sendBack: () => {} };
    if (c) {
      const isPic = c.mine === 'pic';
      const setP = (i, s, a) => this.setState({ pts: { ...pts, [c.id + '|' + i]: { s, a } } });
      const allOk = c.list.every(p => p.s === 'ok'), anyOpen = c.list.some(p => p.s === 'open');
      const s0 = ST[c.st];
      d = {
        title: c.title, unit: c.unit,
        facts: [{ k: 'STATUS', v: s0[0], fg: s0[2] }, { k: isPic ? 'REVIEWER' : 'PIC', v: c.who.replace(/^(Reviewer|PIC) /, ''), fg: '#1F2933' }, { k: 'VERSI · PUTARAN', v: c.ver + ' · ' + c.round, fg: '#1F2933' }, { k: 'TENGGAT', v: c.due, fg: c.late ? '#9A3F0A' : '#1F2933' }],
        hasAlert: c.st !== 'done' && (c.late > 0 || !!c.kkh), alert: c.late ? 'Lewat ' + c.late + ' hari. Kepala Staf sudah diberi tahu. ' + c.kkh + '.' : c.kkh, alertBg: c.late ? '#FCEBDD' : '#DDF5F2', alertFg: c.late ? '#9A3F0A' : '#067A70',
        points: c.list.map((p, i) => { const k = c.id + '|' + i; return {
          no: i + 1, text: p.text, st: P[p.s][0], bg: P[p.s][1], fg: P[p.s][2], hasAns: !!p.ans, ans: p.ans, ansLabel: p.s === 'disagree' ? 'Alasan:' : 'Bukti:',
          picCan: isPic && c.st === 'rev' && p.s === 'open', revCan: !isPic && c.st === 'wait' && (p.s === 'fixed' || p.s === 'disagree'),
          draft: drafts[k] || '', onDraft: (e) => this.setState({ drafts: { ...drafts, [k]: e.target.value } }),
          fix: () => { if ((drafts[k] || '').trim()) setP(i, 'fixed', drafts[k].trim()); }, disagree: () => { if ((drafts[k] || '').trim()) setP(i, 'disagree', drafts[k].trim()); },
          accept: () => setP(i, 'ok', p.ans), reopen: () => setP(i, 'open', '')
        }; }),
        canResubmit: isPic && c.st === 'rev' && !anyOpen, canApprove: !isPic && c.st === 'wait' && allOk, canSendBack: !isPic && c.st === 'wait' && anyOpen,
        resubmit: () => this.setState({ st: { ...st, [c.id]: 'wait' } }), approve: () => this.setState({ st: { ...st, [c.id]: 'done' } }), sendBack: () => this.setState({ st: { ...st, [c.id]: 'rev' } }),
        lock: c.st === 'done' ? 'Selesai. Masuk realisasi output di Performa.' : isPic ? (c.st === 'wait' ? 'Sudah diajukan. Hanya reviewer yang bisa menyatakan selesai.' : anyOpen ? 'Jawab semua poin dulu, lalu ajukan ulang.' : 'Semua poin sudah dijawab.') : (c.st === 'rev' ? 'Menunggu PIC menjawab semua poin.' : allOk ? 'Semua poin diterima.' : 'Terima atau kembalikan setiap poin.')
      };
    }
    const nPic = full.filter(it => it.mine === 'pic' && it.st === 'rev').length, nRev = full.filter(it => it.mine === 'rev' && it.st === 'wait').length;
    return {
      isList: !c, isDetail: !!c, items, d, back: () => this.setState({ sel: null }),
      tabs: [['pic', 'Saya kerjakan (' + nPic + ')'], ['rev', 'Saya review (' + nRev + ')']].map(([k, label]) => ({ label, on: tab === k ? 'true' : 'false', bg: tab === k ? '#09BEAF' : '#2C4664', fg: tab === k ? '#1D3149' : '#FFFFFF', pick: () => this.setState({ tab: k }) })),
      tabNote: tab === 'pic' ? 'Pekerjaan Anda yang sedang direview. Selesai hanya bila reviewer menyetujui.' : 'Pekerjaan tim yang menunggu review Anda, paling lambat 2 hari.',
      tabKkh: '#8A94A3', tabRev: '#067A70', revBadge: nPic + nRev
    };
  }
}

dcBoot(Component);
</script>
