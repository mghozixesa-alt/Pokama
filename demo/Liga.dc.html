    const R = 'https://rentalaja-app.vercel.app/#/MgmtLini';
    const A = [
      { code: 'RA', name: 'Rentalaja', champ: '', sub: 'Gabungan semua cabang, Experience, dan ATVaja', stage: 5, goal: 'Profit', st: 'y', p: [26, 20, 15, 10], q: 72, qPrev: 74, lastW: 1, lastQ: 1, streak: 24, badges: ['kas', 'laporan', 'zero'], link: R, treat: 'Pendampingan Kepala Staf', treatNote: 'Fokus menutup minus di Bandung; Garut Kota tetap jadi penopang kas.' },
      { code: 'WG', name: 'TripinAja', champ: 'Wiranata', sub: '', stage: 4, goal: 'Profit', st: 'g', p: [30, 23, 18, 12], q: 81, qPrev: 76, lastW: 2, lastQ: 2, streak: 18, badges: ['laporan', 'kolab'], link: '', treat: 'Kolaborasi', treatNote: 'Dihubungkan dengan Rentalaja Experience untuk paket trip + menginap.' },
      { code: 'NA', name: 'Niagaaja', champ: 'Yusril Firdaus', sub: '', stage: 4, goal: 'Penguat portofolio', st: 'y', p: [24, 18, 15, 9], q: 63, qPrev: 66, lastW: 3, lastQ: 3, streak: 9, badges: ['closing'], link: '', treat: 'Tambahan modal', treatNote: 'Tambahan modal stok lewat proposal investor, payback dihitung Keuangan.' }
    ];
    const max = [35, 30, 20, 15];
    const view = this.state.view;
    const week = view === 'week';
    const withT = A.map(a => ({ ...a, total: a.p.reduce((x, y) => x + y, 0) }));
    const sorted = [...withT].sort((a, b) => week ? b.total - a.total : b.q - a.q);
    const stMap = {
      g: { t: 'Hijau', bg: '#DDF5F2', fg: '#067A70', dot: '#09BEAF' },
      y: { t: 'Kuning', bg: '#FDF3D7', fg: '#7A5200', dot: '#D99A00' },
      r: { t: 'Merah', bg: '#FCEBDD', fg: '#9A3F0A', dot: '#C2410C' }
    };
    const rows = sorted.map((a, i) => {
      const rank = i + 1;
      const prev = week ? a.lastW : a.lastQ;
      const move = prev - rank;
      const s = stMap[a.st];
      return {
        code: a.code, name: a.name, rank, goal: a.goal,
        champText: a.sub || (a.champ ? 'Leader ' + a.champ : 'Leader belum ada'),
        champFg: a.champ || a.sub ? '#5B6573' : '#9A3F0A',
        up: move > 0, down: move < 0, same: move === 0, move: Math.abs(move),
        stageDots: [1, 2, 3, 4, 5].map(n => ({ c: n <= a.stage ? '#09BEAF' : '#E3E6EB' })),
        stageText: stages[a.stage],
        stText: s.t, stBg: s.bg, stFg: s.fg, stDot: s.dot,
        pillars: a.p.map((v, k) => {
          const r = v / max[k];
          return { v, w: Math.round(r * 100) + '%', c: r < 0.5 ? '#C2410C' : (k < 2 ? '#1D3149' : '#09BEAF') };
        }),
        total: week ? a.total : a.q,
        streak: a.streak,
        badges: a.badges.map(b => B[b]), noBadge: a.badges.length === 0,
        bg: a.code === this.state.sel ? '#F0FBF9' : 'transparent',
        pick: () => this.setState({ sel: a.code })
      };
    });
    const top = rows.slice(0, 3);
    const podium = [top[1], top[0], top[2]].map(r => {
      const a = A.find(x => x.code === r.code);
      return {
        code: r.code, name: r.name, champ: a.champ || 'belum ada', rank: r.rank,
        pts: r.total + (week ? ' poin' : ' skor'),
        first: r.rank === 1,
        size: r.rank === 1 ? '72px' : '60px',
        ring: r.rank === 1 ? '#09BEAF' : '#2C4664',
        h: r.rank === 1 ? '150px' : r.rank === 2 ? '112px' : '84px',
        block: r.rank === 1 ? '#09BEAF' : '#2C4664',
        numFg: r.rank === 1 ? '#1D3149' : '#FFFFFF'
      };
    });
    const nonRed = A.filter(a => a.st !== 'r').length;
    const statusChips = A.map(a => ({ label: a.name.replace('Rentalaja ', 'RA ').replace(' / Laptopaja', ''), bg: stMap[a.st].bg, fg: stMap[a.st].fg }));
    const s0 = withT.find(a => a.code === this.state.sel) || withT[0];
    const cat = s0.q >= 85 ? ['Sangat baik', '#067A70', 'Naik tahap: boleh tambah aset atau cari investor'] :
      s0.q >= 70 ? ['Baik', '#1D3149', 'Lanjut di tahap yang sama dengan target lebih tinggi'] :
      s0.q >= 55 ? ['Perlu perbaikan', '#7A5200', 'Ditahan: satu kuartal dukungan, tanpa tambahan modal'] :
      ['Pembinaan', '#9A3F0A', 'Bila dua kuartal berturut-turut: digabung ke unit lain atau ditutup'];
    const names = [['KAS', 'Kas akhir periode', 0], ['KAS', 'Kewajiban 30 hari', 0], ['PROFIT', 'Laba kontribusi', 1], ['PROFIT', 'Margin kontribusi', 1], ['KAPASITAS', 'Utilisasi aset', 2], ['KAPASITAS', 'Disiplin KKH', 2], ['GROWTH', 'Closing rate', 3], ['GROWTH', 'Omzet bulan-ke-bulan', 3]];
    const off = [4, -6, 2, -3, -5, 6, 3, -4];
    const metrics = names.map(([layer, name, k], i) => {
      const pct = Math.max(20, Math.min(118, Math.round(s0.p[k] / max[k] * 100 + off[i])));
      return {
        layer, name, pct: pct + '%', w: Math.min(100, pct) + '%',
        fg: pct < 60 ? '#9A3F0A' : '#1F2933',
        bar: pct < 60 ? '#C2410C' : pct < 85 ? '#D99A00' : '#09BEAF'
      };
    });
    const formulas = [
      ['KAS', 'Kas akhir periode', 20, 'Saldo kas unit di akhir minggu ÷ biaya operasional 1 bulan', 'Kas ≥ 1 bulan biaya operasional', 'Dasbor keuangan (rekening per unit) di Rentalaja App', 'Reza · Keuangan'],
      ['KAS', 'Kewajiban 30 hari', 15, 'Kewajiban jatuh tempo 30 hari yang sudah ada dananya ÷ total kewajiban 30 hari (cicilan leasing, gaji, sewa, supplier)', 'Semua kewajiban 30 hari sudah ada dananya', 'Jadwal cicilan dan hutang di sheet Keuangan', 'Reza · Keuangan'],
      ['PROFIT', 'Laba kontribusi', 15, '(Omzet − biaya langsung unit) ÷ target laba kontribusi bulan ini, dihitung berjalan per minggu', 'Laba kontribusi = target bulan', 'Laba rugi internal per unit (Keuangan)', 'Reza · Keuangan'],
      ['PROFIT', 'Margin kontribusi', 15, 'Laba kontribusi ÷ omzet, dibandingkan target margin unit', 'Rentalaja ≥ 35% · TripinAja ≥ 25% · Niagaaja ≥ 15%', 'Laba rugi internal per unit (Keuangan)', 'Reza · Keuangan'],
      ['KAPASITAS', 'Utilisasi aset', 10, 'Rentalaja: unit-hari tersewa ÷ unit-hari tersedia · TripinAja: kursi trip terisi ÷ kapasitas · Niagaaja: stok terjual ≤ 30 hari ÷ total stok', 'Rentalaja ≥ 70% · TripinAja ≥ 75% · Niagaaja ≥ 60%', 'Booking Rentalaja App, TripinAja App, daftar stok Niagaaja', 'Fajar · Data omzet'],
      ['KAPASITAS', 'Disiplin KKH', 10, 'Slot KKH tervalidasi ÷ slot terisi, untuk semua orang di unit', 'Semua slot KKH tervalidasi sebelum 18.00', 'KKH di sistem ini (otomatis)', 'Intifa · Kepala Staf'],
      ['GROWTH', 'Closing rate', 8, 'Booking atau penjualan jadi ÷ leads masuk (WA, Instagram, web)', 'Sama dengan target unit (usulan awal 30%)', 'Jurnal BizDev dan catatan chat WA', 'Eja · BizDev'],
      ['GROWTH', 'Omzet bulan-ke-bulan', 7, 'Omzet bulan ini ÷ (omzet bulan lalu × 1,05)', 'Omzet tumbuh ≥ 5% dari bulan lalu', 'Dasbor omzet (Jurnal BizDev)', 'Fajar · Data omzet']
    ].map(([layer, name, w, rumus, target, src, by]) => ({ layer, name, w, rumus, target, src, by }));
    const s = {
      code: s0.code, name: s0.name, champ: s0.champ || 'belum ditetapkan', goal: s0.goal,
      stageText: stages[s0.stage],
      metrics, q: s0.q, cat: cat[0], catFg: cat[1], decision: cat[2],
      gate: s0.stage >= 5 ? 'Sudah di tahap tertinggi; jaga skor ≥ 85' : 'Ke tahap ' + stages[s0.stage + 1] + ': skor ≥ 85 di dua evaluasi berturut',
      dukungan: s0.treat, treatNote: s0.treatNote,
      hasLink: !!s0.link, noLink: !s0.link, link: s0.link || '#'
    };
    const badgeList = Object.keys(B).map(k => {
      const h = A.filter(a => a.badges.includes(k)).map(a => a.name.replace('Rentalaja ', 'RA '));
      return { ...B[k], holders: h.length ? 'Dipegang: ' + h.join(', ') : 'Belum ada pemegang' };
    });
    const imp = [...A].sort((a, b) => (b.q - b.qPrev) - (a.q - a.qPrev))[0];
    const views = [['week', 'Poin minggu ini'], ['quarter', 'Skor kuartal']].map(([k, label]) => ({
      label, on: view === k ? 'true' : 'false',
      bg: view === k ? '#1D3149' : 'transparent', fg: view === k ? '#FFFFFF' : '#3B4250',
      pick: () => this.setState({ view: k })
    }));
    const board = rows.map((r, i) => {
      const prevR = rows[i - 1], nextR = rows[i + 1];
      const first = r.rank === 1, top3 = r.rank <= 3;
      const note = first ? (nextR ? 'Unggul ' + (r.total - nextR.total) + ' poin dari #2' : '') : 'Kurang ' + (prevR.total - r.total + 1) + ' poin untuk menyalip #' + (r.rank - 1);
      return {
        rank: r.rank, name: r.name, champ: r.champText + ' · ' + r.stText, pts: r.total, w: Math.min(100, r.total) + '%', note,
        move: r.up ? '▲ naik ' + r.move : r.down ? '▼ turun ' + r.move : '– tetap',
        moveFg: first ? '#1D3149' : r.up ? '#86DCD3' : r.down ? '#F4A582' : '#C5D3E3',
        bg: first ? '#09BEAF' : top3 ? '#2C4664' : 'transparent', fg: first ? '#1D3149' : '#FFFFFF',
        rankFg: first ? '#1D3149' : top3 ? '#86DCD3' : '#8FA3BC', sub: first ? '#1D3149' : '#C5D3E3',
        track: first ? '#7FE0D6' : '#3A5375', bar: first ? '#1D3149' : r.stText === 'Merah' ? '#F08A5D' : '#09BEAF',
        aria: 'Peringkat ' + r.rank + ', ' + r.name + ', ' + r.total + ' poin. ' + note,
        pick: () => this.setState({ sel: r.code, showDetail: true })
      };
    });
    const FORMS = {};
    return { ...this.uxVals(FORMS), act_bagikan_klasemen_ke_grup: () => this.say('Klasemen minggu ini dikirim ke grup WhatsApp management.'), 

      rows, podium, s, badgeList, views, statusChips, board,
      formulas, showDetail: !!this.state.showDetail, detailOn: this.state.showDetail ? 'true' : 'false', detailText: this.state.showDetail ? 'Sembunyikan rincian poin' : 'Lihat rincian poin per unit dan per metrik', toggleDetail: () => this.setState({ showDetail: !this.state.showDetail }),
      greenPct: Math.round(nonRed / A.length * 100) + '%',
      greenText: nonRed + ' / ' + A.length + ' tidak merah',
      mostImproved: imp.name + ' (+' + (imp.q - imp.qPrev) + ')',
      podiumTitle: week ? 'KLASEMEN UNIT · MINGGU 19–24 OKT' : 'SKOR KUARTAL Q4 · PROYEKSI SAMPAI DESEMBER',
      totalHead: week ? 'POIN' : 'SKOR'
    };
  }
}

dcBoot(Component);
</script>
