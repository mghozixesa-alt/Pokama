<main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 28px 36px 48px; display: flex; flex-direction: column; gap: 18px">
<header style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 13px; color: #5B6573; font-weight: 600">Mau belanja pakai uang perusahaan? Ajukan RAB di sini dulu, lalu laporkan nota (LPJ) setelah belanja.</span>
<h1 style="margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -0.01em">Pengajuan Belanja</h1>
</div>
<button type="button" onClick="{{openNew}}" style="height: 44px; padding: 0 18px; border-radius: 10px; border: 0; background: #09BEAF; color: #1D3149; font: inherit; font-weight: 800; cursor: pointer">+ Ajukan RAB</button>
</header>
<sc-if value="{{hasMsg}}" hint-placeholder-val="{{false}}"><div role="status" style="display: flex; align-items: center; gap: 12px; background: #DDF5F2; color: #067A70; border: 1px solid #A9E4DC; border-radius: 12px; padding: 10px 12px 10px 16px; font-weight: 700"><span style="flex-grow: 1">{{msg}}</span><button type="button" onClick="{{clearMsg}}" style="height: 36px; padding: 0 12px; border-radius: 8px; border: 0; background: transparent; color: #067A70; font: inherit; font-weight: 800; cursor: pointer">Tutup</button></div></sc-if>

<sc-if value="{{newOpen}}" hint-placeholder-val="{{false}}">
<section aria-label="Ajukan RAB" style="background: #FFFFFF; border: 2px solid #09BEAF; border-radius: 16px; padding: 18px 20px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 2px"><h2 style="margin: 0; font-size: 18px; font-weight: 800">Ajukan RAB baru</h2><span style="font-size: 13px; color: #5B6573">Kode RAB dibuat otomatis. Siapa yang menyetujui ditentukan dari nominal, jadi tidak perlu dipilih.</span></div>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px">
<label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 700; color: #3B4250">Unit<select value="{{nUnit}}" onChange="{{onUnit}}" style="height: 44px; border: 1px solid #D3D7DE; border-radius: 10px; padding: 0 10px; font: inherit; background: #FFFFFF"><option value="REN">Rentalaja</option><option value="TRP">TripinAja</option><option value="NIA">Niagaaja</option><option value="POK">Holding</option></select></label>
<label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 700; color: #3B4250">Jenis<select value="{{nKind}}" onChange="{{onKind}}" style="height: 44px; border: 1px solid #D3D7DE; border-radius: 10px; padding: 0 10px; font: inherit; background: #FFFFFF"><option value="op">Kebutuhan operasional</option><option value="mt">Maintenance produk/aset</option><option value="as">Beli aset / stok</option><option value="mk">Marketing</option></select></label>
<label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 700; color: #3B4250; grid-column: span 2">Untuk apa<input type="text" value="{{nTitle}}" onInput="{{onTitle}}" placeholder="Misalnya Ban dan oli 6 motor Garut Kota" style="height: 44px; box-sizing: border-box; border: 1px solid #D3D7DE; border-radius: 10px; padding: 0 12px; font: inherit"></label>
<label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 700; color: #3B4250; grid-column: span 2">Rincian (satu baris satu barang: nama, jumlah, harga)<textarea rows="3" value="{{nItems}}" onInput="{{onItems}}" placeholder="Ban dalam, 6, 45000&#10;Oli mesin, 6, 65000" style="box-sizing: border-box; border: 1px solid #D3D7DE; border-radius: 10px; padding: 10px 12px; font: inherit; resize: vertical"></textarea></label>
<label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 700; color: #3B4250">Dibutuhkan tanggal<input type="text" value="{{nDate}}" onInput="{{onDate}}" placeholder="Misalnya Jum 30 Okt" style="height: 44px; box-sizing: border-box; border: 1px solid #D3D7DE; border-radius: 10px; padding: 0 12px; font: inherit"></label>
<div style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 700; color: #3B4250">Total<span style="height: 44px; display: flex; align-items: center; padding: 0 12px; border-radius: 10px; background: #F3F5F8; font-size: 16px; font-weight: 900">{{nTotal}}</span></div>
</div>
<p style="margin: 0; padding: 10px 12px; border-radius: 10px; background: #FDF3D7; color: #7A5200; font-size: 13px; font-weight: 700">{{nAi}}</p>
<div style="display: flex; gap: 10px"><button type="button" onClick="{{submitNew}}" style="height: 44px; padding: 0 18px; border-radius: 10px; border: 0; background: {{nBtnBg}}; color: {{nBtnFg}}; font: inherit; font-weight: 800; cursor: pointer">Kirim RAB</button><button type="button" onClick="{{closeNew}}" style="height: 44px; padding: 0 16px; border-radius: 10px; border: 1px solid #E3E6EB; background: #FFFFFF; color: #3B4250; font: inherit; font-weight: 700; cursor: pointer">Batal</button></div>
</section>
</sc-if>

<section aria-label="Alur belanja" style="background: #FFFFFF; border: 1px solid #E3E6EB; border-radius: 16px; padding: 14px 16px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px">
<sc-for list="{{steps}}" as="g" hint-placeholder-count="5"><div style="display: flex; gap: 10px; align-items: flex-start"><span aria-hidden="true" style="width: 28px; height: 28px; border-radius: 14px; background: {{g.bg}}; color: {{g.fg}}; font-weight: 900; font-size: 13px; display: flex; align-items: center; justify-content: center; flex-shrink: 0">{{g.no}}</span><span style="display: flex; flex-direction: column"><span style="font-weight: 800; font-size: 14px">{{g.t}}</span><span style="font-size: 12px; color: #5B6573">{{g.s}}</span></span></div></sc-for>
</section>

<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px">
<sc-for list="{{tiles}}" as="t" hint-placeholder-count="4"><div style="background: #FFFFFF; border: 1px solid #E3E6EB; border-radius: 14px; padding: 14px 18px; display: flex; flex-direction: column"><span style="font-size: 13px; color: #5B6573; font-weight: 700">{{t.k}}</span><span style="font-size: 24px; font-weight: 900; color: {{t.fg}}">{{t.v}}</span><span style="font-size: 12px; color: #5B6573">{{t.s}}</span></div></sc-for>
</div>

<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px">
<div role="group" aria-label="Pilih unit" style="display: flex; flex-wrap: wrap; gap: 6px">
<sc-for list="{{unitBtns}}" as="u" hint-placeholder-count="5"><button type="button" aria-pressed="{{u.on}}" onClick="{{u.pick}}" style="height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid #E3E6EB; background: {{u.bg}}; color: {{u.fg}}; font: inherit; font-size: 14px; font-weight: 800; cursor: pointer; display: inline-flex; align-items: center; gap: 8px"><sc-if value="{{u.hasMark}}"><span aria-hidden="true" style="width: 24px; height: 24px; flex-shrink: 0; border-radius: 7px; background: #FFFFFF; border: 1px solid #E3E6EB; display: inline-flex; align-items: center; justify-content: center; overflow: hidden"><sc-if value="{{u.hasLogo}}"><img src="{{u.logo}}" alt="" style="max-width: 76%; max-height: 76%; object-fit: contain"></sc-if><sc-if value="{{u.isPk}}"><span style="font-size: 9px; font-weight: 900; color: #1D3149; letter-spacing: 0">PK</span></sc-if></span></sc-if>{{u.label}}</button></sc-for>
</div>
<div role="group" aria-label="Filter status" style="display: flex; flex-wrap: wrap; gap: 6px">
<sc-for list="{{stBtns}}" as="f" hint-placeholder-count="5"><button type="button" aria-pressed="{{f.on}}" onClick="{{f.pick}}" style="height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid #E3E6EB; background: {{f.bg}}; color: {{f.fg}}; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer">{{f.label}}</button></sc-for>
</div>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start">
<section aria-label="Daftar RAB" style="flex: 2 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{items}}" as="it" hint-placeholder-count="5">
<button type="button" onClick="{{it.pick}}" aria-pressed="{{it.on}}" style="text-align: left; font: inherit; color: #1F2933; cursor: pointer; background: #FFFFFF; border: 1px solid {{it.bd}}; box-shadow: inset 4px 0 0 {{it.bar}}; border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px">
<span style="display: flex; justify-content: space-between; gap: 10px; font-size: 11px; font-weight: 900; letter-spacing: 0.04em"><span style="display: inline-flex; align-items: center; gap: 6px; color: {{it.uFg}}"><sc-if value="{{it.hasMark}}"><span aria-hidden="true" style="width: 18px; height: 18px; flex-shrink: 0; border-radius: 5px; background: #FFFFFF; border: 1px solid #E3E6EB; display: inline-flex; align-items: center; justify-content: center; overflow: hidden"><sc-if value="{{it.hasLogo}}"><img src="{{it.logo}}" alt="" style="max-width: 76%; max-height: 76%; object-fit: contain"></sc-if><sc-if value="{{it.isPk}}"><span style="font-size: 7px; font-weight: 900; color: #1D3149; letter-spacing: 0">PK</span></sc-if></span></sc-if>{{it.unitName}} · {{it.code}}</span><span style="color: #5B6573">{{it.when}}</span></span>
<span style="display: flex; justify-content: space-between; gap: 10px; align-items: flex-start"><span style="font-weight: 800">{{it.title}}</span><span style="font-weight: 900; white-space: nowrap">{{it.total}}</span></span>
<span style="display: flex; justify-content: space-between; gap: 10px; align-items: center"><span style="font-size: 12px; color: #5B6573">Diajukan {{it.by}}</span><span style="font-size: 12px; font-weight: 800; padding: 3px 10px; border-radius: 999px; background: {{it.stBg}}; color: {{it.stFg}}; white-space: nowrap">{{it.st}}</span></span>
</button>
</sc-for>
<sc-if value="{{empty}}" hint-placeholder-val="{{false}}"><p style="margin: 0; padding: 20px; text-align: center; color: #5B6573; background: #FFFFFF; border: 1px dashed #D3D7DE; border-radius: 14px">Tidak ada RAB di sini.</p></sc-if>
</section>

<aside aria-label="Rincian RAB" style="flex: 3 1 540px; min-width: 0; background: #FFFFFF; border: 1px solid #E3E6EB; border-radius: 20px; padding: 22px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; align-items: flex-start">
<div style="display: flex; flex-direction: column; gap: 2px"><span style="display: inline-flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 800; letter-spacing: 0.06em; color: {{d.uFg}}"><sc-if value="{{d.hasMark}}"><span aria-hidden="true" style="width: 26px; height: 26px; flex-shrink: 0; border-radius: 7px; background: #FFFFFF; border: 1px solid #E3E6EB; display: inline-flex; align-items: center; justify-content: center; overflow: hidden"><sc-if value="{{d.hasLogo}}"><img src="{{d.logo}}" alt="" style="max-width: 76%; max-height: 76%; object-fit: contain"></sc-if><sc-if value="{{d.isPk}}"><span style="font-size: 9px; font-weight: 900; color: #1D3149; letter-spacing: 0">PK</span></sc-if></span></sc-if>{{d.unitName}} · {{d.code}} · {{d.kind}}</span><h2 style="margin: 0; font-size: 21px; font-weight: 900">{{d.title}}</h2><span style="font-size: 13px; color: #5B6573">Disusun {{d.by}} · dibutuhkan {{d.need}}</span></div>
<span style="font-size: 12px; font-weight: 800; padding: 4px 12px; border-radius: 999px; background: {{d.stBg}}; color: {{d.stFg}}; white-space: nowrap">{{d.st}}</span>
</div>
<div style="border: 1px solid #E3E6EB; border-radius: 12px; overflow: hidden">
<table style="width: 100%; border-collapse: collapse; font-size: 13px">
<thead><tr style="background: #F7F8FA"><th scope="col" style="text-align: left; padding: 8px 12px; font-size: 11px; color: #5B6573; font-weight: 900">URAIAN</th><th scope="col" style="text-align: right; padding: 8px; font-size: 11px; color: #5B6573; font-weight: 900">QTY</th><th scope="col" style="text-align: right; padding: 8px; font-size: 11px; color: #5B6573; font-weight: 900">HARGA</th><th scope="col" style="text-align: right; padding: 8px 12px; font-size: 11px; color: #5B6573; font-weight: 900">TOTAL</th><th scope="col" style="text-align: right; padding: 8px 12px; font-size: 11px; color: #5B6573; font-weight: 900">REALISASI (LPJ)</th></tr></thead>
<tbody><sc-for list="{{d.rows}}" as="r" hint-placeholder-count="4"><tr style="border-top: 1px solid #EEF0F3"><td style="padding: 8px 12px; font-weight: 700">{{r.n}}</td><td style="padding: 8px; text-align: right; font-variant-numeric: tabular-nums">{{r.q}}</td><td style="padding: 8px; text-align: right; font-variant-numeric: tabular-nums">{{r.p}}</td><td style="padding: 8px 12px; text-align: right; font-weight: 800; font-variant-numeric: tabular-nums">{{r.t}}</td><td style="padding: 8px 12px; text-align: right; font-variant-numeric: tabular-nums; color: {{r.rFg}}">{{r.real}}</td></tr></sc-for>
<tr style="border-top: 1px solid #E3E6EB; background: #F7F8FA"><th scope="row" colspan="3" style="text-align: left; padding: 8px 12px; font-weight: 900">Total</th><td style="padding: 8px 12px; text-align: right; font-weight: 900">{{d.total}}</td><td style="padding: 8px 12px; text-align: right; font-weight: 900; color: {{d.realFg}}">{{d.realTotal}}</td></tr></tbody>
</table>
</div>
<div style="display: flex; flex-direction: column; gap: 6px; background: #FFFBF0; border: 1px solid #EED9A0; border-radius: 12px; padding: 10px 12px"><span style="font-size: 11px; font-weight: 900; letter-spacing: 0.06em; color: #7A5200">CEK OTOMATIS AI</span><sc-for list="{{d.ai}}" as="a" hint-placeholder-count="3"><span style="font-size: 13px; color: #3B4250">• {{a}}</span></sc-for></div>
<span style="font-size: 12px; font-weight: 900; letter-spacing: 0.06em; color: #5B6573">PERJALANAN RAB</span>
<ol style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column">
<sc-for list="{{d.chain}}" as="c" hint-placeholder-count="5"><li style="display: flex; gap: 10px; align-items: flex-start; padding: 6px 0"><span aria-hidden="true" style="width: 22px; height: 22px; border-radius: 11px; flex-shrink: 0; background: {{c.dot}}; color: #FFFFFF; font-size: 12px; font-weight: 900; display: flex; align-items: center; justify-content: center">{{c.mark}}</span><span style="display: flex; flex-direction: column"><span style="font-weight: 800; font-size: 13px; color: {{c.fg}}">{{c.label}}</span><span style="font-size: 12px; color: #5B6573">{{c.note}}</span></span></li></sc-for>
</ol>
<sc-if value="{{d.hasNote}}" hint-placeholder-val="{{false}}"><p style="margin: 0; padding: 10px 12px; border-radius: 12px; background: {{d.noteBg}}; color: {{d.noteFg}}; font-size: 13px; font-weight: 700">{{d.note}}</p></sc-if>
<sc-if value="{{d.hasAct}}" hint-placeholder-val="{{true}}">
<div style="display: flex; flex-wrap: wrap; gap: 10px; border-top: 1px solid #EEF0F3; padding-top: 14px">
<button type="button" onClick="{{d.go}}" style="height: 46px; padding: 0 18px; border-radius: 10px; border: 0; background: #09BEAF; color: #1D3149; font: inherit; font-weight: 900; cursor: pointer">{{d.goText}}</button>
<sc-if value="{{d.canReject}}" hint-placeholder-val="{{true}}"><button type="button" onClick="{{d.back}}" style="height: 46px; padding: 0 16px; border-radius: 10px; border: 1px solid #E3E6EB; background: #FFFFFF; color: #3B4250; font: inherit; font-weight: 700; cursor: pointer">Minta revisi RAB</button><button type="button" onClick="{{d.reject}}" style="height: 46px; padding: 0 14px; border-radius: 10px; border: 0; background: transparent; color: #9A3F0A; font: inherit; font-weight: 700; cursor: pointer">Tolak</button></sc-if>
<span style="font-size: 12px; color: #5B6573; align-self: center">{{d.actNote}}</span>
</div>
</sc-if>
</aside>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start">
<section aria-labelledby="rule-h" style="flex: 3 1 520px; min-width: 0; background: #FFFFFF; border: 1px solid #E3E6EB; border-radius: 16px; padding: 18px 20px; display: flex; flex-direction: column; gap: 4px">
<h2 id="rule-h" style="margin: 0 0 6px; font-size: 16px; font-weight: 800">Aturan belanja <span style="font-size: 12px; font-weight: 800; color: #067A70">· usulan AI, bisa diubah di Keputusan</span></h2>
<sc-for list="{{rules}}" as="r" hint-placeholder-count="6"><div style="display: flex; justify-content: space-between; gap: 14px; padding: 8px 0; border-top: 1px solid #EEF0F3; font-size: 13px"><span style="color: #5B6573">{{r.k}}</span><span style="font-weight: 700; text-align: right; max-width: 60%">{{r.v}}</span></div></sc-for>
</section>
<section aria-labelledby="dar-h" style="flex: 2 1 340px; min-width: 0; background: #FFFFFF; border: 1px solid #E3E6EB; border-radius: 16px; padding: 18px 20px; display: flex; flex-direction: column; gap: 8px">
<h2 id="dar-h" style="margin: 0; font-size: 16px; font-weight: 800">Dana darurat per unit</h2>
<span style="font-size: 12px; color: #5B6573">Untuk belanja mendadak tanpa menunggu RAB. Nota wajib diupload hari itu juga, lalu diisi ulang Keuangan setiap Jumat.</span>
<sc-for list="{{dar}}" as="x" hint-placeholder-count="4"><div style="display: flex; flex-direction: column; gap: 4px; padding: 6px 0; border-top: 1px solid #EEF0F3"><span style="display: flex; justify-content: space-between; font-size: 13px"><span style="font-weight: 800">{{x.name}} <span style="color: #5B6573; font-weight: 600">· {{x.code}}</span></span><span style="font-weight: 900; color: {{x.fg}}">{{x.left}} / {{x.cap}}</span></span><span style="height: 6px; background: #EEF0F3; border-radius: 3px; overflow: hidden"><span style="display: block; height: 100%; width: {{x.pct}}; background: {{x.bar}}"></span></span></div></sc-for>
</section>
</div>
</main>
</div>
</script>

      stBtns: [['all', 'Semua'], ['ok', 'Perlu disetujui'], ['cair', 'Menunggu dana'], ['lpj', 'Menunggu nota'], ['done', 'Selesai'], ['rej', 'Ditolak']].map(([k, l]) => ({ label: l + ' (' + (k === 'all' ? inUnit.length : inUnit.filter(b => b.S[0] === k).length) + ')', on: flt === k ? 'true' : 'false', bg: flt === k ? '#1D3149' : '#FFFFFF', fg: flt === k ? '#FFFFFF' : '#3B4250', pick: () => this.setState({ flt: k }) })),
