<main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 28px 36px 48px; display: flex; flex-direction: column; gap: 18px">
<header style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 13px; color: #5B6573; font-weight: 600">Semua deck, proposal, SOP, laporan, desain, dan draf Pokama · dirancang untuk ratusan dokumen</span>
<h1 style="margin: 0; font-size: 30px; font-weight: 900; letter-spacing: -0.01em">Library Dokumen</h1>
</div>
<button type="button" onClick="{{openAdd}}" style="height: 44px; padding: 0 18px; border-radius: 10px; border: 0; background: #09BEAF; color: #1D3149; font: inherit; font-weight: 900; cursor: pointer">+ Tambah dokumen</button>
</header>

<sc-if value="{{hasMsg}}" hint-placeholder-val="{{false}}"><div role="status" style="display: flex; align-items: center; gap: 12px; background: #DDF5F2; color: #067A70; border: 1px solid #A9E4DC; border-radius: 12px; padding: 10px 12px 10px 16px; font-weight: 700"><span style="flex-grow: 1">{{msg}}</span><button type="button" onClick="{{clearMsg}}" style="height: 36px; padding: 0 12px; border-radius: 8px; border: 0; background: transparent; color: #067A70; font: inherit; font-weight: 800; cursor: pointer">Tutup</button></div></sc-if>
<sc-if value="{{addOpen}}" hint-placeholder-val="{{false}}"><section aria-label="Tambah dokumen" style="background: #FFFFFF; border: 2px solid #09BEAF; border-radius: 16px; padding: 18px 20px; display: flex; flex-direction: column; gap: 12px"><div style="display: flex; flex-direction: column; gap: 2px"><h2 style="margin: 0; font-size: 18px; font-weight: 800">Tambah dokumen ke Library</h2><span style="font-size: 13px; color: #5B6573">Tempel tautan Google Drive, Google Slides, atau artifact. Bila judulnya sama dengan dokumen lama, versi lama otomatis jadi Arsip.</span></div><div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px"><sc-for list="{{addFields}}" as="ff" hint-placeholder-count="5"><label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 700; color: #3B4250">{{ff.label}}<input type="text" value="{{ff.v}}" onChange="{{ff.on}}" placeholder="{{ff.ph}}" style="height: 44px; box-sizing: border-box; border: 1px solid #D3D7DE; border-radius: 10px; padding: 0 12px; font: inherit; font-weight: 500"></label></sc-for></div><div style="display: flex; gap: 8px"><button type="button" onClick="{{addSubmit}}" style="height: 44px; padding: 0 18px; border-radius: 10px; border: 0; background: #09BEAF; color: #1D3149; font: inherit; font-weight: 900; cursor: pointer">Simpan ke Library</button><button type="button" onClick="{{addCancel}}" style="height: 44px; padding: 0 16px; border-radius: 10px; border: 1px solid #E3E6EB; background: #FFFFFF; color: #3B4250; font: inherit; font-weight: 700; cursor: pointer">Batal</button></div></section></sc-if>

<section aria-label="Sinkron Google Drive" style="background: #FFFFFF; border: 1px solid #E3E6EB; border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px">
<span aria-hidden="true" style="width: 36px; height: 36px; border-radius: 10px; background: #DDF5F2; color: #067A70; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 01-14 5.3M4 12a8 8 0 0114-5.3"></path><path d="M18 3v4h-4M6 21v-4h4"></path></svg></span>
<span style="flex: 1 1 320px; display: flex; flex-direction: column"><span style="font-weight: 800">Tersinkron dengan Google Drive · folder Pokama / Library</span><span style="font-size: 13px; color: #5B6573">{{syncText}}</span></span>
<button type="button" onClick="{{syncNow}}" style="height: 40px; padding: 0 14px; border-radius: 10px; font: inherit; font-weight: 800; cursor: pointer; border: 1px solid #1D3149; background: #FFFFFF; color: #1D3149">Sinkron sekarang</button>
<button type="button" aria-pressed="{{accOn}}" onClick="{{toggleAcc}}" style="height: 40px; padding: 0 14px; border-radius: 10px; font: inherit; font-weight: 800; cursor: pointer; border: 0; background: #1D3149; color: #FFFFFF">{{accText}}</button>
</div>
<sc-if value="{{hasPend}}" hint-placeholder-val="{{true}}">
<div style="border-top: 1px solid #EEF0F3; padding-top: 10px; display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 12px; font-weight: 800; letter-spacing: 0.06em; color: #7A5200">FILE BARU DI DRIVE · SARAN AI UNTUK FOLDER DAN STATUS</span>
<sc-for list="{{pend}}" as="pd" hint-placeholder-count="3">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px; background: #FFFBF0; border: 1px solid #EED9A0; border-radius: 12px; padding: 10px 12px">
<span style="flex: 1 1 300px; display: flex; flex-direction: column; min-width: 0"><span style="font-weight: 800">{{pd.title}}</span><span style="font-size: 12px; color: #5B6573">Diunggah {{pd.who}} · {{pd.when}} · di folder Drive "{{pd.from}}"</span></span>
<span style="font-size: 12px; font-weight: 800; color: #7A5200; background: #FDF3D7; border-radius: 999px; padding: 4px 10px">AI: {{pd.sug}}</span>
<button type="button" onClick="{{pd.ok}}" style="height: 40px; padding: 0 14px; border-radius: 10px; font: inherit; font-weight: 800; cursor: pointer; border: 0; background: #09BEAF; color: #1D3149">{{pd.okLabel}}</button>
<button type="button" onClick="{{pd.skip}}" style="height: 40px; padding: 0 14px; border-radius: 10px; font: inherit; font-weight: 800; cursor: pointer; border: 1px solid #E3E6EB; background: #FFFFFF; color: #3B4250">Bukan dokumen kerja</button>
</div>
</sc-for>
</div>
</sc-if>
<sc-if value="{{showAcc}}" hint-placeholder-val="{{false}}">
<div style="border-top: 1px solid #EEF0F3; padding-top: 12px; display: flex; flex-direction: column; gap: 10px; overflow-x: auto">
<span style="font-size: 13px; color: #3B4250">Library tidak menyalin file. Izin buka mengikuti Google Drive: sistem membuat grup Google per unit dan memasukkan orang sesuai perannya di Tim &amp; Peran. Karena semua masuk dengan akun Google, akses langsung ikut dan dicabut otomatis saat orang pindah unit atau keluar.</span>
<table style="width: 100%; min-width: 860px; border-collapse: collapse">
<thead><tr style="border-bottom: 1px solid #E3E6EB"><sc-for list="{{accHead}}" as="h" hint-placeholder-count="5"><th scope="col" style="text-align: left; padding: 8px 10px; font-size: 12px; color: #5B6573; font-weight: 800; letter-spacing: 0.06em">{{h}}</th></sc-for></tr></thead>
<tbody><sc-for list="{{accRows}}" as="r" hint-placeholder-count="5"><tr style="border-bottom: 1px solid #EEF0F3"><th scope="row" style="text-align: left; padding: 8px 10px; font-weight: 800; white-space: nowrap">{{r.role}}</th><sc-for list="{{r.cells}}" as="c" hint-placeholder-count="4"><td style="padding: 6px 10px"><span style="font-size: 12px; font-weight: 800; padding: 3px 10px; border-radius: 999px; background: {{c.bg}}; color: {{c.fg}}; white-space: nowrap">{{c.t}}</span></td></sc-for></tr></sc-for></tbody>
</table>
<span style="font-size: 12px; color: #5B6573">Diatur Kepala Staf. Setiap buka dokumen Terbatas tercatat di riwayat akses.</span>
</div>
</sc-if>
</section>

<section aria-labelledby="pin-h" style="display: flex; flex-direction: column; gap: 8px">
<h2 id="pin-h" style="margin: 0; font-size: 12px; font-weight: 800; letter-spacing: 0.08em; color: #5B6573">DOKUMEN INTI · WAJIB DIBACA SEMUA MANAGEMENT</h2>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{pins}}" as="p" hint-placeholder-count="6"><a href="{{p.url}}" target="_blank" rel="noopener" style="display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px 0 10px; border-radius: 10px; background: #FFFFFF; border: 1px solid #E3E6EB; text-decoration: none; color: #1F2933; font-weight: 800; font-size: 13px"><span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 4px; background: {{p.dot}}"></span>{{p.title}}</a></sc-for>
</div>
</section>

<div style="display: flex; flex-wrap: wrap; gap: 18px; align-items: flex-start">
<aside aria-label="Folder" style="flex: 0 1 270px; min-width: 240px; background: #FFFFFF; border: 1px solid #E3E6EB; border-radius: 16px; padding: 12px; display: flex; flex-direction: column; gap: 2px">
<button type="button" onClick="{{pickAll}}" aria-pressed="{{allOn}}" style="display: flex; justify-content: space-between; align-items: center; min-height: 40px; padding: 0 10px; border-radius: 10px; border: 0; background: {{allBg}}; color: {{allFg}}; font: inherit; font-weight: 900; cursor: pointer; text-align: left"><span>Semua dokumen</span><span>{{allCount}}</span></button>
<sc-for list="{{tree}}" as="u" hint-placeholder-count="4">
<div style="display: flex; flex-direction: column; margin-top: 6px">
<button type="button" onClick="{{u.pick}}" aria-pressed="{{u.on}}" aria-expanded="{{u.open}}" style="display: flex; justify-content: space-between; align-items: center; min-height: 38px; padding: 0 10px; border-radius: 10px; border: 0; background: {{u.bg}}; color: {{u.fg}}; font: inherit; font-weight: 800; cursor: pointer; text-align: left"><span style="display: flex; align-items: center; gap: 8px"><span aria-hidden="true" style="width: 10px; height: 10px; border-radius: 3px; background: {{u.dot}}"></span>{{u.name}}</span><span style="font-weight: 700; color: {{u.cnt}}">{{u.count}}</span></button>
<sc-if value="{{u.isOpen}}" hint-placeholder-val="{{false}}">

        cats: Object.keys(CAT).map(c => ({ c, n: inU.filter(d => d[1] === c).length })).filter(x => x.n).map(({ c, n }) => ({
          name: CAT[c], count: n, on: cat === c ? 'true' : 'false', bg: cat === c ? '#DDF5F2' : 'transparent', fg: cat === c ? '#067A70' : '#3B4250',
          pick: () => this.setState({ cat: c, limit: 20 })
        }))
      };
    });
    const PIN = ['Strategi Rentalaja 2027 · Ringkas', 'Playbook Unit Bisnis POKAMA', 'Aturan Main Sistem Kerja Pokama', 'SOP Operasional Rentalaja', 'Financial Governance POKAMA', 'Proses Bisnis TripinAja', 'Proposal Investasi Laptopaja'];
    const pins = PIN.map(t => all.find(d => d[0] === t)).filter(Boolean).map(d => ({ title: d[0], url: d[6], dot: UN[d[2]][1] }));
    const stBtns = [['aktif', 'Aktif'], ['Draf', 'Draf'], ['Arsip', 'Arsip'], ['all', 'Semua']].map(([k, label]) => ({
      label, on: st === k ? 'true' : 'false', bg: st === k ? '#1D3149' : '#FFFFFF', fg: st === k ? '#FFFFFF' : '#3B4250', pick: () => this.setState({ st: k, limit: 20 })
    }));
    const FL = [['Judul', 'Unit · Judul · Bulan Tahun'], ['Unit', 'Holding / Rentalaja / TripinAja / Niagaaja'], ['Kategori', 'Strategi / Proposal / SOP / Keuangan / Notulensi / Desain / Legal'], ['Jenis', 'Deck / Dokumen / Sheet / PDF / Desain'], ['Tautan', 'https://…']];
    const fv = this.state.fv;
    const UK = { holding: 'HQ', rentalaja: 'RA', tripinaja: 'WG', niagaaja: 'NA' };
    const CK = { strategi: 'strategi', proposal: 'proposal', sop: 'sop', keuangan: 'keu', notulensi: 'rapat', desain: 'desain', legal: 'legal' };
    const PEND = [
      ['p1', 'Rentalaja · Harga sewa akhir tahun · Des 2026', 'Eja', '22.40', 'Upload Eja', ['strategi', 'RA', 'Presentasi', 'Draf'], 'Rentalaja / Strategi · Draf'],
      ['p2', 'TripinAja · Kontrak villa Halaman Belakang Kebon', 'Wiranata', '21.15', 'TripinAja', ['legal', 'WG', 'Dokumen', 'Draf'], 'TripinAja / Legal · Draf'],
      ['p3', 'foto KTP pelanggan 26-10.jpg', 'Ajri', '19.02', 'Upload Ajri', null, 'Bukan dokumen kerja · jangan dimasukkan']
    ];
    const pd0 = this.state.pendDone;
    const pend = PEND.filter(p => !pd0[p[0]]).map(([id, title, who, when, from, row, sug]) => ({
      title, who, when, from, sug, okLabel: row ? 'Masukkan' : 'Ikuti saran AI',
      ok: () => this.setState({ pendDone: { ...pd0, [id]: 1 }, extra: row ? this.state.extra.concat([[title, row[0], row[1], row[2], row[3], '26 Okt 2026', '', 0]]) : this.state.extra, msg: row ? '"' + title + '" masuk Library di ' + sug + '.' : 'File tidak dimasukkan. Data pribadi pelanggan disimpan di Rentalaja App, bukan Library.' }),
      skip: () => this.setState({ pendDone: { ...pd0, [id]: 1 }, msg: '"' + title + '" dilewati dan tidak tampil di Library.' })
    }));
    const AC = { full: ['Buka & ubah', '#DDF5F2', '#067A70'], read: ['Hanya baca', '#E5EEF9', '#1E5AA8'], no: ['Tidak bisa', '#F3F5F8', '#8A94A3'], own: ['Unitnya saja', '#FDF3D7', '#7A5200'] };
    const ACC = [['CEO', 'full', 'full', 'full', 'full'], ['Keuangan', 'full', 'read', 'full', 'full'], ['Kepala Staf', 'full', 'full', 'read', 'no'], ['Leader unit', 'read', 'own', 'own', 'no'], ['Staf management', 'read', 'own', 'no', 'no']];
    const isAll = unit === 'ALL';
    return {
      syncText: 'Terakhir ' + this.state.synced + ' · otomatis tiap 15 menit · file baru di folder Drive langsung masuk antrean di bawah', syncNow: () => this.setState({ synced: '23.20', msg: 'Sinkron selesai. Tidak ada perubahan baru sejak 23.05.' }),
      hasPend: pend.length > 0, pend,
      showAcc: this.state.showAcc, accOn: this.state.showAcc ? 'true' : 'false', accText: this.state.showAcc ? 'Tutup izin akses' : 'Izin akses', toggleAcc: () => this.setState({ showAcc: !this.state.showAcc }),
      accHead: ['PERAN', 'DOKUMEN INTI & HOLDING', 'DOKUMEN UNIT', 'KEUANGAN', 'BERTANDA TERBATAS'],
      accRows: ACC.map(([role, ...c]) => ({ role, cells: c.map(k => ({ t: AC[k][0], bg: AC[k][1], fg: AC[k][2] })) })),
      pins, tree, rows, empty: rows.length === 0, stBtns,
      crumb: (isAll ? 'Semua dokumen' : UN[unit][0] + (cat !== 'ALL' ? ' / ' + CAT[cat] : '')),
      allCount: all.filter(vis).length, allOn: isAll ? 'true' : 'false', allBg: isAll ? '#1D3149' : 'transparent', allFg: isAll ? '#FFFFFF' : '#1F2933',
      pickAll: () => this.setState({ unit: 'ALL', cat: 'ALL', limit: 20 }),
      q, onQ: (e) => this.setState({ q: e.target.value, limit: 20 }),
      sortText: sort === 'new' ? 'terbaru' : 'A–Z', toggleSort: () => this.setState({ sort: sort === 'new' ? 'az' : 'new' }),
      showing: 'Menampilkan ' + rows.length + ' dari ' + list.length + ' dokumen', hasMore: list.length > rows.length, more: () => this.setState({ limit: limit + 20 }),
      hasMsg: !!this.state.msg, msg: this.state.msg, clearMsg: () => this.setState({ msg: '' }),
      addOpen: this.state.add, openAdd: () => this.setState({ add: true, fv: {} }), addCancel: () => this.setState({ add: false }),
      addFields: FL.map(([label, ph], i) => ({ label, ph, v: fv[i] || '', on: (e) => this.setState({ fv: { ...this.state.fv, [i]: e.target.value } }) })),
      addSubmit: () => {
        const t = (fv[0] || '').trim() || 'Dokumen baru';
        const u = UK[(fv[1] || '').trim().toLowerCase()] || 'HQ';
        const c = CK[(fv[2] || '').trim().toLowerCase().split(' ')[0]] || 'strategi';
        const row = [t, c, u, (fv[3] || 'Dokumen').trim(), 'Draf', '26 Okt 2026', (fv[4] || '').trim(), 0];
        this.setState({ extra: this.state.extra.concat([row]), add: false, msg: '"' + t + '" masuk Library sebagai Draf.' });
      }
    };
  }
}

dcBoot(Component);
</script>
