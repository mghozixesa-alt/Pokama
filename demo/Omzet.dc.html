</sc-for>

<span style="font-size: 13px; color: #5B6573">Di bawah 75% perlu tindakan: Kepala Staf membahasnya dengan Leader minggu ini. 75–89% diawasi. 90% ke atas aman.</span>

</div>
</div>

<th scope="col" style="text-align: left; padding: 12px 8px 12px 20px; font-size: 12px; color: #5B6573; font-weight: 800; letter-spacing: 0.06em; width: 220px">CAPAIAN</th>
<th scope="col" style="text-align: right; padding: 12px 8px; font-size: 12px; color: #5B6573; font-weight: 800; letter-spacing: 0.06em">KURANG</th>
<th scope="col" style="text-align: left; padding: 12px 22px 12px 8px; font-size: 12px; color: #5B6573; font-weight: 800; letter-spacing: 0.06em">STATUS</th>
</tr></thead>
<tbody>
<sc-for list="{{tgtRows}}" as="r" hint-placeholder-count="9">
<tr style="border-bottom: 1px solid #EEF0F3; background: {{r.bg}}">
<td style="padding: 10px 22px 10px {{r.indent}}"><span style="display: flex; flex-direction: column"><span style="font-weight: {{r.fw}}; font-size: {{r.fs}}">{{r.name}}</span><span style="font-size: 12px; color: #5B6573">{{r.sub}}</span></span></td>
<td style="padding: 10px 8px; text-align: right; font-variant-numeric: tabular-nums; color: #3B4250">{{r.t}}</td>
<td style="padding: 10px 8px; text-align: right; font-variant-numeric: tabular-nums; font-weight: {{r.fw}}">{{r.a}}</td>
<td style="padding: 10px 8px 10px 20px"><div style="display: flex; align-items: center; gap: 10px"><div style="flex-grow: 1; height: 10px; background: #EEF0F3; border-radius: 5px; overflow: hidden"><div style="height: 100%; width: {{r.w}}; background: {{r.bar}}; border-radius: 5px"></div></div><span style="font-weight: 900; font-variant-numeric: tabular-nums; width: 44px; text-align: right; color: {{r.pctFg}}">{{r.pct}}</span></div></td>
<td style="padding: 10px 8px; text-align: right; font-variant-numeric: tabular-nums; color: #9A3F0A">{{r.gap}}</td>
<td style="padding: 8px 22px 8px 8px"><div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap"><span style="font-size: 12px; font-weight: 800; padding: 3px 10px; border-radius: 999px; background: {{r.stBg}}; color: {{r.stFg}}; white-space: nowrap">{{r.st}}</span><sc-if value="{{r.evalNeeded}}" hint-placeholder-val="{{false}}"><a href="Penugasan.dc.html" style="font-size: 12px; font-weight: 800; color: #9A3F0A; white-space: nowrap">Buat tugas perbaikan →</a></sc-if></div></td>
</tr>
</sc-for>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 800; color: #3B4250">Unit
<select value="{{f.unit}}" onChange="{{onUnit}}" style="height: 44px; border: 1px solid #D3D7DE; border-radius: 10px; padding: 0 10px; font: inherit; font-size: 14px; background: #FFFFFF; color: #1F2933">
<option value="WG">TripinAja</option>
<option value="NL">Niagaaja · Laptopaja</option>
<option value="NJ">Niagaaja · JB</option>
<option value="MP">Maripoto Photobooth</option>
</select>
</label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 800; color: #3B4250">Tanggal
<input type="text" value="Senin, 26 Okt 2026" readonly style="height: 44px; box-sizing: border-box; border: 1px solid #D3D7DE; border-radius: 10px; padding: 0 12px; font: inherit; font-size: 14px; color: #1F2933; background: #F7F8FA">
</label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 800; color: #3B4250">Omzet hari ini (Rp)
<input type="text" inputmode="numeric" value="{{f.omzet}}" onChange="{{onOmzet}}" placeholder="0" style="height: 44px; box-sizing: border-box; border: 1px solid #D3D7DE; border-radius: 10px; padding: 0 12px; font: inherit; font-size: 14px; color: #1F2933">
</label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 800; color: #3B4250">Jumlah transaksi
<input type="text" inputmode="numeric" placeholder="0" style="height: 44px; box-sizing: border-box; border: 1px solid #D3D7DE; border-radius: 10px; padding: 0 12px; font: inherit; font-size: 14px; color: #1F2933">
</label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 800; color: #3B4250">Tunai disetor (Rp)
<input type="text" inputmode="numeric" placeholder="0" style="height: 44px; box-sizing: border-box; border: 1px solid #D3D7DE; border-radius: 10px; padding: 0 12px; font: inherit; font-size: 14px; color: #1F2933">
</label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 800; color: #3B4250">Calon pelanggan yang bertanya
<input type="text" inputmode="numeric" placeholder="untuk closing rate" style="height: 44px; box-sizing: border-box; border: 1px solid #D3D7DE; border-radius: 10px; padding: 0 12px; font: inherit; font-size: 14px; color: #1F2933">
</label>
</div>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 800; color: #3B4250">Catatan (komplain, kendala, DP yang ditahan)
<textarea rows="2" style="font: inherit; font-size: 14px; border: 1px solid #D3D7DE; border-radius: 10px; padding: 10px 12px; resize: vertical; color: #1F2933"></textarea>
</label>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px">
<button type="button" onClick="{{submit}}" style="height: 44px; padding: 0 20px; border-radius: 10px; border: 0; background: #09BEAF; color: #1D3149; font: inherit; font-weight: 800; cursor: pointer">Kirim laporan</button>
<sc-if value="{{sentMsg}}" hint-placeholder-val="{{false}}"><span style="font-weight: 700; color: #067A70">{{sentText}}</span></sc-if>
</div>
</section>
</sc-if>
<sc-if value="{{noForm}}" hint-placeholder-val="{{false}}">
<section aria-label="Cara lapor" style="flex: 2 1 520px; min-width: 0; background: #FFFFFF; border: 1px solid #E3E6EB; border-radius: 20px; padding: 22px; display: flex; flex-direction: column; gap: 12px"><h2 style="margin: 0; font-size: 18px; font-weight: 800">Lapor omzet harian</h2><span style="color: #3B4250">Unit ini melapor lewat <strong>Tutup shift</strong> di Rentalaja App, jadi angkanya masuk otomatis ke sini.</span><a href="https://rentalaja-app.vercel.app/#/PosShift" target="_blank" rel="noopener" style="align-self: flex-start; height: 44px; padding: 0 16px; border-radius: 10px; background: #09BEAF; color: #1D3149; font-weight: 800; display: flex; align-items: center; text-decoration: none">Buka Tutup shift ↗</a></section>
</sc-if>

<section aria-labelledby="st-h" style="flex: 1 1 320px; min-width: 0; background: #FFFFFF; border: 1px solid #E3E6EB; border-radius: 20px; padding: 22px; display: flex; flex-direction: column; gap: 4px">
<h2 id="st-h" style="margin: 0 0 8px; font-size: 18px; font-weight: 800">Laporan masuk hari ini</h2>
<sc-for list="{{status}}" as="s" hint-placeholder-count="6">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid #EEF0F3">
<span style="display: flex; flex-direction: column"><span style="font-weight: 800">{{s.name}}</span><span style="font-size: 12px; color: #5B6573">{{s.who}}</span></span>
<span style="font-size: 12px; font-weight: 800; padding: 4px 10px; border-radius: 999px; background: {{s.bg}}; color: {{s.fg}}; white-space: nowrap">{{s.st}}</span>
</div>
</sc-for>
<span style="font-size: 12px; color: #5B6573; margin-top: 8px">Lewat 21.00 belum masuk: Leader diingatkan WhatsApp; lewat 22.00 diteruskan ke Kepala Staf.</span>
</section>
</div>
</main>
</div>
</script>
<script>

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { unit: 'WG', omzet: '', sent: {}, scope: 'H' };
  }
  renderVals() {
    const SC = [['GK', 'RA Garut Kota'], ['BD', 'RA Bandung'], ['WN', 'RA Wanaraja'], ['CP', 'RA Ciputat'], ['EX', 'Experience'], ['JP', 'Jeep'], ['WG', 'TripinAja'], ['NA', 'Niagaaja'], ['MP', 'Maripoto']];
    const scope = this.state.scope || 'H';
    const isH = scope === 'H';
    const scopeVals = {
      isH, notH: !isH, isHolding: isH ? 'true' : 'false', hBg: isH ? '#1D3149' : '#F3F5F8', hFg: isH ? '#FFFFFF' : '#3B4250',
      pickHolding: () => this.setState({ scope: 'H' }),
      unitBtns: SC.map(([k, label]) => ({ label, on: scope === k ? 'true' : 'false', bg: scope === k ? '#1D3149' : '#FFFFFF', fg: scope === k ? '#FFFFFF' : '#3B4250', pick: () => this.setState({ scope: k }) }))
    };
    const rp = (v) => 'Rp' + Math.round(v).toLocaleString('id-ID');
    const DB = 'Dasbor Rentalaja';
    const IN = 'Lapor di sini';
    const U = [
      { name: 'Rentalaja Garut Kota', src: DB, parts: [['Garut Kota', 71452000]] },
      { name: 'Niagaaja', src: IN, parts: [['Laptopaja', 23028000], ['JB (jual beli)', 1499000]] },
      { name: 'TripinAja', src: IN, parts: [['Trip', 20294000]] },
      { name: 'ATVaja (Jeep)', src: DB, parts: [['Jeep', 18905000]] },
      { name: 'Rentalaja Bandung', src: DB, parts: [['Booth Jackal DU', 8791000], ['Bandung', 7617000]] },
      { name: 'Maripoto Photobooth', src: IN, parts: [['Bumi UPI', 14243000]] },
      { name: 'Rentalaja Experience', src: DB, parts: [['Ruma Metua', 6192410]] },
      { name: 'Rentalaja Wanaraja', src: DB, parts: [['Wanaraja', 3240000]] },
      { name: 'Lainnya', src: 'Sudah berhenti / kecil', parts: [['Maripoto Sport PPG (ditutup Okt)', 2867000], ['Pergipiknik', 1150000]] }
    ];
    const sums = U.map(u => u.parts.reduce((a, p) => a + p[1], 0));
    const CODE = { 'Rentalaja Garut Kota': 'GK', 'Niagaaja': 'NA', 'TripinAja': 'WG', 'ATVaja (Jeep)': 'JP', 'Rentalaja Bandung': 'BD', 'Maripoto Photobooth': 'MP', 'Rentalaja Experience': 'EX', 'Rentalaja Wanaraja': 'WN', 'Lainnya': 'LN' };
    const keep = (u) => isH || CODE[u.name] === scope;
    const total = sums.reduce((a, b, i) => a + (keep(U[i]) ? b : 0), 0);
    const max = Math.max(...sums);
    const units = U.map((u, i) => ({
      name: u.name, v: rp(sums[i]), share: Math.round(sums[i] / max * 100) + '%',
      src: u.src, srcBg: u.src === DB ? '#1D3149' : u.src === IN ? '#DDF5F2' : '#EEF0F3', srcFg: u.src === DB ? '#FFFFFF' : u.src === IN ? '#067A70' : '#4A5160',
      parts: u.parts.length > 1 ? u.parts.map(p => ({ k: p[0], v: rp(p[1]) })) : []
    })).filter((x, i) => keep(U[i]));
    const TG = [
      { k: 'RA', name: 'Rentalaja', sub: 'Gabungan semua lini', t: 150000000, lines: [['GK', 'Garut Kota', 85000000, 71452000], ['JP', 'ATVaja (Jeep)', 22000000, 18905000], ['BD', 'Bandung', 25000000, 16408000], ['EX', 'Experience', 12000000, 6192410], ['WN', 'Wanaraja', 6000000, 3240000]] },
      { k: 'WG', name: 'TripinAja', sub: 'Leader Wiranata', t: 25000000, a: 20294000 },
      { k: 'NA', name: 'Niagaaja', sub: 'Leader Yusril Firdaus', t: 30000000, a: 24527000 },
      { k: 'MP', name: 'Maripoto Photobooth', sub: 'Di luar liga 3 unit', t: 15000000, a: 14243000 }
    ];
    const stOf = (p) => p >= 1 ? ['Tercapai', '#DDF5F2', '#067A70', '#09BEAF'] : p >= 0.9 ? ['Aman', '#DDF5F2', '#067A70', '#09BEAF'] : p >= 0.75 ? ['Diawasi', '#FDF3D7', '#7A5200', '#D99A00'] : ['Perlu evaluasi', '#FCEBDD', '#9A3F0A', '#C2410C'];
    const row = (name, sub, t, a, lvl) => { const p = a / t, st = stOf(p); return { name, sub, t: rp(t), a: rp(a), pct: Math.round(p * 100) + '%', w: Math.min(100, Math.round(p * 100)) + '%', gap: a >= t ? '—' : rp(t - a), st: st[0], stBg: st[1], stFg: st[2], bar: st[3], pctFg: st[2], evalNeeded: p < 0.75, indent: lvl ? '44px' : '22px', fw: lvl ? 600 : 900, fs: lvl ? '13px' : '15px', bg: lvl ? '#FAFAFB' : 'transparent' }; };
    const tgtRows = [];
    let tT = 0, tA = 0, nEval = 0;
    TG.forEach(u => {
      const a = u.lines ? u.lines.reduce((x, l) => x + l[3], 0) : u.a;
      const lines = u.lines || [];
      const show = isH || scope === u.k || lines.some(l => l[0] === scope);
      if (!show) return;
      tgtRows.push(row(u.name, u.sub, u.t, a, 0)); tT += u.t; tA += a; if (a / u.t < 0.75) nEval++;
      lines.filter(l => isH || scope === u.k || l[0] === scope).forEach(l => { const r = row(l[1], 'Lini Rentalaja', l[2], l[3], 1); tgtRows.push(r); if (l[3] / l[2] < 0.75) nEval++; });
    });
    const tgtTiles = [
      { k: 'Target', v: rp(tT), fg: '#1F2933' }, { k: 'Omzet', v: rp(tA), fg: '#1F2933' },
      { k: 'Capaian', v: tT ? Math.round(tA / tT * 100) + '%' : '—', fg: '#067A70' }, { k: 'Perlu evaluasi', v: nEval + ' unit/lini', fg: '#9A3F0A' }
    ];
    const names = { WG: 'TripinAja', NL: 'Niagaaja · Laptopaja', NJ: 'Niagaaja · JB', MP: 'Maripoto Photobooth' };
    const sent = this.state.sent;
    const status = [
      { k: 'RA', name: 'Cabang Rentalaja', who: 'Otomatis dari Tutup shift', auto: true },
      { k: 'WG', name: 'TripinAja', who: 'Ariq' },
      { k: 'NL', name: 'Niagaaja · Laptopaja', who: 'Yusril' },
      { k: 'NJ', name: 'Niagaaja · JB', who: 'Yusril' },
      { k: 'MP', name: 'Maripoto Photobooth', who: 'Leader belum ada' }
    ].filter(s => isH || s.k === scope || (s.k === 'RA' && ['GK', 'BD', 'WN', 'CP', 'EX', 'JP'].includes(scope)) || (scope === 'NA' && (s.k === 'NL' || s.k === 'NJ'))).map(s => {
      const ok = s.auto || sent[s.k];
      return { name: s.name, who: s.who, st: s.auto ? 'Tersambung' : ok ? 'Masuk' : 'Belum', bg: ok ? '#DDF5F2' : '#FCEBDD', fg: ok ? '#067A70' : '#9A3F0A' };
    });
    const last = this.state.last;
    const formUnit = isH ? this.state.unit : ({ WG: 'WG', NA: (this.state.unit === 'NJ' ? 'NJ' : 'NL'), MP: 'MP' }[scope] || this.state.unit);
    const showForm = isH || ['WG', 'NA', 'MP'].includes(scope);
    return { tgtRows, tgtTiles,
      ...scopeVals, showForm, noForm: !showForm, empty: units.length === 0,
      totalLabel: isH ? 'Total yang tercatat' : 'Omzet unit ini',
      units, total: rp(total), status,
      f: { unit: formUnit, omzet: this.state.omzet },
      onUnit: (e) => this.setState({ unit: e.target.value }),
      onOmzet: (e) => this.setState({ omzet: e.target.value }),
      submit: () => this.setState({ sent: { ...sent, [formUnit]: true }, last: formUnit, omzet: '' }),
      sentMsg: !!last, sentText: last ? 'Laporan ' + names[last] + ' masuk.' : ''
    };
  }
}

dcBoot(Component);
</script>
</body>
</html>
