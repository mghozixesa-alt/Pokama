<main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 28px 36px 48px; display: flex; flex-direction: column; gap: 18px">
<header style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 13px; color: #5B6573; font-weight: 600">Siapa mengerjakan apa, sampai kapan</span>
<h1 style="margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -0.01em">Proyek &amp; Tugas</h1>
</div>
<button type="button" onClick="{{act_proyek_baru}}" style="height: 44px; padding: 0 18px; border-radius: 10px; border: 0; background: #09BEAF; color: #1D3149; font: inherit; font-weight: 800; cursor: pointer">+ Tugas baru</button>
</header>
<sc-if value="{{hasMsg}}" hint-placeholder-val="{{false}}"><div role="status" style="display: flex; align-items: center; gap: 12px; background: #DDF5F2; color: #067A70; border: 1px solid #A9E4DC; border-radius: 12px; padding: 10px 12px 10px 16px; font-weight: 700"><span style="flex-grow: 1">{{msg}}</span><button type="button" onClick="{{clearMsg}}" style="height: 36px; padding: 0 12px; border-radius: 8px; border: 0; background: transparent; color: #067A70; font: inherit; font-weight: 800; cursor: pointer">Tutup</button></div></sc-if>
<sc-if value="{{formOpen}}" hint-placeholder-val="{{false}}"><section aria-label="{{formTitle}}" style="background: #FFFFFF; border: 2px solid #09BEAF; border-radius: 16px; padding: 18px 20px; display: flex; flex-direction: column; gap: 12px"><div style="display: flex; flex-direction: column; gap: 2px"><h2 style="margin: 0; font-size: 18px; font-weight: 800">{{formTitle}}</h2><span style="font-size: 13px; color: #5B6573">{{formNote}}</span></div><div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px"><sc-for list="{{formFields}}" as="ff" hint-placeholder-count="3"><label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 700; color: #3B4250">{{ff.label}}<input type="text" value="{{ff.v}}" onChange="{{ff.on}}" placeholder="{{ff.ph}}" style="height: 44px; box-sizing: border-box; border: 1px solid #D3D7DE; border-radius: 10px; padding: 0 12px; font: inherit; font-weight: 500; color: #1F2933"></label></sc-for></div><div style="display: flex; gap: 8px"><button type="button" onClick="{{formSubmit}}" style="height: 44px; padding: 0 18px; border-radius: 10px; border: 0; background: #09BEAF; color: #1D3149; font: inherit; font-weight: 900; cursor: pointer">{{formCta}}</button><button type="button" onClick="{{formCancel}}" style="height: 44px; padding: 0 16px; border-radius: 10px; border: 1px solid #E3E6EB; background: #FFFFFF; color: #3B4250; font: inherit; font-weight: 700; cursor: pointer">Batal</button></div></section></sc-if>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px; background: #FFFFFF; border: 1px solid #E3E6EB; border-radius: 14px; padding: 12px 16px; font-size: 13px; color: #3B4250">
<span style="font-weight: 900; color: #1D3149">Tugas datang dari 2 jalan:</span>
<span style="display: inline-flex; align-items: center; gap: 6px"><span style="font-size: 11px; font-weight: 900; padding: 3px 8px; border-radius: 999px; background: #EEF0F3; color: #3B4250">Dari atasan</span>dibuat langsung di sini</span>
<span style="display: inline-flex; align-items: center; gap: 6px"><span style="font-size: 11px; font-weight: 900; padding: 3px 8px; border-radius: 999px; background: #E5EEF9; color: #1E5AA8">Dari permintaan</span>unit lain minta bantuan, lalu diterima di <a href="Permintaan.dc.html" style="font-weight: 800; color: #1D3149">Permintaan</a></span>
</div>

<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px">
<div role="group" aria-label="Pilih unit" style="display: flex; flex-wrap: wrap; gap: 6px">
<sc-for list="{{unitBtns}}" as="u" hint-placeholder-count="5"><button type="button" aria-pressed="{{u.on}}" onClick="{{u.pick}}" style="height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid #E3E6EB; background: {{u.bg}}; color: {{u.fg}}; font: inherit; font-size: 14px; font-weight: 800; cursor: pointer">{{u.label}}</button></sc-for>
</div>
<button type="button" aria-pressed="{{attnOn}}" onClick="{{toggleAttn}}" style="height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid {{attnBd}}; background: {{attnBg}}; color: {{attnFg}}; font: inherit; font-size: 14px; font-weight: 800; cursor: pointer">{{attnText}}</button>
</div>

<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px">
<sc-for list="{{tiles}}" as="t" hint-placeholder-count="3"><div style="background: #FFFFFF; border: 1px solid #E3E6EB; border-radius: 14px; padding: 14px 18px; display: flex; flex-direction: column"><span style="font-size: 13px; color: #5B6573; font-weight: 700">{{t.k}}</span><span style="font-size: 26px; font-weight: 900; color: {{t.fg}}">{{t.v}}</span></div></sc-for>
</div>

<sc-if value="{{emptyNote}}" hint-placeholder-val="{{false}}"><p style="margin: 0; padding: 14px 16px; border-radius: 12px; background: #FFFFFF; border: 1px dashed #C9CED6; color: #5B6573">Tidak ada tugas yang perlu perhatian di unit ini.</p></sc-if>

<sc-for list="{{groups}}" as="g" hint-placeholder-count="4">
<section aria-label="{{g.name}}" style="display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; align-items: center; gap: 10px"><span style="font-size: 17px; font-weight: 900; color: {{g.color}}">{{g.name}}</span><span style="font-size: 13px; color: #5B6573; font-weight: 700">{{g.count}} tugas</span></div>
<div style="background: #FFFFFF; border: 1px solid #E3E6EB; border-left: 6px solid {{g.color}}; border-radius: 12px; overflow-x: auto">
<table style="width: 100%; min-width: 900px; border-collapse: collapse">
<thead><tr style="border-bottom: 1px solid #E3E6EB">
<th scope="col" style="text-align: left; padding: 10px 14px; font-size: 12px; color: #5B6573; font-weight: 800">Tugas</th>
<th scope="col" style="text-align: left; padding: 10px 8px; font-size: 12px; color: #5B6573; font-weight: 800; width: 150px">PIC</th>
<th scope="col" style="text-align: center; padding: 10px 0; font-size: 12px; color: #5B6573; font-weight: 800; width: 170px">Status</th>
<th scope="col" style="text-align: left; padding: 10px 12px; font-size: 12px; color: #5B6573; font-weight: 800; width: 140px">Tenggat</th>
<th scope="col" style="text-align: left; padding: 10px 14px 10px 8px; font-size: 12px; color: #5B6573; font-weight: 800; width: 150px">Progres</th>
</tr></thead>
<tbody>
<sc-for list="{{g.rows}}" as="r" hint-placeholder-count="3">
<tr style="border-bottom: 1px solid #EEF0F3; background: {{r.rowBg}}">
<td style="padding: 0"><button type="button" aria-expanded="{{r.open}}" onClick="{{r.toggle}}" style="width: 100%; min-height: 52px; border: 0; background: transparent; font: inherit; color: #1F2933; text-align: left; padding: 8px 14px; cursor: pointer; display: flex; align-items: center; gap: 10px"><span aria-hidden="true" style="color: #8A94A3; font-size: 12px; width: 10px">{{r.caret}}</span><span style="display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 800">{{r.title}}</span><sc-if value="{{r.fromReq}}" hint-placeholder-val="{{false}}"><span style="font-size: 11px; font-weight: 800; color: #1E5AA8">{{r.srcText}}</span></sc-if></span></button></td>
<td style="padding: 8px"><span style="display: flex; align-items: center; gap: 8px; font-weight: 700"><span aria-hidden="true" style="width: 28px; height: 28px; border-radius: 14px; background: {{r.avBg}}; color: #FFFFFF; font-size: 11px; font-weight: 900; display: flex; align-items: center; justify-content: center; flex-shrink: 0">{{r.ini}}</span>{{r.pic}}</span></td>
<td style="padding: 3px 0"><span style="display: flex; align-items: center; justify-content: center; height: 46px; background: {{r.stBg}}; color: {{r.stFg}}; font-size: 13px; font-weight: 800">{{r.st}}</span></td>
<td style="padding: 8px 12px"><span style="display: flex; flex-direction: column"><span style="font-weight: 800; color: {{r.dueFg}}">{{r.due}}</span><sc-if value="{{r.late}}" hint-placeholder-val="{{false}}"><span style="font-size: 11px; font-weight: 800; color: #C2410C">{{r.lateText}}</span></sc-if></span></td>
<td style="padding: 8px 14px 8px 8px"><sc-if value="{{r.hasPct}}" hint-placeholder-val="{{true}}"><span style="display: flex; align-items: center; gap: 8px"><span style="flex: 1 1 auto; height: 8px; background: #EEF0F3; border-radius: 4px; overflow: hidden"><span style="display: block; height: 100%; width: {{r.pct}}; background: {{r.bar}}"></span></span><span style="font-size: 12px; font-weight: 800; width: 34px; text-align: right">{{r.pct}}</span></span></sc-if><sc-if value="{{r.routine}}" hint-placeholder-val="{{false}}"><span style="font-size: 12px; font-weight: 700; color: #5B6573">Rutin tiap hari</span></sc-if></td>
</tr>
<sc-if value="{{r.isOpen}}" hint-placeholder-val="{{false}}">
<tr style="border-bottom: 1px solid #EEF0F3; background: #FAFBFC"><td colspan="5" style="padding: 12px 14px 16px 38px">
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; font-size: 13px">
<span style="display: flex; flex-direction: column; grid-column: span 2"><span style="font-size: 11px; font-weight: 900; color: #5B6573; letter-spacing: 0.04em">SELESAI BILA</span><span style="font-weight: 700">{{r.dod}}</span></span>
<span style="display: flex; flex-direction: column"><span style="font-size: 11px; font-weight: 900; color: #5B6573; letter-spacing: 0.04em">DICEK OLEH</span><span style="font-weight: 700">{{r.rev}}</span></span>
<span style="display: flex; flex-direction: column"><span style="font-size: 11px; font-weight: 900; color: #5B6573; letter-spacing: 0.04em">IKUT MEMBANTU</span><span style="font-weight: 700">{{r.team}}</span></span>
<span style="display: flex; flex-direction: column; grid-column: span 2"><span style="font-size: 11px; font-weight: 900; color: #5B6573; letter-spacing: 0.04em">CATATAN REVIEW</span><span style="font-weight: 700">{{r.rvText}}</span></span>
<span style="display: flex; flex-direction: column"><span style="font-size: 11px; font-weight: 900; color: #5B6573; letter-spacing: 0.04em">JAM KERJA MINGGU INI</span><span style="font-weight: 700">{{r.kkh}} (dari KKH)</span></span>
<span style="display: flex; align-items: flex-end"><a href="Review.dc.html" style="font-weight: 800; color: #067A70">Buka review →</a></span>
</div>
</td></tr>
</sc-if>
</sc-for>
</tbody>
</table>
<div style="display: flex; align-items: center; gap: 10px; padding: 8px 14px; border-top: 1px solid #EEF0F3; background: #FAFBFC"><span style="font-size: 12px; color: #5B6573; font-weight: 700">Ringkasan</span><span style="flex: 1 1 auto; display: flex; height: 10px; border-radius: 5px; overflow: hidden; max-width: 360px"><sc-for list="{{g.bar}}" as="b" hint-placeholder-count="3"><span title="{{b.t}}" style="width: {{b.w}}; background: {{b.c}}"></span></sc-for></span></div>
</div>
</section>
</sc-for>

<div style="display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: #3B4250; font-weight: 700">
<sc-for list="{{legend}}" as="l" hint-placeholder-count="6"><span style="display: inline-flex; align-items: center; gap: 6px"><span aria-hidden="true" style="width: 14px; height: 14px; border-radius: 4px; background: {{l.c}}"></span>{{l.t}}</span></sc-for>
</div>
</main>
</div>
</script>
<script>

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { unit: 'ALL', attn: false, open: 'lk' };
  }
  componentDidUpdate(pp, ps) { if ((this.state.form_ && this.state.form_ !== ps.form_) || (this.state.msg && this.state.msg !== ps.msg)) { try { window.scrollTo({ top: 0, behavior: 'smooth' }); } catch (e) {} } }
  openForm(k, ctx) { this.setState({ form_: k, fv: {}, fctx: ctx || '' }); }
  say(m) { this.setState({ msg: m, form_: null }); }
  uxVals(F) {
    const k = this.state.form_, f = k ? F[k] : null, fv = this.state.fv || {}, ctx = this.state.fctx || '';
    return {
      hasMsg: !!this.state.msg, msg: this.state.msg || '', clearMsg: () => this.setState({ msg: '' }),
      formOpen: !!f, formTitle: f ? f.title.replace('{ctx}', ctx) : '', formNote: f ? (f.note || '') : '', formCta: f ? (f.cta || 'Kirim') : '',
      formFields: f ? f.fields.map(([label, ph], i) => ({ label, ph: (ph || '').replace('{ctx}', ctx), v: fv[i] || '', on: (e) => this.setState({ fv: { ...(this.state.fv || {}), [i]: e.target.value } }) })) : [],
      formSubmit: () => this.say(f.done.replace('{ctx}', ctx).replace(/\{(\d)\}/g, (m, i) => (fv[i] || '').trim() || 'baru')), formCancel: () => this.setState({ form_: null })
    };
  }
  renderVals() {
    const ST = {
      todo: ['Belum mulai', '#C9CED6', '#1F2933'], run: ['Dikerjakan', '#2F6FD6', '#FFFFFF'], wait: ['Menunggu review', '#F2B33D', '#1F2933'],
      rev: ['Perlu revisi', '#E2445C', '#FFFFFF'], done: ['Selesai', '#00A87E', '#FFFFFF'], hold: ['Ditunda', '#8E6CC9', '#FFFFFF']
    };
    const PC = { RZ: ['Reza', '#1D3149'], EJ: ['Eja', '#067A70'], KV: ['Kevin', '#B45309'], AJ: ['Ajri', '#2F6FD6'], AD: ['Adrian', '#5B4B8A'], IF: ['Intifa', '#0E7C66'], WR: ['Wiranata', '#C2410C'], YF: ['Yusril', '#7A5200'] };
    const G = [
      ['HQ', 'Holding', '#555E6E', [
        ['lk', 'Laporan keuangan komprehensif PT Pokama', 'RZ', 'rev', '31 Okt', 60, 'LK Jan–Sep disetujui Kepala Staf, disahkan CEO', 'Intifa (Kepala Staf)', '—', 'v2 · 2 poin belum diperbaiki', 12, true, ''],
        ['bz', 'Jurnal BizDev & omzet harian', 'EJ', 'run', 'Tiap hari', null, 'Omzet semua cabang masuk sebelum 21.00', 'Intifa (Kepala Staf)', 'Reza', '—', 10, false, ''],
        ['wa', 'Strategi WA Story', 'KV', 'rev', '30 Nov', 25, 'Viewer story kembali ±1.250', 'Intifa (Kepala Staf)', '—', 'v3 · putaran ke-3', 4, true, 'Terancam telat'],
        ['kb2', 'Konten promo paket Halaman Belakang Kebon', 'KV', 'todo', '6 Nov', 0, '3 konten feed dan story tayang', 'Wiranata', '—', '—', 0, false, '', 'Dari permintaan Wiranata · TripinAja']
      ]],
      ['RA', 'Rentalaja', '#1D3149', [
        ['cp', 'Buka cabang Ciputat (iPhone)', 'AJ', 'wait', '7 Nov', 45, 'Etalase siap dan cabang buka untuk pelanggan', 'Adrian', 'Intifa', 'Etalase v1 menunggu dicek Adrian', 9, false, ''],
        ['bd', 'Penyelamatan Rentalaja Bandung', 'AD', 'run', '31 Des', 20, 'Bandung tidak minus 2 bulan berturut-turut', 'Intifa (Kepala Staf)', 'Intifa, Eja', '—', 6, true, 'Terancam telat'],
        ['web', 'Redesain rentalaja.co.id', 'IF', 'run', '15 Des', 35, 'Alur pilih → keranjang → verifikasi → bayar sudah live', 'Ghozy', 'Kevin', 'Tahap 1 (halaman pilih produk) sudah disetujui', 5, false, ''],
        ['ex', 'Onboarding properti Experience', 'EJ', 'todo', '30 Nov', 10, 'Didi House & rumah Green Hill bisa dibooking', 'Intifa (Kepala Staf)', 'Adrian', '—', 3, false, '']
      ]],
      ['WG', 'TripinAja', '#0E7C66', [
        ['tr', 'Restrukturisasi TripinAja', 'WR', 'rev', '15 Nov', 40, 'Struktur, 4 rekening, dan SOP disetujui', 'Intifa (Kepala Staf)', 'Intifa', 'Revisi telat 2 hari · 2 poin belum diperbaiki', 8, true, 'Revisi telat 2 hari'],
        ['kb', 'Kemitraan Halaman Belakang Kebon', 'WR', 'todo', '30 Nov', 0, 'Paket villa + sarapan tayang dan bisa dibooking', 'Intifa (Kepala Staf)', 'Kevin', '—', 2, false, '']
      ]],
      ['NA', 'Niagaaja', '#B45309', [
        ['lp', 'Proposal investor Laptopaja', 'YF', 'wait', '8 Nov', 55, 'Proposal final terkirim ke calon investor', 'Intifa (Kepala Staf)', 'Intifa', 'v3 menunggu dicek Intifa', 7, false, ''],
        ['wn', 'Website Niagaaja', 'YF', 'hold', '30 Nov', 0, 'Profil dan tombol WhatsApp online', 'Intifa (Kepala Staf)', 'Kevin', '—', 0, false, '']
      ]]
    ];
    const { unit, attn, open } = this.state;
    const needs = (r) => r[3] === 'rev' || r[3] === 'wait' || !!r[12];
    const allRows = G.flatMap(g => g[3]);
    const groups = G.filter(g => unit === 'ALL' || g[0] === unit).map(([k, name, color, rows]) => {
      const vis = rows.filter(r => !attn || needs(r));
      const cnt = {}; rows.forEach(r => { cnt[r[3]] = (cnt[r[3]] || 0) + 1; });
      return {
        name, color, count: vis.length,
        bar: Object.keys(ST).filter(s => cnt[s]).map(s => ({ c: ST[s][1], w: Math.round(cnt[s] / rows.length * 100) + '%', t: ST[s][0] + ': ' + cnt[s] })),
        rows: vis.map(r => {
          const [id, title, pic, st, due, pct, dod, rev, team, rvText, kkh, soon, late, src] = r;
          const s = ST[st], isOpen = open === id;
          return {
            title, ini: pic, pic: PC[pic][0], avBg: PC[pic][1], st: s[0], stBg: s[1], stFg: s[2], due, dueFg: soon ? '#C2410C' : '#1F2933', late: !!late, lateText: late,
            hasPct: pct !== null, routine: pct === null, pct: (pct || 0) + '%', bar: st === 'rev' ? '#E2445C' : '#1D3149',
            dod, rev, team, rvText, kkh: kkh + ' jam', fromReq: !!src, srcText: src || '',
            isOpen, open: isOpen ? 'true' : 'false', caret: isOpen ? '▾' : '▸', rowBg: isOpen ? '#F3FBFA' : '#FFFFFF',
            toggle: () => this.setState({ open: isOpen ? null : id })
          };
        })
      };
    }).filter(g => g.rows.length);
    const scoped = unit === 'ALL' ? allRows : (G.find(g => g[0] === unit) || [0, 0, 0, []])[3];
    const FORMS = {"proyek": {"title": "Tugas baru", "note": "Isi singkat saja. AI menyarankan siapa yang mengecek (bawaan: atasan langsung PIC) dan langsung membuat slot pertama di KKH PIC.", "fields": [["Nama tugas", "Misalnya Buka cabang Ciputat"], ["Selesai bila", "Hasil akhir yang bisa dicek"], ["PIC", "Satu orang penanggung jawab"], ["Tenggat", "Misalnya 30 Nov"]], "cta": "Buat tugas", "done": "Tugas \"{0}\" dibuat. PIC diberi tahu dan slot pertama masuk KKH-nya."}};
    return { ...this.uxVals(FORMS), act_proyek_baru: () => this.openForm('proyek'),
      unitBtns: [['ALL', 'Semua'], ['HQ', 'Holding'], ['RA', 'Rentalaja'], ['WG', 'TripinAja'], ['NA', 'Niagaaja']].map(([k, l]) => ({ label: l, on: unit === k ? 'true' : 'false', bg: unit === k ? '#1D3149' : '#FFFFFF', fg: unit === k ? '#FFFFFF' : '#3B4250', pick: () => this.setState({ unit: k }) })),
      attnOn: attn ? 'true' : 'false', attnText: attn ? '✓ Hanya yang perlu perhatian' : 'Hanya yang perlu perhatian', attnBg: attn ? '#FCEBDD' : '#FFFFFF', attnFg: attn ? '#9A3F0A' : '#3B4250', attnBd: attn ? '#F0C2A3' : '#E3E6EB', toggleAttn: () => this.setState({ attn: !attn }),
      tiles: [{ k: 'Tugas aktif', v: scoped.filter(r => r[3] !== 'hold' && r[3] !== 'done').length, fg: '#1F2933' }, { k: 'Perlu revisi', v: scoped.filter(r => r[3] === 'rev').length, fg: '#C2410C' }, { k: 'Terancam telat', v: scoped.filter(r => r[12]).length, fg: '#C2410C' }],
      groups, emptyNote: groups.length === 0,
      legend: Object.values(ST).map(s => ({ t: s[0], c: s[1] }))
    };
  }
}

dcBoot(Component);
</script>
</body>
</html>
