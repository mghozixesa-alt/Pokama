<h1 style="margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -0.01em">Proyek &amp; Tugas</h1>
</div>
<button type="button" onClick="{{act_proyek_baru}}" style="height: 44px; padding: 0 18px; border-radius: 10px; border: 0; background: #09BEAF; color: #1D3149; font: inherit; font-weight: 800; cursor: pointer">+ Tugas baru</button>

<sc-if value="{{hasMsg}}" hint-placeholder-val="{{false}}"><div role="status" style="display: flex; align-items: center; gap: 12px; background: #DDF5F2; color: #067A70; border: 1px solid #A9E4DC; border-radius: 12px; padding: 10px 12px 10px 16px; font-weight: 700"><span style="flex-grow: 1">{{msg}}</span><button type="button" onClick="{{clearMsg}}" style="height: 36px; padding: 0 12px; border-radius: 8px; border: 0; background: transparent; color: #067A70; font: inherit; font-weight: 800; cursor: pointer">Tutup</button></div></sc-if>
<sc-if value="{{formOpen}}" hint-placeholder-val="{{false}}"><section aria-label="{{formTitle}}" style="background: #FFFFFF; border: 2px solid #09BEAF; border-radius: 16px; padding: 18px 20px; display: flex; flex-direction: column; gap: 12px"><div style="display: flex; flex-direction: column; gap: 2px"><h2 style="margin: 0; font-size: 18px; font-weight: 800">{{formTitle}}</h2><span style="font-size: 13px; color: #5B6573">{{formNote}}</span></div><div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px"><sc-for list="{{formFields}}" as="ff" hint-placeholder-count="3"><label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 700; color: #3B4250">{{ff.label}}<input type="text" value="{{ff.v}}" onChange="{{ff.on}}" placeholder="{{ff.ph}}" style="height: 44px; box-sizing: border-box; border: 1px solid #D3D7DE; border-radius: 10px; padding: 0 12px; font: inherit; font-weight: 500; color: #1F2933"></label></sc-for></div><div style="display: flex; gap: 8px"><button type="button" onClick="{{formSubmit}}" style="height: 44px; padding: 0 18px; border-radius: 10px; border: 0; background: #09BEAF; color: #1D3149; font: inherit; font-weight: 900; cursor: pointer">{{formCta}}</button><button type="button" onClick="{{formCancel}}" style="height: 44px; padding: 0 16px; border-radius: 10px; border: 1px solid #E3E6EB; background: #FFFFFF; color: #3B4250; font: inherit; font-weight: 700; cursor: pointer">Batal</button></div></section></sc-if>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px; background: #FFFFFF; border: 1px solid #E3E6EB; border-radius: 14px; padding: 12px 16px; font-size: 13px; color: #3B4250">
<span style="font-weight: 900; color: #1D3149">Tugas datang dari 2 jalan:</span>
<span style="display: inline-flex; align-items: center; gap: 6px"><span style="font-size: 11px; font-weight: 900; padding: 3px 8px; border-radius: 999px; background: #EEF0F3; color: #3B4250">Dari atasan</span>dibuat langsung di sini</span>
<span style="display: inline-flex; align-items: center; gap: 6px"><span style="font-size: 11px; font-weight: 900; padding: 3px 8px; border-radius: 999px; background: #E5EEF9; color: #1E5AA8">Dari permintaan</span>unit lain minta bantuan, lalu diterima di <a href="Permintaan.dc.html" style="font-weight: 800; color: #1D3149">Permintaan</a></span>

</div>

<sc-for list="{{groups}}" as="g" hint-placeholder-count="4">

</tr></thead>
<tbody>

<td style="padding: 8px"><span style="display: flex; align-items: center; gap: 8px; font-weight: 700"><span aria-hidden="true" style="width: 28px; height: 28px; border-radius: 14px; background: {{r.avBg}}; color: #FFFFFF; font-size: 11px; font-weight: 900; display: flex; align-items: center; justify-content: center; flex-shrink: 0; overflow: hidden"><sc-if value="{{r.hasPhoto}}"><img src="{{r.photo}}" alt="" style="width: 100%; height: 100%; object-fit: cover; display: block"></sc-if><sc-if value="{{r.noPhoto}}">{{r.ini}}</sc-if></span>{{r.pic}}</span></td>
<td style="padding: 3px 0"><span style="display: flex; align-items: center; justify-content: center; height: 46px; background: {{r.stBg}}; color: {{r.stFg}}; font-size: 13px; font-weight: 800">{{r.st}}</span></td>
<td style="padding: 8px 12px"><span style="display: flex; flex-direction: column"><span style="font-weight: 800; color: {{r.dueFg}}">{{r.due}}</span><sc-if value="{{r.late}}" hint-placeholder-val="{{false}}"><span style="font-size: 11px; font-weight: 800; color: #C2410C">{{r.lateText}}</span></sc-if></span></td>
<td style="padding: 8px 14px 8px 8px"><sc-if value="{{r.hasPct}}" hint-placeholder-val="{{true}}"><span style="display: flex; align-items: center; gap: 8px"><span style="flex: 1 1 auto; height: 8px; background: #EEF0F3; border-radius: 4px; overflow: hidden"><span style="display: block; height: 100%; width: {{r.pct}}; background: {{r.bar}}"></span></span><span style="font-size: 12px; font-weight: 800; width: 34px; text-align: right">{{r.pct}}</span></span></sc-if><sc-if value="{{r.routine}}" hint-placeholder-val="{{false}}"><span style="font-size: 12px; font-weight: 700; color: #5B6573">Rutin tiap hari</span></sc-if></td>
</tr>
<sc-if value="{{r.isOpen}}" hint-placeholder-val="{{false}}">
<tr style="border-bottom: 1px solid #EEF0F3; background: #FAFBFC"><td colspan="5" style="padding: 12px 14px 16px 38px">

<span style="display: flex; flex-direction: column; grid-column: span 2"><span style="font-size: 11px; font-weight: 900; color: #5B6573; letter-spacing: 0.04em">SELESAI BILA</span><span style="font-weight: 700">{{r.dod}}</span></span>
<span style="display: flex; flex-direction: column"><span style="font-size: 11px; font-weight: 900; color: #5B6573; letter-spacing: 0.04em">DICEK OLEH</span><span style="font-weight: 700">{{r.rev}}</span></span>

<span style="display: flex; flex-direction: column"><span style="font-size: 11px; font-weight: 900; color: #5B6573; letter-spacing: 0.04em">JAM KERJA MINGGU INI</span><span style="font-weight: 700">{{r.kkh}} (dari KKH)</span></span>
<span style="display: flex; align-items: flex-end"><a href="Review.dc.html" style="font-weight: 800; color: #067A70">Buka review →</a></span>

</td></tr>
</sc-if>
</sc-for>
</tbody>
</table>
<div style="display: flex; align-items: center; gap: 10px; padding: 8px 14px; border-top: 1px solid #EEF0F3; background: #FAFBFC"><span style="font-size: 12px; color: #5B6573; font-weight: 700">Ringkasan</span><span style="flex: 1 1 auto; display: flex; height: 10px; border-radius: 5px; overflow: hidden; max-width: 360px"><sc-for list="{{g.bar}}" as="b" hint-placeholder-count="3"><span title="{{b.t}}" style="width: {{b.w}}; background: {{b.c}}"></span></sc-for></span></div>
