<script>

class Component extends DCLogic {
  ph(k) { const PH = {}; const AL = {"IF": "Intifa", "Intifa Ilmi": "Intifa", "RZ": "Reza", "Ade": "Reza", "Ade Reza N.": "Reza", "EJ": "Eja", "KV": "Kevin", "YF": "Yusril", "AJ": "Ajri", "AF": "Fauzi", "Ahmad": "Fauzi", "AD": "Adrian", "WR": "Wiranata", "AR": "Ariq", "NY": "Nayla", "FN": "Fajar", "DZ": "Dzikri"}; const s = String(k || ''); const n = PH[s] ? s : (AL[s] || AL[s.split(' ')[0]] || s.split(' ')[0]); const v = PH[n] || ''; return { photo: v, hasPhoto: !!v, noPhoto: !v }; }
  constructor(props) {
    super(props);
    this.state = { tab: 'struktur', sel: 'AD' };
  }

  componentDidUpdate(pp, ps) { if ((this.state.form_ && this.state.form_ !== ps.form_) || (this.state.msg && this.state.msg !== ps.msg)) { try { window.scrollTo({ top: 0, behavior: 'smooth' }); } catch (e) {} } }
  openForm(k, ctx) { this.setState({ form_: k, fv: {}, fctx: ctx || '' }); }
  say(m) { this.setState({ msg: m, form_: null }); }
  uxVals(F) {
    const k = this.state.form_, f = k ? F[k] : null, fv = this.state.fv || {}, ctx = this.state.fctx || '';
    return {
      hasMsg: !!this.state.msg, msg: this.state.msg || '', clearMsg: () => this.setState({ msg: '' }),
      formOpen: !!f, formTitle: f ? f.title.replace('{ctx}', ctx) : '', formNote: f ? (f.note || '') : '', formCta: f ? (f.cta || 'Kirim') : '',
      formFields: f ? f.fields.map(([label, ph], i) => ({ label, ph: (ph || '').replace('{ctx}', ctx), v: fv[i] || '', on: (e) => this.setState({ fv: { ...(this.state.fv || {}), [i]: e.target.value } }) })) : [],
      formSubmit: () => this.say(f.done.replace('{ctx}', ctx).replace(/\{(\d)\}/g, (m, i) => (fv[i] || '').trim() || 'baru')), formCancel: () => this.setState({ form_: null })
    };
  }
  renderVals() {
    const P = [
      { ini: 'GZ', name: 'Ghozy', role: 'CEO', ar: 'CEO', alloc: 'Holding · semua unit', boss: '—', tasks: 7 },
      { ini: 'IF', name: 'Intifa Ilmi', role: 'Kepala Staf', ar: 'Kepala Staf', alloc: 'Holding · review, permintaan, rapat bulanan', boss: 'Ghozy', tasks: 5 },
      { ini: 'RZ', name: 'Ade Reza N.', role: 'Gerbang Keuangan', ar: 'Keuangan', alloc: 'Holding · keuangan & leader aset', boss: 'Ghozy', tasks: 6 },
      { ini: 'EJ', name: 'Eja', role: 'Data & BizDev', ar: 'Data & BizDev', alloc: 'Holding · jurnal omzet, kolaborasi', boss: 'Intifa Ilmi', tasks: 4 },
      { ini: 'KV', name: 'Kevin Septiano', role: 'Fungsi bersama', ar: 'Fungsi bersama', alloc: 'Marketing · dibagi ke semua unit', boss: 'Intifa Ilmi', tasks: 4 },
      { ini: 'YF', name: 'Yusril Firdaus', role: 'Leader', ar: 'Leader', alloc: 'Niagaaja + Purchasing & Aset (Holding)', boss: 'Ghozy', tasks: 4, two: true },
      { ini: 'IG', name: 'Igam', role: 'Leader', ar: 'Leader', alloc: 'Rentalaja Garut Kota', boss: 'Ghozy', tasks: 3 },
      { ini: 'AJ', name: 'Ajri', role: 'Anggota', ar: 'Anggota unit', alloc: 'Rentalaja Garut Kota · lini Transport & Store', boss: 'Adrian Akbar', tasks: 4 },
      { ini: 'UJ', name: 'Pak Uji', role: 'Leader', ar: 'Leader', alloc: 'Rentalaja Bandung (Hub + Jakal)', boss: 'Ghozy', tasks: 3 },
      { ini: 'AF', name: 'Ahmad Fauzi', role: 'Anggota', ar: 'Anggota unit', alloc: 'Rentalaja Bandung', boss: 'Pak Uji', tasks: 2 },
      { ini: 'AD', name: 'Adrian Akbar', role: 'Leader', ar: 'Leader', alloc: 'Rentalaja Experience + bantu ops Bandung', boss: 'Ghozy', tasks: 5 },
      { ini: 'WR', name: 'Wiranata', role: 'Leader', ar: 'Leader', alloc: 'TripinAja', boss: 'Ghozy', tasks: 4 },
      { ini: 'AR', name: 'Ariq', role: 'Anggota', ar: 'Anggota unit', alloc: 'TripinAja · pelapor omzet', boss: 'Wiranata', tasks: 3 },
      { ini: 'NY', name: 'Nayla', role: 'Anggota', ar: 'Anggota unit', alloc: 'TripinAja · konten & admin', boss: 'Wiranata', tasks: 2 },
      { ini: 'FN', name: 'Fajar Nurahdian', role: 'Pelapor omzet', ar: 'Anggota unit', alloc: 'Rentalaja · laporan omzet harian', boss: 'Eja', tasks: 1 },
      { ini: 'DZ', name: 'Dzikri', role: 'Tim Aset', ar: 'Staf holding', alloc: 'Purchasing & Aset · fungsi bersama', boss: 'Yusril Firdaus', tasks: 3 },
      { ini: 'DT', name: 'Dita', role: 'Tim Marketing', ar: 'Staf holding', alloc: 'Marketing · fungsi bersama', boss: 'Kevin Septiano', tasks: 3 },
      { ini: 'MU', name: 'Mugni', role: 'Tim Marketing', ar: 'Staf holding', alloc: 'Marketing · fungsi bersama', boss: 'Kevin Septiano', tasks: 3 }
    ];
    const roleStyle = {
      'CEO': ['#1D3149', '#FFFFFF'], 'Kepala Staf': ['#1D3149', '#FFFFFF'], 'Gerbang Keuangan': ['#1D3149', '#FFFFFF'],

    const payOf = (p) => {

      ...p, ...this.ph(p.ini), ax: MG.includes(p.ini) ? 'Sistem kerja' : 'Rentalaja App saja', axBg: MG.includes(p.ini) ? '#1D3149' : '#EEF0F3', axFg: MG.includes(p.ini) ? '#FFFFFF' : '#4A5160', v1: p.boss === '—' ? 'Ghozy' : p.boss === 'Belum diisi' ? 'Intifa Ilmi' : p.boss, v2: ['GZ', 'IF'].includes(p.ini) || p.boss === 'Intifa Ilmi' ? 'Ghozy' : 'Intifa Ilmi', roleBg: roleStyle[p.role][0], roleFg: roleStyle[p.role][1],
      bg: p.ini === this.state.sel ? '#F0FBF9' : 'transparent', pick: pick(p.ini)
    }));
    const gov = [
      { role: 'KEPALA STAF', ini: 'IF', note: 'Review, permintaan, rapat bulanan' },
      { role: 'GERBANG KEUANGAN', ini: 'RZ', note: 'Validasi angka & kas' },
      { role: 'DATA & BIZDEV', ini: 'EJ', note: 'Jurnal omzet, kolaborasi' },
      { role: 'MARKETING', ini: 'KV', note: 'Fungsi bersama' },
      { role: 'PURCHASING & ASET', ini: 'YF', note: 'Fungsi bersama' },
      { role: 'DATA OMZET', ini: 'FN', note: 'Rekap omzet harian' },
      { role: 'TIM ASET', ini: 'DZ', note: 'Bantu Purchasing & Aset' },
      { role: 'TIM MARKETING', ini: 'DT', note: 'Bersama Kevin' },
      { role: 'TIM MARKETING', ini: 'MU', note: 'Bersama Kevin' }
    ].map(g => ({ ...g, ...this.ph(g.ini), name: byIni(g.ini).name, pick: pick(g.ini) }));
    const am = [
      ['Rentalaja Garut Kota', '5', 'IG', ['AJ']],
      ['Rentalaja Bandung', '4', 'UJ', ['AF']],
      ['Rentalaja Experience', '4', 'AD', []],

      ['Niagaaja / Laptopaja', '4', 'YF', []],

      ['Rentalaja Wanaraja', '3', '', []],

    ];
    const units = am.map(([name, stage, c, mem]) => ({
      name, stage, hasChamp: !!c, noChamp: !c,
      champ: c ? byIni(c).name : '', champIni: c, ...this.ph(c), pickChamp: pick(c || 'GZ'), setLeader: () => this.openForm('leader', name),
