<sc-if value="{{formOpen}}" hint-placeholder-val="{{false}}"><section aria-label="{{formTitle}}" style="background: #FFFFFF; border: 2px solid #09BEAF; border-radius: 16px; padding: 18px 20px; display: flex; flex-direction: column; gap: 12px"><div style="display: flex; flex-direction: column; gap: 2px"><h2 style="margin: 0; font-size: 18px; font-weight: 800">{{formTitle}}</h2><span style="font-size: 13px; color: #5B6573">{{formNote}}</span></div><div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px"><sc-for list="{{formFields}}" as="ff" hint-placeholder-count="3"><label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 700; color: #3B4250">{{ff.label}}<input type="text" value="{{ff.v}}" onChange="{{ff.on}}" placeholder="{{ff.ph}}" style="height: 44px; box-sizing: border-box; border: 1px solid #D3D7DE; border-radius: 10px; padding: 0 12px; font: inherit; font-weight: 500; color: #1F2933"></label></sc-for></div><div style="display: flex; gap: 8px"><button type="button" onClick="{{formSubmit}}" style="height: 44px; padding: 0 18px; border-radius: 10px; border: 0; background: #09BEAF; color: #1D3149; font: inherit; font-weight: 900; cursor: pointer">{{formCta}}</button><button type="button" onClick="{{formCancel}}" style="height: 44px; padding: 0 16px; border-radius: 10px; border: 1px solid #E3E6EB; background: #FFFFFF; color: #3B4250; font: inherit; font-weight: 700; cursor: pointer">Batal</button></div></section></sc-if>

<div style="flex: 1 1 170px; background: #FFFFFF; border: 1px solid #E3E6EB; border-radius: 14px; padding: 14px 18px; display: flex; flex-direction: column"><span style="font-size: 12px; color: #5B6573; font-weight: 700">Kursi Leader kosong</span><span style="font-size: 24px; font-weight: 900; color: #C2410C">4</span></div>

</sc-for>

<script>

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tab: 'struktur', sel: 'AD' };
  }

  componentDidUpdate(pp, ps) { if ((this.state.form_ && this.state.form_ !== ps.form_) || (this.state.msg && this.state.msg !== ps.msg)) { try { window.scrollTo({ top: 0, behavior: 'smooth' }); } catch (e) {} } }
  openForm(k, ctx) { this.setState({ form_: k, fv: {}, fctx: ctx || '' }); }
  say(m) { this.setState({ msg: m, form_: null }); }
  uxVals(F) {
    const k = this.state.form_, f = k ? F[k] : null, fv = this.state.fv || {}, ctx = this.state.fctx || '';
    return {
      hasMsg: !!this.state.msg, msg: this.state.msg || '', clearMsg: () => this.setState({ msg: '' }),
      formOpen: !!f, formTitle: f ? f.title.replace('{ctx}', ctx) : '', formNote: f ? (f.note || '') : '', formCta: f ? (f.cta || 'Kirim') : '',
      formFields: f ? f.fields.map(([label, ph], i) => ({ label, ph: (ph || '').replace('{ctx}', ctx), v: fv[i] || '', on: (e) => this.setState({ fv: { ...(this.state.fv || {}), [i]: e.target.value } }) })) : [],
      formSubmit: () => this.say(f.done.replace('{ctx}', ctx).replace(/\{(\d)\}/g, (m, i) => (fv[i] || '').trim() || 'baru')), formCancel: () => this.setState({ form_: null })
    };

      { ini: 'UJ', name: 'Pak Uji', role: 'Leader', ar: 'Leader', alloc: 'Rentalaja Bandung (Hub + Jakal)', boss: 'Ghozy', tasks: 3 },
      { ini: 'AF', name: 'Ahmad Fauzi', role: 'Anggota', ar: 'Anggota unit', alloc: 'Rentalaja Bandung', boss: 'Pak Uji', tasks: 2 },
      { ini: 'AD', name: 'Adrian Akbar', role: 'Leader', ar: 'Leader', alloc: 'Rentalaja Experience + bantu ops Bandung', boss: 'Ghozy', tasks: 5 },
      { ini: 'WR', name: 'Wiranata', role: 'Leader', ar: 'Leader', alloc: 'TripinAja', boss: 'Ghozy', tasks: 4 },
