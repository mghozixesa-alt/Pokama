</div>

<div style="background: #F3F5F8; border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 8px; font-size: 13px">
<div style="display: flex; justify-content: space-between; gap: 10px"><span>Skor performa</span><span style="font-weight: 800">{{d.scoreLine}}</span></div>
<div style="display: flex; justify-content: space-between; gap: 10px"><span>Insentif</span><span style="font-weight: 800; text-align: right">{{d.insLine}}</span></div>
<div style="display: flex; justify-content: space-between; gap: 10px"><span>Bonus</span><span style="font-weight: 800; text-align: right">{{d.bonLine}}</span></div>
<div style="display: flex; justify-content: space-between; gap: 10px; padding-top: 8px; border-top: 1px solid #E3E6EB; font-size: 15px"><span style="font-weight: 800">Total bulan ini</span><span style="font-weight: 900">{{d.totText}}</span></div>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-if value="{{d.canApprove}}" hint-placeholder-val="{{true}}"><button type="button" onClick="{{d.approve}}" style="height: 44px; padding: 0 16px; border-radius: 10px; border: 0; background: #1D3149; color: #FFFFFF; font: inherit; font-weight: 800; cursor: pointer">Setujui (CEO)</button></sc-if>
<sc-if value="{{d.canPay}}" hint-placeholder-val="{{false}}"><button type="button" onClick="{{d.pay}}" style="height: 44px; padding: 0 16px; border-radius: 10px; border: 0; background: #09BEAF; color: #1D3149; font: inherit; font-weight: 900; cursor: pointer">Tandai dibayar (Keuangan)</button></sc-if>
<sc-if value="{{d.canReset}}" hint-placeholder-val="{{false}}"><button type="button" onClick="{{d.reset}}" style="height: 44px; padding: 0 16px; border-radius: 10px; border: 1px solid #E3E6EB; background: #FFFFFF; color: #9A3F0A; font: inherit; font-weight: 700; cursor: pointer">Kembalikan ke draf</button></sc-if>
</div>
</aside>
</div>

<section aria-labelledby="pool-h" style="background: #FFFFFF; border: 1px solid #E3E6EB; border-radius: 20px; overflow-x: auto">
<div style="padding: 18px 20px 6px; display: flex; flex-direction: column"><h2 id="pool-h" style="margin: 0; font-size: 18px; font-weight: 800">Pool bonus per unit</h2><span style="font-size: 13px; color: #5B6573">Pool = 5% laba kontribusi × faktor Liga, porsi management. Laba diambil dari Dasbor keuangan (angka di bawah contoh). Holding memakai laba grup. Porsi staf cabang dibagi terpisah lewat Rentalaja App.</span></div>
<table style="width: 100%; min-width: 760px; border-collapse: collapse">
<thead><tr style="border-bottom: 1px solid #E3E6EB">
<th scope="col" style="text-align: left; padding: 12px 20px; font-size: 12px; color: #5B6573; font-weight: 800; letter-spacing: 0.06em">UNIT</th>
<th scope="col" style="text-align: left; padding: 12px 8px; font-size: 12px; color: #5B6573; font-weight: 800; letter-spacing: 0.06em">LABA KONTRIBUSI BULAN INI</th>
<th scope="col" style="text-align: left; padding: 12px 8px; font-size: 12px; color: #5B6573; font-weight: 800; letter-spacing: 0.06em">HASIL LIGA</th>
<th scope="col" style="text-align: right; padding: 12px 8px; font-size: 12px; color: #5B6573; font-weight: 800; letter-spacing: 0.06em">FAKTOR</th>
<th scope="col" style="text-align: right; padding: 12px 20px 12px 8px; font-size: 12px; color: #5B6573; font-weight: 800; letter-spacing: 0.06em">POOL 5% × FAKTOR</th>
</tr></thead>
<tbody>
<sc-for list="{{pools}}" as="p" hint-placeholder-count="5">
<tr style="border-bottom: 1px solid #EEF0F3">
<td style="padding: 10px 20px; font-weight: 800">{{p.name}}</td>
<td style="padding: 10px 8px"><label style="display: inline-flex; align-items: center; gap: 6px; height: 38px; border: 1px solid #D3D7DE; border-radius: 10px; padding: 0 10px; box-sizing: border-box; color: #5B6573">Rp<input type="text" inputmode="numeric" value="{{p.base}}" onChange="{{p.onBase}}" aria-label="Pool dasar {{p.name}}" style="border: 0; outline: 0; width: 110px; font: inherit; font-weight: 800; color: #1F2933; background: transparent"></label></td>
<td style="padding: 10px 8px"><span style="font-size: 12px; font-weight: 800; padding: 3px 10px; border-radius: 999px; background: {{p.catBg}}; color: {{p.catFg}}">{{p.cat}}</span></td>
<td style="padding: 10px 8px; text-align: right; font-weight: 800">{{p.f}}</td>
<td style="padding: 10px 20px 10px 8px; text-align: right; font-weight: 900; font-variant-numeric: tabular-nums">{{p.eff}}</td>
</tr>
</sc-for>
</tbody>
</table>
</section>
</main>
</div>
</script>
<script>

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sel: 'WR', unit: 'ALL', st: {}, plL: '6700000', plS: '4000000', pools: {} };
  }
  renderVals() {
    const num = (v) => parseInt(String(v).replace(/\D/g, ''), 10) || 0;
    const rp = (v) => 'Rp' + Math.round(v).toLocaleString('id-ID');
    const UN = { HQ: 'Holding · fungsi bersama', RA: 'Rentalaja', WG: 'TripinAja', NA: 'Niagaaja' };
    const LIGA = { HQ: ['Baik', 0.7], RA: ['Baik', 0.7], WG: ['Juara liga', 1], NA: ['Perlu perbaikan', 0.3] };
    const POOL0 = { HQ: 30000000, RA: 40000000, WG: 24000000, NA: 12000000 };
    const P = [
      ['IF', 'Intifa Ilmi', 'HQ', 'L', 96, 4, [['Review selesai ≤ 2 hari kerja (%)', 40, 90, 85, 'Review & Revisi'], ['Permintaan dipilah ≤ 24 jam (%)', 30, 95, 90, 'Permintaan Bantuan'], ['Rapat bulanan CEO terjadwal dan dicatat', 30, 1, 1, 'Proyek & Tugas']]],
      ['RZ', 'Ade Reza N.', 'HQ', 'S', 94, 4, [['Laporan keuangan Jan–Sep disetujui CEO', 40, 1, 1, 'Penugasan'], ['Rekonsiliasi harian (hari)', 30, 22, 22, 'KKH'], ['Data Jeep Guntur dirapikan', 30, 1, 0, 'Penugasan']]],
      ['EJ', 'Eja', 'HQ', 'S', 92, 4, [['Jurnal BizDev tepat waktu (hari)', 50, 26, 26, 'KKH'], ['Properti baru masuk kelolaan', 50, 2, 1, 'Penugasan']]],
      ['KV', 'Kevin Septiano', 'HQ', 'S', 85, 3, [['Viewer WA Story', 50, 1250, 310, 'Target Unit'], ['Konten terbit', 50, 30, 22, 'KKH']]],
      ['FN', 'Fajar Nurahdian', 'HQ', 'S', 92, 4, [['Rekap omzet harian tepat waktu (hari)', 100, 26, 25, 'Omzet Unit']]],
      ['AJ', 'Ajri', 'RA', 'S', 88, 4, [['Etalase iPhone Ciputat siap', 40, 1, 1, 'Penugasan'], ['Closing rate iPhone (%)', 60, 30, 24, 'Omzet Unit']]],
      ['AD', 'Adrian Akbar', 'RA', 'L', 92, 3, [['Properti baru tayang', 60, 2, 1, 'Penugasan'], ['Jadwal teknisi runner Bandung terisi (%)', 40, 100, 90, 'KKH']]],
      ['WR', 'Wiranata', 'WG', 'L', 97, 4, [['Trip terjual', 50, 8, 7, 'Omzet Unit'], ['Laporan omzet tepat waktu (hari)', 20, 26, 26, 'Omzet Unit'], ['Paket Halaman Belakang Kebon tayang', 30, 1, 0, 'Penugasan']]],
      ['AR', 'Ariq', 'WG', 'S', 98, 4, [['Booking trip diproses', 60, 40, 38, 'KKH'], ['Laporan omzet tepat waktu (hari)', 40, 26, 26, 'Omzet Unit']]],
      ['NY', 'Nayla', 'WG', 'S', 76, 3, [['Konten terbit', 100, 20, 14, 'KKH']]],
      ['YF', 'Yusril Firdaus', 'NA', 'L', 94, 4, [['Laptop terjual', 50, 10, 8, 'Omzet Unit'], ['Proposal investor terkirim', 30, 5, 3, 'Penugasan'], ['Website Niagaaja online', 20, 1, 0, 'Penugasan']]],
      ['DZ', 'Dzikri', 'HQ', 'S', 0, 3, []],
      ['DT', 'Dita', 'HQ', 'S', 0, 3, []],
      ['MU', 'Mugni', 'HQ', 'S', 0, 3, []]
    ];
    const plL = 0.15 * num(this.state.plL), plS = 0.15 * num(this.state.plS);
    const poolBase = (u) => this.state.pools[u] !== undefined ? num(this.state.pools[u]) : POOL0[u];
    const calc = P.map(([ini, name, u, lvl, kkh, nilai, outs]) => {
      const W = outs.reduce((a, o) => a + o[1], 0);
      const cap = W ? outs.reduce((a, o) => a + o[1] * Math.min(o[3] / o[2], 1.2), 0) / W : null;
      const capPct = cap === null ? 0 : Math.round(cap * 100);
      const score = cap === null ? 0 : Math.round(0.6 * Math.min(capPct, 100) + 0.25 * kkh + 0.15 * (nilai / 5 * 100));
      const fac = cap === null || kkh < 80 || cap < 0.7 ? 0 : cap < 0.9 ? cap : cap <= 1 ? 1 : Math.min(cap, 1.2);
      const ins = (lvl === 'L' ? plL : plS) * fac;
      const w = lvl === 'L' ? 1.5 : 1;
      return { ini, name, u, lvl, kkh, nilai, outs, cap, capPct, score, fac, ins, w, pts: cap === null ? 0 : w * score };
    });
    const SPLIT = { YF: { NA: 0.7, HQ: 0.3 } };
    const shares = (c) => SPLIT[c.ini] || { [c.u]: 1 };
    const unitPts = {};
    calc.forEach(c => { const sh = shares(c); Object.keys(sh).forEach(u => { unitPts[u] = (unitPts[u] || 0) + c.pts * sh[u]; }); });
    const effPool = (u) => 0.05 * poolBase(u) * LIGA[u][1];
    calc.forEach(c => { const sh = shares(c); c.bon = Object.keys(sh).reduce((a, u) => a + (unitPts[u] ? effPool(u) * c.pts * sh[u] / unitPts[u] : 0), 0); c.tot = c.ins + c.bon; });
    const ST = { draf: ['Draf · cek Keuangan', '#FDF3D7', '#7A5200'], ok: ['Disetujui CEO', '#E5EEF9', '#1E5AA8'], paid: ['Dibayar', '#DDF5F2', '#067A70'], none: ['Belum ada kesepakatan', '#FCEBDD', '#9A3F0A'] };
    const stOf = (c) => c.cap === null ? 'none' : (this.state.st[c.ini] || 'draf');
    const catOf = (s) => s >= 85 ? ['Sangat baik', '#DDF5F2', '#067A70'] : s >= 70 ? ['Baik', '#E5EEF9', '#1E5AA8'] : s >= 55 ? ['Perlu perbaikan', '#FDF3D7', '#7A5200'] : ['Pembinaan', '#FCEBDD', '#9A3F0A'];
    const unit = this.state.unit;
    const shown = calc.filter(c => unit === 'ALL' || c.u === unit);
    const rows = shown.map(c => {
      const cat = c.cap === null ? ['—', '#F3F5F8', '#8A94A3'] : catOf(c.score);
      const st = ST[stOf(c)];
      return {
        name: c.name, unitName: SPLIT[c.ini] ? Object.keys(SPLIT[c.ini]).map(u => UN[u].split(' · ')[0] + ' ' + Math.round(SPLIT[c.ini][u] * 100) + '%').join(' / ') : UN[c.u], lvlText: c.lvl === 'L' ? 'Leader ×1,5' : 'Staf ×1,0',
        capText: c.cap === null ? '—' : c.capPct + '%', capFg: c.cap === null ? '#8A94A3' : c.capPct < 70 ? '#9A3F0A' : '#1F2933',
        kkh: c.kkh, kkhFg: c.kkh < 80 ? '#9A3F0A' : '#1F2933',
        score: c.cap === null ? '—' : c.score, cat: cat[0], catBg: cat[1], catFg: cat[2],
        insText: rp(c.ins), bonText: rp(c.bon), totText: rp(c.tot),
        stText: st[0], stBg: st[1], stFg: st[2],
        bg: c.ini === this.state.sel ? '#F0FBF9' : 'transparent',
        pick: () => this.setState({ sel: c.ini })
      };
    });
    const sum = (f) => shown.reduce((a, c) => a + f(c), 0);
    const tiles = [
      { k: 'Insentif bulan ini', v: rp(sum(c => c.ins)), fg: '#1F2933' },
      { k: 'Bonus · ditabung, dibayar awal Jan', v: rp(sum(c => c.bon)), fg: '#1F2933' },
      { k: 'Total kewajiban bulan ini', v: rp(sum(c => c.tot)), fg: '#067A70' },
      { k: 'Capaian di bawah 70% / belum sepakat', v: shown.filter(c => c.cap === null || c.capPct < 70).length + ' orang', fg: '#9A3F0A' }
    ];
    const c0 = calc.find(c => c.ini === this.state.sel) || calc[0];
    const s0 = stOf(c0);
    const setSt = (v) => () => this.setState({ st: { ...this.state.st, [c0.ini]: v } });
    const d = {
      name: c0.name, unitName: (SPLIT[c0.ini] ? 'DIGAJI 2 UNIT · ' + Object.keys(SPLIT[c0.ini]).map(u => UN[u].split(' · ')[0] + ' ' + Math.round(SPLIT[c0.ini][u] * 100) + '%').join(' / ') : UN[c0.u]).toUpperCase(), lvlText: c0.lvl === 'L' ? 'LEADER ×1,5' : 'STAF ×1,0',
      outs: c0.outs.map(([name, w, t, r, src]) => {
        const p = r / t;
        return { name, w, t: t.toLocaleString('id-ID'), r: r.toLocaleString('id-ID'), pct: Math.round(p * 100) + '%', bar: Math.min(100, Math.round(p * 100)) + '%', barC: p < 0.7 ? '#C2410C' : p < 0.9 ? '#D99A00' : '#09BEAF', src };
      }),
      noOuts: c0.outs.length === 0,
      scoreLine: c0.cap === null ? '—' : c0.score + ' (output ' + c0.capPct + '% · KKH ' + c0.kkh + '% · valuer ' + c0.nilai + '/5)',
      insLine: c0.cap === null ? 'Rp0 · belum ada kesepakatan' : '15% gaji pokok ' + rp(c0.lvl === 'L' ? plL : plS) + ' × ' + Math.round(c0.fac * 100) + '% = ' + rp(c0.ins),
      bonLine: 'ditabung ke Q4 · ' + Object.keys(shares(c0)).map(u => rp(effPool(u)) + ' pool ' + UN[u].split(' · ')[0] + ' × porsi ' + (unitPts[u] ? Math.round(c0.pts * shares(c0)[u] / unitPts[u] * 100) : 0) + '%').join(' + ') + ' = ' + rp(c0.bon),
      totText: rp(c0.tot),
      canApprove: s0 === 'draf', canPay: s0 === 'ok', canReset: s0 === 'ok' || s0 === 'paid',
      approve: setSt('ok'), pay: setSt('paid'), reset: setSt('draf')
    };
    const pools = Object.keys(UN).map(u => {
      const cat = catOf(LIGA[u][0] === 'Juara liga' || LIGA[u][0] === 'Sangat baik' ? 90 : LIGA[u][0] === 'Baik' ? 75 : LIGA[u][0] === 'Perlu perbaikan' ? 60 : 40);
      return {
        name: UN[u], base: this.state.pools[u] !== undefined ? this.state.pools[u] : String(POOL0[u]),
        onBase: (e) => this.setState({ pools: { ...this.state.pools, [u]: e.target.value } }),
        cat: LIGA[u][0], catBg: cat[1], catFg: cat[2], f: Math.round(LIGA[u][1] * 100) + '%', eff: rp(effPool(u))
      };
    });
    const filters = [['ALL', 'Semua']].concat(Object.keys(UN).map(u => [u, UN[u].split(' · ')[0]])).map(([k, label]) => ({
      label, on: unit === k ? 'true' : 'false', bg: unit === k ? '#1D3149' : '#FFFFFF', fg: unit === k ? '#FFFFFF' : '#3B4250',
      pick: () => this.setState({ unit: k })
    }));
    const approveAll = () => {
      const st = { ...this.state.st };
      calc.forEach(c => { if (c.cap !== null && (st[c.ini] || 'draf') === 'draf') st[c.ini] = 'ok'; });
      this.setState({ st });
    };
    return {
      rows, tiles, d, pools, filters, approveAll,
      plL: this.state.plL, plS: this.state.plS,
      onPlL: (e) => this.setState({ plL: e.target.value }), onPlS: (e) => this.setState({ plS: e.target.value })
    };
  }
}

dcBoot(Component);
</script>
</body>
</html>
