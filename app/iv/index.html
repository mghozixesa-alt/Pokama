let G = null, RANGE = '1B';

function holdRet(x) { const lockedNow = x.last && x.last.period === D.period; return +x.total + (x.month && x.month.auto && !lockedNow ? +x.month.share : 0); }
function series() {
  if (!G) return null;
  let pts = [];
  if (RANGE === '1B' || RANGE === '3B') { const n = RANGE === '1B' ? 30 : 90; pts = G.daily.slice(-n).map(p => ({ l: tgl(p.d), v: +p.v })); }
  else {
    const m = G.monthly.map(p => ({ l: bulan(p.p), v: +p.v, p: p.p }));
    if (+D.month_live && !m.some(x => x.p === D.period)) m.push({ l: bulan(D.period) + ' (berjalan)', v: +D.month_live });
    pts = RANGE === '1T' ? m.slice(-12) : m;
  }
  let c = 0; return pts.map(p => ({ l: p.l, v: (c += p.v) }));
}
function lineChart(pts, w = 350, h = 130) {
  if (pts && pts.length >= 2 && !pts[pts.length - 1].v) return '<div class="chartempty">Grafik terisi setelah hasil pertama masuk.</div>';
  if (!pts || pts.length < 2) return `<div class="chartempty">${pts && pts.length === 1 ? 'Grafik muncul setelah ada data 2 periode.' : 'Belum ada hasil di periode ini.'}</div>`;
  const max = Math.max(1, ...pts.map(p => p.v)), X = (i) => i / (pts.length - 1) * w, Y = (v) => h - 6 - v / max * (h - 18);
  const d = pts.map((p, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(p.v).toFixed(1)).join(' ');
  const last = pts[pts.length - 1];
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="Pertumbuhan hasil, terakhir ${rp(last.v)}">
    <defs><linearGradient id="gg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#09BEAF" stop-opacity=".28"/><stop offset="1" stop-color="#09BEAF" stop-opacity="0"/></linearGradient></defs>
    <path d="${d} L${w} ${h} L0 ${h}Z" fill="url(#gg)"/><path d="${d}" fill="none" stroke="#077A70" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
    <circle cx="${X(pts.length - 1)}" cy="${Y(last.v)}" r="4.5" fill="#077A70" stroke="#fff" stroke-width="2"/></svg>
    <div class="axis"><span>${esc(pts[0].l)}</span><span>${esc(last.l)}</span></div>`;
}

      <section class="card"><h2>Bulan ini (berjalan)</h2><div class="ledger">
        ${flat ? `<div><span>Nominal tetap per bulan</span><b>${rp(h.rp_flat)}</b></div><div><span>${V.rev} (info)</span><span>${rp(m.revenue)}</span></div>
          <div class="mine"><span>Bagian Anda s.d. hari ini</span><span>${rp(m.share)}</span></div></div>
          <p class="note">Skema nominal tetap: Anda menerima ${rp(h.rp_flat)} per bulan, tidak bergantung ramai atau sepinya ${V.word}. Pendapatan ditampilkan sebagai informasi kinerja.</p>`

/* ---------- Laporan ---------- */
async function vLaporan() {
  const R = await A.rpc('iv_reports', { p_year: YEAR }), ms = R.months || [];
  const tot = ms.reduce((a, m) => a + +m.share, 0), max = Math.max(1, ...ms.map(m => +m.share));
  const months = Array.from({ length: 12 }, (_, i) => { const k = YEAR + '-' + String(i + 1).padStart(2, '0') + '-01'; const m = ms.find(x => x.period === k); return { i, v: m ? +m.share : 0 }; });
  const ys = []; for (let y = new Date().getFullYear(); y >= 2025; y--) ys.push(y);
  window.__R = R;
  return `${plain('Laporan')}<main>
    <div class="chips">${ys.map(y => `<button data-year="${y}" aria-pressed="${y === YEAR}">${y}</button>`).join('')}</div>
    <section class="card"><div class="g2 split"><div class="kpi"><span class="lbl">Total diterima ${YEAR}</span><b style="font-size:20px">${rp(tot)}</b></div><div class="kpi"><span class="lbl">Rata-rata per bulan</span><b style="font-size:20px">${rp(ms.length ? tot / ms.length : 0)}</b></div></div>
      <div class="bars" aria-label="Hasil per bulan">${months.map(m => `<div><i style="height:${m.v / max * 72}px;${m.v ? '' : 'background:var(--line)'}"></i><span>${'JFMAMJJASOND'[m.i]}</span></div>`).join('')}</div>
      <span class="small">Sudah ditransfer ke rekening ${YEAR}: ${rp(R.paid)}</span></section>
    ${ms.length ? ms.map((m, i) => `<section class="card"><div style="display:flex;justify-content:space-between;align-items:center"><h2>${bulan(m.period)}</h2>${pill('Final', 'p-good')}</div>
      <div class="ledger">${m.rows.map(r => `<div><span>${esc(r.title)}<br><span class="small">${KIND[r.kind]}${+r.revenue ? ' · pendapatan ' + rpk(r.revenue) + ', biaya ' + rpk(r.costs) : r.kind === 'dividen' ? ' · laba dibagi ' + rpk(r.base) : ''}</span></span><b>${rp(r.share)}</b></div>`).join('')}
        <div class="mine"><span>Bagian Anda</span><span>${rp(m.share)}</span></div>${+m.modal ? `<div><span>Pengembalian modal</span><b>${rp(m.modal)}</b></div>` : ''}</div>
      <button class="btn sm" data-pdf="${i}">${svg('doc', 16)} Unduh laporan PDF</button></section>`).join('') : `<div class="card"><p class="empty">Belum ada laporan final di ${YEAR}. Laporan bulanan dikunci Keuangan setelah tutup buku.</p></div>`}
    <section class="card"><div class="feat"><span class="ic">${svg('doc')}</span><div><b>Rekap tahunan ${YEAR} untuk SPT</b><span>Total bagi hasil, dividen, pengembalian modal, dan penarikan per investasi dalam satu halaman. Bukti potong pajak (bila ada) diterbitkan Keuangan.</span></div></div>
      <button class="btn" data-rekap>${svg('doc', 18)} Buka rekap tahunan</button></section>
    <p class="note">Laporan final setelah dikunci Keuangan dan disetujui CEO. Angka yang belum dikunci tampil di Beranda sebagai estimasi.</p></main>`;
}
function pdf(i) {
  const m = window.__R.months[i], w = window.open('', '_blank'); if (!w) { toast('Izinkan pop-up untuk mengunduh', 1); return; }
  const rows = m.rows.map(r => `<tr><td>${esc(r.title)}<br><small>${esc(r.unit)} · ${KIND[r.kind]}</small></td><td class="r">${r.revenue ? rp(r.revenue) : '—'}</td><td class="r">${r.costs ? rp(r.costs) : '—'}</td><td class="r">${rp(r.base)}</td><td class="r"><b>${rp(r.share)}</b></td></tr>
    ${(r.units || []).map(u => `<tr class="u"><td>· ${esc(u.name)} (${esc(u.branch)})</td><td class="r">${rp(u.revenue)}</td><td class="r">${rp(+u.service + +u.ops)}</td><td class="r">${rp(u.net)}</td><td class="r">${rp(u.share)}</td></tr>`).join('')}`).join('');
  w.document.write(`<!doctype html><html lang="id"><head><meta charset="utf-8"><title>Laporan investor ${bulan(m.period)}</title><style>body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:#1F2B4D;padding:32px;max-width:780px;margin:auto}h1{font-size:22px;margin:0}table{width:100%;border-collapse:collapse;font-size:13px;margin-top:16px}th,td{padding:8px;border-bottom:1px solid #E6E8EC;text-align:left;vertical-align:top}th{font-size:11px;text-transform:uppercase;color:#5B6573}.r{text-align:right}tr.u td{color:#5B6573;font-size:12px}tfoot td{font-weight:800;border-top:2px solid #1F2B4D}small{color:#5B6573}.hd{display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid #09BEAF;padding-bottom:12px}</style></head><body>
    <div class="hd"><div><h1>Laporan bagi hasil · ${bulan(m.period)}</h1><small>${esc(D.me.name)} · ${esc(D.me.email)}</small></div><img src="${location.origin}/img/pokama-logo.png" style="height:34px"></div>
    <table><thead><tr><th>Investasi</th><th class="r">Pendapatan</th><th class="r">Biaya</th><th class="r">Dasar hitung</th><th class="r">Bagian Anda</th></tr></thead><tbody>${rows}</tbody>
    <tfoot><tr><td colspan="4">Total bagian Anda</td><td class="r">${rp(m.share)}</td></tr>${+m.modal ? `<tr><td colspan="4">Pengembalian modal</td><td class="r">${rp(m.modal)}</td></tr>` : ''}</tfoot></table>
    <p><small>Rekening terdaftar: ${esc(D.me.bank || '—')}. Laporan final, dikunci oleh Keuangan PT Popo Karya Investama. Dicetak ${new Date().toLocaleString('id-ID')}.</small></p>
    <script>setTimeout(()=>print(),400)<\/script></body></html>`);
  w.document.close();
}

function rekap() {
  const R = window.__R, by = {};
  (R.months || []).forEach(m => m.rows.forEach(r => { const k = r.title; by[k] = by[k] || { title: r.title, unit: r.unit, hasil: 0, dividen: 0, modal: 0 }; by[k][r.kind] += +r.share; }));
  const rows = Object.values(by), t = rows.reduce((a, r) => ({ hasil: a.hasil + r.hasil, dividen: a.dividen + r.dividen, modal: a.modal + r.modal }), { hasil: 0, dividen: 0, modal: 0 });
  const html = `<div class="hd"><div><h1>Rekap investasi tahun ${YEAR}</h1><small>${esc(D.me.name)} · NPWP ${esc(D.me.npwp || '—')} · ${esc(D.me.email)}</small></div><img src="/img/pokama-logo.png" style="height:34px"></div>
    <table><thead><tr><th>Investasi</th><th class="r">Bagi hasil</th><th class="r">Dividen</th><th class="r">Pengembalian modal</th></tr></thead>
    <tbody>${rows.map(r => `<tr><td>${esc(r.title)}<br><small>${esc(r.unit)}</small></td><td class="r">${rp(r.hasil)}</td><td class="r">${rp(r.dividen)}</td><td class="r">${rp(r.modal)}</td></tr>`).join('') || '<tr><td colspan="4">Belum ada laporan final.</td></tr>'}</tbody>
    <tfoot><tr><td>Total ${YEAR}</td><td class="r">${rp(t.hasil)}</td><td class="r">${rp(t.dividen)}</td><td class="r">${rp(t.modal)}</td></tr><tr><td colspan="3">Penarikan ditransfer ke rekening ${YEAR}</td><td class="r">${rp(R.paid)}</td></tr></tfoot></table>
    <p><small>Dari laporan bulanan final PT Popo Karya Investama. Pengembalian modal bukan penghasilan. Untuk pelaporan pajak, cocokkan dengan bukti potong dari Keuangan (bila ada). Dibuat ${new Date().toLocaleString('id-ID')}.</small></p>`;
  const sheet = document.createElement('div'); sheet.className = 'rekap';
  sheet.innerHTML = `<div class="rk">${html}<div class="noprint" style="display:flex;gap:8px;margin-top:16px"><button class="btn dark" data-print>Cetak / simpan PDF</button><button class="btn" data-closerk>Tutup</button></div></div>`;
  document.body.appendChild(sheet);
  sheet.querySelector('[data-closerk]').onclick = () => sheet.remove();
  sheet.querySelector('[data-print]').onclick = () => { document.body.classList.add('printing'); try { window.print(); } catch (e) {} setTimeout(() => document.body.classList.remove('printing'), 500); };
}

/* ---------- Dana ---------- */
function vDana() {
  const b = D.balance, ok = D.me.kyc_status === 'terverifikasi' && D.me.bank, waiting = D.withdrawals.some(w => w.status === 'diminta');
  return `${plain('Tarik dana')}<main>
    <section class="card" style="background:var(--navy);color:#fff;border:0"><span class="small" style="color:#C9D1E2">Saldo bisa ditarik</span><span style="font-size:30px;font-weight:800">${rp(b.withdrawable)}</span>
      <span class="small" style="color:#C9D1E2">${+b.in_process ? rp(b.in_process) + ' sedang diproses · ' : ''}${rp(D.month_live)} bulan ini masuk setelah tutup buku</span></section>
    <form class="card" id="fw" novalidate>
      <label class="f">Nominal<input class="inp" name="amount" inputmode="numeric" value="${+b.withdrawable >= 50000 ? Math.floor(b.withdrawable).toLocaleString('id-ID') : ''}" placeholder="Minimal Rp50.000" ${ok && !waiting ? '' : 'disabled'}></label>
      <div class="row" style="padding:0"><span class="av" style="background:var(--bg);color:var(--navy)">${svg('bank', 18)}</span><div class="t"><span class="small">Ke rekening terdaftar</span><strong>${esc(D.me.bank || 'Belum ada rekening')}</strong>${D.me.bank_holder ? `<span class="small">a.n. ${esc(D.me.bank_holder)}</span>` : ''}</div></div>
      ${!ok ? `<div class="warn">Rekening atau data diri belum diverifikasi tim Keuangan.</div>` : waiting ? `<div class="warn">Masih ada penarikan yang menunggu persetujuan.</div>` : ''}
      <div id="we"></div>
      <button class="btn dark" type="submit" style="height:50px" ${ok && !waiting && +b.withdrawable >= 50000 ? '' : 'disabled'}>Ajukan penarikan</button>
      <p class="note">Disetujui CEO, lalu ditransfer Keuangan ke rekening atas nama Anda, biasanya 1–3 hari kerja. Rekening hanya bisa diganti lewat tim Pokama dengan verifikasi ulang.</p></form>
    ${reinvestCard()}
    <section class="card list"><div class="sechead" style="padding-top:12px"><span>Riwayat penarikan</span></div>
      ${D.withdrawals.length ? D.withdrawals.map(w => `<div class="row"><div class="t"><strong>${rp(w.amount)}</strong><span class="small">${tgl(w.requested_at)} ${new Date(w.requested_at).getFullYear()}${w.paid_at ? ' · ditransfer ' + tgl(w.paid_at) : ''}${w.reason ? ' · ' + esc(w.reason) : ''}</span></div><div class="r">${pill(...(WD[w.status] || [w.status, 'p-mute']))}</div></div>`).join('') : '<p class="empty">Belum ada penarikan.</p>'}</section></main>`;
}

/* ---------- Peluang (jelajah) ---------- */
let OFF_F = 'semua';
async function vPeluang() {
  if (!OFFERS) OFFERS = await A.rpc('iv_offers_open');
  if (PARAM) { const o = OFFERS.find(x => x.id === PARAM); if (o) return `${plain(o.title, '#peluang')}<main>${offerCard(o, true)}<p class="note">Tidak ada pembayaran di aplikasi. Perjanjian dan transfer dilakukan langsung dengan PT Popo Karya Investama. Estimasi dari data operasional, bukan jaminan hasil.</p></main>`; }
  const list = OFFERS.filter(o => OFF_F === 'semua' || o.jenis === OFF_F);
  return `<header class="whead"><div style="flex:1"><b style="font-size:20px">Jelajahi peluang</b><br><span class="small">Unit dan proyek yang sedang dibutuhkan, dipilih dari data permintaan</span></div></header><main style="padding-top:6px">
    <div class="chips" role="group" aria-label="Jenis">${[['semua', 'Semua'], ['aset', 'Aset sewa'], ['proyek', 'Proyek / modal'], ['saham', 'Saham']].map(([k, l]) => `<button data-offf="${k}" aria-pressed="${OFF_F === k}">${l}</button>`).join('')}</div>
    ${list.length ? list.map(o => offerCard(o, true)).join('') : `<div class="card"><b>Belum ada peluang ${OFF_F === 'semua' ? 'dibuka' : 'jenis ini'}</b><p class="empty" style="padding:0">Tulis unit atau proyek yang Anda minati, tim kami menghubungi.</p>
      <form class="fi" data-offer=""><input class="inp" name="amount" inputmode="numeric" placeholder="Rencana dana (opsional)"><input class="inp" name="note" placeholder="Unit atau jenis investasi yang diminati"><button class="btn dark" type="submit">Kirim ke tim</button></form></div>`}
    <p class="note">Program terbatas berdasarkan undangan, bukan penawaran umum. Estimasi dari data operasional, bukan jaminan hasil: unit bisa sepi, rusak, atau perlu servis; proyek bisa terlambat.</p></main>`;
}

/* ---------- Akun ---------- */
function vAkun() {
  const me = D.me, K = { terverifikasi: ['Terverifikasi', 'p-good'], menunggu: ['Menunggu verifikasi', 'p-warn'], ditolak: ['Perlu diperbaiki', 'p-bad'] }[me.kyc_status];
  return `${plain('Akun')}<main>
    <section class="card"><div class="row" style="padding:0"><div class="av" style="background:var(--navy);width:48px;height:48px;border-radius:24px">${esc(initials(me.name))}</div><div class="t"><strong style="font-size:16px">${esc(me.name)}</strong><span class="small">${esc(me.email)} · masuk dengan Google</span></div></div></section>
    <section class="card list"><div class="sechead" style="padding-top:12px"><span>Data diri & rekening</span>${pill(...K)}</div>
      <div class="row"><div class="t"><span class="small">WhatsApp</span><strong>${esc(me.wa || '—')}</strong></div></div>
      <div class="row"><div class="t"><span class="small">NIK</span><strong>${esc(me.nik || '—')}</strong></div></div>
      <div class="row"><div class="t"><span class="small">NPWP</span><strong>${esc(me.npwp || '—')}</strong></div></div>
      <div class="row"><div class="t"><span class="small">Rekening</span><strong>${esc(me.bank || '—')}</strong>${me.bank_holder ? `<span class="small">a.n. ${esc(me.bank_holder)}</span>` : ''}</div></div>
      <p class="note" style="padding:4px 0 12px">Data disimpan terenkripsi dan selalu tersamar. Untuk mengganti rekening atau data diri, hubungi tim Pokama; perubahan diverifikasi ulang oleh Keuangan.</p></section>
    <section class="card list"><div class="sechead" style="padding-top:12px"><span>Dokumen perjanjian</span></div>
      ${D.docs.length ? D.docs.map(d => `<div class="row"><span class="av" style="background:var(--bg);color:var(--navy)">${svg('doc', 18)}</span><div class="t"><strong>${esc(d.title)}</strong></div><button class="btn sm" data-doc="${d.id}">Buka</button></div>`).join('') : '<p class="empty">Belum ada dokumen.</p>'}</section>
    <section class="card"><div class="feat"><span class="ic">${svg('shield')}</span><div><b>Keamanan akun</b><span>Masuk hanya dengan akun Google ${esc(me.email)}. Aktifkan verifikasi 2 langkah di akun Google Anda. Tim Pokama tidak pernah meminta kode atau kata sandi.</span></div></div></section>
    <button class="btn" data-out style="height:50px">Keluar</button>
    <p class="note">PT Popo Karya Investama · <a href="https://pokama.org">pokama.org</a></p></main>`;
}

/* ---------- render ---------- */
async function render() {
  const h = (location.hash || '#beranda').slice(1).split('/');
  VIEW = h[0] || 'beranda'; PARAM = h[1] || '';
  const V = { kabar: vKabar, beranda: vBeranda, investasi: vInvestasi, inv: () => vInv(PARAM), laporan: vLaporan, dana: vDana, peluang: vPeluang, akun: vAkun };
  if (!V[VIEW]) { VIEW = 'beranda'; }
  try {
    const html = await V[VIEW]();
    app.innerHTML = (D.me.demo ? '<div class="demo">DATA DEMO · bukan transaksi sungguhan</div>' : '') + '<div class="pad">' + html + '</div>' + nav();
    window.scrollTo(0, 0); wire();
  } catch (er) {
    if (er.status === 401) { logout(); return; }
    app.innerHTML = `<div class="pad">${plain('Ada kendala')}<main><div class="err">${esc(er.message)}</div><button class="btn" onclick="location.reload()">Coba lagi</button></main></div>` + nav();
  }
}
function wire() {
  app.querySelectorAll('[data-invf]').forEach(b => b.onclick = () => { INVF = b.dataset.invf; render(); });
  const rv = app.querySelector('[data-reinvest]');
  if (rv) rv.onchange = async () => { rv.disabled = true; try { const r = await A.rpc('iv_set_reinvest', { p_on: rv.checked }); EX.reinvest = r.reinvest; EX.reinvest_since = r.reinvest ? new Date().toISOString() : null;
    toast(r.reinvest ? 'Investasi ulang aktif. Tim akan menghubungi.' : 'Investasi ulang dimatikan'); render(); } catch (er) { rv.checked = !rv.checked; rv.disabled = false; toast(er.message, 1); } };
  app.querySelectorAll('[data-offf]').forEach(b => b.onclick = () => { OFF_F = b.dataset.offf; render(); });
  wireRange(); loadGrowth(); loadOffers();
  app.querySelectorAll('[data-year]').forEach(b => b.onclick = () => { YEAR = +b.dataset.year; render(); });
  app.querySelectorAll('[data-rekap]').forEach(b => b.onclick = rekap);
  app.querySelectorAll('[data-pdf]').forEach(b => b.onclick = () => pdf(+b.dataset.pdf));
  app.querySelectorAll('[data-doc]').forEach(b => b.onclick = async () => { try { const p = await A.rpc('iv_doc_path', { p_h: b.dataset.doc }); if (!p) throw new Error('Dokumen belum diunggah'); await A.openFile(p); } catch (er) { toast(er.message, 1); } });
  const fw = app.querySelector('#fw');
  if (fw) {
    fw.amount.oninput = () => { const v = num(fw.amount.value); fw.amount.value = v ? v.toLocaleString('id-ID') : ''; };
    fw.onsubmit = async (e) => {
      e.preventDefault(); const a = num(fw.amount.value), b = fw.querySelector('button'), out = fw.querySelector('#we');
      if (!a) { out.innerHTML = '<div class="err">Isi nominal penarikan.</div>'; return; }
      if (!confirm('Tarik ' + rp(a) + ' ke ' + D.me.bank + '?')) return;
      b.disabled = true; b.textContent = 'Mengirim…';
      try { await A.rpc('iv_request_withdrawal', { p_amount: a }); toast('Penarikan diajukan'); await refresh(); }
      catch (er) { out.innerHTML = `<div class="err">${esc(er.message)}</div>`; b.disabled = false; b.textContent = 'Ajukan penarikan'; }
    };
  }
  app.querySelectorAll('form.fi').forEach(f => {
    f.amount.oninput = () => { const v = num(f.amount.value); f.amount.value = v ? v.toLocaleString('id-ID') : ''; };
    f.onsubmit = async (e) => {
      e.preventDefault(); const b = f.querySelector('button'); b.disabled = true; b.textContent = 'Mengirim…';
      try { await A.rpc('iv_interest', { p_offer: f.dataset.offer || null, p_amount: num(f.amount.value) || null, p_note: f.note.value || null });
        f.innerHTML = '<div class="ok">Terkirim. Tim investor relations menghubungi lewat WhatsApp.</div>'; const o = (OFFERS || []).find(x => x.id === f.dataset.offer); if (o) o.mine = true; }
      catch (er) { toast(er.message, 1); b.disabled = false; b.textContent = 'Saya tertarik'; }
    };
  });
}
async function refresh() { const [d, x] = await Promise.all([A.rpc('iv_dashboard'), A.rpc('iv_extra').catch(() => null)]); D = d; if (x) EX = x; G = null; OFFERS = null; render(); }
addEventListener('hashchange', () => { document.querySelectorAll('.rekap').forEach(x => x.remove()); if (D) render(); else if (location.hash.includes('access_token=')) boot(); });
['click', 'keydown', 'touchstart'].forEach(ev => addEventListener(ev, act, { passive: true }));
document.addEventListener('click', (e) => { if (e.target.closest('[data-google]')) google(); if (e.target.closest('[data-out]')) logout(); if (e.target.closest('[data-switch]')) { sess.save(null); google(); } if (e.target.closest('[data-minat]')) { logout(); setTimeout(() => document.querySelector('#minat')?.scrollIntoView({ behavior: 'smooth' }), 60); } });

async function boot() {
  if (location.hash.includes('access_token=')) {
    const p = new URLSearchParams(location.hash.slice(1));
    const em = (() => { try { return JSON.parse(atob(p.get('access_token').split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))).email; } catch (e) { return ''; } })();
    sess.save({ access_token: p.get('access_token'), refresh_token: p.get('refresh_token'), expires_in: +p.get('expires_in') || 3600, email: em });
    act(); history.replaceState(null, '', location.pathname + '#beranda');
  } else if (location.hash.includes('error_description=')) {
    const p = new URLSearchParams(location.hash.slice(1)); history.replaceState(null, '', location.pathname); landing({ t: p.get('error_description') || 'Gagal masuk', err: 1 }); return;
  }
  if (sess.load() && idle()) { logout(); return; }
  const t = await sess.token();
  if (!t) { D = null; landing(); return; }
  act();
  try {
    const l = await A.rpc('iv_link_me');
    if (l.need_google) { sess.save(null); landing({ t: 'Portal investor hanya bisa dibuka dengan tombol Masuk dengan Google.', err: 1 }); return; }
    if (!l.found && l.staff) { gate('Ini akun staf Pokama', `${esc(l.email)} terdaftar sebagai staf. Data investor dikelola dari panel staf.`, `<a class="btn dark" href="https://app.pokama.org/investor" style="height:50px">Buka panel investor staf</a>`); return; }
    if (!l.found) { gate('Email belum terdaftar sebagai investor', `${esc(l.email)} belum tercatat di program investor Pokama. Akun investor dibuat tim kami setelah perjanjian ditandatangani. Kalau Anda sudah berinvestasi, pastikan memakai email Google yang didaftarkan.`, `<button class="btn pri" data-minat style="height:50px">Ajukan minat jadi investor</button>`); return; }
    if (l.status !== 'aktif') { gate('Akun investor nonaktif', 'Hubungi tim Pokama untuk informasi lebih lanjut.'); return; }
    if (!location.hash || location.hash === '#masuk') history.replaceState(null, '', '#beranda');
    await refresh();
  } catch (er) {
    if (er.status === 401) { logout(); return; }
    app.innerHTML = `<main><div class="err">${esc(er.message)}</div><button class="btn" onclick="location.reload()">Coba lagi</button><button class="btn" data-out>Keluar</button></main>`;
  }
}
boot();
</script>
