<!doctype html>
<html lang="id" data-gate-title="Investor">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Investor · Pokama</title>
<link rel="icon" href="/img/pk.png">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/marketing/gate.css">
<script src="/marketing/gate.js"></script>
<style>
:root{--navy:#1D3149;--teal:#09BEAF;--teal-d:#067A70;--mint:#DDF5F2;--bg:#F3F5F8;--line:#E3E6EB;--line2:#EEF0F3;--ink:#1F2933;--mut:#5B6573;--red:#9A3F0A;--redbg:#FCEBDD;--yel:#7A5200;--yelbg:#FDF3D7;--blue:#1E5AA8;--bluebg:#E5EEF9}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Nunito,system-ui,-apple-system,sans-serif}
a{color:var(--teal-d)}
button,input,select,textarea{font:inherit;color:inherit}
#dc-root{display:flex;min-height:100vh}
.side{width:236px;flex:none;background:#fff;border-right:1px solid var(--line);padding:20px 12px;display:flex;flex-direction:column;gap:14px;position:sticky;top:0;height:100vh;overflow-y:auto}
.side img{width:112px;margin:0 10px}
.side .grp{display:flex;flex-direction:column;gap:2px}.side .grp>span{font-size:10.5px;font-weight:800;letter-spacing:.1em;color:#8A94A3;padding:0 10px 4px}
.side a{display:flex;align-items:center;gap:10px;min-height:36px;padding:0 10px;border-radius:9px;text-decoration:none;font-weight:600;color:#3B4250;font-size:13.5px}
.side a[aria-current="page"]{font-weight:800;color:var(--navy);background:#EAF8F6;box-shadow:inset 3px 0 0 var(--teal)}
.side a .nb{margin-left:auto}.side a[aria-current="page"] svg{color:#067A70 !important}.side a:hover svg{color:#3B4250 !important}
.side .foot{margin-top:auto;border-top:1px solid var(--line);padding:12px 10px 0;font-size:12px;color:var(--mut)}
main{flex:1;min-width:0;padding:26px 32px 60px;display:flex;flex-direction:column;gap:18px}
h1{margin:0;font-size:25px;font-weight:900;color:var(--navy)}h2{margin:0;font-size:17px;font-weight:900;color:var(--navy)}
.ph{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:flex-end}.ph .sub{font-size:13.5px;color:var(--mut)}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sel,.inp{height:38px;border:1px solid #D3D7DE;border-radius:10px;padding:0 10px;background:#fff;font-weight:700}
.inp{font-weight:600}textarea.inp{height:70px;padding:8px 10px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.tile{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 16px;display:flex;flex-direction:column;gap:2px;border-top:4px solid var(--teal)}
.tile span{font-size:12px;color:var(--mut);font-weight:700}.tile b{font-size:24px;font-weight:900;color:var(--navy)}.tile small{color:var(--mut);font-weight:700;font-size:12px}
.tile.warn{border-top-color:#F2A33A}.tile.bad{border-top-color:#C2410C}.tile.bad small{color:var(--red)}
.cols{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:18px;align-items:start}
.tbl{width:100%;border-collapse:collapse}.tbl th{text-align:left;font-size:12px;color:var(--mut);font-weight:800;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line2);vertical-align:middle}.tbl .r{text-align:right}.tbl tr.click{cursor:pointer}.tbl tr.click:hover td{background:#FAFBFC}
.scroll{overflow-x:auto}
.btn{height:38px;padding:0 14px;border-radius:10px;border:1px solid #C9D1DB;background:#fff;color:var(--navy);font-weight:800;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none;white-space:nowrap}
.btn.pri{background:var(--teal);border-color:var(--teal)}.btn.sm{height:32px;padding:0 10px;font-size:12.5px}.btn.warn{color:var(--red);border-color:#E9B999}.btn:disabled{opacity:.55;cursor:default}
.pill{display:inline-flex;align-items:center;font-size:11.5px;font-weight:800;padding:2px 8px;border-radius:999px;background:#EEF0F3;color:#3B4250;white-space:nowrap}
.pill.g{background:var(--mint);color:var(--teal-d)}.pill.y{background:var(--yelbg);color:var(--yel)}.pill.r{background:var(--redbg);color:var(--red)}.pill.b{background:var(--bluebg);color:var(--blue)}
.nb{min-width:20px;height:20px;border-radius:10px;background:#C2410C;color:#fff;font-size:11px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;padding:0 6px}
.list{display:flex;flex-direction:column}.li{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line2)}.li:first-child{border-top:0}.li .t{flex:1;min-width:0;display:flex;flex-direction:column}.li .t span{font-size:12.5px;color:var(--mut)}
.alert{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:#FFFBF8;border:1px solid #E9B999}.alert b{color:var(--red)}
.ok{background:var(--mint);color:var(--teal-d);border-radius:10px;padding:10px 12px;font-weight:700}
.muted{color:var(--mut)}.small{font-size:12.5px}
.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:800;color:#3B4250}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.demo{background:#FFF6E0;color:#7A4B00;border:1px solid #F2D58A;border-radius:10px;padding:8px 12px;font-weight:800;font-size:13px}
.scrim{position:fixed;inset:0;background:rgba(29,49,73,.45);z-index:60;display:flex;justify-content:flex-end}
.panel{background:#fff;width:min(560px,100%);height:100%;overflow:auto;padding:22px;display:flex;flex-direction:column;gap:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;background:var(--navy);color:#fff;padding:10px 16px;border-radius:12px;font-weight:800;z-index:90}.toast.err{background:#9A3F0A}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.kv>div{background:var(--bg);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column}.kv span{font-size:11px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
code,pre{font-family:ui-monospace,Menlo,monospace;font-size:12.5px}pre{background:#0F1B2B;color:#D7E3F1;padding:12px;border-radius:10px;overflow:auto;white-space:pre-wrap;margin:0}
.mbar{display:none}
@media (max-width:900px){
  .side{position:fixed;left:0;top:0;bottom:0;z-index:70;transform:translateX(-102%);transition:transform .2s;width:260px}
  body.nav-open .side{transform:none;box-shadow:0 0 40px rgba(29,49,73,.25)}
  .mbar{display:flex;position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--line);height:52px;align-items:center;gap:10px;padding:0 12px}
  .mbar img{width:80px}.mbar b{flex:1;text-align:right;font-weight:900;color:var(--navy)}
  #dc-root{flex-direction:column}
  main{padding:14px 12px 50px}
  .cols,.g3{grid-template-columns:minmax(0,1fr)}
  .cols>*{min-width:0}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .li{flex-wrap:wrap}.li .t{flex:1 1 100%}
  .tile b{font-size:19px;overflow-wrap:anywhere}
  .g2{grid-template-columns:minmax(0,1fr)}
  .card{padding:14px}
  .filters .sel{flex:1 1 140px;min-width:0}
  .inp{max-width:100%}
  pre{font-size:11px}
  main{max-width:100vw}
  .ph>div{min-width:0}
}
.side .foot{word-break:break-word}
.nb[hidden]{display:none}
.tbl td .btn.sm{white-space:nowrap}
</style>
</head>
<body>
<div id="dc-root">
  <div class="mbar"><button class="btn sm" data-menu aria-label="Buka menu">☰</button><img src="/img/pokama-logo.png" alt="Pokama"><b id="mt">Investor</b></div>
  <aside class="side" aria-label="Menu investor">
    <img src="/img/pokama-logo.png" alt="Pokama">
    <div class="grp"><span>INVESTOR</span>
      <a href="#ringkasan"><svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none;color:#8A94A3"><path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/></svg><span style="flex:1">Ringkasan</span></a><a href="#investor"><svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none;color:#8A94A3"><path d="M9 4.5a3.5 3.5 0 1 1 0 7a3.5 3.5 0 1 1 0-7zM2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6.5 6.5 0 0 1 3.5 6"/></svg><span style="flex:1">Investor </span><b class="nb" data-nb="kyc_wait" hidden></b></a><a href="#investasi"><svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none;color:#8A94A3"><path d="M6 3h9l4 4v14H6zM14 3v5h5"/></svg><span style="flex:1">Investasi & perjanjian </span><b class="nb" data-nb="hold_wait" hidden></b></a><a href="#peluang"><svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none;color:#8A94A3"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.8.8 1 1.5 1 2.5h6c0-1 .2-1.7 1-2.5A6 6 0 0 0 12 3z"/></svg><span style="flex:1">Peluang & minat </span><b class="nb" data-nb="leads" hidden></b></a></div>
    <div class="grp"><span>KEUANGAN</span><a href="#bagihasil"><svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none;color:#8A94A3"><path d="M19 5L5 19M7 5a2 2 0 1 1 0 4a2 2 0 1 1 0-4zM17 15a2 2 0 1 1 0 4a2 2 0 1 1 0-4z"/></svg><span style="flex:1">Bagi hasil bulanan </span><b class="nb" data-nb="st_wait" hidden></b></a><a href="#penarikan"><svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none;color:#8A94A3"><path d="M12 3v12M7 10l5 5 5-5M4 21h16"/></svg><span style="flex:1">Penarikan dana </span><b class="nb" data-nb="wd" hidden></b></a></div>
    <div class="grp"><span>LAINNYA</span><a href="#log"><svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none;color:#8A94A3"><path d="M12 3a9 9 0 1 0 9 9M12 7v5l3 2"/></svg><span style="flex:1">Log audit</span></a><a href="/">← Sistem Kerja</a><a href="/keuangan/"><svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none;color:#8A94A3"><path d="M3 10l9-6 9 6M5 10v8M10 10v8M14 10v8M19 10v8M3 21h18"/></svg><span style="flex:1">Keuangan grup</span></a><a href="https://investor.pokama.org" target="_blank" rel="noopener"><svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none;color:#8A94A3"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg><span style="flex:1">Portal investor ↗</span></a></div>
    <div class="foot" id="me">…</div>
  </aside>
  <main id="app"><p class="muted">Memuat…</p></main>
</div>
<script type="module">
import { makeSession, api, esc, rp, rpk, pct, tgl, bulan, monthKey, toast, waLink } from '/mitra/af.js';
const A = api(makeSession('pokama.session'));
const app = document.getElementById('app');
const PAGES = { ringkasan: 'Ringkasan', investor: 'Investor', investasi: 'Investasi & perjanjian', bagihasil: 'Bagi hasil bulanan', penarikan: 'Penarikan dana', peluang: 'Peluang & minat', log: 'Log audit' };
const view = () => { const v = (location.hash || '#ringkasan').slice(1).split('/')[0]; return PAGES[v] ? v : 'ringkasan'; };
const S = { unit: '', hstatus: '', period: '', q: '' };
let M = null, cur = null;
const JENIS = { aset: 'Aset sewa', proyek: 'Proyek / modal', saham: 'Saham' };
const SCHEME = { per_unit: 'Per unit', vendor: 'Portofolio vendor', flat: 'Flat bulanan', location: 'Kemitraan lokasi' };
const HST = { draf: ['Draf', ''], menunggu: ['Menunggu CEO', 'y'], aktif: ['Aktif', 'g'], selesai: ['Selesai', ''], ditolak: ['Ditolak', 'r'] };
const WST = { diminta: ['Menunggu CEO', 'y'], disetujui: ['Siap ditransfer', 'b'], dibayar: ['Ditransfer', 'g'], ditolak: ['Ditolak', 'r'], gagal: ['Gagal', 'r'] };
const SST = { draf: ['Draf', ''], diajukan: ['Diajukan', 'y'], terkunci: ['Terkunci', 'g'] };
const KYC = { menunggu: ['KYC menunggu', 'y'], terverifikasi: ['Terverifikasi', 'g'], ditolak: ['KYC ditolak', 'r'] };
const LST = { baru: ['Baru', 'y'], dihubungi: ['Dihubungi', 'b'], jadi_investor: ['Jadi investor', 'g'], batal: ['Batal', ''] };
const KIND = { hasil: 'Bagi hasil', dividen: 'Dividen', modal: 'Pengembalian modal' };
const pill = (a) => `<span class="pill ${a[1]}">${esc(a[0])}</span>`;
const pc = (n) => n == null ? '—' : String(Math.round(+n * 100) / 100).replace('.', ',') + '%';
const num = (s) => +String(s ?? '').replace(/[^\d,-]/g, '').replace(',', '.') || 0;
const unitName = (c) => ((M && M.units.find(u => u.code === c)) || {}).name || c;
const months = () => { const o = []; const d = new Date(); d.setDate(1); for (let i = 0; i < 13; i++) { o.push(monthKey(d)); d.setMonth(d.getMonth() - 1); } return o; };
const header = (title, sub, right = '') => `<div class="ph"><div><h1>${title}</h1><div class="sub">${sub}</div></div>${right}</div>`;
const tile = (l, v, s, cls = '') => `<div class="tile ${cls}"><span>${l}</span><b>${v}</b><small>${s}</small></div>`;
const unitSel = (k = 'unit', all = 'Semua unit') => `<select class="sel" data-f="${k}" aria-label="Unit"><option value="">${all}</option>${M.units.map(u => `<option value="${u.code}"${u.code === S[k] ? ' selected' : ''}>${esc(u.name)}</option>`).join('')}</select>`;
const can = { biz: () => M.is_biz || M.is_fin, fin: () => M.is_fin, owner: () => M.is_owner };
function returnLine(h) {
  if (h.jenis === 'aset') return h.rp_scheme === 'flat' ? rp(h.rp_flat) + '/bln' : pc(h.rate_pct) + ' ' + (h.rp_scheme === 'per_unit' ? 'laba unit' : h.rp_basis === 'gross' ? 'pendapatan' : 'laba') + (h.rp_ops_pct ? ' · biaya kelola ' + pc(h.rp_ops_pct) : '');
  if (h.jenis === 'proyek') return h.return_model === 'imbal_tetap' ? pc(h.rate_pct) + '/bln dari modal' : pc(h.rate_pct) + ' laba proyek';
  return pc(h.rate_pct) + ' kepemilikan';
}

/* ---------- Ringkasan ---------- */
async function vRingkasan() {
  const O = await A.rpc('iv_admin_overview', { p_unit: S.unit || null });
  const yearly = +O.principal ? (+O.last_month || +O.month_live) * 12 / +O.principal * 100 : null;
  let h = header('Ringkasan investor', 'Semua unit bisnis dalam satu tempat. Angka bulan berjalan dihitung langsung dari transaksi; final setelah tutup buku.', `<div class="filters">${unitSel()}</div>`);
  h += `<div class="tiles">
    ${tile('Dana investor dikelola', rpk(O.principal), O.investors_active + ' investor aktif · ' + O.investors + ' terdaftar')}
    ${tile('Bagi hasil berjalan', rpk(O.month_live), bulan(O.period) + ' · estimasi')}
    ${tile('Bagi hasil bulan lalu', rpk(O.last_month), yearly != null ? 'setara ' + pc(yearly) + '/tahun dari modal' : 'belum ada')}
    ${tile('Dibagikan tahun ini', rpk(O.ytd), 'laporan terkunci, tanpa pengembalian modal')}
    ${tile('Kewajiban ke investor', rpk(O.payable), 'saldo yang bisa ditarik investor', +O.payable > 0 ? 'warn' : '')}
    ${tile('Penarikan diproses', rpk(O.wd_pending), (M.counts.wd_wait + M.counts.wd_pay) + ' permintaan', +O.wd_pending ? 'warn' : '')}
    ${tile('Imbal tetap per bulan', rpk(O.fixed_next), 'kas keluar rutin proyek imbal tetap')}
    ${tile('Modal jatuh tempo 90 hari', rpk(O.due_90.reduce((a, d) => a + (d.back === 'akhir' ? +d.principal : 0), 0)), O.due_90.length + ' investasi', O.due_90.length ? 'bad' : '')}
  </div>`;
  const att = [];
  if (M.counts.hold_wait) att.push(`<div class="alert"><span><b>${M.counts.hold_wait} perjanjian menunggu persetujuan CEO</b>. <a href="#investasi">Buka Investasi</a></span></div>`);
  if (M.counts.wd_wait) att.push(`<div class="alert"><span><b>${M.counts.wd_wait} penarikan menunggu persetujuan CEO</b>. <a href="#penarikan">Buka Penarikan</a></span></div>`);
  if (M.counts.wd_pay) att.push(`<div class="alert"><span><b>${M.counts.wd_pay} penarikan siap ditransfer Keuangan</b>. <a href="#penarikan">Buka Penarikan</a></span></div>`);
  if (+O.last_unlocked) att.push(`<div class="alert"><span><b>${O.last_unlocked} investasi belum ditutup buku ${bulan(months()[1])}</b>. Hitung, ajukan, lalu kunci di <a href="#bagihasil">Bagi hasil</a>.</span></div>`);
  if (M.counts.st_wait) att.push(`<div class="alert"><span><b>${M.counts.st_wait} laporan diajukan</b> menunggu dikunci. <a href="#bagihasil">Buka</a></span></div>`);
  if (M.counts.kyc_wait) att.push(`<div class="alert"><span><b>${M.counts.kyc_wait} investor belum KYC</b>: belum bisa menarik dana. <a href="#investor">Buka Investor</a></span></div>`);
  if (M.counts.leads) att.push(`<div class="alert" style="border-color:var(--line);background:#fff"><span><b style="color:var(--navy)">${M.counts.leads} minat baru</b> calon investor. <a href="#peluang">Hubungi</a></span></div>`);
  const per = O.per_unit.length ? `<table class="tbl"><thead><tr><th>Unit</th><th class="r">Investasi</th><th class="r">Modal</th><th class="r">Bagi hasil berjalan</th><th class="r">Pendapatan aset</th><th class="r">% modal/bln</th></tr></thead><tbody>${O.per_unit.map(u => `<tr><td><b>${esc(u.name)}</b><br><span class="muted small">${[u.aset ? u.aset + ' aset' : '', u.proyek ? u.proyek + ' proyek' : '', u.saham ? u.saham + ' saham' : ''].filter(Boolean).join(' · ')}</span></td><td class="r">${u.n}</td><td class="r">${rp(u.principal)}</td><td class="r">${rp(u.live)}</td><td class="r">${+u.revenue ? rp(u.revenue) : '—'}</td><td class="r">${+u.principal ? pc(u.live / u.principal * 100) : '—'}</td></tr>`).join('')}</tbody></table>` : '<p class="muted">Belum ada investasi aktif.</p>';
  const BJ = O.by_jenis || {}, tj = Object.values(BJ).reduce((a, x) => a + +x.principal, 0) || 1, CJ = { aset: '#09BEAF', proyek: '#1D3149', saham: '#E0A82E' };
  const komp = `<div style="display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--line)">${Object.entries(BJ).map(([k, x]) => `<i style="width:${x.principal / tj * 100}%;background:${CJ[k]}"></i>`).join('')}</div>
    <div class="g3">${['aset', 'proyek', 'saham'].map(k => `<div><span class="muted small"><i style="display:inline-block;width:9px;height:9px;border-radius:5px;background:${CJ[k]}"></i> ${JENIS[k]}</span><br><b>${rpk((BJ[k] || {}).principal || 0)}</b> <span class="muted small">${(BJ[k] || {}).n || 0} inv.</span></div>`).join('')}</div>`;
  const tr = O.trend, mx = Math.max(1, ...tr.map(t => +t.share));
  const trend = tr.length ? `<div style="display:flex;align-items:flex-end;gap:6px;height:110px">${tr.map(t => `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px" title="${bulan(t.period)}: ${rp(t.share)}"><i style="display:block;width:100%;max-width:30px;height:${t.share / mx * 86}px;min-height:3px;background:var(--teal);border-radius:6px 6px 2px 2px"></i><span class="muted" style="font-size:10px">${bulan(t.period).slice(0, 3)}</span></div>`).join('')}</div>` : '<p class="muted small">Tren muncul setelah ada laporan bulanan terkunci.</p>';

  const right = `<div class="filters"><select class="sel" data-f="period">${months().map(m => `<option value="${m}"${m === S.period ? ' selected' : ''}>${bulan(m)}${m === months()[0] ? ' (berjalan)' : ''}</option>`).join('')}</select>
    ${can.fin() && R.closed ? '<button class="btn" data-compute>Hitung otomatis</button><button class="btn" data-sact="ajukan">Ajukan semua draf</button>' : ''}
    ${(M.is_owner || M.role === 'keuangan') && R.closed ? '<button class="btn pri" data-sact="kunci">Kunci yang diajukan</button>' : ''}</div>`;
  let h = header('Bagi hasil bulanan', 'Aset sewa dan imbal tetap dihitung otomatis. Bagi laba proyek dan dividen saham diisi Keuangan. Alur: hitung/isi → ajukan → dikunci orang lain → masuk saldo investor.', right);
  h += `<div class="tiles">${tile('Total bagian investor', rpk(sum()), all.length + ' laporan')}${tile('Draf', rpk(sum('draf')), all.filter(s => s.status === 'draf').length + ' laporan')}${tile('Diajukan', rpk(sum('diajukan')), all.filter(s => s.status === 'diajukan').length + ' menunggu dikunci', all.some(s => s.status === 'diajukan') ? 'warn' : '')}${tile('Terkunci', rpk(sum('terkunci')), 'sudah masuk saldo investor')}
    ${tile('Belum ada laporan', rows.filter(r => !(r.st || []).length).length, 'investasi', rows.some(r => !(r.st || []).length) && R.closed ? 'bad' : '')}</div>`;
  if (!R.closed) h += `<div class="alert"><span><b>Bulan berjalan</b>: angka di bawah masih estimasi dan belum bisa ditutup. Tutup buku setelah bulan selesai.</span></div>`;
  h += `<section class="card"><div class="scroll"><table class="tbl"><thead><tr><th>Investasi</th><th>Investor</th><th class="r">${R.closed ? 'Hitungan sistem' : 'Estimasi'}</th><th>Laporan</th><th class="r">Bagian investor</th><th>Status</th><th></th></tr></thead><tbody>
    ${rows.length ? rows.map(r => {
      const sts = r.st || [], live = r.live || {};
      const inputBtn = can.fin() && R.closed ? (r.jenis === 'saham' ? `<button class="btn sm" data-input="${r.holding_id}" data-kind="dividen">Isi dividen</button>` : r.jenis === 'proyek' ? `${r.return_model === 'bagi_laba' ? `<button class="btn sm" data-input="${r.holding_id}" data-kind="hasil">Isi laba</button>` : ''}<button class="btn sm" data-input="${r.holding_id}" data-kind="modal">Modal kembali</button>` : '') : '';
      return `<tr><td><b>${esc(r.title)}</b><br><span class="muted small">${esc(r.unit)} · ${JENIS[r.jenis]}${r.rp_scheme ? ' · ' + SCHEME[r.rp_scheme] : ''}</span></td><td>${esc(r.investor)}</td>
        <td class="r">${live.auto ? rp(live.share) + (+live.revenue ? `<br><span class="muted small">pendapatan ${rpk(live.revenue)}</span>` : '') : '<span class="muted small">perlu input</span>'}</td>
        <td>${sts.map(s => `<div class="small">${KIND[s.kind]}${s.source === 'input' ? ' · input' : ''}${+s.revenue ? ' · ' + rpk(s.revenue) + ' − ' + rpk(s.costs) : s.kind === 'dividen' ? ' · laba dibagi ' + rpk(s.base) : ''}${s.note ? ' · ' + esc(s.note) : ''}</div>`).join('') || '<span class="muted small">—</span>'}</td>
        <td class="r">${sts.length ? sts.map(s => `<div>${rp(s.share)}</div>`).join('') : '—'}</td><td>${sts.map(s => `<div>${pill(SST[s.status])}${s.status === 'diajukan' && s.by_me ? ' <span class="muted small">oleh Anda</span>' : ''}</div>`).join('') || pill(['Belum', 'r'])}</td>

          <label class="f">Cabang (opsional)<input class="inp" name="branch_name" value="${esc(o.branch_name || '')}" placeholder="Garut"></label>
          <label class="f">Porsi investor %<input class="inp" name="share_pct" inputmode="decimal" value="${o.share_pct != null ? String(+o.share_pct).replace('.', ',') : ''}" placeholder="30"></label></div>
        <datalist id="cats"><option value="iphone"><option value="penginapan"><option value="motor"><option value="mobil"><option value="jeep"><option value="kamera"><option value="lensa"><option value="game"><option value="camping"></datalist>
        <button class="btn sm" type="button" data-bench>Cek angka dari data</button><div id="bo" class="small"></div></div>
      <label class="f">Status<select class="inp" name="status"><option value="dibuka"${o.status === 'dibuka' ? ' selected' : ''}>Dibuka</option><option value="ditutup"${o.status === 'ditutup' ? ' selected' : ''}>Ditutup</option></select></label>
      <div id="oe"></div><button class="btn pri" type="submit">Simpan</button></form>`,
  (p) => { const f = p.querySelector('#fo');
    p.querySelector('[data-bench]').onclick = async () => { const out = p.querySelector('#bo'); out.textContent = 'Menghitung…';
      try { const b = await A.rpc('iv_admin_offer_bench', { p_cat: f.category.value, p_branch: f.branch_name.value, p_share: +String(f.share_pct.value).replace(',', '.') || null });
        out.innerHTML = b ? `<b>${b.units} unit</b> · pendapatan/unit/bln rata-rata ${rpk(b.month_avg)} (${rpk(b.month_low)}–${rpk(b.month_high)})${b.yield_avg != null ? ` · <b>${String(b.yield_avg).replace('.', ',')}%/thn</b> (${String(b.yield_low).replace('.', ',')}–${String(b.yield_high).replace('.', ',')}%) dari ${b.priced} unit berharga beli` : ' · harga beli unit belum diisi atau porsi kosong, %/thn belum bisa dihitung'}` : 'Tidak ada unit dengan kategori/cabang itu.'; }
      catch (er) { out.textContent = er.message; } };
    f.onsubmit = async (e) => { e.preventDefault(); const d = Object.fromEntries(new FormData(f)); if (o.id) d.id = o.id; ['target_amount', 'min_amount', 'raised_amount'].forEach(k => d[k] = num(d[k]) || '');
    try { await A.rpc('iv_admin_offer_save', { p: d }); toast('Peluang tersimpan'); close(); render(); } catch (er) { p.querySelector('#oe').innerHTML = `<div class="alert"><b>${esc(er.message)}</b></div>`; } }; });
}

/* ---------- Log ---------- */
async function vLog() {
  const L = await A.rpc('iv_admin_audit', { p_limit: 300 });
  const nice = (a) => ({ investor_baru: 'Investor dibuat', investor_ubah: 'Profil investor diubah', kyc_ubah: 'KYC / rekening diubah', buka_data: 'Data pribadi dibuka', investasi_baru: 'Investasi dibuat', investasi_ubah: 'Investasi diubah',
    investasi_ajukan: 'Investasi diajukan', investasi_setujui: 'Investasi disetujui', investasi_tolak: 'Investasi ditolak', investasi_akhiri: 'Investasi diakhiri', dokumen: 'Dokumen diunggah', hitung: 'Bagi hasil dihitung',
    laporan_ajukan: 'Laporan diajukan', laporan_kunci: 'Laporan dikunci', laporan_kembalikan: 'Laporan dikembalikan', tarik_diminta: 'Penarikan diminta', tarik_setujui: 'Penarikan disetujui', tarik_tolak: 'Penarikan ditolak',
    tarik_dibayar: 'Penarikan ditransfer', tarik_gagal: 'Penarikan gagal', peluang: 'Peluang disimpan', minat: 'Status minat', tautan_akun: 'Investor masuk pertama kali', input_hasil: 'Laba proyek diisi', input_dividen: 'Dividen diisi', input_modal: 'Modal kembali diisi' }[a] || a);
  return header('Log audit', 'Semua perubahan investor, perjanjian, laporan, rekening, dan penarikan. Tidak bisa diubah atau dihapus.') +
    `<section class="card"><div class="scroll"><table class="tbl"><thead><tr><th>Waktu</th><th>Oleh</th><th>Kejadian</th><th>Keterangan</th></tr></thead><tbody>${L.map(a => `<tr><td class="small" style="white-space:nowrap">${new Date(a.at).toLocaleString('id-ID', { dateStyle: 'medium', timeStyle: 'short' })}</td><td>${esc(a.by)}</td><td><b>${esc(nice(a.action))}</b></td><td class="small">${esc(a.reason || '')}${a.data && a.data.amount ? ' · ' + rp(a.data.amount) : ''}${a.data && a.data.n ? ' · ' + a.data.n + ' baris' : ''}</td></tr>`).join('') || '<tr><td colspan="4" class="muted">Belum ada catatan.</td></tr>'}</tbody></table></div></section>`;
}

/* ---------- kerangka ---------- */
function panel(html, after) { close(); cur = document.createElement('div'); cur.className = 'scrim'; cur.innerHTML = `<div class="panel" role="dialog" aria-modal="true">${html}</div>`; document.body.appendChild(cur); cur.addEventListener('click', (e) => { if (e.target === cur || e.target.closest('[data-close]')) close(); }); if (after) after(cur.querySelector('.panel')); }
function close() { if (cur) { cur.remove(); cur = null; } }
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') close(); });
const V = { ringkasan: vRingkasan, investor: vInvestor, investasi: vInvestasi, bagihasil: vBagiHasil, penarikan: vPenarikan, peluang: vPeluang, log: vLog };
async function render() {
  const v = view();
  document.querySelectorAll('.side a[href^="#"]').forEach(a => { if (a.getAttribute('href') === '#' + v) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  document.getElementById('mt').textContent = PAGES[v]; document.body.classList.remove('nav-open');
  try {
    M = await A.rpc('iv_admin_meta');
    app.innerHTML = (M.is_biz || M.is_fin ? '' : '<div class="demo">Mode lihat saja · Kepala Staf</div>') + await V[v]();
    const c = M.counts; document.querySelectorAll('[data-nb]').forEach(b => { const n = b.dataset.nb === 'wd' ? (M.is_owner ? c.wd_wait : 0) + (M.role === 'keuangan' || M.is_owner ? c.wd_pay : 0) : c[b.dataset.nb]; b.textContent = n; b.hidden = !n; });
  } catch (er) {
    app.innerHTML = /akses/i.test(er.message) ? '<div class="card"><h2>Tidak punya akses</h2><p class="muted">Panel investor untuk CEO, Kepala Staf (lihat saja), BizDev, dan Keuangan.</p></div>'
      : `<div class="card"><h2>Gagal memuat</h2><p class="muted">${esc(er.message)}</p><button class="btn" onclick="location.reload()">Coba lagi</button></div>`;
  }
}
document.addEventListener('submit', async (e) => {
  if (e.target.id !== 'fn') return; e.preventDefault(); const f = e.target, b = f.querySelector('button'), d = Object.fromEntries(new FormData(f)); b.disabled = true;
  try { await A.rpc('iv_admin_news_save', { p: d }); toast('Kabar terkirim ke portal investor'); render(); } catch (er) { toast(er.message, 1); b.disabled = false; }
});
document.addEventListener('click', async (e) => {
  const t = e.target.closest('[data-delnews]'); if (!t) return;
  if (!confirm('Hapus kabar ini dari portal investor?')) return;
  try { await A.rpc('iv_admin_news_delete', { p_id: t.dataset.delnews }); toast('Kabar dihapus'); render(); } catch (er) { toast(er.message, 1); }
});
document.addEventListener('change', async (e) => {
  const t = e.target;
  if (cur && cur.contains(t)) return;
  if (t.dataset.f) { S[t.dataset.f] = t.value; render(); return; }
  try {
    if (t.dataset.lead) { await A.rpc('iv_admin_lead_set', { p_id: t.dataset.lead, p_status: t.value }); toast('Status minat tersimpan'); }
    if (t.dataset.upload) { const file = t.files[0]; if (!file) return; if (file.size > 10 * 1048576) return toast('Maksimal 10 MB', true);
      const ext = (file.name.split('.').pop() || 'pdf').toLowerCase().replace(/[^a-z0-9]/g, ''); const path = await A.upload('iv-docs', t.dataset.upload + '/perjanjian-' + Date.now() + '.' + ext, file);
      await A.rpc('iv_admin_holding_doc', { p_id: t.dataset.upload, p_path: path }); toast('Perjanjian terunggah'); render(); }
  } catch (er) { toast(er.message, true); }
});
let tq; document.addEventListener('input', (e) => { if (e.target.hasAttribute('data-q')) { clearTimeout(tq); tq = setTimeout(() => { S.q = e.target.value.trim(); render().then(() => { const q = document.querySelector('[data-q]'); if (q) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); } }); }, 350); } });
document.addEventListener('click', async (e) => {
  if (e.target.closest('[data-menu]')) { document.body.classList.toggle('nav-open'); return; }
  if (cur && cur.contains(e.target)) return;
  const t = e.target.closest('[data-inv],[data-newinv],[data-newhold],[data-edithold],[data-hact],[data-hdoc],[data-compute],[data-sact],[data-input],[data-wact],[data-newoffer],[data-editoffer]'); if (!t) return;
  const d = t.dataset; e.preventDefault();
  try {
    if (d.inv) return investorPanel(d.inv);
    if (d.newinv !== undefined) return investorPanel(null);
    if (d.newhold !== undefined) return holdingPanel(d.newhold || '');
    if (d.edithold) { const L = await A.rpc('iv_admin_holdings', { p_status: null, p_unit: null }); return holdingPanel(null, L.find(x => x.id === d.edithold)); }
    if (d.hdoc) { const p = await A.rpc('iv_doc_path', { p_h: d.hdoc }); return A.openFile(p); }
    if (d.hact) {
      let reason = null;
      if (d.hact === 'tolak') { reason = prompt('Alasan penolakan (terlihat oleh pengaju):'); if (!reason) return; }
      if (d.hact === 'akhiri') { reason = prompt('Keterangan pengakhiran (mis. unit dijual, modal dikembalikan):'); if (!reason) return; }
      if (d.hact === 'setujui' && !confirm('Setujui investasi ini? Bagi hasil mulai dihitung sejak tanggal mulai.')) return;
      if (d.hact === 'ajukan' && !confirm('Ajukan ke CEO? Setelah diajukan, ketentuan tidak bisa diubah.')) return;
      await A.rpc('iv_admin_holding_act', { p_id: d.id, p_act: d.hact, p_reason: reason }); toast({ ajukan: 'Diajukan ke CEO', setujui: 'Disetujui · investasi aktif', tolak: 'Ditolak', akhiri: 'Investasi diakhiri' }[d.hact]); return render();
    }
    if (d.compute !== undefined) { const r = await A.rpc('iv_admin_compute', { p_period: S.period }); toast(r.computed + ' laporan otomatis dihitung'); return render(); }
    if (d.sact) { if (!confirm(d.sact === 'kunci' ? 'Kunci semua laporan yang diajukan orang lain? Setelah dikunci masuk saldo investor dan tidak bisa diubah.' : 'Ajukan semua draf bulan ini untuk dikunci?')) return;
      const n = await A.rpc('iv_admin_statements_act', { p_period: S.period, p_act: d.sact, p_ids: null }); toast(n + ' laporan ' + (d.sact === 'kunci' ? 'dikunci' : 'diajukan')); return render(); }
    if (d.input) return inputPanel(d.input, d.kind);
    if (d.wact) {
      let note = null;
      if (d.wact === 'tolak') { note = prompt('Alasan menolak (terlihat investor):'); if (!note) return; }
      if (d.wact === 'dibayar') { note = prompt('Nomor referensi / berita transfer:'); if (!note) return; }
      if (d.wact === 'gagal') { note = prompt('Kenapa gagal? (terlihat investor)'); if (!note) return; }
      if (d.wact === 'setujui' && !confirm('Setujui penarikan ini?')) return;
      await A.rpc('iv_admin_withdrawal_act', { p_id: d.id, p_act: d.wact, p_note: note }); toast('Tersimpan'); return render();
    }
    if (d.newoffer !== undefined) return offerPanel(null);
    if (d.editoffer) return offerPanel(JSON.parse(d.editoffer));
  } catch (er) { toast(er.message, true); }
});
window.addEventListener('hashchange', () => { close(); render(); scrollTo(0, 0); });
const wait = setInterval(() => { const p = window.mkPerson; if (p || location.hostname === 'localhost') { clearInterval(wait); document.getElementById('me').textContent = p ? (p.nickname || p.name) + ' · ' + (p.title || p.role) : 'uji lokal'; render(); } }, 200);
</script>
</body>
</html>
