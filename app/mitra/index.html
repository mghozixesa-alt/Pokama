<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Program Mitra · Pokama</title>
<meta name="description" content="Rekomendasikan Rentalaja, dapat komisi tiap sewa selesai. Untuk hotel, villa, travel, komunitas, kampus, dan kreator.">
<meta name="theme-color" content="#077A70">
<link rel="icon" href="/img/pk.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--teal:#077A70;--teal2:#09BEAF;--mint:#E3F7F5;--navy:#1F2B4D;--ink:#1F2B4D;--mut:#4A5468;--mut2:#5B6573;--bg:#F4F6F9;--line:#E6E8EC;--line2:#F0F1F4;--red:#A12A1F;--redbg:#FCEDEB;--amb:#7A4B00;--ambbg:#FFF6E0}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 'Plus Jakarta Sans',system-ui,-apple-system,sans-serif}
a{color:var(--teal)}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative}
.hero{background:var(--teal);color:#fff;padding:16px 20px 28px;display:flex;flex-direction:column;gap:18px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo{height:26px;background:#fff;border-radius:8px;padding:4px 9px}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#BFF2EC}
h1{margin:0;font-size:26px;line-height:32px;font-weight:800}
h2{margin:0;font-size:17px;font-weight:800}
.lead{margin:0;font-size:14px;line-height:21px;color:#E3F7F5}
.cta{height:48px;border-radius:12px;background:#fff;color:var(--teal);font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center;text-decoration:none;border:0;cursor:pointer;width:100%}
main{padding:20px;display:flex;flex-direction:column;gap:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.feat{display:flex;gap:12px;align-items:flex-start}.feat .ic{width:40px;height:40px;flex:none;border-radius:12px;background:var(--mint);display:flex;align-items:center;justify-content:center;color:var(--teal)}
.feat b{font-size:15px;display:block}.feat span{font-size:13px;line-height:19px;color:var(--mut)}
.rates{display:grid;grid-template-columns:minmax(0,1fr) 60px 60px;font-size:13px}
.rates>span{padding:9px 0;border-bottom:1px solid var(--line2)}.rates>span.h{color:var(--mut);font-weight:700;border-color:var(--line)}.rates .r{text-align:right;font-weight:800}.rates .t{color:var(--teal)}
.steps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px}.steps li{display:flex;gap:12px;align-items:center;font-size:14px}.steps b{width:28px;height:28px;flex:none;border-radius:14px;background:var(--navy);color:#fff;font-size:13px;display:flex;align-items:center;justify-content:center}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700}
.inp{height:46px;border-radius:10px;border:1px solid #D5D9E0;padding:0 12px;font-weight:500;background:#fff;width:100%}
textarea.inp{height:80px;padding:10px 12px}
.inp:focus{outline:2px solid var(--teal2);border-color:var(--teal2)}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:19px;color:var(--mut)}.chk input{width:20px;height:20px;margin:0;flex:none;accent-color:var(--teal)}
.btn{height:46px;border-radius:12px;border:1px solid #D5D9E0;background:#fff;color:var(--navy);font-weight:800;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;text-decoration:none;padding:0 14px}
.btn.pri{background:var(--teal2);border-color:var(--teal2);color:var(--navy)}.btn.dark{background:var(--navy);border-color:var(--navy);color:#fff}.btn.sm{height:36px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.6;cursor:default}
.note{font-size:12px;line-height:18px;color:var(--mut2);margin:0}
.err{background:var(--redbg);color:var(--red);border-radius:10px;padding:10px 12px;font-size:13px;font-weight:700}
.ok{background:var(--mint);color:var(--teal);border-radius:10px;padding:10px 12px;font-size:13px;font-weight:700}
/* app */
.apphead{background:var(--teal);color:#fff;padding:14px 20px 70px;display:flex;flex-direction:column;gap:14px}
.apphead .who{display:flex;align-items:center;gap:10px}.apphead .who span{flex:1;font-size:13px;font-weight:700;color:#BFF2EC}
.av{width:36px;height:36px;border-radius:18px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800}
.over{margin-top:-54px}
.bal{box-shadow:0 6px 20px rgba(31,43,77,.08);border:0}
.bal .g2>div{display:flex;flex-direction:column;gap:3px}.bal .g2>div+div{border-left:1px solid var(--line);padding-left:12px}
.lbl{font-size:12px;font-weight:700;color:var(--mut)}.big{font-size:22px;font-weight:800}.small{font-size:12px;color:var(--mut2)}
.tierpill{height:26px;padding:0 10px;border-radius:13px;background:var(--ambbg);color:var(--amb);font-size:12px;font-weight:800;display:inline-flex;align-items:center}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}.bar i{display:block;height:8px;background:var(--teal2);border-radius:4px}
.hl{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--ambbg);text-decoration:none;color:var(--ink);font-size:13px;line-height:18px}
.code{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;border:1.5px dashed var(--teal2);background:#F2FCFB}
.code strong{font-size:20px;letter-spacing:.08em}.code .l{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}.code .u{font-size:12px;color:var(--mut2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.unit{display:flex;align-items:center;gap:8px;font-weight:800}.unit img{width:22px;height:22px;object-fit:contain}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.stats>div{background:var(--bg);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:2px}.stats b{font-size:18px}
.row{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line2)}.row:first-child{border-top:0}
.row .t{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}.row .t strong{font-size:14px}.row .r{display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-weight:800;font-size:14px}
.pill{font-size:11px;font-weight:800;padding:3px 8px;border-radius:10px;white-space:nowrap}
.list{padding:4px 16px;gap:0}
.sechead{display:flex;justify-content:space-between;padding:12px 0 6px;font-size:12px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
.tabs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));background:#E9ECF1;border-radius:12px;padding:4px}.tabs button{height:38px;border:0;border-radius:9px;background:transparent;font-weight:700;color:var(--mut);cursor:pointer}.tabs button[aria-selected="true"]{background:#fff;color:var(--navy);font-weight:800;box-shadow:0 1px 3px rgba(31,43,77,.1)}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chips button{height:34px;padding:0 14px;border-radius:17px;border:1px solid #D5D9E0;background:#fff;font-weight:700;font-size:13px;color:var(--mut);cursor:pointer}.chips button[aria-pressed="true"]{border:1.5px solid var(--navy);color:var(--navy);font-weight:800}
.dark{background:var(--navy);color:#fff;border:0}.dark .lbl,.dark .small{color:#C9D1E2}
.ladder{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.ladder>div{border-radius:10px;padding:8px;background:var(--bg);font-size:12px;font-weight:700;color:var(--mut);text-align:center}.ladder>div.on{background:var(--ambbg);color:var(--amb)}
.ch{display:flex;flex-direction:column;gap:6px;padding:12px 0;border-top:1px solid var(--line2)}.ch:first-of-type{border-top:0}
.board .row{padding:9px 0}.board .rk{width:28px;height:28px;border-radius:14px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px}.board .me{background:#F2FCFB;border-radius:10px;padding-left:6px;padding-right:6px}
.badges{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.badge{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;font-size:11px;font-weight:700;color:var(--mut)}.badge i{width:48px;height:48px;border-radius:24px;background:var(--ambbg);color:var(--amb);display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:800;font-size:14px}.badge.off i{background:var(--bg);color:#A9B1BE}.badge.off{color:#A9B1BE}
nav.bottom{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:480px;height:68px;background:#fff;border-top:1px solid #E8EBEF;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));align-items:center;padding-bottom:env(safe-area-inset-bottom);z-index:20}
nav.bottom a{text-decoration:none;color:var(--mut2);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700}nav.bottom a span{width:48px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:15px}
nav.bottom a[aria-current="page"]{color:var(--teal);font-weight:800}nav.bottom a[aria-current="page"] span{background:var(--mint)}
.pad{padding-bottom:90px}
.plain{background:#fff;border-bottom:1px solid #E8EBEF;padding:12px 16px;display:flex;align-items:center;gap:8px}.plain h1{font-size:18px;line-height:24px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;background:var(--navy);color:#fff;padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;z-index:50;max-width:90vw}.toast.err{background:var(--red)}
.empty{font-size:13px;color:var(--mut2);padding:12px 0}
.loading{min-height:60vh;display:flex;align-items:center;justify-content:center;color:var(--mut2)}
.otp{letter-spacing:.4em;font-size:24px;text-align:center;font-weight:800}
.demo{background:#FFF6E0;color:#7A4B00;font-size:12px;font-weight:800;text-align:center;padding:6px}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px}.sw input{width:44px;height:26px;accent-color:var(--teal)}
@media (min-width:520px){.wrap{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="loading">Memuat…</div></div>
<script type="module">
import { SB_URL, SB_KEY, makeSession, api, esc, rp, pct, tgl, bulan, KIND, chip, toast, waLink, qrPdf } from '/mitra/af.js';

const sess = makeSession('pokama.mitra');
const A = api(sess);
const app = document.getElementById('app');
const IC = {
  home: '<path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/>', money: '<path d="M12 3v18M17 7H9.5a3 3 0 0 0 0 6h5a3 3 0 0 1 0 6H6"/>',
  cup: '<path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0zM7 6H4a3 3 0 0 0 3 4M17 6h3a3 3 0 0 1-3 4"/>', user: '<circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/>',
  truck: '<path d="M3 7h11v9H3zM14 10h4l3 3v3h-7"/><circle cx="7" cy="18" r="1.6"/><circle cx="17" cy="18" r="1.6"/>', cal: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/>',
  wa: '<path d="M4 20l1.5-4.5A8 8 0 1 1 9 19z"/>', qr: '<rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><path d="M14 14h3v3M21 14v7h-7"/>',
  back: '<path d="M15 6l-6 6 6 6"/>', next: '<path d="M9 6l6 6-6 6"/>', bank: '<path d="M3 10l9-6 9 6M5 10v8M19 10v8M9 10v8M15 10v8M3 20h18"/>',
};
const svg = (k, n = 22, c = 'currentColor') => `<svg width="${n}" height="${n}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[k]}</svg>`;
let ME = null, VIEW = 'beranda', KF = 'semua', KT = 'komisi';

/* ---------- halaman depan & daftar ---------- */
const GBTN = `<svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.1-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>`;
function google() { try { localStorage.setItem('pokama.mitra.go', String(Date.now())); } catch (e) {} location.href = SB_URL + '/auth/v1/authorize?provider=google&prompt=select_account&redirect_to=' + encodeURIComponent(location.origin + '/mitra/'); }
async function landing(note) {
  let rates = [];
  try { rates = await A.rpc('af_public_rates', {}, true) || []; } catch (e) {}
  const rows = rates.map(r => `<span>${esc(r.label)}</span><span class="r">${pct(r.pct)}</span><span class="r t">${pct(+r.pct + 3)}</span>`).join('');
  app.innerHTML = `
  <header class="hero">
    <div class="topbar"><img class="logo" src="/img/pokama-logo.png" alt="Pokama"><button data-google style="background:none;border:0;color:#fff;font-weight:800;font-size:14px;cursor:pointer">Masuk</button></div>
    <div style="display:flex;flex-direction:column;gap:8px"><span class="eyebrow">Program Mitra · Rentalaja</span>
      <h1>Rekomendasikan Rentalaja, dapat komisi tiap sewa selesai</h1>
      <p class="lead">Untuk hotel, villa, homestay, travel, komunitas, organisasi kampus, dan kreator di Garut, Bandung, dan Ciputat.</p></div>
    <button class="cta" data-google>${GBTN}&nbsp; Daftar dengan Google, gratis</button>
  </header>
  <main>
    ${note ? `<div class="ok">${esc(note)}</div>` : ''}
    <section class="card"><h2>Yang Anda dapat</h2>
      <div class="feat"><span class="ic">${svg('money')}</span><div><b>Komisi ${rates.length ? pct(Math.min(...rates.map(r => +r.pct))) + '–' + pct(Math.max(...rates.map(r => +r.pct)) + 3) : '5–10%'}</b><span>Dari nilai sewa, naik otomatis sesuai jumlah booking Anda.</span></div></div>
      <div class="feat"><span class="ic">${svg('truck')}</span><div><b>Unit diantar ke tempat Anda</b><span>Tamu tidak perlu ke toko. Anda tidak perlu menyimpan barang.</span></div></div>
      <div class="feat"><span class="ic">${svg('cal')}</span><div><b>Cair tiap bulan</b><span>Ditransfer paling lambat tanggal 10, minimal Rp50.000.</span></div></div>
    </section>
    <section class="card"><h2>Besaran komisi</h2>
      <div class="rates"><span class="h">Kategori</span><span class="h r">Awal</span><span class="h r">Utama</span>${rows}</div>
      <p class="note">Dihitung dari harga setelah diskon, tanpa ongkir, deposit, dan denda. Sah setelah unit kembali, tamu check-out, atau trip selesai. Pelanggan yang pernah sewa: setengah komisi.</p>
    </section>
    <section class="card"><h2>Cara kerjanya</h2><ol class="steps"><li><b>1</b>Daftar dengan akun Google, lalu verifikasi nomor WhatsApp</li><li><b>2</b>Setelah disetujui, tempel QR atau bagikan link dan kode Anda</li><li><b>3</b>Tamu booking, sewa selesai, komisi cair awal bulan berikutnya</li></ol>
      <button class="btn pri" data-google style="height:50px">${GBTN} Daftar / masuk dengan Google</button></section>
    ${terms()}
  </main>`;
  if (location.hash === '#syarat') setTimeout(() => document.querySelector('#syarat')?.scrollIntoView(), 50);
}
function terms() {
  return `<section class="card" id="syarat"><h2>Syarat program mitra</h2><ul class="note" style="padding-left:18px;margin:0;display:flex;flex-direction:column;gap:6px;font-size:13px">
  <li>Komisi dihitung dari nilai sewa bersih (tanpa ongkir, deposit, denda, biaya tambahan) dan sah setelah sewa selesai tanpa denda atau keluhan.</li>
  <li>Booking batal, ditolak verifikasi, refund, atau pemesan masuk daftar hitam tidak berkomisi. Booking lewat OTA tidak berkomisi.</li>
  <li>Kode tidak boleh dipakai untuk sewa sendiri. NIK atau nomor HP pemesan yang sama dengan mitra = komisi nol dan dicek.</li>
  <li>Staf grup Pokama tidak boleh menjadi mitra.</li>
  <li>Dilarang memasang iklan berbayar dengan kata kunci nama brand, atau memakai nama brand sebagai nama akun.</li>
  <li>Pelanggaran pertama: komisi bulan itu hangus. Pelanggaran kedua: keluar dari program.</li>
  <li>Pencairan tiap tanggal 1–10 untuk komisi yang siap cair bulan sebelumnya, minimal Rp50.000. Potongan pajak mengikuti aturan yang berlaku.</li></ul></section>`;
}

/* ---------- daftar (setelah masuk Google) & kode WhatsApp ---------- */
function plain(title, inner) { return `<header class="plain"><img src="/img/pokama-logo.png" alt="Pokama" style="height:24px"><h1 style="margin-left:6px">${title}</h1></header><main>${inner}</main>`; }
function register(msg) {
  const s = sess.load() || {}; const em = s.email || '';
  app.innerHTML = plain('Daftar jadi mitra', `<form class="card" id="daftar" novalidate>
      ${msg ? `<div class="err">${esc(msg)}</div>` : ''}
      <p class="note" style="font-size:14px">Masuk sebagai <b>${esc(em)}</b>. Lengkapi data di bawah, lalu verifikasi nomor WhatsApp.</p>
      <label class="f">Nama lengkap<input class="inp" name="name" placeholder="Sesuai KTP" autocomplete="name" value="${esc(s.full_name || '')}" required></label>
      <label class="f">Nama usaha atau organisasi<input class="inp" name="org" placeholder="Contoh: nama villa, himpunan, komunitas"></label>
      <div class="g2"><label class="f">Jenis mitra<select class="inp" name="kind">${Object.entries(KIND).map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}</select></label>
        <label class="f">Kota<select class="inp" name="city"><option>Garut</option><option>Bandung</option><option>Ciputat</option></select></label></div>
      <label class="f">Nomor WhatsApp<input class="inp" name="wa" type="tel" inputmode="tel" placeholder="08xx" autocomplete="tel" required></label>
      <label class="chk"><input type="checkbox" name="agree"><span>Saya setuju dengan <a href="#syarat">syarat program mitra</a>, termasuk larangan memakai kode untuk sewa sendiri.</span></label>
      <div id="ferr"></div>
      <button class="btn pri" style="height:50px;font-size:16px" type="submit">Daftar & kirim kode WhatsApp</button>
      <button class="btn" type="button" data-out>Pakai akun Google lain</button></form>${terms()}`);
  const f = app.querySelector('#daftar');
  f.onsubmit = async (e) => {
    e.preventDefault(); const d = Object.fromEntries(new FormData(f)); d.agree = !!f.agree.checked;
    const b = f.querySelector('button[type=submit]'); b.disabled = true; b.textContent = 'Mengirim…';
    try { await A.rpc('af_register', { p: d }); await otp('login'); }
    catch (er) { f.querySelector('#ferr').innerHTML = `<div class="err">${esc(er.message)}</div>`; b.disabled = false; b.textContent = 'Daftar & kirim kode WhatsApp'; }
  };
}
async function otp(purpose, info) {
  let sent = null, err = null;
  try { sent = await A.rpc('af_otp_send', { p_purpose: purpose }); } catch (er) { err = er.message; }
  const title = purpose === 'bank' ? 'Konfirmasi ganti rekening' : 'Verifikasi WhatsApp';
  app.innerHTML = plain(title, `<form class="card" id="fo" novalidate>
    <p class="note" style="font-size:14px">${purpose === 'bank' ? 'Demi keamanan, perubahan rekening harus dikonfirmasi dengan kode yang dikirim ke WhatsApp terdaftar. Setelah dikonfirmasi, rekening baru dipakai 3 hari kemudian.' : 'Kami kirim kode 6 angka ke WhatsApp terdaftar. Verifikasi dibutuhkan saat masuk dari perangkat baru, berlaku 30 hari.'}</p>
    ${sent ? `<div class="ok">Kode dikirim ke ${esc(sent.wa_masked)}.</div>` : ''}${err ? `<div class="err">${esc(err)}</div>` : ''}${info ? `<div class="ok">${esc(info)}</div>` : ''}
    <label class="f">Kode dari WhatsApp<input class="inp otp" name="otp" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required></label>
    <div id="eo"></div><button class="btn pri" type="submit">Verifikasi</button>
    <button class="btn" type="button" id="again">Kirim ulang kode</button>
    <button class="btn" type="button" data-out>Keluar</button></form>`);
  const f = app.querySelector('#fo'); f.otp.focus();
  app.querySelector('#again').onclick = () => otp(purpose);
  f.onsubmit = async (e) => {
    e.preventDefault(); const b = f.querySelector('button[type=submit]'); b.disabled = true; b.textContent = 'Memeriksa…';
    try {
      const r = await A.rpc('af_otp_verify', { p_purpose: purpose, p_code: f.otp.value });
      if (!r.ok) { f.querySelector('#eo').innerHTML = `<div class="err">${esc(r.error)}</div>`; b.disabled = false; b.textContent = 'Verifikasi'; return; }
      if (purpose === 'bank') { toast('Rekening baru dikonfirmasi, dipakai 3 hari lagi'); location.hash = '#akun'; }
      boot();
    } catch (er) { f.querySelector('#eo').innerHTML = `<div class="err">${esc(er.message)}</div>`; b.disabled = false; b.textContent = 'Verifikasi'; }
  };
}

/* ---------- render ---------- */
function render() {
  VIEW = (location.hash || '#beranda').slice(1) || 'beranda';
  if (!['beranda', 'komisi', 'tantangan', 'akun'].includes(VIEW)) VIEW = 'beranda';
  const V = { beranda: vBeranda, komisi: vKomisi, tantangan: vTantangan, akun: vAkun };
  app.innerHTML = (ME.partner.demo ? '<div class="demo">DATA DEMO · bukan transaksi sungguhan</div>' : '') + '<div class="pad">' + V[VIEW]() + '</div>' + nav();
  const fa = app.querySelector('#fa');
  if (fa) fa.onsubmit = async (e) => {
    e.preventDefault(); const d = Object.fromEntries(new FormData(fa)); d.guest_discount = fa.guest_discount.checked;
    const b = fa.querySelector('button[type=submit]'); b.disabled = true;
    if (!d.bank_acct) { delete d.bank_name; delete d.bank_holder; }
    try { const r = await A.rpc('af_me_update', { p: d }); if (r && r.bank_pending) { ME = null; await otp('bank'); return; } toast('Tersimpan'); await refresh(); } catch (er) { fa.querySelector('#ea').innerHTML = `<div class="err">${esc(er.message)}</div>`; b.disabled = false; }
  };
  const out = app.querySelector('#out'); if (out) out.onclick = logout;
  const bo = app.querySelector('[data-bankotp]'); if (bo) bo.onclick = (e) => { e.preventDefault(); otp('bank'); };
}
app.addEventListener('click', async (e) => {
  const t = e.target.closest('[data-copy],[data-qr],[data-kf],[data-kt],[data-proof]'); if (!t) return;
  if (t.dataset.copy) { try { await navigator.clipboard.writeText(t.dataset.copy); toast('Link tersalin'); } catch (er) { prompt('Salin link ini', t.dataset.copy); } }
  if (t.dataset.qr) {
    const u = ME.units.find(x => x.code === t.dataset.qr); t.disabled = true; t.textContent = 'Menyiapkan…';
    try { await qrPdf({ code: ME.partner.code, link: u.link, org: pname(), unit: u.name, products: u.rates.map(r => r.label), discount: ME.partner.guest_discount ? ME.rules.guest_discount_pct : 0 }); toast('QR A6 terunduh'); }
    catch (er) { toast(er.message, true); }
    render();
  }
  if (t.dataset.kf) { KF = t.dataset.kf; render(); }
  if (t.dataset.kt) { KT = t.dataset.kt; render(); }
  if (t.dataset.proof) { e.preventDefault(); try { await A.openFile(t.dataset.proof); } catch (er) { toast(er.message, true); } }
});
window.addEventListener('hashchange', () => {
  if (ME) { render(); scrollTo(0, 0); return; }
  if (location.hash.includes('access_token=')) { boot(); return; }
  if (location.hash === '#syarat') document.querySelector('#syarat')?.scrollIntoView();
});
async function refresh() { ME = await A.rpc('af_me'); render(); }

function logout() { try { fetch(SB_URL + '/auth/v1/logout', { method: 'POST', headers: { apikey: SB_KEY, Authorization: 'Bearer ' + (sess.load() || {}).access_token } }); } catch (e) {} sess.save(null); ME = null; history.replaceState(null, '', location.pathname); landing(); }
// sesi mitra berakhir otomatis setelah 7 hari tidak dipakai
const IDLE = 7 * 864e5, act = () => { try { localStorage.setItem('pokama.mitra.active', String(Date.now())); } catch (e) {} };
function idle() { let t = 0; try { t = +localStorage.getItem('pokama.mitra.active') || 0; } catch (e) {} return t && Date.now() - t > IDLE; }
['click', 'keydown', 'touchstart'].forEach(ev => document.addEventListener(ev, act, { passive: true }));
document.addEventListener('click', (e) => { if (e.target.closest('[data-google]')) google(); if (e.target.closest('[data-out]')) logout(); if (e.target.closest('[data-switch]')) { logout(); google(); } });

async function boot() {
  if (location.hash.includes('access_token=')) {
    try { localStorage.removeItem('pokama.mitra.go'); } catch (e) {}
    const p = new URLSearchParams(location.hash.slice(1));
    let full = ''; try { full = JSON.parse(atob(p.get('access_token').split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))).user_metadata?.full_name || ''; } catch (e) {}
    const em = (() => { try { return JSON.parse(atob(p.get('access_token').split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))).email; } catch (e) { return ''; } })();
    sess.save({ access_token: p.get('access_token'), refresh_token: p.get('refresh_token'), expires_in: +p.get('expires_in') || 3600, email: em });
    try { const s = sess.load(); s.full_name = full; localStorage.setItem('pokama.mitra', JSON.stringify(s)); } catch (e) {}
    act(); history.replaceState(null, '', location.pathname + '#beranda');
  }
  if (sess.load() && idle()) { logout(); return; }
  const t = await sess.token();
  if (!t) { ME = null; landing(); return; }
  act();
  try {
    const l = await A.rpc('af_link_me');
    if (l.need_google) { sess.save(null); landing('Portal mitra hanya bisa dibuka dengan tombol Masuk dengan Google.'); return; }
    if (!l.found && l.staff) {
      app.innerHTML = `<header class="hero"><div class="topbar"><img class="logo" src="/img/pokama-logo.png" alt="Pokama"></div><h1>Ini akun staf Pokama</h1><p class="lead">${esc(l.email || 'Akun ini')} terdaftar sebagai staf, jadi tidak bisa membuka portal mitra. Untuk masuk sebagai mitra, pilih akun Google mitra.</p></header><main><button class="btn pri" data-switch style="height:50px">${GBTN} Pilih akun Google lain</button><a class="btn" href="/mitra/admin">Buka panel admin mitra</a></main>`; return;
    }
    if (!l.found) { register(); return; }
    if (l.status === 'ditolak' || l.status === 'nonaktif') {
      const M = { ditolak: ['Pendaftaran belum bisa diterima', l.reason || 'Hubungi tim kami untuk informasi.'], nonaktif: ['Akun mitra nonaktif', l.reason || 'Hubungi tim kami untuk informasi.'] }[l.status];
      app.innerHTML = `<header class="hero"><div class="topbar"><img class="logo" src="/img/pokama-logo.png" alt="Pokama"></div><h1>${esc(M[0])}</h1><p class="lead">${esc(M[1])}</p></header><main><button class="btn" data-out>Keluar</button></main>`; return;
    }
    if (!l.verified) { await otp('login'); return; }
    if (l.status === 'menunggu') {
      app.innerHTML = `<header class="hero"><div class="topbar"><img class="logo" src="/img/pokama-logo.png" alt="Pokama"></div><h1>Pendaftaran sedang dicek</h1><p class="lead">Nomor WhatsApp Anda sudah terverifikasi. Tim kami mengecek data dan menghubungi Anda. Setelah disetujui, kode, link, dan QR muncul di sini.</p></header><main><button class="btn" data-out>Keluar</button></main>`; return;
    }
    if (!location.hash || location.hash === '#masuk') history.replaceState(null, '', '#beranda');
    await refresh();
  } catch (er) {
    if (er.status === 401) { logout(); return; }
    app.innerHTML = `<main><div class="err">${esc(er.message)}</div><button class="btn" onclick="location.reload()">Coba lagi</button><button class="btn" data-out>Keluar</button></main>`;
  }
}
boot();
</script>

</html>
