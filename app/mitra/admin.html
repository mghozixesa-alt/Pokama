<!doctype html>
<html lang="id" data-gate-title="Mitra affiliate">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mitra affiliate · Pokama</title>
<link rel="icon" href="/img/pk.png">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/marketing/gate.css">
<script src="/marketing/gate.js"></script>
<style>
:root{--navy:#1D3149;--teal:#09BEAF;--teal-d:#067A70;--mint:#DDF5F2;--bg:#F3F5F8;--line:#E3E6EB;--line2:#EEF0F3;--ink:#1F2933;--mut:#5B6573;--red:#9A3F0A;--redbg:#FCEBDD;--yel:#7A5200;--yelbg:#FDF3D7;--blue:#1E5AA8;--bluebg:#E5EEF9}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Nunito,system-ui,-apple-system,sans-serif}
a{color:var(--teal-d)}
button,input,select,textarea{font:inherit;color:inherit}
#dc-root{display:flex;min-height:100vh}
.side{width:236px;flex:none;background:#fff;border-right:1px solid var(--line);padding:20px 12px;display:flex;flex-direction:column;gap:14px;position:sticky;top:0;height:100vh;overflow-y:auto}
.side img{width:112px;margin:0 10px}
.side .grp{display:flex;flex-direction:column;gap:2px}.side .grp>span{font-size:10.5px;font-weight:800;letter-spacing:.1em;color:#8A94A3;padding:0 10px 4px}
.side a{display:flex;align-items:center;gap:10px;min-height:36px;padding:0 10px;border-radius:9px;text-decoration:none;font-weight:600;color:#3B4250;font-size:13.5px}
.side a[aria-current="page"]{font-weight:800;color:var(--navy);background:#EAF8F6;box-shadow:inset 3px 0 0 var(--teal)}
.side a .nb{margin-left:auto}.side a[aria-current="page"] svg{color:#067A70 !important}.side a:hover svg{color:#3B4250 !important}
.side .foot{margin-top:auto;border-top:1px solid var(--line);padding:12px 10px 0;font-size:12px;color:var(--mut)}
main{flex:1;min-width:0;padding:26px 32px 60px;display:flex;flex-direction:column;gap:18px}
h1{margin:0;font-size:25px;font-weight:900;color:var(--navy)}h2{margin:0;font-size:17px;font-weight:900;color:var(--navy)}
.ph{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:flex-end}.ph .sub{font-size:13.5px;color:var(--mut)}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sel,.inp{height:38px;border:1px solid #D3D7DE;border-radius:10px;padding:0 10px;background:#fff;font-weight:700}
.inp{font-weight:600}textarea.inp{height:70px;padding:8px 10px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.tile{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 16px;display:flex;flex-direction:column;gap:2px;border-top:4px solid var(--teal)}
.tile span{font-size:12px;color:var(--mut);font-weight:700}.tile b{font-size:24px;font-weight:900;color:var(--navy)}.tile small{color:var(--mut);font-weight:700;font-size:12px}
.tile.warn{border-top-color:#F2A33A}.tile.bad{border-top-color:#C2410C}.tile.bad small{color:var(--red)}
.cols{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:18px;align-items:start}
.tbl{width:100%;border-collapse:collapse}.tbl th{text-align:left;font-size:12px;color:var(--mut);font-weight:800;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line2);vertical-align:middle}.tbl .r{text-align:right}.tbl tr.click{cursor:pointer}.tbl tr.click:hover td{background:#FAFBFC}
.scroll{overflow-x:auto}
.btn{height:38px;padding:0 14px;border-radius:10px;border:1px solid #C9D1DB;background:#fff;color:var(--navy);font-weight:800;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none;white-space:nowrap}
.btn.pri{background:var(--teal);border-color:var(--teal)}.btn.sm{height:32px;padding:0 10px;font-size:12.5px}.btn.warn{color:var(--red);border-color:#E9B999}.btn:disabled{opacity:.55;cursor:default}
.pill{display:inline-flex;align-items:center;font-size:11.5px;font-weight:800;padding:2px 8px;border-radius:999px;background:#EEF0F3;color:#3B4250;white-space:nowrap}
.pill.g{background:var(--mint);color:var(--teal-d)}.pill.y{background:var(--yelbg);color:var(--yel)}.pill.r{background:var(--redbg);color:var(--red)}.pill.b{background:var(--bluebg);color:var(--blue)}
.nb{min-width:20px;height:20px;border-radius:10px;background:#C2410C;color:#fff;font-size:11px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;padding:0 6px}
.list{display:flex;flex-direction:column}.li{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line2)}.li:first-child{border-top:0}.li .t{flex:1;min-width:0;display:flex;flex-direction:column}.li .t span{font-size:12.5px;color:var(--mut)}
.alert{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:#FFFBF8;border:1px solid #E9B999}.alert b{color:var(--red)}
.ok{background:var(--mint);color:var(--teal-d);border-radius:10px;padding:10px 12px;font-weight:700}
.muted{color:var(--mut)}.small{font-size:12.5px}
.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:800;color:#3B4250}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.demo{background:#FFF6E0;color:#7A4B00;border:1px solid #F2D58A;border-radius:10px;padding:8px 12px;font-weight:800;font-size:13px}
.scrim{position:fixed;inset:0;background:rgba(29,49,73,.45);z-index:60;display:flex;justify-content:flex-end}
.panel{background:#fff;width:min(560px,100%);height:100%;overflow:auto;padding:22px;display:flex;flex-direction:column;gap:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;background:var(--navy);color:#fff;padding:10px 16px;border-radius:12px;font-weight:800;z-index:90}.toast.err{background:#9A3F0A}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.kv>div{background:var(--bg);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column}.kv span{font-size:11px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
code,pre{font-family:ui-monospace,Menlo,monospace;font-size:12.5px}pre{background:#0F1B2B;color:#D7E3F1;padding:12px;border-radius:10px;overflow:auto;white-space:pre-wrap;margin:0}
.mbar{display:none}
@media (max-width:900px){
  .side{position:fixed;left:0;top:0;bottom:0;z-index:70;transform:translateX(-102%);transition:transform .2s;width:260px}
  body.nav-open .side{transform:none;box-shadow:0 0 40px rgba(29,49,73,.25)}
  .mbar{display:flex;position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--line);height:52px;align-items:center;gap:10px;padding:0 12px}
  .mbar img{width:80px}.mbar b{flex:1;text-align:right;font-weight:900;color:var(--navy)}
  #dc-root{flex-direction:column}
  main{padding:14px 12px 50px}
  .cols,.g3{grid-template-columns:minmax(0,1fr)}
  .cols>*{min-width:0}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .li{flex-wrap:wrap}.li .t{flex:1 1 100%}
  .tile b{font-size:19px;overflow-wrap:anywhere}
  .g2{grid-template-columns:minmax(0,1fr)}
  .card{padding:14px}
  .filters .sel{flex:1 1 140px;min-width:0}
  .inp{max-width:100%}
  pre{font-size:11px}
  main{max-width:100vw}
  .ph>div{min-width:0}
}
</style>
</head>
<body>
<div id="dc-root">
  <div class="mbar"><button class="btn sm" data-menu aria-label="Buka menu">☰</button><img src="/img/pokama-logo.png" alt="Pokama"><b id="mt">Mitra affiliate</b></div>
  <aside class="side" aria-label="Menu mitra affiliate">
    <img src="/img/pokama-logo.png" alt="Pokama">
    <div class="grp"><span>MITRA AFFILIATE</span>
      <a href="#ringkasan"><svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none;color:#8A94A3"><path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/></svg><span style="flex:1">Ringkasan</span></a><a href="#pendaftar"><svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none;color:#8A94A3"><path d="M9 8a3.5 3.5 0 1 0 0 .01M2.5 20a6.5 6.5 0 0 1 13 0M19 8v6M16 11h6"/></svg><span style="flex:1">Pendaftar </span><b class="nb" data-nb="menunggu" hidden></b></a><a href="#mitra"><svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none;color:#8A94A3"><path d="M9 4.5a3.5 3.5 0 1 1 0 7a3.5 3.5 0 1 1 0-7zM2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6.5 6.5 0 0 1 3.5 6"/></svg><span style="flex:1">Daftar mitra</span></a><a href="#tantangan"><svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none;color:#8A94A3"><path d="M8 21h8M12 17v4M7 4h10v4a5 5 0 0 1-10 0zM17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg><span style="flex:1">Tantangan & juara</span></a><a href="#wa"><svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none;color:#8A94A3"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg><span style="flex:1">Kirim WA </span><b class="nb" data-nb="notifs" hidden></b></a><a href="#email"><svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none;color:#8A94A3"><path d="M3 6h18v12H3zM3 7l9 6 9-6"/></svg><span style="flex:1">Email & campaign</span></a><a href="#laporan"><svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none;color:#8A94A3"><path d="M6 3h9l4 4v14H6zM14 3v5h5M9 13h7M9 17h5"/></svg><span style="flex:1">Laporan</span></a></div>
    <div class="grp"><span>KEUANGAN</span><a href="#cair"><svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none;color:#8A94A3"><path d="M3 6h18v13H3zM3 10h18M16 14h2"/></svg><span style="flex:1">Pencairan</span></a></div>
    <div class="grp"><span>LAINNYA</span><a href="#atur"><svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none;color:#8A94A3"><path d="M4 7h10M18 7h2M4 17h4M12 17h8M16 5a2 2 0 1 1 0 4a2 2 0 1 1 0-4zM10 15a2 2 0 1 1 0 4a2 2 0 1 1 0-4z"/></svg><span style="flex:1">Pengaturan & API</span></a><a href="/marketing/"><svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none;color:#8A94A3"><path d="M3 11v2a1 1 0 0 0 1 1h3l5 4V6L7 10H4a1 1 0 0 0-1 1zM16 8a5 5 0 0 1 0 8M19 5a9 9 0 0 1 0 14"/></svg><span style="flex:1">Modul Marketing</span></a><a href="https://mitra.pokama.org" target="_blank" rel="noopener"><svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none;color:#8A94A3"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg><span style="flex:1">Portal mitra ↗</span></a></div>
    <div class="foot" id="me">…</div>
  </aside>
  <main id="app"><p class="muted">Memuat…</p></main>
</div>
<script type="module">
import { makeSession, api, esc, rp, rpk, pct, tgl, bulan, monthKey, KIND, chip, toast, waLink } from '/mitra/af.js';
const A = api(makeSession('pokama.session'));
const app = document.getElementById('app');
const S = { demo: localStorage.getItem('af.demo') === '1', month: monthKey(), city: '', unit: '', kind: '', pstatus: '', period: '', rby: 'unit' };
let MISC = null, cur = null;
const PAGES = { ringkasan: 'Ringkasan', pendaftar: 'Pendaftar', mitra: 'Daftar mitra', tantangan: 'Tantangan & juara', wa: 'Kirim WA', email: 'Email & campaign', laporan: 'Laporan', cair: 'Pencairan', atur: 'Pengaturan & API' };
const months = () => { const o = []; const d = new Date(); d.setDate(1); for (let i = 0; i < 12; i++) { o.push(monthKey(d)); d.setMonth(d.getMonth() - 1); } return o; };
const unitName = (c) => (MISC.units.find(u => u.code === c) || {}).name || c;
const catLabel = (u, c) => ((MISC.units.find(x => x.code === u) || { rates: [] }).rates.find(r => r.cat === c) || {}).label || c || 'semua produk';
const view = () => { const v = (location.hash || '#ringkasan').slice(1); return PAGES[v] ? v : 'ringkasan'; };

function filters(withMonth = true, extra = '') {
  return `<div class="filters">${withMonth ? `<select class="sel" data-f="month" aria-label="Bulan">${months().map(m => `<option value="${m}"${m === S.month ? ' selected' : ''}>${bulan(m)}</option>`).join('')}</select>` : ''}
    <select class="sel" data-f="city" aria-label="Kota"><option value="">Semua kota</option>${['Garut', 'Bandung', 'Ciputat'].map(c => `<option${c === S.city ? ' selected' : ''}>${c}</option>`).join('')}</select>
    <select class="sel" data-f="unit" aria-label="Unit"><option value="">Semua unit</option>${MISC.units.map(u => `<option value="${u.code}"${u.code === S.unit ? ' selected' : ''}>${esc(u.name)}</option>`).join('')}</select>
    <select class="sel" data-f="kind" aria-label="Jenis mitra"><option value="">Semua jenis</option>${Object.entries(KIND).map(([k, v]) => `<option value="${k}"${k === S.kind ? ' selected' : ''}>${v}</option>`).join('')}</select>
    ${extra}<label class="pill ${S.demo ? 'y' : ''}" style="height:38px;padding:0 12px;cursor:pointer;gap:6px"><input type="checkbox" data-demo ${S.demo ? 'checked' : ''}>Data demo</label></div>`;
}
const header = (title, sub, right = '') => `${S.demo ? '<div class="demo">Menampilkan DATA DEMO · tidak ada transfer sungguhan</div>' : ''}<div class="ph"><div><h1>${title}</h1><div class="sub">${sub}</div></div>${right}</div>`;
const tile = (l, v, s, cls = '') => `<div class="tile ${cls}"><span>${l}</span><b>${v}</b><small>${s}</small></div>`;
const pstat = (s) => `<span class="pill ${{ aktif: 'g', menunggu: 'y', ditolak: 'r', nonaktif: 'r' }[s] || ''}">${esc(s)}</span>`;

/* ---------- Ringkasan ---------- */
async function vRingkasan() {
  const F = { p_month: S.month, p_city: S.city || null, p_unit: S.unit || null, p_kind: S.kind || null, p_demo: S.demo };
  const [O, I] = await Promise.all([A.rpc('af_admin_overview', F), A.rpc('af_admin_insight', F).catch(() => null)]);
  const cap = +O.cost_cap, cost = O.cost_pct, over = cost != null && cost > cap, rwOver = +O.reward_used > +O.reward_budget;
  let h = header('Mitra affiliate', 'Semua unit, satu data mitra. Angka dari booking yang dikirim aplikasi unit.', filters());
  h += `<div class="tiles">${tile('Mitra aktif', O.partners.aktif, O.partners.produktif + ' ada booking selesai · target 15')}
    ${tile('Booking dari mitra', O.booking, O.selesai + ' selesai bulan ini')}
    ${tile('Pendapatan dibawa', rpk(O.revenue), 'booking selesai berkomisi')}
    ${tile('Biaya komisi + hadiah', pct(cost), 'batas ' + cap + '% · komisi ' + pct(O.commission_pct), over ? 'bad' : '')}
    ${tile('Anggaran hadiah', rpk(O.reward_used) + ' / ' + rpk(O.reward_budget), O.reward_budget_pct + '% pendapatan affiliate', rwOver ? 'bad' : '')}
    ${tile('Menunggu dicek', O.partners.menunggu, 'pendaftar baru', O.partners.menunggu ? 'warn' : '')}</div>`;
  const att = [];
  if (O.frozen.length) att.push(`<div class="alert"><span><b>${O.frozen.length} komisi dibekukan</b>: ${esc(O.frozen.slice(0, 3).map(f => f.partner + ' (' + f.reason + ')').join('; '))}. Dicek Keuangan di menu Pencairan.</span></div>`);
  if (O.idle.length) att.push(`<div class="alert"><span><b>${O.idle.length} mitra tanpa booking 30 hari</b>: ${esc(O.idle.slice(0, 4).map(i => i.name).join(', '))}. Kunjungi ulang atau kirim materi baru.</span></div>`);
  if (over) att.push(`<div class="alert"><span><b>Biaya ${pct(cost)} melewati batas ${cap}%</b>. Tinjau tarif khusus dan nominal hadiah.</span></div>`);
  if (rwOver) att.push(`<div class="alert"><span><b>Hadiah melewati anggaran</b> (${rp(O.reward_used)} dari ${rp(O.reward_budget)}). Keuangan bisa menolak hadiah di menu Pencairan.</span></div>`);
  if (O.notifs) att.push(`<div class="alert" style="border-color:var(--line);background:#fff"><span><b style="color:var(--navy)">${O.notifs} pesan WA</b> menunggu dikirim ke mitra. <a href="#wa">Buka Kirim WA</a></span></div>`);
  const units = `<table class="tbl"><thead><tr><th>Unit</th><th class="r">Booking</th><th class="r">Pendapatan</th><th class="r">Komisi</th><th class="r">%</th></tr></thead><tbody>${O.per_unit.map(u => `<tr><td><b>${esc(u.name)}</b></td><td class="r">${u.booking}</td><td class="r">${rp(u.revenue)}</td><td class="r">${rp(u.commission)}</td><td class="r">${u.revenue ? pct(u.commission / u.revenue * 100) : '—'}</td></tr>`).join('')}</tbody></table>`;
  const cats = O.per_cat.length ? `<table class="tbl"><thead><tr><th>Produk</th><th class="r">Selesai</th><th class="r">Pendapatan</th><th class="r">Komisi</th></tr></thead><tbody>${O.per_cat.map(c => `<tr><td>${esc(unitName(c.unit))} · ${esc(catLabel(c.unit, c.cat))}</td><td class="r">${c.n}</td><td class="r">${rp(c.revenue)}</td><td class="r">${rp(c.commission)}</td></tr>`).join('')}</tbody></table>` : '<p class="muted">Belum ada booking selesai.</p>';
  const top = O.top.length ? `<table class="tbl"><thead><tr><th>Mitra</th><th class="r">Booking</th><th class="r">Selesai</th><th class="r">Komisi</th></tr></thead><tbody>${O.top.slice(0, 10).map(t => `<tr class="click" data-pid="${t.id}"><td><b>${esc(t.name)}</b><br><span class="muted small">${esc(t.tier)} · ${esc(KIND[t.kind] || t.kind)} · ${esc(t.city)}</span></td><td class="r">${t.booking}</td><td class="r">${t.done}</td><td class="r">${rp(t.commission)}</td></tr>`).join('')}</tbody></table>` : '<p class="muted">Belum ada booking dari mitra bulan ini.</p>';
  if (I) h += insight(I);
  h += `<div class="cols"><div style="display:flex;flex-direction:column;gap:18px"><section class="card"><h2>Mitra teratas ${bulan(S.month)}</h2><div class="scroll">${top}</div></section>
      <section class="card"><h2>Per produk</h2><div class="scroll">${cats}</div></section></div>
    <div style="display:flex;flex-direction:column;gap:18px"><section class="card"><h2>Perlu perhatian</h2>${att.join('') || '<p class="muted">Tidak ada yang perlu ditindak.</p>'}</section>
      <section class="card"><h2>Per unit</h2><div class="scroll">${units}</div><p class="muted small">Persentase booking mitra terhadap total booking unit tampil setelah unit mengirim total booking bulanan.</p></section></div></div>`;
  return h;
}

/* ---------- Angka keputusan: ekonomi per booking, tren, corong, utang komisi ---------- */
const div0 = (a, b) => (+b ? +a / +b : null);
function delta(cur, prev, { good = 'up', unit = '%' } = {}) {
  if (cur == null || prev == null) return '';
  let d, txt;
  if (unit === 'pt') { d = cur - prev; txt = (d > 0 ? '+' : '') + String(Math.round(d * 10) / 10).replace('.', ',') + ' poin'; }
  else { if (!prev) return cur ? 'baru bulan ini' : ''; d = (cur - prev) / Math.abs(prev) * 100; txt = (d > 0 ? '▲ ' : d < 0 ? '▼ ' : '') + Math.abs(Math.round(d)) + '%'; }
  if (Math.abs(d) < 0.05) return 'sama dengan bulan lalu';
  const ok = good === 'up' ? d > 0 : d < 0;
  return `<span style="color:${ok ? 'var(--teal-d)' : 'var(--red)'}">${txt}</span> vs bulan lalu`;
}
function econ(t) {
  const sel = +t.selesai, rev = +t.revenue, cost = +t.commission + +t.rewards;
  return { sel, rev, cost, aov: div0(rev, sel), komisi: div0(t.commission, sel), biaya: div0(cost, sel), bersih: rev - cost,
    costp: rev ? cost / rev * 100 : null, batal: +t.booking ? t.batal / t.booking * 100 : null, perMitra: div0(rev, t.produktif) };
}
function trendChart(T) {
  const W = 640, H = 230, P = 20, n = T.length, bw = (W - P * 2) / n, max = Math.max(1, ...T.map(t => +t.revenue));
  const cap = +((MISC.settings || {}).cost_cap_pct || 0);
  const y = (v) => H - 46 - (v / max) * (H - 80);
  const bars = T.map((t, i) => { const e = econ(t), x = P + i * bw + bw * .2, w = bw * .6, cur = t.month === S.month, cx = x + w / 2;
    const over = e.costp != null && cap && e.costp > cap;
    return `<rect x="${x}" y="${y(e.rev)}" width="${w}" height="${Math.max(0, H - 46 - y(e.rev))}" rx="5" fill="${cur ? 'var(--teal)' : '#B9E9E4'}"><title>${bulan(t.month)}: pendapatan ${rp(e.rev)}, komisi + hadiah ${rp(e.cost)}</title></rect>
      <rect x="${x}" y="${y(e.cost)}" width="${w}" height="${Math.max(0, H - 46 - y(e.cost))}" rx="3" fill="var(--navy)"></rect>
      ${e.rev ? `<text x="${cx}" y="${y(e.rev) - 6}" text-anchor="middle" font-size="11" font-weight="800" fill="var(--navy)">${rpk(e.rev).replace('Rp', '')}</text>` : ''}
      <text x="${cx}" y="${H - 28}" text-anchor="middle" font-size="11" font-weight="700" fill="var(--mut)">${bulan(t.month).slice(0, 3)}</text>
      <text x="${cx}" y="${H - 10}" text-anchor="middle" font-size="11" font-weight="800" fill="${over ? '#B4410C' : 'var(--teal-d)'}">${e.costp == null ? '—' : pct(e.costp)}</text>`; }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Grafik pendapatan dan biaya mitra 6 bulan">${bars}</svg>
    <div style="display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mut);font-weight:700"><span><i style="display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--teal);margin-right:5px"></i>Pendapatan dari mitra</span><span><i style="display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--navy);margin-right:5px"></i>Komisi + hadiah</span><span>Angka bawah = biaya % pendapatan${cap ? ` (batas ${cap}%, merah bila lewat)` : ''}</span></div>`;
}
function insight(I) {
  const T = I.trend || [], cur = T[T.length - 1] || {}, prev = T[T.length - 2] || null, e = econ(cur), p = prev ? econ(prev) : {}, Q = I.quality || {}, L = I.liability || {}, Fn = I.funnel || {};
  const cap = +((MISC.settings || {}).cost_cap_pct || 0);
  const rep = Q.selesai ? Q.repeat / Q.selesai * 100 : null, gd = Q.selesai ? Q.guest_disc / Q.selesai * 100 : null;
  let h = `<h2 style="font-size:15px;margin:6px 0 -6px;color:var(--navy)">Ekonomi per booking · ${bulan(S.month)}</h2><div class="tiles">
    ${tile('Nilai rata-rata booking', e.aov == null ? '—' : rpk(e.aov), delta(e.aov, p.aov) || 'dari booking selesai')}
    ${tile('Komisi per booking', e.komisi == null ? '—' : rpk(e.komisi), Q.avg_rate != null ? 'tarif rata-rata ' + pct(Q.avg_rate) : '—')}
    ${tile('Biaya per booking', e.biaya == null ? '—' : rpk(e.biaya), delta(e.biaya, p.biaya, { good: 'down' }) || 'komisi + hadiah')}
    ${tile('Pendapatan bersih', rpk(e.bersih), delta(e.bersih, p.bersih) || 'setelah komisi & hadiah', e.bersih < 0 ? 'bad' : '')}
    ${tile('Total komisi + hadiah', rpk(e.cost), delta(e.cost, p.cost, { good: 'down' }) || 'biaya program bulan ini', e.costp != null && cap && e.costp > cap ? 'bad' : '')}
    ${tile('Pembatalan', pct(e.batal), (Q.batal || 0) + ' dari ' + (Q.booked || 0) + ' booking', e.batal != null && e.batal > 15 ? 'warn' : '')}
    ${tile('Pelanggan ulang', pct(rep), (Q.repeat || 0) + ' booking · komisi 50%')}
    ${tile('Pakai potongan tamu', pct(gd), 'perpanjangan ' + rpk(Q.ext_rev || 0))}
    ${tile('Pendapatan per mitra produktif', e.perMitra == null ? '—' : rpk(e.perMitra), (cur.produktif || 0) + ' mitra menghasilkan')}</div>`;
  const tr = `<table class="tbl"><thead><tr><th>Bulan</th><th class="r">Booking</th><th class="r">Selesai</th><th class="r">Batal</th><th class="r">Pendapatan</th><th class="r">Komisi+hadiah</th><th class="r">Biaya %</th><th class="r">Bersih</th><th class="r">Mitra produktif</th><th class="r">Mitra baru</th></tr></thead><tbody>
    ${T.slice().reverse().map(t => { const x = econ(t); return `<tr${t.month === S.month ? ' style="background:#F4FBFA;font-weight:800"' : ''}><td>${bulan(t.month)}</td><td class="r">${t.booking}</td><td class="r">${t.selesai}</td><td class="r">${t.batal}</td><td class="r">${rp(x.rev)}</td><td class="r">${rp(x.cost)}</td><td class="r"${x.costp != null && cap && x.costp > cap ? ' style="color:var(--red)"' : ''}>${pct(x.costp)}</td><td class="r">${rp(x.bersih)}</td><td class="r">${t.produktif}</td><td class="r">${t.mitra_baru}</td></tr>`; }).join('')}</tbody></table>`;
  const steps = [['Mendaftar', Fn.daftar], ['Disetujui', Fn.disetujui], ['Aktif sekarang', Fn.aktif], ['Pernah kirim booking', Fn.pernah_booking], ['Pernah booking selesai', Fn.pernah_selesai], ['Rutin (≥3 selesai / 90 hari)', Fn.rutin]];
  const top = Math.max(1, +Fn.daftar || 0);
  const funnel = steps.map(([l, v], i) => { const w = Math.max(2, (+v || 0) / top * 100), conv = i ? (steps[i - 1][1] ? Math.round((+v || 0) / steps[i - 1][1] * 100) + '% dari tahap sebelumnya' : '') : '';
    return `<div style="display:flex;flex-direction:column;gap:3px"><div style="display:flex;justify-content:space-between;font-size:13px;font-weight:700"><span>${l}</span><span>${v || 0}${conv ? ` <span class="muted small" style="font-weight:600">· ${conv}</span>` : ''}</span></div><div style="height:10px;background:var(--line2);border-radius:6px"><div style="height:10px;width:${w}%;background:${i < 3 ? '#B9E9E4' : 'var(--teal)'};border-radius:6px"></div></div></div>`; }).join('')
    + `<p class="muted small" style="margin:0">Ditolak ${Fn.ditolak || 0} · nonaktif ${Fn.nonaktif || 0}. Target: 15 mitra produktif per bulan.</p>`;
  const owe = +L.tertunda + +L.siap_cair + +L.hadiah_siap + +L.diajukan + +L.disetujui;
  const liab = `<div style="display:flex;justify-content:space-between;align-items:baseline"><b style="font-size:24px;color:var(--navy)">${rp(owe)}</b><span class="pill ${L.rekap_n ? 'y' : ''}">transfer paling lambat ${tgl(L.jatuh_tempo)}</span></div>
    <table class="tbl"><tbody>
    <tr><td>Belum pasti (sewa belum selesai)</td><td class="r">${L.tertunda_n || 0} booking</td><td class="r">${rp(L.tertunda)}</td></tr>
    <tr><td>Siap cair, belum direkap</td><td class="r">${L.siap_cair_n || 0} booking</td><td class="r">${rp(L.siap_cair)}</td></tr>
    <tr><td>Hadiah siap cair</td><td></td><td class="r">${rp(L.hadiah_siap)}</td></tr>
    <tr><td>Rekap diajukan (menunggu persetujuan)</td><td></td><td class="r">${rp(L.diajukan)}</td></tr>
    <tr><td>Disetujui, belum ditransfer</td><td></td><td class="r">${rp(L.disetujui)}</td></tr>
    ${+L.dibekukan ? `<tr><td style="color:var(--red)">Dibekukan (dicek Keuangan)</td><td></td><td class="r" style="color:var(--red)">${rp(L.dibekukan)}</td></tr>` : ''}
    </tbody></table><p class="muted small" style="margin:0">Sudah ditransfer sejak awal program: ${rp(L.dibayar_total)}. Angka "belum pasti" bisa berubah bila sewa batal.</p>`;
  const seg = (rows, name) => rows.length ? `<table class="tbl"><thead><tr><th>${name}</th><th class="r">Mitra aktif</th><th class="r">Produktif</th><th class="r">Selesai</th><th class="r">Pendapatan</th><th class="r">Biaya %</th><th class="r">Per mitra aktif</th></tr></thead><tbody>${rows.map(r => `<tr><td><b>${esc(name === 'Jenis' ? KIND[r.key] || r.key : r.key)}</b></td><td class="r">${r.mitra}</td><td class="r">${r.produktif}${r.mitra ? ` <span class="muted small">(${Math.round(r.produktif / r.mitra * 100)}%)</span>` : ''}</td><td class="r">${r.selesai}</td><td class="r">${rp(r.revenue)}</td><td class="r">${+r.revenue ? pct(r.commission / r.revenue * 100) : '—'}</td><td class="r">${r.mitra ? rpk(r.revenue / r.mitra) : '—'}</td></tr>`).join('')}</tbody></table>` : '<p class="muted">Belum ada data.</p>';
  const warn = [];
  if (Q.self_ref) warn.push(`${Q.self_ref} booking memakai kode sendiri (komisi otomatis nol)`);
  if (Q.issue) warn.push(`${Q.issue} booking bermasalah / pelanggan blacklist`);
  if (Q.hangus) warn.push(`${Q.hangus} komisi hangus karena pelanggaran`);
  h += `<div class="cols"><section class="card"><h2>Tren 6 bulan</h2>${trendChart(T)}<div class="scroll">${tr}</div></section>
    <div style="display:flex;flex-direction:column;gap:18px"><section class="card"><h2>Utang komisi ke mitra</h2>${liab}</section>
    <section class="card"><h2>Corong mitra</h2>${funnel}${warn.length ? `<div class="alert"><span><b>Kualitas ${bulan(S.month)}:</b> ${esc(warn.join('; '))}.</span></div>` : ''}</section></div></div>
    <div class="cols" style="grid-template-columns:minmax(0,1fr) minmax(0,1fr)"><section class="card"><h2>Per kota · ${bulan(S.month)}</h2><div class="scroll">${seg(I.by_city || [], 'Kota')}</div></section>
    <section class="card"><h2>Per jenis mitra · ${bulan(S.month)}</h2><div class="scroll">${seg(I.by_kind || [], 'Jenis')}</div></section></div>`;
  return h;
}

let cmT = 0;
function cmRead() { const s = document.getElementById('cm-subj'); if (!s) return; CM.subject = s.value; CM.body = document.getElementById('cm-body').value;
  document.querySelectorAll('[data-cm-seg]').forEach(x => { CM.seg[x.dataset.cmSeg] = x.type === 'checkbox' ? x.checked : x.value; }); }
async function cmCount() {
  const el = document.getElementById('cm-count'); if (!el) return; cmRead();
  try { const T = await A.rpc('af_campaign_targets', { p_segment: CM.seg, p_demo: S.demo });
    el.innerHTML = `<b style="color:var(--navy);font-size:15px">${T.n} mitra</b> akan menerima${T.sample.length ? ': ' + esc(T.sample.join(', ')) + (T.n > T.sample.length ? ', …' : '') : ''}. <span class="muted">Tidak dihitung: ${T.optout} berhenti berlangganan, ${T.no_email} tanpa email.</span>`;
  } catch (er) { el.textContent = er.message; }
}
async function cmSave() { cmRead(); const id = await A.rpc('af_campaign_save', { p: { id: CM.id || null, subject: CM.subject, body: CM.body, segment: CM.seg, demo: S.demo } }); CM.id = id; return id; }
document.addEventListener('input', (e) => { if (e.target.closest('#cmform')) { cmRead(); if (e.target.dataset.cmSeg) { clearTimeout(cmT); cmT = setTimeout(cmCount, 250); } } });
document.addEventListener('change', (e) => { if (e.target.dataset && e.target.dataset.cmSeg) { cmRead(); cmCount(); } });
document.addEventListener('click', async (e) => {
  const b = e.target.closest('[data-cm-tpl],[data-cm-ins],[data-cm-new],[data-cm-save],[data-cm-test],[data-cm-send],[data-cm-sched],[data-cm-edit],[data-cm-cancel]'); if (!b) return;
  const d = b.dataset;
  try {
    if (d.cmTpl !== undefined) { const t = CM_TPL[+d.cmTpl]; if ((CM.subject || CM.body) && !confirm('Ganti isi yang sedang ditulis dengan contoh "' + t[0] + '"?')) return; CM.subject = t[1]; CM.body = t[2]; Object.assign(CM.seg, { status: 'aktif', idle: false, produktif: false }, t[3]); return render(); }
    if (d.cmIns) { const ta = document.getElementById('cm-body'); const p = ta.selectionStart ?? ta.value.length; ta.value = ta.value.slice(0, p) + d.cmIns + ta.value.slice(ta.selectionEnd ?? p); ta.focus(); ta.selectionStart = ta.selectionEnd = p + d.cmIns.length; cmRead(); return; }
    if (d.cmNew !== undefined) { Object.assign(CM, { id: '', subject: '', body: '', seg: { status: 'aktif', city: '', kind: '', idle: false, produktif: false } }); return render(); }
    if (d.cmEdit) { const L = await A.rpc('af_campaign_list', { p_demo: S.demo }); const r = L.rows.find(x => x.id === d.cmEdit); if (!r) return;
      Object.assign(CM, { id: r.id, subject: r.subject, body: r.body, seg: Object.assign({ status: 'aktif', city: '', kind: '', idle: false, produktif: false }, r.segment || {}) }); await render(); document.getElementById('cmform')?.scrollIntoView({ behavior: 'smooth' }); return; }
    if (d.cmCancel) { if (!confirm('Batalkan campaign ini? Email tidak akan dikirim.')) return; await A.rpc('af_campaign_cancel', { p_id: d.cmCancel }); if (CM.id === d.cmCancel) CM.id = ''; toast('Campaign dibatalkan'); return render(); }
    b.disabled = true;
    if (d.cmSave !== undefined) { await cmSave(); toast('Draf tersimpan'); return render(); }
    if (d.cmTest !== undefined) { const id = await cmSave(); const em = await A.rpc('af_campaign_test', { p_id: id }); toast('Email uji dikirim ke ' + em + ' (± 2 menit)'); b.disabled = false; return; }
    if (d.cmSend !== undefined) { const id = await cmSave(); const T = await A.rpc('af_campaign_targets', { p_segment: CM.seg, p_demo: S.demo });
      if (!confirm(`Kirim "${CM.subject}" ke ${T.n} mitra sekarang? Email yang sudah terkirim tidak bisa ditarik.`)) { b.disabled = false; return; }
      const r = await A.rpc('af_campaign_send', { p_id: id, p_when: null }); toast((S.demo ? 'Disimulasikan ke ' : 'Dikirim bertahap ke ') + r.n + ' mitra'); Object.assign(CM, { id: '', subject: '', body: '' }); return render(); }
    if (d.cmSched !== undefined) { const w = document.getElementById('cm-when').value; if (!w) { toast('Pilih tanggal & jam dulu', true); b.disabled = false; return; }
      const id = await cmSave(); const r = await A.rpc('af_campaign_send', { p_id: id, p_when: new Date(w).toISOString() }); toast('Dijadwalkan ' + new Date(r.at).toLocaleString('id-ID')); Object.assign(CM, { id: '', subject: '', body: '' }); return render(); }
  } catch (er) { toast(er.message, true); b.disabled = false; }
});

function diff(d) {
  if (!d || !d.sebelum || !d.sesudah) return '';
  const k = Object.keys(d.sesudah).filter(x => JSON.stringify(d.sebelum[x]) !== JSON.stringify(d.sesudah[x]) && !['updated_at'].includes(x)).slice(0, 4);
  return k.length ? '<br>' + k.map(x => '<code>' + esc(x) + '</code>: ' + esc(JSON.stringify(d.sebelum[x])) + ' → ' + esc(JSON.stringify(d.sesudah[x]))).join('<br>') : '';
}

    if (d.transfer !== undefined) { if (!confirm('Unduh daftar transfer berisi nomor rekening lengkap? Pembukaan data ini tercatat di log audit.')) return;
      const per = S.period || (S._payout.periods[0] || ''); const L = await A.rpc('af_payout_transfer_list', { p_period: per, p_demo: S.demo });
      const q = (v) => '"' + String(v ?? '').replace(/"/g, '""') + '"';
      const rows = [['Nama', 'Bank', 'Rekening', 'Atas nama', 'Jumlah', 'Status', 'Ditahan']].concat(L.map(r => [r.nama, r.bank, r.rekening, r.atas_nama, r.jumlah, r.status, r.ditahan ? 'ya' : '']));
      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['\ufeff' + rows.map(r => r.map(q).join(',')).join('\n')], { type: 'text/csv' })); a.download = 'daftar-transfer-mitra-' + per + '.csv'; a.click(); return; }
    if (d.pay) return payoutPanel(d.pay);
    if (d.paid) return paidPanel(d.paid);
    if (d.proof) return A.openFile(d.proof);
    if (d.approveSel !== undefined) { const ids = [...document.querySelectorAll('[data-sel]:checked')].map(c => c.dataset.sel); if (!ids.length) return toast('Centang pencairan dulu', true); const n = await A.rpc('af_payout_approve', { p_ids: ids }); toast(n + ' pencairan disetujui'); return render(); }
    if (d.closeMonth !== undefined) { if (!confirm('Buat ulang rekap komisi bulan lalu? Pencairan yang belum disetujui akan dihitung ulang.')) return; const d2 = new Date(); d2.setDate(1); d2.setMonth(d2.getMonth() - 1); const r = await A.rpc('af_close_month', { p_month: monthKey(d2), p_force: true, p_demo: S.demo }); toast('Rekap dibuat: ' + r.payouts + ' pencairan'); S.period = ''; return render(); }
    if (d.unfreeze) { const r = prompt('Alasan melepas pembekuan:'); if (!r) return; await A.rpc('af_freeze', { p_booking: d.unfreeze, p_freeze: false, p_reason: r }); toast('Dilepas'); return render(); }
    if (d.freeze !== undefined) { const bid = document.querySelector('[data-freeze-id]').value.trim(); if (!bid) return; const r = prompt('Alasan membekukan:'); if (!r) return; const rows = await A.rpc('af_find_booking', { p_booking_id: bid, p_demo: S.demo }); if (!rows || !rows.length) return toast('Booking tidak ditemukan', true); await A.rpc('af_freeze', { p_booking: rows[0].id, p_freeze: true, p_reason: r }); toast('Dibekukan'); return render(); }
    if (d.viol) { const r = prompt('Pelanggaran apa? (wajib)'); if (!r) return; const o = await A.rpc('af_violation', { p_partner: d.viol, p_reason: r }); toast('Pelanggaran ke-' + o.ke + (o.nonaktif ? ', mitra dinonaktifkan' : '')); return render(); }
    if (d.rwreject) { const r = prompt('Alasan menolak hadiah:'); if (!r) return; await A.rpc('af_reward_reject', { p_id: d.rwreject, p_reason: r }); toast('Hadiah ditolak'); return render(); }
    if (d.newkey) { if (!confirm('Buat kunci baru untuk ' + unitName(d.newkey) + '? Kunci lama langsung tidak berlaku.')) return; const k = await A.rpc('af_unit_key_new', { p_unit: d.newkey });
      panel(`<div style="display:flex;justify-content:space-between"><h2 style="font-size:20px">Kunci API ${esc(unitName(d.newkey))}</h2><button class="btn sm" data-close>✕</button></div><div class="ok">Salin sekarang. Rahasia ini tidak bisa ditampilkan lagi.</div><pre>x-key-id : ${esc(k.key_id)}
rahasia  : ${esc(k.secret)}</pre><button class="btn pri" id="ck">Salin keduanya</button><p class="muted small">Kirim ke tim aplikasi lewat jalur pribadi (bukan grup). Simpan rahasia di server aplikasi unit sebagai secret, jangan di aplikasi HP atau kode web. Kunci lama langsung tidak berlaku.</p>`, (pn) => { pn.querySelector('#ck').onclick = async () => { try { await navigator.clipboard.writeText('x-key-id: ' + k.key_id + '\nrahasia: ' + k.secret); toast('Tersalin'); } catch (x) {} }; });
      return; }
    if (d.revoke) { if (!confirm('Cabut kunci API ' + unitName(d.revoke) + '? Aplikasi unit langsung tidak bisa mengirim data sampai diberi kunci baru.')) return; await A.rpc('af_unit_key_revoke', { p_unit: d.revoke }); toast('Kunci dicabut'); return render(); }
    if (d.addcat) { const u = d.addcat, c = document.querySelector(`[data-newcat="${u}"]`).value.trim().toLowerCase(), l = document.querySelector(`[data-newlabel="${u}"]`).value.trim(), p = +document.querySelector(`[data-newpct="${u}"]`).value; if (!c || !l || !p) return toast('Isi kode, label, dan tarif', true); await A.rpc('af_rate_base_set', { p_unit: u, p_cat: c, p_label: l, p_pct: p }); toast('Kategori ditambah'); return render(); }
  } catch (er) { toast(er.message, true); }
});
document.addEventListener('submit', async (e) => {
  if (e.target.id !== 'chf') return; e.preventDefault();
  const d = Object.fromEntries(new FormData(e.target)); d.month = S.month; d.demo = S.demo;
  try { await A.rpc('af_challenge_save', { p: d }); toast('Tantangan tersimpan'); render(); } catch (er) { toast(er.message, true); }
});
window.addEventListener('hashchange', () => { close(); render(); scrollTo(0, 0); });
const wait = setInterval(() => { const p = window.mkPerson; if (p || location.hostname === 'localhost') { clearInterval(wait); document.getElementById('me').textContent = p ? (p.nickname || p.name) + ' · ' + (p.title || p.role) : 'uji lokal'; render(); } }, 200);
</script>
</body>
