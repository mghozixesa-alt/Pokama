<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1080}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { unit: 'Semua' }; }
  renderVals() {
    var self = this;
    var UC = { Rentalaja: '#2F6FD0', TripinAja: '#0FA394', Niagaaja: '#D08A1E' };
    var P = {
      dita: { name: 'Dita', ini: 'D', color: '#2F6FD0' }, mugni: { name: 'Mugni', ini: 'M', color: '#0FA394' },
      nayla: { name: 'Nayla', photo: 'nayla.jpg' }, kevin: { name: 'Kevin', photo: 'kevin.jpg' },
      none: { name: 'Belum dipilih', ini: '?', color: '#A9B4C2' }
    };
    var PIL = { 'Ditanyakan di WA': 'Educational', 'Dari ulasan': 'Conversational', 'Dari hasil konten': 'Educational', 'Hari besar dan pesaing': 'Entertainment' };
    var STS = { Planned: ['#EEF0F3', '#3B4250'], 'In progress': ['#FDF3D7', '#7A5200'], Ready: ['#DDF5F2', '#067A70'] };
    var it = function (unit, acc, title, proof, who, route, status) {
      var w = who || P.none, s = status || 'Planned';
      return { status: s, stBg: STS[s][0], stFg: STS[s][1], pillar: '', unit: unit, acc: acc, title: title, proof: proof, dot: UC[unit], content: !route, notContent: !!route, route: route || '', who: { name: w.name, photo: w.photo || '', ini: w.photo ? '' : w.ini, color: w.color } };
    };
    var C = [
      { title: 'Ditanyakan di WA', sub: 'Pertanyaan yang muncul 3 kali atau lebih dalam 7 hari', bg: '#E5EEF9', fg: '#1E5AA8', items: [
        it('Rentalaja', 'Rentalaja', 'Sewa motor bisa diantar ke stasiun?', '6 kali minggu ini, WA Garut Kota dan Wanaraja', P.dita),
        it('TripinAja', 'TripinAja', 'Trip Papandayan bisa private untuk keluarga?', '5 kali, 3 di antaranya dari iklan Open trip November', P.nayla),
        it('Rentalaja', 'Rentalaja Experience', 'Boleh bawa hewan peliharaan ke Ruma Metua?', '4 kali, belum ada jawaban baku di template CS', P.dita),
        it('Niagaaja', 'Laptopaja', 'Laptop bekas ada garansinya?', '3 kali, padahal ada konten garansi bulan lalu', P.dita)
