<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brand &amp; positioning — Marketing Pokama</title>
<link rel="icon" href="logo-pokama.png">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F3F5F8}
a{color:#1D3149}a:hover{color:#0F1D2E}
table{font-variant-numeric:tabular-nums}
main > header{background:radial-gradient(circle at 92% -30%, rgba(9,190,175,.45), transparent 42%),linear-gradient(135deg,#1D3149 0%,#28507A 100%);border-radius:22px;padding:22px 26px;align-items:center !important;box-shadow:0 10px 30px rgba(29,49,73,.18)}
main > header h1{color:#FFFFFF !important}
main > header span{color:#D3E0EC !important}
main > header b{color:#7FF0E2 !important}
main > header span[style*="dashed"]{border-color:rgba(255,255,255,.45) !important}
main > header button{border-color:rgba(255,255,255,.35) !important}
main > header button[aria-pressed="true"]{background:#09BEAF !important;color:#1D3149 !important;border-color:#09BEAF !important}
main > header button[aria-pressed="false"]{background:rgba(255,255,255,.08) !important;color:#FFFFFF !important}
main > header a{color:#1D3149}
main section{transition:box-shadow .2s ease, transform .2s ease}
main section:hover{box-shadow:0 8px 24px rgba(29,49,73,.07)}
main > header span[aria-hidden="true"]{flex:none}
@media (max-width: 760px){article[style*="grid-template-columns: 36px minmax(0, 1fr) auto"]{grid-template-columns:32px minmax(0,1fr) !important}
article[style*="grid-template-columns: 36px minmax(0, 1fr) auto"] > div:last-child{grid-column:2;flex-direction:row !important;justify-content:space-between;align-items:center !important}}
@media (max-width: 760px){main > header{padding:16px !important;border-radius:16px}}
@media (max-width: 760px){table:not(:has(th:nth-child(5))){min-width:0 !important;width:100% !important}}
td[style*="text-align: right"]{white-space:nowrap}
tbody tr:hover td{background:#F9FAFB}
thead th{position:sticky;top:0;background:#FFFFFF}
button:focus-visible,a:focus-visible{outline:2px solid #09BEAF;outline-offset:2px;border-radius:8px}
button{transition:filter .15s}button:hover{filter:brightness(0.97)}
@media (max-width: 760px){
nav[aria-label="Menu utama"]{flex:1 1 100% !important;flex-direction:row !important;align-items:center !important;overflow-x:auto;gap:4px !important;padding:8px 12px !important;border-right:0 !important;border-bottom:1px solid #E3E6EB;position:sticky;top:0;z-index:20;scrollbar-width:none}
nav[aria-label="Menu utama"] > div{flex-direction:row !important;gap:4px !important;padding:0 !important;flex:none !important}
nav[aria-label="Menu utama"] > div > span:first-child{display:none !important}
nav[aria-label="Menu utama"] > div:first-child img{width:84px !important}
nav[aria-label="Menu utama"] > div:first-child span{display:none !important}
nav[aria-label="Menu utama"] a{white-space:nowrap;min-height:36px !important;padding:0 10px !important}
nav[aria-label="Menu utama"] > div[style*="margin-top: auto"]{display:none !important}
main{padding:18px 16px 40px !important}
h1{font-size:24px !important}
}
</style>
<link rel="stylesheet" href="gate.css">
<script src="gate.js"></script>
<script src="dc-lite.js"></script>
</head>
<body>
<template id="dc-tpl">

<div style="min-height: 1900px; display: flex; flex-wrap: wrap; background: #F3F5F8; color: #1F2933; font-family: 'Nunito', system-ui, sans-serif; font-size: 14px; line-height: 1.45;">

<nav aria-label="Menu utama" style="flex: 1 1 240px; box-sizing: border-box; background: #FFFFFF; border-right: 1px solid #E3E6EB; padding: 24px 16px; display: flex; flex-direction: column; gap: 18px;">
<div style="display: flex; flex-direction: column; gap: 6px; padding: 0 8px;">
<img src="logo-pokama.png" alt="Pokama" style="width: 132px; height: auto;">
<span style="font-size: 12px; color: #5B6573; font-weight: 700;">Marketing</span>
</div>
<div style="display: flex; flex-direction: column; gap: 2px;">
<span style="font-size: 11px; font-weight: 800; letter-spacing: 0.08em; color: #5B6573; padding: 0 12px 4px;">KERJA</span>
<a href="kerja.html#today" data-view="today" style="display: flex; align-items: center; gap: 10px; min-height: 38px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-weight: 600; color: #3B4250;"><span data-ic style="display: inline-flex; color: #5B6573;"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18zM12 7v5l3 2"></path></svg></span><span style="flex-grow: 1;">Hari ini</span><span data-badge="today"></span></a>
<a href="kerja.html#campaign" data-view="campaign" style="display: flex; align-items: center; gap: 10px; min-height: 38px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-weight: 600; color: #3B4250;"><span data-ic style="display: inline-flex; color: #5B6573;"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4M5 4h12l-2 4 2 4H5"></path></svg></span><span style="flex-grow: 1;">Campaign</span><span data-badge="campaign"></span></a>
<a href="kerja.html#plan" data-view="plan" style="display: flex; align-items: center; gap: 10px; min-height: 38px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-weight: 600; color: #3B4250;"><span data-ic style="display: inline-flex; color: #5B6573;"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h18v16H3zM3 10h18M8 3v4M16 3v4"></path></svg></span><span style="flex-grow: 1;">Content plan</span><span data-badge="plan"></span></a>
<a href="kerja.html#bank" data-view="bank" style="display: flex; align-items: center; gap: 10px; min-height: 38px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-weight: 600; color: #3B4250;"><span data-ic style="display: inline-flex; color: #5B6573;"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.8.8 1 1.5 1 2.5h6c0-1 .2-1.7 1-2.5A6 6 0 0 0 12 3z"></path></svg></span><span style="flex-grow: 1;">Content bank</span><span data-badge="bank"></span></a>
<a href="kerja.html#editor" data-view="editor" style="display: flex; align-items: center; gap: 10px; min-height: 38px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-weight: 600; color: #3B4250;"><span data-ic style="display: inline-flex; color: #5B6573;"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h14v18H5zM8 8h8M8 12h8M8 16h5"></path></svg></span><span style="flex-grow: 1;">Antrean editor</span><span data-badge="editor"></span></a>
</div>
<div style="display: flex; flex-direction: column; gap: 2px;">
<span style="font-size: 11px; font-weight: 800; letter-spacing: 0.08em; color: #5B6573; padding: 0 12px 4px;">ANALITIK</span>
<a href="Dashboard.dc.html" style="display: flex; align-items: center; gap: 10px; min-height: 38px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-weight: 600; color: #3B4250;"><span data-ic style="display: inline-flex; color: #5B6573;"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3h7v9H3zM14 3h7v5h-7zM14 12h7v9h-7zM3 16h7v5H3z"></path></svg></span><span style="flex-grow: 1;">Dashboard utama</span></a>
<a href="Sosial.dc.html" style="display: flex; align-items: center; gap: 10px; min-height: 38px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-weight: 600; color: #3B4250;"><span data-ic style="display: inline-flex; color: #5B6573;"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v16H4zM12 8.5a3.5 3.5 0 1 0 0 7a3.5 3.5 0 1 0 0-7zM17 7h.01"></path></svg></span><span style="flex-grow: 1;">Analytics IG &amp; TikTok</span></a>
<a href="Ads.dc.html" style="display: flex; align-items: center; gap: 10px; min-height: 38px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-weight: 600; color: #3B4250;"><span data-ic style="display: inline-flex; color: #5B6573;"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11v2a1 1 0 0 0 1 1h3l5 4V6L7 10H4a1 1 0 0 0-1 1zM16 8a5 5 0 0 1 0 8"></path></svg></span><span style="flex-grow: 1;">Paid ads</span></a>
<a href="KOL.dc.html" style="display: flex; align-items: center; gap: 10px; min-height: 38px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-weight: 600; color: #3B4250;"><span data-ic style="display: inline-flex; color: #5B6573;"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.5 6.7 19.4l1.2-6L3.4 9.3l6-.7z"></path></svg></span><span style="flex-grow: 1;">KOL</span></a>
<a href="Maps.dc.html" style="display: flex; align-items: center; gap: 10px; min-height: 38px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-weight: 600; color: #3B4250;"><span data-ic style="display: inline-flex; color: #5B6573;"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4a7 7 0 1 0 0 14a7 7 0 1 0 0-14zM21 21l-5-5"></path></svg></span><span style="flex-grow: 1;">SEO</span></a>
<a href="WA.dc.html" style="display: flex; align-items: center; gap: 10px; min-height: 38px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-weight: 600; color: #3B4250;"><span data-ic style="display: inline-flex; color: #5B6573;"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H8l-4 4z"></path></svg></span><span style="flex-grow: 1;">WA &amp; CS</span></a>
</div>
<div style="display: flex; flex-direction: column; gap: 2px;">
<span style="font-size: 11px; font-weight: 800; letter-spacing: 0.08em; color: #5B6573; padding: 0 12px 4px;">PENGATURAN</span>
<a href="Brand.dc.html" aria-current="page" style="display: flex; align-items: center; gap: 10px; min-height: 38px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-weight: 800; color: #1D3149; background: #DDF5F2;"><span data-ic style="display: inline-flex; color: #067A70;"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12V4h8l10 10-8 8zM7.5 7.5h.01"></path></svg></span><span style="flex-grow: 1;">Brand &amp; positioning</span></a>
</div>
<div style="margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 14px 12px 0; border-top: 1px solid #E3E6EB;">
<img src="kevin.jpg" alt="" style="width: 38px; height: 38px; border-radius: 19px; object-fit: cover;">
<div style="display: flex; flex-direction: column;"><span style="font-weight: 800;">Kevin</span><span style="font-size: 12px; color: #5B6573;">Head of Marketing</span></div>
</div>
</nav>

<main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 28px 36px 48px; display: flex; flex-direction: column; gap: 22px;">

<header style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px;">
<div style="display: flex; flex-direction: column; gap: 4px; max-width: 960px;">
<span style="font-size: 13px; color: #5B6573; font-weight: 700;">Ditinjau Head of Marketing tiap awal kuartal · campaign mengambil dari sini, tidak mengubahnya</span>
<h1 style="margin: 0; font-size: 28px; font-weight: 900; color: #1D3149;">Brand &amp; positioning</h1>
<span style="font-size: 14px; color: #3B4250; max-width: 900px;">Siapa target tiap akun, bagaimana mereka membeli, apa janji kita, dan porsi content pillar. Campaign mengambil dari sini.</span>
</div>
<span style="font-size: 12px; font-weight: 700; color: #5B6573; border: 1px dashed #A9B4C2; border-radius: 18px; padding: 8px 12px;">Draf awal · perlu dilengkapi Kevin</span>
</header>

<div role="group" aria-label="Pilih akun" style="display: flex; flex-wrap: wrap; gap: 8px;">
<template data-sc="for" list="{{tabs}}" as="t" hint-placeholder-count="8">
<button type="button" onClick="{{t.pick}}" aria-pressed="{{t.pressed}}" style="display: inline-flex; align-items: center; gap: 7px; height: 38px; padding: 0 14px; border-radius: 19px; border: 1px solid {{t.border}}; background: {{t.bg}}; color: {{t.fg}}; font-family: inherit; font-size: 13px; font-weight: 800; cursor: pointer;"><span style="width: 8px; height: 8px; border-radius: 4px; background: {{t.dot}};"></span>{{t.label}}</button>
</template>
</div>

<section style="background: #FFFFFF; border: 1px solid #E3E6EB; border-top: 5px solid {{b.dot}}; border-radius: 20px; padding: 20px 22px; display: flex; flex-direction: column; gap: 14px;">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px;">
<div style="display: flex; flex-direction: column; gap: 4px;"><span style="font-size: 12px; font-weight: 800; color: #5B6573;">{{b.unit}} · PIC akun {{b.pic}} · {{b.status}}</span><h2 style="margin: 0; font-size: 26px; font-weight: 900; color: #1D3149;">{{b.name}}</h2></div>
<span style="font-size: 12px; font-weight: 800; color: #5B6573;">Ditinjau terakhir: {{b.reviewed}}</span>
</div>
<div style="background: #F0FBF9; border: 1px solid #BFE9E3; border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px;"><span style="font-size: 11.5px; font-weight: 900; letter-spacing: 0.1em; color: #067A70;">POSITIONING</span><span style="font-size: 16px; font-weight: 800; color: #1D3149; line-height: 1.45;">{{b.positioning}}</span></div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px;">
<template data-sc="for" list="{{b.fields}}" as="f" hint-placeholder-count="6">
<div style="border: 1px solid #E3E6EB; border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 4px;"><span style="font-size: 11.5px; font-weight: 900; letter-spacing: 0.06em; color: #5B6573;">{{f.label}}</span><span style="font-size: 13.5px; color: #1D3149; font-weight: 700;">{{f.val}}</span></div>
</template>
</div>
</section>

<section style="background: #FFFFFF; border: 1px solid #E3E6EB; border-radius: 20px; padding: 18px 20px; display: flex; flex-direction: column; gap: 12px;">
<div style="display: flex; flex-direction: column;"><h3 data-icon-done="1" style="display: flex; align-items: center; gap: 10px; margin: 0; font-size: 17px; font-weight: 900; color: #1D3149;"><span aria-hidden="true" style="width: 28px; height: 28px; flex: none; border-radius: 8px; background: #EFEDFF; color: #4B3BA8; display: inline-flex; align-items: center; justify-content: center;"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 12a4 4 0 1 0 0-8a4 4 0 1 0 0 8zM4 21c1-4 4-6 8-6s7 2 8 6"></path></svg></span>Persona yang dikejar</h3><span style="font-size: 12.5px; color: #5B6573;">Rujukan utama untuk brief konten, iklan, dan pilihan KOL. Perilaku konsumen diambil dari pertanyaan di WA dan data closing.</span></div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px;">
<template data-sc="for" list="{{b.personas}}" as="p" hint-placeholder-count="3">
<div style="border: 1px solid #E3E6EB; border-top: 4px solid {{b.dot}}; border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 8px;">
<div style="display: flex; align-items: center; gap: 10px;"><span aria-hidden="true" style="width: 40px; height: 40px; border-radius: 20px; background: #F3F5F8; color: #1D3149; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 14px;">{{p.ini}}</span><div style="display: flex; flex-direction: column;"><strong style="font-size: 15px; color: #1D3149;">{{p.name}}</strong><span style="font-size: 12px; color: #5B6573;">{{p.who}}</span></div></div>
<template data-sc="for" list="{{p.rows}}" as="r" hint-placeholder-count="5"><div style="display: grid; grid-template-columns: 104px minmax(0, 1fr); gap: 8px; font-size: 12.5px; border-top: 1px dashed #E3E6EB; padding-top: 6px;"><span style="font-weight: 800; color: #5B6573;">{{r.k}}</span><span style="color: #1D3149;">{{r.v}}</span></div></template>
<div style="background: #F0FBF9; border-radius: 10px; padding: 8px 10px; font-size: 12.5px; color: #1D3149;"><b style="color: #067A70;">Pesan yang mempan:</b> {{p.msg}}</div>
</div>
</template>
</div>
</section>

<div style="display: flex; flex-wrap: wrap; gap: 22px; align-items: flex-start;">
<section style="flex: 1 1 420px; min-width: 0; background: #FFFFFF; border: 1px solid #E3E6EB; border-radius: 20px; padding: 18px 20px; display: flex; flex-direction: column; gap: 10px;">
<div style="display: flex; flex-direction: column;"><h3 data-icon-done="1" style="display: flex; align-items: center; gap: 10px; margin: 0; font-size: 17px; font-weight: 900; color: #1D3149;"><span aria-hidden="true" style="width: 28px; height: 28px; flex: none; border-radius: 8px; background: #FDF0F6; color: #9C2C63; display: inline-flex; align-items: center; justify-content: center;"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 2h10v20H7zM11 18h2"></path></svg></span>Cerita brand (StoryBrand)</h3><span style="font-size: 12.5px; color: #5B6573;">Pelanggan jadi tokoh utama, kita pemandunya. Dipakai sebagai kerangka setiap brief konten.</span></div>
<template data-sc="for" list="{{b.story}}" as="s" hint-placeholder-count="5">
<div style="display: grid; grid-template-columns: 130px minmax(0, 1fr); gap: 10px; padding: 8px 0; border-bottom: 1px solid #EEF0F3;"><span style="font-size: 12px; font-weight: 900; color: #067A70;">{{s.k}}</span><span style="font-size: 13px; color: #1D3149;">{{s.v}}</span></div>
</template>
</section>
<section style="flex: 1 1 340px; min-width: 0; background: #FFFFFF; border: 1px solid #E3E6EB; border-radius: 20px; padding: 18px 20px; display: flex; flex-direction: column; gap: 10px;">
<div style="display: flex; flex-direction: column;"><h3 data-icon-done="1" style="display: flex; align-items: center; gap: 10px; margin: 0; font-size: 17px; font-weight: 900; color: #1D3149;"><span aria-hidden="true" style="width: 28px; height: 28px; flex: none; border-radius: 8px; background: #DDF5F2; color: #067A70; display: inline-flex; align-items: center; justify-content: center;"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"></path></svg></span>Porsi content pillar</h3><span style="font-size: 12.5px; color: #5B6573;">Ubah sesuai strategi. Content plan memakai patokan ini untuk menghitung porsi.</span></div>
<template data-sc="for" list="{{b.pillars}}" as="p" hint-placeholder-count="4">
<div style="display: flex; flex-direction: column; gap: 4px;">
<div style="display: grid; grid-template-columns: minmax(0, 1fr) 34px 60px 34px; gap: 6px; align-items: center;"><strong style="font-size: 13px; color: #1D3149;">{{p.name}}</strong><button type="button" onClick="{{p.minus}}" aria-label="Kurangi {{p.name}}" style="height: 32px; border-radius: 8px; border: 1px solid #E3E6EB; background: #F7F8FA; font-family: inherit; font-size: 16px; font-weight: 900; color: #1D3149; cursor: pointer;">−</button><span style="height: 32px; border-radius: 8px; border: 1px solid #D5DAE1; display: flex; align-items: center; justify-content: center; font-weight: 900; color: #1D3149;">{{p.target}}</span><button type="button" onClick="{{p.plus}}" aria-label="Tambah {{p.name}}" style="height: 32px; border-radius: 8px; border: 1px solid #E3E6EB; background: #F7F8FA; font-family: inherit; font-size: 16px; font-weight: 900; color: #1D3149; cursor: pointer;">+</button></div>
<div style="position: relative; height: 10px; border-radius: 4px; background: #EEF0F3;"><div style="height: 100%; width: {{p.actual}}; background: #09BEAF; border-radius: 4px;"></div><div style="position: absolute; top: -3px; bottom: -3px; left: {{p.target}}; border-left: 2px solid #1D3149;"></div></div>
<span style="font-size: 11.5px; color: #5B6573;">aktual <b style="color: {{p.color}};">{{p.actual}}</b>{{p.note}}</span>
</div>
</template>
<div style="display: flex; justify-content: space-between; align-items: center; gap: 8px; padding-top: 4px;"><span style="font-size: 12.5px; font-weight: 800; color: {{b.totalColor}};">Total {{b.total}}</span><button type="button" onClick="{{b.savePil}}" style="height: 36px; padding: 0 14px; border-radius: 10px; border: 0; background: {{b.saveBg}}; color: #1D3149; font-family: inherit; font-size: 13px; font-weight: 900; cursor: pointer;">{{b.saveLabel}}</button></div>
<div style="border-top: 1px solid #EEF0F3; padding-top: 10px; display: flex; flex-direction: column; gap: 4px;"><strong style="font-size: 13px; color: #1D3149;">Tone of voice</strong><span style="font-size: 12.5px; color: #3B4250;">{{b.tone}}</span></div>
