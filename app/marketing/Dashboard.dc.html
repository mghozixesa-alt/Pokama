<style>

a{color:#1D3149}a:hover{color:#0F1D2E}

main > header button{border-color:rgba(255,255,255,.35) !important}
main > header button[aria-pressed="true"]{background:#09BEAF !important;color:#1D3149 !important;border-color:#09BEAF !important}
main > header button[aria-pressed="false"]{background:rgba(255,255,255,.08) !important;color:#FFFFFF !important}
main > header a{color:#1D3149}
main section{transition:box-shadow .2s ease, transform .2s ease}
main section:hover{box-shadow:0 8px 24px rgba(29,49,73,.07)}
main > header span[aria-hidden="true"]{flex:none}
@media (max-width: 760px){[data-desk]{display:none !important}[data-mob]{display:flex !important}}
@media (max-width: 760px){article[style*="grid-template-columns: 36px minmax(0, 1fr) auto"]{grid-template-columns:32px minmax(0,1fr) !important}
article[style*="grid-template-columns: 36px minmax(0, 1fr) auto"] > div:last-child{grid-column:2;flex-direction:row !important;justify-content:space-between;align-items:center !important}}
@media (max-width: 760px){main > header{padding:16px !important;border-radius:16px}}
@media (max-width: 760px){table:not(:has(th:nth-child(5))){min-width:0 !important;width:100% !important}}
td[style*="text-align: right"]{white-space:nowrap}
tbody tr:hover td{background:#F9FAFB}
thead th{position:sticky;top:0;background:#FFFFFF}
button:focus-visible,a:focus-visible{outline:2px solid #09BEAF;outline-offset:2px;border-radius:8px}
button{transition:filter .15s}button:hover{filter:brightness(0.97)}
@media (max-width: 760px){
nav[aria-label="Menu utama"]{flex:1 1 100% !important;flex-direction:row !important;align-items:center !important;overflow-x:auto;gap:4px !important;padding:8px 12px !important;border-right:0 !important;border-bottom:1px solid #E3E6EB;position:sticky;top:0;z-index:20;scrollbar-width:none}
nav[aria-label="Menu utama"] > div{flex-direction:row !important;gap:4px !important;padding:0 !important;flex:none !important}
nav[aria-label="Menu utama"] > div > span:first-child{display:none !important}
nav[aria-label="Menu utama"] > div:first-child img{width:84px !important}
nav[aria-label="Menu utama"] > div:first-child span{display:none !important}
nav[aria-label="Menu utama"] a{white-space:nowrap;min-height:36px !important;padding:0 10px !important}
nav[aria-label="Menu utama"] > div[style*="margin-top: auto"]{display:none !important}
main{padding:18px 16px 40px !important}
h1{font-size:24px !important}
}
</style>

<main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 28px 36px 48px; display: flex; flex-direction: column; gap: 22px;">

<span style="font-size: 13px; color: #5B6573; font-weight: 700;">Kamis, 29 Oktober 2026 · hari ke-29 dari 31 · gambaran besar seluruh marketing</span>
<h1 style="margin: 0; font-size: 28px; font-weight: 900; color: #1D3149;">Dashboard utama</h1>
<span style="font-size: 14px; color: #3B4250; max-width: 960px;"><b style="color: #067A70;">Ringkasan otomatis:</b> 4 campaign jalan: Rp 7,1 jt jadi 131 closing dan Rp 114,6 jt omzet. Motor Musim Hujan di bawah patokan.</span>
</div>
<span style="font-size: 12px; font-weight: 700; color: #5B6573; border: 1px dashed #A9B4C2; border-radius: 18px; padding: 8px 12px;">Data contoh</span>
</header>

<section aria-label="Angka bulan ini" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px;">
<template data-sc="for" list="{{kpis}}" as="k" hint-placeholder-count="6">
<div style="background: #FFFFFF; border: 1px solid #E3E6EB; border-top: 4px solid {{k.bar}}; border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px;">
<span style="display: flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 700; color: #3B4250;"><span style="color: #067A70; display: inline-flex;"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{k.ip}}"></path></svg></span>{{k.label}}</span>
<span style="font-size: 26px; font-weight: 900; color: #1D3149; line-height: 1.1;">{{k.val}}</span>
<div style="height: 6px; border-radius: 3px; background: #E3E6EB; overflow: hidden;"><div style="height: 100%; width: {{k.pct}}; background: {{k.bar}};"></div></div>
<span style="font-size: 12px; font-weight: 800; color: {{k.noteColor}};">{{k.note}}</span>
</div>
</template>
</section>

<section aria-labelledby="camp-h" style="background: #FFFFFF; border: 1px solid #E3E6EB; border-radius: 20px; padding: 18px 20px; display: flex; flex-direction: column; gap: 12px;">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 10px;">
<div style="display: flex; flex-direction: column;"><h2 id="camp-h" data-icon-done="1" style="display: flex; align-items: center; gap: 10px; margin: 0; font-size: 18px; font-weight: 900; color: #1D3149;"><span aria-hidden="true" style="width: 28px; height: 28px; flex: none; border-radius: 8px; background: #DDF5F2; color: #067A70; display: inline-flex; align-items: center; justify-content: center;"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4M5 4h12l-2 4 2 4H5"></path></svg></span>Campaign berjalan dan persiapan</h2><span style="font-size: 12.5px; color: #5B6573;">Semua konten, iklan, dan KOL punya induk campaign. Konten harian masuk "Always-on" per akun.</span></div>
<a href="kerja.html#campaign" style="height: 40px; padding: 0 16px; border-radius: 10px; background: #09BEAF; color: #1D3149; font-size: 13.5px; font-weight: 900; display: flex; align-items: center; text-decoration: none;">Buka Campaign</a>
</div>
<div data-desk="1" style="overflow-x: auto;">
<table style="width: 100%; min-width: 1020px; border-collapse: collapse; font-size: 13px;">
<thead><tr style="text-align: left; color: #5B6573; font-size: 12px;"><th scope="col" style="padding: 8px; border-bottom: 1px solid #E3E6EB;">Campaign</th><th scope="col" style="padding: 8px; border-bottom: 1px solid #E3E6EB;">Waktu</th><th scope="col" style="padding: 8px; border-bottom: 1px solid #E3E6EB;">Target utama</th><th scope="col" style="padding: 8px; border-bottom: 1px solid #E3E6EB; text-align: right;">Leads</th><th scope="col" style="padding: 8px; border-bottom: 1px solid #E3E6EB; text-align: right;">Closing</th><th scope="col" style="padding: 8px; border-bottom: 1px solid #E3E6EB; text-align: right;">Omzet</th><th scope="col" style="padding: 8px; border-bottom: 1px solid #E3E6EB; text-align: right;">Budget</th><th scope="col" style="padding: 8px; border-bottom: 1px solid #E3E6EB; text-align: right;">ROAS</th><th scope="col" style="padding: 8px; border-bottom: 1px solid #E3E6EB;">Next action</th></tr></thead>
<tbody>
<template data-sc="for" list="{{camps}}" as="c" hint-placeholder-count="6">
<tr>
<td style="padding: 10px 8px; border-bottom: 1px solid #EEF0F3;"><div style="display: flex; flex-direction: column; gap: 3px;"><span style="display: inline-flex; align-items: center; gap: 7px;"><span style="width: 9px; height: 9px; border-radius: 5px; background: {{c.dot}};"></span><strong style="color: #1D3149;">{{c.name}}</strong></span><span style="font-size: 11.5px; color: #5B6573;">{{c.accs}}</span><span style="font-size: 11.5px; font-weight: 900; color: {{c.stFg}}; background: {{c.stBg}}; border-radius: 7px; padding: 1px 7px; align-self: flex-start;">{{c.status}}</span></div></td>
<td style="padding: 10px 8px; border-bottom: 1px solid #EEF0F3; min-width: 130px;"><div style="display: flex; flex-direction: column; gap: 4px;"><span style="font-size: 12px; color: #3B4250;">{{c.period}}</span><div style="height: 6px; border-radius: 3px; background: #E3E6EB; overflow: hidden;"><div style="height: 100%; width: {{c.timePct}}; background: #A9B4C2;"></div></div><span style="font-size: 11px; color: #5B6573;">{{c.timeNote}}</span></div></td>
<td style="padding: 10px 8px; border-bottom: 1px solid #EEF0F3; min-width: 150px;"><div style="display: flex; flex-direction: column; gap: 4px;"><span style="font-size: 12.5px; font-weight: 800; color: #1D3149;">{{c.goal}}</span><div style="height: 6px; border-radius: 3px; background: #E3E6EB; overflow: hidden;"><div style="height: 100%; width: {{c.goalPct}}; background: {{c.goalBar}};"></div></div><span style="font-size: 11.5px; font-weight: 800; color: {{c.goalColor}};">{{c.goalNote}}</span></div></td>
<td style="padding: 10px 8px; border-bottom: 1px solid #EEF0F3; text-align: right; font-weight: 700;">{{c.leads}}</td>
<td style="padding: 10px 8px; border-bottom: 1px solid #EEF0F3; text-align: right; font-weight: 800;">{{c.closing}}</td>
<td style="padding: 10px 8px; border-bottom: 1px solid #EEF0F3; text-align: right;">{{c.omzet}}</td>
<td style="padding: 10px 8px; border-bottom: 1px solid #EEF0F3; text-align: right;">{{c.budget}}</td>
<td style="padding: 10px 8px; border-bottom: 1px solid #EEF0F3; text-align: right; font-weight: 900; color: {{c.roasColor}};">{{c.roas}}</td>
<td style="padding: 10px 8px; border-bottom: 1px solid #EEF0F3; font-size: 12.5px; color: #3B4250; max-width: 240px;">{{c.next}}</td>
</tr>
</template>
</tbody>
</table>
</div>

<div data-mob="1" style="display: none; flex-direction: column; gap: 10px;">
<template data-sc="for" list="{{camps}}" as="c" hint-placeholder-count="6">
<a href="kerja.html#campaign" style="text-decoration: none; color: #1F2933; border: 1px solid #E3E6EB; border-left: 5px solid {{c.dot}}; border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 8px;">
<div style="display: flex; justify-content: space-between; gap: 8px; align-items: flex-start;"><div style="display: flex; flex-direction: column;"><strong style="font-size: 15px; color: #1D3149;">{{c.name}}</strong><span style="font-size: 12px; color: #5B6573;">{{c.accs}}</span></div><span style="font-size: 11px; font-weight: 900; color: {{c.stFg}}; background: {{c.stBg}}; border-radius: 7px; padding: 2px 8px; white-space: nowrap;">{{c.status}}</span></div>
<div style="display: flex; flex-direction: column; gap: 4px;"><div style="display: flex; justify-content: space-between; font-size: 12.5px;"><b style="color: #1D3149;">{{c.goal}}</b><span style="color: #5B6573;">{{c.period}}</span></div><div style="height: 7px; border-radius: 4px; background: #E3E6EB; overflow: hidden;"><div style="height: 100%; width: {{c.goalPct}}; background: {{c.goalBar}};"></div></div><span style="font-size: 11.5px; font-weight: 800; color: {{c.goalColor}};">{{c.goalNote}}</span></div>
<div style="display: grid; grid-template-columns: 1fr 1fr 1.5fr 1fr; gap: 6px;"><div style="display: flex; flex-direction: column; background: #F7F8FA; border-radius: 10px; padding: 6px 8px;"><span style="font-size: 11px; font-weight: 800; color: #5B6573;">Leads</span><span style="font-size: 13.5px; white-space: nowrap; font-weight: 900; color: #1D3149;">{{c.leads}}</span></div><div style="display: flex; flex-direction: column; background: #F7F8FA; border-radius: 10px; padding: 6px 8px;"><span style="font-size: 11px; font-weight: 800; color: #5B6573;">Closing</span><span style="font-size: 13.5px; white-space: nowrap; font-weight: 900; color: #1D3149;">{{c.closing}}</span></div><div style="display: flex; flex-direction: column; background: #F7F8FA; border-radius: 10px; padding: 6px 8px;"><span style="font-size: 11px; font-weight: 800; color: #5B6573;">Omzet</span><span style="font-size: 13.5px; white-space: nowrap; font-weight: 900; color: #1D3149;">{{c.omzet}}</span></div><div style="display: flex; flex-direction: column; background: #F7F8FA; border-radius: 10px; padding: 6px 8px;"><span style="font-size: 11px; font-weight: 800; color: #5B6573;">ROAS</span><span style="font-size: 13.5px; white-space: nowrap; font-weight: 900; color: {{c.roasColor}};">{{c.roas}}</span></div></div>
<span style="font-size: 12px; color: #3B4250;"><b style="color: #067A70;">Next:</b> {{c.next}}</span>
</a>
</template>
</div>
</section>
