nav[aria-label="Menu utama"] > div[style*="margin-top: auto"]{display:none !important}
main{padding:18px 16px 40px !important}
h1{font-size:24px !important}
}
</style>

<template data-sc="for" list="{{people}}" as="p" hint-placeholder-count="6">
<div style="background: #FFFFFF; border: 1px solid {{p.border}}; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 12px;">
<div style="display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center;">
<template data-sc="if" value="{{p.photo}}" hint-placeholder-val="{{ true }}"><img src="{{p.photo}}" alt="{{p.name}}" style="width: 72px; height: 72px; border-radius: 36px; object-fit: cover; box-shadow: 0 0 0 3px {{p.ring}};"></template>
<template data-sc="if" value="{{p.ini}}" hint-placeholder-val="{{ false }}"><span role="img" aria-label="{{p.name}}" style="width: 72px; height: 72px; border-radius: 36px; background: {{p.color}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 26px; box-shadow: 0 0 0 3px {{p.ring}};">{{p.ini}}</span></template>
<strong style="font-size: 16px; color: #1D3149;">{{p.name}}</strong>
<span style="font-size: 12px; color: #5B6573;">{{p.role}}</span>
<div style="display: flex; flex-wrap: wrap; gap: 4px; justify-content: center;">
<template data-sc="for" list="{{p.accs}}" as="a" hint-placeholder-count="2"><span style="display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 800; color: #3B4250; background: #F3F5F8; border-radius: 8px; padding: 2px 7px;"><span style="width: 7px; height: 7px; border-radius: 4px; background: {{a.dot}};"></span>{{a.name}}</span></template>
</div>
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; text-align: center; border-top: 1px solid #EEF0F3; border-bottom: 1px solid #EEF0F3; padding: 8px 0;">
<div style="display: flex; flex-direction: column;"><span style="font-size: 18px; font-weight: 900; color: #1D3149;">{{p.load}}</span><span style="font-size: 11px; font-weight: 700; color: #5B6573;">{{p.loadLabel}}</span></div>
<div style="display: flex; flex-direction: column;"><span style="font-size: 18px; font-weight: 900; color: {{p.lateColor}};">{{p.late}}</span><span style="font-size: 11px; font-weight: 700; color: #5B6573;">telat</span></div>
<div style="display: flex; flex-direction: column;"><span style="font-size: 18px; font-weight: 900; color: #1D3149;">{{p.ontime}}</span><span style="font-size: 11px; font-weight: 700; color: #5B6573;">tepat waktu</span></div>
</div>
<template data-sc="for" list="{{p.items}}" as="i" hint-placeholder-count="3">

<span style="font-size: 12.5px; font-weight: 800; color: #1D3149; line-height: 1.25;">{{i.title}}</span>
</div>
</template>
<template data-sc="if" value="{{p.alert}}" hint-placeholder-val="{{ false }}"><span style="font-size: 12px; font-weight: 800; color: #9A3F0A; background: #FCEBDD; border-radius: 10px; padding: 8px 10px;">{{p.alert}}</span></template>
</div>

<span style="font-size: 12px; color: #3B4250;">{{l.why}}</span>
<span style="font-size: 11.5px; font-weight: 800; color: {{l.stColor}};">{{l.status}}</span>
</div>
</div>
</template>
</div>
</section>

</main>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    var U = { RA: '#2F6FD0', WG: '#0FA394', NA: '#D08A1E' };
    var ST = { Ide: ['#EEF0F3', '#3B4250'], Brief: ['#E5EEF9', '#1E5AA8'], Produksi: ['#FDF3D7', '#7A5200'], Review: ['#FFF1E0', '#9A5B00'], Revisi: ['#FCEBDD', '#9A3F0A'], Terjadwal: ['#DDF5F2', '#067A70'] };
    var i = function (stage, when, title) { return { stage: stage, when: when, title: title, bg: ST[stage][0], fg: ST[stage][1] }; };
    var a = function (name, u) { return { name: name, dot: U[u] }; };
