<main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 28px 36px 48px; display: flex; flex-direction: column; gap: 22px;">

<header style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px;">
<div style="display: flex; flex-direction: column; gap: 4px;">
<span style="font-size: 13px; color: #5B6573; font-weight: 600;">Dari mana setiap angka, siapa yang mengisi, kapan, dan bagaimana dijaga</span>
<h1 style="margin: 0; font-size: 30px; font-weight: 900; letter-spacing: -0.01em;">Input &amp; Kualitas Data</h1>
</div>
<span style="font-size: 12px; font-weight: 700; color: #5B6573; border: 1px dashed #A9B4C2; border-radius: 18px; padding: 8px 12px;">Status contoh</span>
</header>

<section aria-label="Status saat ini" style="background: #1D3149; color: #FFFFFF; border-radius: 20px; padding: 22px 24px; display: flex; flex-wrap: wrap; gap: 28px; align-items: center;">
<div style="flex: 1 1 300px; display: flex; flex-direction: column; gap: 6px;">
<span style="font-size: 12px; font-weight: 800; letter-spacing: 0.1em; color: #86DCD3;">KONDISI HARI INI</span>
<span style="font-size: 22px; font-weight: 900; line-height: 1.3;">Belum ada sumber yang tersambung. Semua angka di dashboard masih contoh.</span>
<span style="font-size: 13px; color: #C5D3E3;">Dari {{total}} jenis data: sebagian bisa otomatis setelah disambung, sebagian memang harus diisi manusia karena tidak ada API-nya.</span>
</div>
<div style="flex: 2 1 520px; display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 14px;">
<template data-sc="for" list="{{catSum}}" as="c" hint-placeholder-count="5">
<div style="display: flex; flex-direction: column; gap: 2px;"><span style="font-size: 30px; font-weight: 900;">{{c.n}}</span><span style="font-size: 12px; font-weight: 700; color: #C5D3E3;"><span style="display: inline-block; width: 8px; height: 8px; border-radius: 4px; background: {{c.dot}}; margin-right: 6px;"></span>{{c.label}}</span><span style="font-size: 11px; color: #A9B4C2;">{{c.desc}}</span></div>
</template>
</div>
</section>

<section aria-labelledby="cls-h" style="background: #FFFFFF; border: 1px solid #E3E6EB; border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 12px;">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 10px;">
<div style="display: flex; flex-direction: column;"><h2 id="cls-h" style="margin: 0; font-size: 18px; font-weight: 800;">Klasifikasi semua data</h2><span style="font-size: 13px; color: #5B6573;">Pilih kategori untuk menyaring. Kolom "Penjaga kualitas" = cara memastikan angkanya benar.</span></div>
<div role="group" aria-label="Filter kategori" style="display: flex; flex-wrap: wrap; gap: 6px;">
<template data-sc="for" list="{{catFilters}}" as="f" hint-placeholder-count="6">
<button type="button" onClick="{{f.pick}}" aria-pressed="{{f.pressed}}" style="height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid {{f.border}}; background: {{f.bg}}; color: {{f.fg}}; font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer;">{{f.label}}</button>
</template>
</div>
</div>
<div style="overflow-x: auto;">
<table style="width: 100%; min-width: 1260px; border-collapse: collapse; font-size: 13px;">
<thead><tr style="text-align: left; color: #5B6573; font-size: 12px;">
<th scope="col" style="padding: 8px; border-bottom: 1px solid #E3E6EB; font-weight: 800;">Data</th>
<th scope="col" style="padding: 8px; border-bottom: 1px solid #E3E6EB; font-weight: 800;">Kategori</th>
<th scope="col" style="padding: 8px; border-bottom: 1px solid #E3E6EB; font-weight: 800;">Sumber</th>
<th scope="col" style="padding: 8px; border-bottom: 1px solid #E3E6EB; font-weight: 800;">Yang mengisi</th>
<th scope="col" style="padding: 8px; border-bottom: 1px solid #E3E6EB; font-weight: 800;">Kapan</th>
<th scope="col" style="padding: 8px; border-bottom: 1px solid #E3E6EB; font-weight: 800;">Penjaga kualitas</th>
<th scope="col" style="padding: 8px; border-bottom: 1px solid #E3E6EB; font-weight: 800;">Risiko</th>
</tr></thead>
<tbody>
<template data-sc="for" list="{{rows}}" as="r" hint-placeholder-count="12">
<tr>
<th scope="row" style="text-align: left; padding: 10px 8px; border-bottom: 1px solid #EEF0F3; vertical-align: top;"><span style="font-weight: 800;">{{r.data}}</span><br><span style="font-size: 12px; font-weight: 600; color: #5B6573;">Halaman: {{r.page}}</span></th>
<td style="padding: 10px 8px; border-bottom: 1px solid #EEF0F3; vertical-align: top;"><span style="font-size: 12px; font-weight: 800; border-radius: 8px; padding: 2px 8px; background: {{r.bg}}; color: {{r.fg}}; white-space: nowrap;">{{r.cat}}</span></td>
<td style="padding: 10px 8px; border-bottom: 1px solid #EEF0F3; vertical-align: top; color: #3B4250;">{{r.src}}</td>
<td style="padding: 10px 8px; border-bottom: 1px solid #EEF0F3; vertical-align: top; font-weight: 700;">{{r.who}}</td>
<td style="padding: 10px 8px; border-bottom: 1px solid #EEF0F3; vertical-align: top; white-space: nowrap;">{{r.when}}</td>
<td style="padding: 10px 8px; border-bottom: 1px solid #EEF0F3; vertical-align: top; color: #3B4250;">{{r.qc}}</td>
<td style="padding: 10px 8px; border-bottom: 1px solid #EEF0F3; vertical-align: top; color: {{r.riskColor}}; font-weight: 700;">{{r.risk}}</td>
</tr>
</template>
</tbody>
</table>
</div>
</section>

<section aria-labelledby="form-h" style="background: #FFFFFF; border: 1px solid #E3E6EB; border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 16px;">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 10px;">
<div style="display: flex; flex-direction: column;"><span style="font-size: 12px; font-weight: 800; letter-spacing: 0.08em; color: #067A70;">CONTOH FORM · DIISI PIC WA TIAP HARI SEBELUM 21.00</span><h2 id="form-h" style="margin: 0; font-size: 20px; font-weight: 900;">Laporan Harian PIC WA</h2><span style="font-size: 13px; color: #5B6573;">Satu laporan per nomor CS. Angka klik tautan sudah terisi otomatis sebagai pembanding. Coba ubah angka untuk melihat pengecekan otomatis.</span></div>
<span style="font-size: 13px; font-weight: 800; border-radius: 12px; padding: 4px 12px; background: #FDF3D7; color: #7A5200;">Batas kirim 21.00 · sisa 7 jam 30 menit</span>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start;">
<form style="flex: 3 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 18px;">

<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px;">
<div style="display: flex; flex-direction: column; gap: 4px;"><label for="tgl" style="font-size: 12px; font-weight: 800;">Tanggal</label><input id="tgl" type="text" value="Rabu, 28 Okt 2026" readonly style="min-height: 44px; padding: 0 12px; border-radius: 10px; border: 1px solid #E3E6EB; background: #F3F5F8; font-family: inherit; font-size: 14px; color: #1F2933;"></div>
<div style="display: flex; flex-direction: column; gap: 4px;"><label for="nomor" style="font-size: 12px; font-weight: 800;">Nomor CS</label><select id="nomor" style="min-height: 44px; padding: 0 12px; border-radius: 10px; border: 1px solid #C9CED6; background: #FFFFFF; font-family: inherit; font-size: 14px; color: #1F2933;"><option>CS Garut Kota</option><option>CS Bandung</option><option>CS Wanaraja</option><option>CS TripinAja</option><option>CS Niagaaja</option></select></div>
<div style="display: flex; flex-direction: column; gap: 4px;"><label for="pic" style="font-size: 12px; font-weight: 800;">PIC (dari login)</label><input id="pic" type="text" value="Admin CS Garut Kota" readonly style="min-height: 44px; padding: 0 12px; border-radius: 10px; border: 1px solid #E3E6EB; background: #F3F5F8; font-family: inherit; font-size: 14px; color: #1F2933;"></div>
<div style="display: flex; flex-direction: column; gap: 4px;"><label for="shift" style="font-size: 12px; font-weight: 800;">Shift</label><select id="shift" style="min-height: 44px; padding: 0 12px; border-radius: 10px; border: 1px solid #C9CED6; background: #FFFFFF; font-family: inherit; font-size: 14px; color: #1F2933;"><option>Pagi 07.30–15.00</option><option>Sore 15.00–23.00</option><option>Penuh</option></select></div>
</div>

<fieldset style="border: 1px solid #E3E6EB; border-radius: 14px; margin: 0; padding: 14px; display: flex; flex-direction: column; gap: 10px;">
<legend style="font-size: 14px; font-weight: 900; padding: 0 6px;">A · Chat masuk per sumber</legend>
<div style="display: grid; grid-template-columns: minmax(0, 1.6fr) 110px 120px minmax(0, 1fr); gap: 8px; font-size: 12px; font-weight: 800; color: #5B6573;"><span>Kode sumber</span><span style="text-align: right;">Klik tautan (otomatis)</span><span style="text-align: right;">Chat masuk (isi)</span><span>Cek</span></div>
<template data-sc="for" list="{{srcRows}}" as="s" hint-placeholder-count="8">
<div style="display: grid; grid-template-columns: minmax(0, 1.6fr) 110px 120px minmax(0, 1fr); gap: 8px; align-items: center;">
<label for="{{s.id}}" style="font-size: 13px; font-weight: 700;">{{s.name}} <span style="font-weight: 600; color: #5B6573;">{{s.code}}</span></label>
<span style="font-size: 13px; text-align: right; color: #5B6573;">{{s.clicks}}</span>
<input id="{{s.id}}" type="number" min="0" value="{{s.val}}" onInput="{{s.set}}" style="min-height: 40px; padding: 0 10px; border-radius: 8px; border: 2px solid {{s.border}}; font-family: inherit; font-size: 14px; font-weight: 800; color: #1F2933; text-align: right;">
<span style="font-size: 12px; font-weight: 800; color: {{s.flagColor}};">{{s.flag}}</span>
</div>
</template>
<div style="display: flex; justify-content: space-between; align-items: center; padding-top: 6px; border-top: 1px solid #EEF0F3;"><span style="font-size: 13px; font-weight: 800;">Total chat masuk</span><span style="font-size: 18px; font-weight: 900;">{{totalChat}}</span></div>
</fieldset>

<fieldset style="border: 1px solid #E3E6EB; border-radius: 14px; margin: 0; padding: 14px; display: flex; flex-direction: column; gap: 10px;">
<legend style="font-size: 14px; font-weight: 900; padding: 0 6px;">B · Hasil percakapan hari ini</legend>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px;">
<template data-sc="for" list="{{outRows}}" as="o" hint-placeholder-count="4">
<div style="display: flex; flex-direction: column; gap: 4px;"><label for="{{o.id}}" style="font-size: 12px; font-weight: 800;">{{o.label}}</label><input id="{{o.id}}" type="number" min="0" value="{{o.val}}" onInput="{{o.set}}" style="min-height: 44px; padding: 0 12px; border-radius: 10px; border: 2px solid {{o.border}}; font-family: inherit; font-size: 15px; font-weight: 800; color: #1F2933;"><span style="font-size: 11px; color: #5B6573;">{{o.hint}}</span></div>
</template>
</div>
<div style="display: flex; flex-direction: column; gap: 6px;">
<span style="font-size: 12px; font-weight: 800;">Alasan tidak jadi (pilih, bukan ketik bebas)</span>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px;">
<template data-sc="for" list="{{lostRows}}" as="l" hint-placeholder-count="6">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 10px; border-radius: 10px; background: #F3F5F8;"><label for="{{l.id}}" style="font-size: 12px; font-weight: 700;">{{l.name}}</label><input id="{{l.id}}" type="number" min="0" value="{{l.val}}" style="width: 56px; min-height: 36px; padding: 0 6px; border-radius: 8px; border: 1px solid #C9CED6; font-family: inherit; font-size: 14px; font-weight: 800; text-align: right;"></div>
</template>

    var samples = SM.map(function (s, i) { return { n: i + 1, in: s[0], out: s[1], gap: gaps[i] + ' menit', color: gaps[i] <= 5 ? '#067A70' : '#9A3F0A' }; });
    var sorted = gaps.slice().sort(function (a, b) { return a - b; });
    var median = sorted[2] + ' menit';

    var avgVal = Number(O.close) ? Number(O.value) / Number(O.close) : 0;
    var valBad = Number(O.close) && (avgVal < 50000 || avgVal > 25000000);
    var noCodeShare = totalChat ? (Number(S.none) || 0) / totalChat : 0;
    var C = [
      { ok: !flagsBad, warn: flagsBad > 0, title: 'Chat vs klik tautan berkode', body: flagsBad ? flagsBad + ' sumber selisih besar dengan klik. Cek label atau tulis alasannya.' : 'Semua sumber wajar dibanding klik tautan.' },
      { ok: !orderBad, title: 'Urutan corong masuk akal', body: orderBad ? 'Closing ≤ DP ≤ penawaran ≤ total chat belum terpenuhi.' : 'Closing ≤ DP ≤ penawaran ≤ total chat.' },
      { ok: !valBad, title: 'Nilai per closing wajar', body: Number(O.close) ? 'Rata-rata Rp ' + Math.round(avgVal / 1000).toLocaleString('id-ID') + ' rb per closing (batas Rp 50 rb–25 jt).' : 'Belum ada closing.' },
      { ok: true, title: 'Closing cocok dengan kasir', body: 'Rentalaja App mencatat 11 transaksi bertanda [CS Garut Kota] hari ini.' },
      { ok: noCodeShare < 0.05, warn: noCodeShare >= 0.05, title: 'Chat tanpa kode', body: Math.round(noCodeShare * 100) + '% dari chat (target < 5%).' },
      { ok: Number(S.ads) > 0, title: 'Sesuai data Meta Ads', body: 'Meta mencatat 16 chat dimulai dari iklan untuk nomor ini.' },
      { ok: this.state.shot, title: 'Bukti story diunggah', body: this.state.shot ? 'Screenshot viewer story sudah ada.' : 'Wajib, karena story hilang setelah 24 jam.' }
    ];
    var checks = C.map(function (c) { var bad = !c.ok && !c.warn; return { title: c.title, body: c.body, icon: c.ok ? '✓' : (c.warn ? '!' : '✕'), bg: c.ok ? '#DDF5F2' : (c.warn ? '#FDF3D7' : '#FCEBDD'), fg: c.ok ? '#067A70' : (c.warn ? '#7A5200' : '#9A3F0A') }; });
    var nBad = C.filter(function (c) { return !c.ok && !c.warn; }).length;
    var nWarn = C.filter(function (c) { return c.warn; }).length;

    var schedule = [
      { when: 'Setiap transaksi', items: [{ what: 'Kode promo / sumber', who: 'Kasir & CS cabang', time: 'saat input transaksi' }, { what: 'Status konten + tautan', who: 'Pembuat konten', time: 'saat pindah tahap' }] },
      { when: 'Harian · sebelum 21.00', items: [{ what: 'Laporan Harian PIC WA', who: 'PIC WA tiap nomor', time: '±10 menit' }, { what: 'Viewer story + screenshot', who: 'PIC WA', time: '±2 menit' }, { what: 'Ulasan Maps baru', who: 'CS cabang', time: '±5 menit' }] },
      { when: 'Mingguan · Senin 10.00', items: [{ what: 'Data TikTok', who: 'Dita', time: '±10 menit' }, { what: 'CSV Google Maps', who: 'Mugni', time: '±5 menit' }, { what: 'Harga & promo pesaing', who: 'Kevin', time: '±20 menit' }] },
      { when: 'Bulanan & per kejadian', items: [{ what: 'Target bulan depan', who: 'CEO + Keuangan', time: 'tanggal 28' }, { what: 'Budget per kanal', who: 'Reza', time: 'tanggal 1' }, { what: 'Deal & insight KOL', who: 'Kevin', time: 'saat deal · H+7' }] }
    ];
    var Q = [
      ['CS Garut Kota', 'Laporan harian PIC WA', 100, 96, 91, 5, 96], ['CS Bandung', 'Laporan harian PIC WA', 92, 78, 74, 12, 81], ['CS Wanaraja', 'Laporan harian PIC WA', 85, 70, 80, 9, 74],
      ['CS TripinAja', 'Laporan harian PIC WA', 100, 92, 88, 7, 92], ['CS Niagaaja', 'Laporan harian PIC WA', 96, 88, 90, 11, 88],
      ['Dita', 'TikTok mingguan · status konten', 100, 100, null, null, 100], ['Mugni', 'CSV Maps · status konten', 75, 75, null, null, 75], ['Kevin', 'KOL · pesaing · status konten', 100, 75, null, null, 83]
    ];
    var quality = Q.map(function (q) {
      var parts = [q[2], q[3], q[6]].concat(q[4] === null ? [] : [q[4]]);
      var sc = Math.round(parts.reduce(function (a, b) { return a + b; }, 0) / parts.length);
      return { who: q[0], what: q[1], comp: q[2] + '%', time: q[3] + '%', match: q[4] === null ? '—' : q[4] + '%', nocode: q[5] === null ? '—' : q[5] + '%', proof: q[6] + '%', score: sc, bg: sc >= 85 ? '#DDF5F2' : '#FCEBDD', fg: sc >= 85 ? '#067A70' : '#9A3F0A' };
    });
    var rules = [
      { t: '1 · Semua tautan berkode', b: 'Tidak ada tautan WA atau web yang disebar tanpa kode sumber. Link dibuat hanya dari pokama.org.' },
      { t: '2 · Pilihan, bukan ketik bebas', b: 'Sumber, alasan gagal, jenis konten dipilih dari daftar tetap supaya bisa dijumlahkan.' },
      { t: '3 · Satu angka, satu pemilik', b: 'Setiap data punya satu PIC. Kalau kosong, yang ditanya jelas siapa.' },
      { t: '4 · Batas waktu = slot KKH', b: 'Input manual masuk KKH. Telat mengisi tercatat seperti telat pekerjaan lain.' },
      { t: '5 · Dicocokkan otomatis', b: 'Angka manual dibandingkan dengan data otomatis (klik tautan, Meta, kasir). Selisih besar wajib alasan.' },
      { t: '6 · Bukti untuk yang hilang 24 jam', b: 'Story dan jam balas wajib screenshot karena tidak bisa dicek ulang besoknya.' },
      { t: '7 · Terkunci setelah validasi', b: 'Kepala Staf memvalidasi sebelum 09.00. Koreksi setelahnya tercatat siapa dan kapan.' },
      { t: '8 · Skor kualitas masuk performa', b: 'Skor di bawah 85 dua minggu berturut-turut dibahas di review mingguan.' }
    ];

    return {
      total: R.length, catSum: catSum, catFilters: catFilters, rows: rows,
      srcRows: srcRows, totalChat: totalChat, outRows: outRows, lostRows: lostRows, samples: samples, median: median,
      checks: checks, checkHead: nBad ? nBad + ' harus diperbaiki sebelum kirim' : (nWarn ? 'Bisa dikirim, ' + nWarn + ' perlu alasan' : 'Siap dikirim'),
      sendBg: nBad ? '#E3E6EB' : '#09BEAF', sendColor: nBad ? '#9A3F0A' : '#067A70', sendNote: nBad ? 'Perbaiki tanda merah dulu' : 'Laporan siap dikirim',
      shotLabel: this.state.shot ? '✓ Screenshot viewer story (terunggah)' : '+ Unggah screenshot viewer story', shotPressed: this.state.shot ? 'true' : 'false', shotBorder: this.state.shot ? '#09BEAF' : '#C2410C', shotBg: this.state.shot ? '#F0FBF9' : '#FFFFFF',
      toggleShot: function () { self.setState({ shot: !self.state.shot }); },
      schedule: schedule, quality: quality, rules: rules
    };
  }
}
