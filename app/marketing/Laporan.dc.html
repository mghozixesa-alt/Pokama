<style>
body{margin:0;background:#F3F5F8}
a{color:#1D3149}a:hover{color:#0F1D2E}
table{font-variant-numeric:tabular-nums}
main > header{background:radial-gradient(circle at 92% -30%, rgba(9,190,175,.45), transparent 42%),linear-gradient(135deg,#1D3149 0%,#28507A 100%);border-radius:22px;padding:22px 26px;align-items:center !important;box-shadow:0 10px 30px rgba(29,49,73,.18)}
main > header h1{color:#FFFFFF !important}
main > header span{color:#D3E0EC !important}
main > header b{color:#7FF0E2 !important}
main > header span[style*="dashed"]{border-color:rgba(255,255,255,.45) !important}
main > header button{border-color:rgba(255,255,255,.35) !important}
main > header button[aria-pressed="true"]{background:#09BEAF !important;color:#1D3149 !important;border-color:#09BEAF !important}
main > header button[aria-pressed="false"]{background:rgba(255,255,255,.08) !important;color:#FFFFFF !important}
main > header a{color:#1D3149}
main section{transition:box-shadow .2s ease, transform .2s ease}
main section:hover{box-shadow:0 8px 24px rgba(29,49,73,.07)}
main > header span[aria-hidden="true"]{flex:none}
@media (max-width: 760px){article[style*="grid-template-columns: 36px minmax(0, 1fr) auto"]{grid-template-columns:32px minmax(0,1fr) !important}
article[style*="grid-template-columns: 36px minmax(0, 1fr) auto"] > div:last-child{grid-column:2;flex-direction:row !important;justify-content:space-between;align-items:center !important}}
@media (max-width: 760px){main > header{padding:16px !important;border-radius:16px}}
@media (max-width: 760px){table:not(:has(th:nth-child(5))){min-width:0 !important;width:100% !important}}
td[style*="text-align: right"]{white-space:nowrap}
tbody tr:hover td{background:#F9FAFB}
thead th{position:sticky;top:0;background:#FFFFFF}
button:focus-visible,a:focus-visible{outline:2px solid #09BEAF;outline-offset:2px;border-radius:8px}
button{transition:filter .15s}button:hover{filter:brightness(0.97)}
@media (max-width: 760px){
nav[aria-label="Menu utama"]{flex:1 1 100% !important;flex-direction:row !important;align-items:center !important;overflow-x:auto;gap:4px !important;padding:8px 12px !important;border-right:0 !important;border-bottom:1px solid #E3E6EB;position:sticky;top:0;z-index:20;scrollbar-width:none}
nav[aria-label="Menu utama"] > div{flex-direction:row !important;gap:4px !important;padding:0 !important;flex:none !important}
nav[aria-label="Menu utama"] > div > span:first-child{display:none !important}
nav[aria-label="Menu utama"] > div:first-child img{width:84px !important}
nav[aria-label="Menu utama"] > div:first-child span{display:none !important}
nav[aria-label="Menu utama"] a{white-space:nowrap;min-height:36px !important;padding:0 10px !important}
nav[aria-label="Menu utama"] > div[style*="margin-top: auto"]{display:none !important}
main{padding:18px 16px 40px !important}
h1{font-size:24px !important}
}
</style>

<main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 28px 36px 48px; display: flex; flex-direction: column; gap: 22px;">

<header style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px;">
<div style="display: flex; flex-direction: column; gap: 4px; max-width: 960px;">
<span style="font-size: 13px; color: #5B6573; font-weight: 700;">Dikirim lewat jalur WA yang sama dengan KKH</span>
<h1 style="margin: 0; font-size: 28px; font-weight: 900; color: #1D3149;">Laporan &amp; WA</h1>
<span style="font-size: 14px; color: #3B4250;">Ringkasan rutin ke CEO dan leader unit, laporan masalah dan masukan ke unit bisnis, serta pengaturan kapan WA dikirim dan ke siapa.</span>
</div>
<span style="font-size: 12px; font-weight: 700; color: #5B6573; border: 1px dashed #A9B4C2; border-radius: 18px; padding: 8px 12px;">Data contoh</span>
</header>

<section aria-labelledby="rep-h" style="background: #FFFFFF; border: 1px solid #E3E6EB; border-radius: 20px; padding: 18px 20px; display: flex; flex-direction: column; gap: 14px;">
<div style="display: flex; flex-direction: column;"><h2 id="rep-h" data-icon-done="1" style="display: flex; align-items: center; gap: 10px; margin: 0; font-size: 18px; font-weight: 900; color: #1D3149;"><span aria-hidden="true" style="width: 28px; height: 28px; flex: none; border-radius: 8px; background: #FDF3D7; color: #7A5200; display: inline-flex; align-items: center; justify-content: center;"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16v-5a6 6 0 0 1 12 0v5l2 2H4zM10 20a2 2 0 0 0 4 0"></path></svg></span>1 · Laporan rutin</h2><span style="font-size: 12.5px; color: #5B6573;">Dibuat otomatis dari data dashboard. Klik satu laporan untuk melihat contoh pesan WA-nya.</span></div>
<div style="display: flex; flex-wrap: wrap; gap: 18px; align-items: flex-start;">
<div style="flex: 3 1 520px; min-width: 0; display: flex; flex-direction: column; gap: 8px;">
<template data-sc="for" list="{{reports}}" as="r" hint-placeholder-count="5">
<button type="button" onClick="{{r.pick}}" aria-pressed="{{r.pressed}}" style="text-align: left; font-family: inherit; cursor: pointer; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 12px 14px; border-radius: 14px; border: {{r.bw}} solid {{r.border}}; background: #FFFFFF;">
<span style="display: flex; flex-direction: column; gap: 2px; min-width: 0;"><strong style="font-size: 14.5px; color: #1D3149;">{{r.name}}</strong><span style="font-size: 12.5px; color: #3B4250;">Ke {{r.to}} · {{r.when}}</span><span style="font-size: 12px; color: #5B6573;">{{r.what}}</span></span>
<span style="font-size: 11.5px; font-weight: 900; color: {{r.stFg}}; background: {{r.stBg}}; border-radius: 8px; padding: 3px 9px; white-space: nowrap;">{{r.status}}</span>
</button>
</template>
</div>
<div style="flex: 2 1 340px; min-width: 0; display: flex; flex-direction: column; gap: 8px; align-items: center;">
<span style="font-size: 12px; font-weight: 800; color: #5B6573;">Contoh pesan WA: {{pv.name}}</span>
<div style="width: 100%; max-width: 380px; background: #ECE5DD; border-radius: 18px; padding: 14px; box-sizing: border-box;">
<div style="background: #DCF8C6; border-radius: 12px 12px 2px 12px; padding: 10px 12px; font-size: 13px; color: #1F2933; line-height: 1.5; box-shadow: 0 1px 1px rgba(0,0,0,0.08);">
<template data-sc="for" list="{{pv.lines}}" as="l" hint-placeholder-count="8"><div style="font-weight: {{l.w}}; margin-top: {{l.mt}};">{{l.t}}</div></template>
<div style="text-align: right; font-size: 11px; color: #5B6573; margin-top: 4px;">{{pv.time}} ✓✓</div>
</div>
</div>
</div>
</div>
</section>

<section aria-labelledby="esc-h" style="background: #FFFFFF; border: 1px solid #E3E6EB; border-radius: 20px; padding: 18px 20px; display: flex; flex-direction: column; gap: 14px;">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 10px;"><div style="display: flex; flex-direction: column;"><h2 id="esc-h" data-icon-done="1" style="display: flex; align-items: center; gap: 10px; margin: 0; font-size: 18px; font-weight: 900; color: #1D3149;"><span aria-hidden="true" style="width: 28px; height: 28px; flex: none; border-radius: 8px; background: #FCEBDD; color: #9A3F0A; display: inline-flex; align-items: center; justify-content: center;"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l10 18H2zM12 10v5M12 18h.01"></path></svg></span>2 · Masalah dan masukan untuk unit bisnis</h2><span style="font-size: 12.5px; color: #5B6573;">Yang ditemukan marketing tapi bukan pekerjaan konten: harga, stok, layanan, operasional, ide produk. Dikirim ke leader unit lewat WA dan jadi tugas di KKH.</span></div><button type="button" onClick="{{toggleForm}}" style="height: 40px; padding: 0 16px; border-radius: 10px; border: 0; background: #09BEAF; color: #1D3149; font-family: inherit; font-size: 13.5px; font-weight: 900; cursor: pointer;">+ Laporkan masalah / masukan</button></div>
<template data-sc="if" value="{{showForm}}" hint-placeholder-val="{{ false }}">
<div style="border: 1px solid #BFE9E3; background: #F0FBF9; border-radius: 14px; padding: 14px; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px;">
<template data-sc="for" list="{{formFields}}" as="f" hint-placeholder-count="6"><label style="display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; font-weight: 800; color: #3B4250;">{{f.k}}<span style="min-height: 40px; box-sizing: border-box; border: 1px solid #D5DAE1; border-radius: 10px; padding: 8px 12px; background: #FFFFFF; font-weight: 600; color: #1F2933;">{{f.v}}</span></label></template>
<div style="grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 10px; align-items: center;"><button type="button" onClick="{{sendForm}}" style="height: 40px; padding: 0 16px; border-radius: 10px; border: 0; background: {{sendBg}}; color: #1D3149; font-family: inherit; font-size: 13.5px; font-weight: 900; cursor: pointer;">{{sendLabel}}</button><span style="font-size: 12px; color: #3B4250;">Terkirim ke WA leader unit, jadi tugas di KKH-nya, dan tembusan ke CEO kalau prioritas tinggi.</span></div>
</div>
</template>
<div style="overflow-x: auto;">
<table style="width: 100%; min-width: 900px; border-collapse: collapse; font-size: 13px;">
<thead><tr style="color: #5B6573; font-size: 12px; text-align: left;"><th scope="col" style="padding: 8px; border-bottom: 1px solid #E3E6EB;">Masalah / masukan</th><th scope="col" style="padding: 8px; border-bottom: 1px solid #E3E6EB;">Bukti</th><th scope="col" style="padding: 8px; border-bottom: 1px solid #E3E6EB;">Ke</th><th scope="col" style="padding: 8px; border-bottom: 1px solid #E3E6EB;">Prioritas</th><th scope="col" style="padding: 8px; border-bottom: 1px solid #E3E6EB;">Status</th><th scope="col" style="padding: 8px; border-bottom: 1px solid #E3E6EB;">Umur</th></tr></thead>
<tbody>
<template data-sc="for" list="{{issues}}" as="i" hint-placeholder-count="6">
<tr><td style="padding: 10px 8px; border-bottom: 1px solid #EEF0F3;"><span style="font-size: 11.5px; font-weight: 900; color: {{i.catFg}}; background: {{i.catBg}}; border-radius: 6px; padding: 1px 6px;">{{i.cat}}</span><br><strong style="color: #1D3149;">{{i.title}}</strong></td><td style="padding: 10px 8px; border-bottom: 1px solid #EEF0F3; color: #3B4250; max-width: 280px;">{{i.proof}}</td><td style="padding: 10px 8px; border-bottom: 1px solid #EEF0F3; font-weight: 700;">{{i.to}}</td><td style="padding: 10px 8px; border-bottom: 1px solid #EEF0F3; font-weight: 800; color: {{i.prColor}};">{{i.pr}}</td><td style="padding: 10px 8px; border-bottom: 1px solid #EEF0F3;"><span style="font-size: 11.5px; font-weight: 900; color: {{i.stFg}}; background: {{i.stBg}}; border-radius: 8px; padding: 2px 8px; white-space: nowrap;">{{i.status}}</span></td><td style="padding: 10px 8px; border-bottom: 1px solid #EEF0F3; font-weight: 700; color: {{i.ageColor}};">{{i.age}}</td></tr>
</template>
</tbody>
</table>
</div>
<span style="font-size: 12px; color: #5B6573;">Belum ditindaklanjuti lebih dari 2 hari → otomatis naik ke CEO lewat WA.</span>
