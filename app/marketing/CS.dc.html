<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Halaman CS — Marketing Pokama</title>
<link rel="icon" href="logo-pokama.png">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F3F5F8}
a{color:#1D3149}
table{font-variant-numeric:tabular-nums}
main > header{background:radial-gradient(circle at 92% -30%, rgba(9,190,175,.45), transparent 42%),linear-gradient(135deg,#1D3149 0%,#28507A 100%);border-radius:22px;padding:22px 26px;align-items:center !important;box-shadow:0 10px 30px rgba(29,49,73,.18)}
main > header h1{color:#FFFFFF !important}
main > header span{color:#D3E0EC !important}
main > header b{color:#7FF0E2 !important}
main > header span[style*="dashed"]{border-color:rgba(255,255,255,.45) !important}
main > header button{border-color:rgba(255,255,255,.35) !important}
main > header button[aria-pressed="true"]{background:#09BEAF !important;color:#1D3149 !important;border-color:#09BEAF !important}
main > header button[aria-pressed="false"]{background:rgba(255,255,255,.08) !important;color:#FFFFFF !important}
main > header a{color:#1D3149}
main section{transition:box-shadow .2s ease, transform .2s ease}
main section:hover{box-shadow:0 8px 24px rgba(29,49,73,.07)}
main > header span[aria-hidden="true"]{flex:none}
@media (max-width: 760px){article[style*="grid-template-columns: 36px minmax(0, 1fr) auto"]{grid-template-columns:32px minmax(0,1fr) !important}
article[style*="grid-template-columns: 36px minmax(0, 1fr) auto"] > div:last-child{grid-column:2;flex-direction:row !important;justify-content:space-between;align-items:center !important}}
@media (max-width: 760px){main > header{padding:16px !important;border-radius:16px}}
@media (max-width: 760px){table:not(:has(th:nth-child(5))){min-width:0 !important;width:100% !important}}
td[style*="text-align: right"]{white-space:nowrap}
tbody tr:hover td{background:#F9FAFB}
thead th{position:sticky;top:0;background:#FFFFFF}
button:focus-visible,a:focus-visible{outline:2px solid #09BEAF;outline-offset:2px;border-radius:8px}
button{transition:filter .15s}button:hover{filter:brightness(0.97)}
@media (max-width: 760px){
nav[aria-label="Menu utama"]{flex:1 1 100% !important;flex-direction:row !important;align-items:center !important;overflow-x:auto;gap:4px !important;padding:8px 12px !important;border-right:0 !important;border-bottom:1px solid #E3E6EB;position:sticky;top:0;z-index:20;scrollbar-width:none}
nav[aria-label="Menu utama"] > div{flex-direction:row !important;gap:4px !important;padding:0 !important;flex:none !important}
nav[aria-label="Menu utama"] > div > span:first-child{display:none !important}
nav[aria-label="Menu utama"] > div:first-child img{width:84px !important}
nav[aria-label="Menu utama"] > div:first-child span{display:none !important}
nav[aria-label="Menu utama"] a{white-space:nowrap;min-height:36px !important;padding:0 10px !important}
nav[aria-label="Menu utama"] > div[style*="margin-top: auto"]{display:none !important}
main{padding:18px 16px 40px !important}
h1{font-size:24px !important}
}
</style>
<link rel="stylesheet" href="gate.css">
<script src="gate.js"></script>
<script src="dc-lite.js"></script>
</head>
<body>
<template id="dc-tpl">

<div style="min-height: 1960px; background: #F3F5F8; color: #1F2933; font-family: 'Nunito', system-ui, sans-serif; font-size: 14px; line-height: 1.45; box-sizing: border-box; padding: 32px 40px 48px; display: flex; flex-direction: column; gap: 24px;">

<header style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 16px;">
<div style="display: flex; flex-direction: column; gap: 4px; max-width: 900px;">
<span style="font-size: 13px; color: #5B6573; font-weight: 700;">Untuk CS WA · bukan bagian dari KKH atau modul Marketing</span>
<h1 style="margin: 0; font-size: 28px; font-weight: 900; color: #1D3149;">Halaman CS</h1>
<span style="font-size: 14px; color: #3B4250; max-width: 900px;">Tandai hasil chat, kirim follow-up, isi viewer story, dan catat broadcast. Dibuka di HP, sekitar 15 menit sehari.</span>
<span style="font-size: 14px; color: #3B4250;">CS tetap membalas chat di WhatsApp Business seperti biasa. Halaman ini hanya untuk menandai hasil chat, mengisi viewer Story, dan mencatat broadcast. CS tidak bisa melihat omzet, iklan, atau data tim.</span>
</div>
<span style="font-size: 12px; font-weight: 700; color: #5B6573; border: 1px dashed #A9B4C2; border-radius: 18px; padding: 8px 12px;">Data contoh</span>
</header>

<section aria-labelledby="flow-h" style="background: #FFFFFF; border: 1px solid #E3E6EB; border-radius: 20px; padding: 18px 20px; display: flex; flex-direction: column; gap: 14px;">
<h2 id="flow-h" data-icon-done="1" style="display: flex; align-items: center; gap: 10px; margin: 0; font-size: 18px; font-weight: 900; color: #1D3149;"><span aria-hidden="true" style="width: 28px; height: 28px; flex: none; border-radius: 8px; background: #DDF5F2; color: #067A70; display: inline-flex; align-items: center; justify-content: center;"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h10M6 12h12M9 18h10"></path></svg></span>Alur harian CS</h2>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px;">
<template data-sc="for" list="{{flow}}" as="f" hint-placeholder-count="5">
<div style="display: flex; flex-direction: column; gap: 4px; padding: 12px; border-radius: 14px; background: {{f.bg}}; border-top: 4px solid {{f.color}};">
<span style="font-size: 12px; font-weight: 900; color: {{f.color}};">{{f.when}}</span>
<strong style="font-size: 14px; color: #1D3149;">{{f.title}}</strong>
<span style="font-size: 12.5px; color: #3B4250;">{{f.body}}</span>
</div>
</template>
</div>
</section>

<section aria-labelledby="who-h" style="background: #FFFFFF; border: 1px solid #E3E6EB; border-radius: 20px; padding: 18px 20px; display: flex; flex-direction: column; gap: 12px;">
<div style="display: flex; flex-direction: column;"><h2 id="who-h" data-icon-done="1" style="display: flex; align-items: center; gap: 10px; margin: 0; font-size: 18px; font-weight: 900; color: #1D3149;"><span aria-hidden="true" style="width: 28px; height: 28px; flex: none; border-radius: 8px; background: #EFEDFF; color: #4B3BA8; display: inline-flex; align-items: center; justify-content: center;"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11a3.5 3.5 0 1 0 0-7a3.5 3.5 0 1 0 0 7zM2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5M17 11a2.5 2.5 0 1 0 0-5M17 14.5c2.3 0 4 1.5 4.5 4"></path></svg></span>Siapa pegang nomor apa</h2><span style="font-size: 12.5px; color: #5B6573;">Setiap akun CS hanya melihat chat dari nomor yang dipegangnya.</span></div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 10px;">
<template data-sc="for" list="{{owners}}" as="o" hint-placeholder-count="4">
<div style="display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 14px; background: #F7F8FA; border: 1px solid {{o.border}};">
<span aria-hidden="true" style="width: 40px; height: 40px; flex: none; border-radius: 20px; background: {{o.color}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 13px;">{{o.ini}}</span>
<div style="display: flex; flex-direction: column; min-width: 0;"><strong style="font-size: 14px; color: #1D3149;">{{o.who}}</strong><span style="font-size: 12.5px; color: #3B4250;">{{o.nums}}</span><span style="font-size: 12px; font-weight: 700; color: {{o.noteColor}};">{{o.note}}</span></div>
</div>
</template>
</div>
</section>

<section aria-label="Tampilan HP" style="display: flex; flex-wrap: wrap; gap: 28px; justify-content: center; align-items: flex-start;">

<div style="display: flex; flex-direction: column; gap: 10px; align-items: center;">
<span style="font-size: 13px; font-weight: 900; color: #1D3149;">1 · Tandai hasil chat (13.00 dan 20.30)</span>
<div style="width: 390px; height: 860px; box-sizing: border-box; border: 10px solid #1D3149; border-radius: 40px; background: #F3F5F8; overflow: hidden; display: flex; flex-direction: column;">
<div style="background: #FFFFFF; padding: 16px 16px 12px; border-bottom: 1px solid #E3E6EB; display: flex; flex-direction: column; gap: 10px;">
<div style="display: flex; justify-content: space-between; align-items: center;"><img src="logo-pokama.png" alt="Pokama" style="width: 96px; height: auto;"><span style="display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 800;"><span aria-hidden="true" style="width: 30px; height: 30px; border-radius: 15px; background: #2F6FD0; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 900;">I</span>Ica</span></div>
<div style="display: flex; flex-direction: column; gap: 4px;"><strong style="font-size: 17px; color: #1D3149;">{{todo}} chat belum ditandai</strong><span style="font-size: 12.5px; color: #5B6573;">Kamis, 29 Okt · {{total}} chat hari ini</span>
<div style="height: 8px; border-radius: 4px; background: #E3E6EB; overflow: hidden;"><div style="height: 100%; width: {{pct}}; background: #09BEAF; border-radius: 4px;"></div></div></div>
<div role="group" aria-label="Nomor" style="display: flex; gap: 6px;">
<template data-sc="for" list="{{nums}}" as="n" hint-placeholder-count="3">
<button type="button" onClick="{{n.pick}}" aria-pressed="{{n.pressed}}" style="height: 34px; padding: 0 12px; border-radius: 17px; border: 1px solid {{n.border}}; background: {{n.bg}}; color: {{n.fg}}; font-family: inherit; font-size: 12.5px; font-weight: 800; cursor: pointer;">{{n.label}}</button>
</template>
</div>
</div>
<div style="flex-grow: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px;">
<template data-sc="for" list="{{chats}}" as="c" hint-placeholder-count="5">
<article style="background: #FFFFFF; border: 1px solid {{c.border}}; border-radius: 14px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px;">
<div style="display: flex; justify-content: space-between; gap: 8px;"><div style="display: flex; flex-direction: column; min-width: 0;"><strong style="font-size: 14px; color: #1D3149;">{{c.name}}</strong><span style="font-size: 12px; color: #5B6573;">{{c.phone}} · masuk {{c.time}}</span></div><span style="font-size: 11.5px; font-weight: 900; color: {{c.codeFg}}; background: {{c.codeBg}}; border-radius: 8px; padding: 2px 8px; height: fit-content; white-space: nowrap;">{{c.code}}</span></div>
<span style="font-size: 12px; color: #3B4250;">{{c.src}}</span>
<template data-sc="if" value="{{c.askSrc}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 6px; background: #FFFBF0; border-radius: 10px; padding: 8px;"><span style="font-size: 12px; font-weight: 800; color: #7A5200;">Chat tanpa kode. Tanyakan: "Kakak tahu kami dari mana?"</span>
<div style="display: flex; flex-wrap: wrap; gap: 6px;"><template data-sc="for" list="{{c.srcOpts}}" as="o" hint-placeholder-count="5"><button type="button" onClick="{{o.pick}}" style="height: 30px; padding: 0 10px; border-radius: 15px; border: 1px solid #F2D9A6; background: #FFFFFF; color: #1D3149; font-family: inherit; font-size: 12px; font-weight: 800; cursor: pointer;">{{o.label}}</button></template></div></div>
</template>
<template data-sc="if" value="{{c.open}}" hint-placeholder-val="{{ true }}">
<div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px;">
<button type="button" onClick="{{c.book}}" style="height: 40px; border-radius: 10px; border: 1px solid #BFD3F2; background: #E5EEF9; color: #1E5AA8; font-family: inherit; font-size: 13px; font-weight: 900; cursor: pointer;">Booking</button>
<button type="button" onClick="{{c.close}}" style="height: 40px; border-radius: 10px; border: 1px solid #9FDCD4; background: #DDF5F2; color: #067A70; font-family: inherit; font-size: 13px; font-weight: 900; cursor: pointer;">Closing</button>
<button type="button" onClick="{{c.lost}}" style="height: 40px; border-radius: 10px; border: 1px solid #F2C9B4; background: #FCEBDD; color: #9A3F0A; font-family: inherit; font-size: 13px; font-weight: 900; cursor: pointer;">Lost</button>
</div>
</template>
<template data-sc="if" value="{{c.showReasons}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 6px;"><span style="font-size: 12px; font-weight: 800; color: #9A3F0A;">Kenapa tidak jadi?</span>
<div style="display: flex; flex-wrap: wrap; gap: 6px;">
<template data-sc="for" list="{{c.reasons}}" as="r" hint-placeholder-count="6"><button type="button" onClick="{{r.pick}}" style="height: 32px; padding: 0 10px; border-radius: 16px; border: 1px solid #E3E6EB; background: #FFFFFF; color: #1D3149; font-family: inherit; font-size: 12px; font-weight: 800; cursor: pointer;">{{r.label}}</button></template>
</div></div>
</template>
<template data-sc="if" value="{{c.showValue}}" hint-placeholder-val="{{ false }}">
<div style="display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px; align-items: end;"><label style="display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 800; color: #067A70;">Nilai order<span style="height: 40px; box-sizing: border-box; border: 1px solid #BFE9E3; border-radius: 10px; padding: 0 10px; display: flex; align-items: center; font-weight: 700; color: #1F2933; background: #FFFFFF;">{{c.value}}</span></label><button type="button" onClick="{{c.save}}" style="height: 40px; padding: 0 14px; border-radius: 10px; border: 0; background: #09BEAF; color: #1D3149; font-family: inherit; font-size: 13px; font-weight: 900; cursor: pointer;">Simpan</button></div>
</template>
<template data-sc="if" value="{{c.done}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; justify-content: space-between; align-items: center;"><span style="font-size: 12.5px; font-weight: 900; color: {{c.resFg}}; background: {{c.resBg}}; border-radius: 9px; padding: 4px 10px;">✓ {{c.result}}</span><button type="button" onClick="{{c.undo}}" style="border: 0; background: none; font-family: inherit; font-size: 12px; font-weight: 800; color: #5B6573; cursor: pointer; text-decoration: underline;">Ubah</button></div>
</template>
</article>
</template>
</div>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 10px; align-items: center;">
<span style="font-size: 13px; font-weight: 900; color: #1D3149;">2 · Story (17.00) dan broadcast</span>
<div style="width: 390px; height: 860px; box-sizing: border-box; border: 10px solid #1D3149; border-radius: 40px; background: #F3F5F8; overflow: hidden; display: flex; flex-direction: column;">
<div style="background: #FFFFFF; padding: 16px; border-bottom: 1px solid #E3E6EB; display: flex; justify-content: space-between; align-items: center;"><img src="logo-pokama.png" alt="Pokama" style="width: 96px; height: auto;"><span style="display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 800;"><span aria-hidden="true" style="width: 30px; height: 30px; border-radius: 15px; background: #2F6FD0; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 900;">I</span>Ica</span></div>
<div style="padding: 12px; display: flex; flex-direction: column; gap: 12px;">
<div style="background: #FFFFFF; border: 1px solid #E3E6EB; border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px;">
<div style="display: flex; justify-content: space-between; align-items: baseline;"><strong style="font-size: 16px; color: #1D3149;">Story hari ini</strong><span style="font-size: 12px; font-weight: 800; color: #7A5200;">sebelum 17.00</span></div>
<span style="font-size: 12px; color: #5B6573;">CS Garut Kota · lihat angka di menu Status WhatsApp</span>
<template data-sc="for" list="{{story}}" as="s" hint-placeholder-count="3">
<div style="display: grid; grid-template-columns: minmax(0, 1fr) 40px 64px 40px; gap: 6px; align-items: center;"><span style="font-size: 13px; font-weight: 800; color: #3B4250;">{{s.label}}</span><button type="button" onClick="{{s.minus}}" aria-label="Kurangi {{s.label}}" style="height: 40px; border-radius: 10px; border: 1px solid #E3E6EB; background: #F7F8FA; font-family: inherit; font-size: 18px; font-weight: 900; color: #1D3149; cursor: pointer;">−</button><span style="height: 40px; border-radius: 10px; border: 1px solid #D5DAE1; background: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 900; color: #1D3149;">{{s.v}}</span><button type="button" onClick="{{s.plus}}" aria-label="Tambah {{s.label}}" style="height: 40px; border-radius: 10px; border: 1px solid #E3E6EB; background: #F7F8FA; font-family: inherit; font-size: 18px; font-weight: 900; color: #1D3149; cursor: pointer;">+</button></div>
</template>
<button type="button" onClick="{{saveStory}}" style="height: 44px; border-radius: 12px; border: 0; background: {{storyBg}}; color: #1D3149; font-family: inherit; font-size: 14px; font-weight: 900; cursor: pointer;">{{storyLabel}}</button>
<span style="font-size: 11.5px; color: #5B6573;">Target viewer nomor ini 400. Rata-rata 7 hari terakhir 312.</span>
</div>
<div style="background: #FFFFFF; border: 1px solid #E3E6EB; border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px;">
<div style="display: flex; justify-content: space-between; align-items: baseline;"><strong style="font-size: 16px; color: #1D3149;">Catat broadcast</strong><span style="font-size: 12px; color: #5B6573;">setiap selesai kirim</span></div>
<label style="display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; font-weight: 800; color: #3B4250;">Segmen<span style="height: 42px; box-sizing: border-box; border: 1px solid #D5DAE1; border-radius: 10px; padding: 0 12px; display: flex; align-items: center; justify-content: space-between; font-weight: 700; color: #1F2933; background: #FFFFFF;">Pelanggan motor 90 hari terakhir<svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"></path></svg></span></label>
<label style="display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; font-weight: 800; color: #3B4250;">Jumlah terkirim<span style="height: 42px; box-sizing: border-box; border: 1px solid #D5DAE1; border-radius: 10px; padding: 0 12px; display: flex; align-items: center; font-weight: 700; color: #1F2933; background: #FFFFFF;">820</span></label>
<label style="display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; font-weight: 800; color: #3B4250;">Kode di pesan<span style="height: 42px; box-sizing: border-box; border: 1px solid #BFE9E3; border-radius: 10px; padding: 0 12px; display: flex; align-items: center; font-weight: 800; color: #067A70; background: #F0FBF9;">BC-RA-MTR1029 · salin ke pesan</span></label>
<button type="button" onClick="{{saveBc}}" style="height: 44px; border-radius: 12px; border: 0; background: {{bcBg}}; color: #1D3149; font-family: inherit; font-size: 14px; font-weight: 900; cursor: pointer;">{{bcLabel}}</button>
<span style="font-size: 11.5px; color: #5B6573;">Klik dan booking dari broadcast dihitung otomatis lewat kode. Maksimal 1 broadcast per segmen per minggu.</span>
</div>
</div>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 10px; align-items: center;">
<span style="font-size: 13px; font-weight: 900; color: #1D3149;">3 · Cadangan: rekap harian (sebelum nomor tersambung)</span>
<div style="width: 390px; height: 860px; box-sizing: border-box; border: 10px solid #1D3149; border-radius: 40px; background: #F3F5F8; overflow: hidden; display: flex; flex-direction: column;">
<div style="background: #FFFFFF; padding: 16px; border-bottom: 1px solid #E3E6EB; display: flex; flex-direction: column; gap: 6px;"><div style="display: flex; justify-content: space-between; align-items: center;"><img src="logo-pokama.png" alt="Pokama" style="width: 96px; height: auto;"><span style="display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 800;"><span aria-hidden="true" style="width: 30px; height: 30px; border-radius: 15px; background: #0FA394; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 900;">E</span>El</span></div><strong style="font-size: 16px; color: #1D3149;">Rekap hari ini · CS Bandung</strong><span style="font-size: 12px; color: #5B6573;">Diisi sekali, sebelum 21.00. Isinya sama dengan rekap admin harian yang sudah biasa.</span></div>
<div style="padding: 12px; display: flex; flex-direction: column; gap: 12px;">
<div style="background: #FFFFFF; border: 1px solid #E3E6EB; border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 6px;">
<div style="display: grid; grid-template-columns: minmax(0, 1fr) 52px 52px 52px; gap: 6px; font-size: 11.5px; font-weight: 900; color: #5B6573;"><span>Sumber chat</span><span style="text-align: center;">Chat</span><span style="text-align: center;">Booking</span><span style="text-align: center;">Closing</span></div>
<template data-sc="for" list="{{recap}}" as="r" hint-placeholder-count="5">
<div style="display: grid; grid-template-columns: minmax(0, 1fr) 52px 52px 52px; gap: 6px; align-items: center;"><span style="font-size: 13px; font-weight: 800; color: #1D3149;">{{r.src}}</span><span style="height: 36px; border: 1px solid #D5DAE1; border-radius: 9px; display: flex; align-items: center; justify-content: center; font-weight: 800; background: #FFFFFF;">{{r.chat}}</span><span style="height: 36px; border: 1px solid #D5DAE1; border-radius: 9px; display: flex; align-items: center; justify-content: center; font-weight: 800; background: #FFFFFF;">{{r.book}}</span><span style="height: 36px; border: 1px solid #D5DAE1; border-radius: 9px; display: flex; align-items: center; justify-content: center; font-weight: 800; background: #FFFFFF;">{{r.close}}</span></div>
</template>
</div>
<div style="background: #FFFFFF; border: 1px solid #E3E6EB; border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 8px;">
<span style="font-size: 13px; font-weight: 900; color: #9A3F0A;">Lost hari ini, per alasan</span>
<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 6px;">

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1960}}'>

    return {
