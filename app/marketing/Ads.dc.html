main{padding:18px 16px 40px !important}
h1{font-size:24px !important}

<span style="font-size: 14px; color: #3B4250; max-width: 960px;"><b style="color: #067A70;">Ringkasan otomatis:</b> Rp 4,7 jt iklan jadi 223 leads, 60 closing, Rp 60,4 jt omzet (ROAS 12,9x). Sewa motor Garut perlu materi baru.</span>

<section aria-label="Sumber data dan patokan" style="background: #FFFFFF; border: 1px solid #E3E6EB; border-radius: 16px; padding: 12px 16px; display: flex; flex-direction: column; gap: 10px;">
<div style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center;"><span style="font-size: 11.5px; font-weight: 900; letter-spacing: 0.08em; color: #5B6573; margin-right: 4px;">DATA DARI</span><span style="display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: #1F2933; background: #F7F8FA; border: 1px solid #E3E6EB; border-radius: 10px; padding: 5px 10px;"><b style="font-size: 11.5px; font-weight: 900; background: #DDF5F2; color: #067A70; border-radius: 6px; padding: 1px 6px;">Otomatis</b>Meta Ads API · tiap jam</span><span style="display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: #1F2933; background: #F7F8FA; border: 1px solid #E3E6EB; border-radius: 10px; padding: 5px 10px;"><b style="font-size: 11.5px; font-weight: 900; background: #DDF5F2; color: #067A70; border-radius: 6px; padding: 1px 6px;">Otomatis</b>Leads & closing Rentalaja dari WA berkode</span><span style="display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: #1F2933; background: #F7F8FA; border: 1px solid #E3E6EB; border-radius: 10px; padding: 5px 10px;"><b style="font-size: 11.5px; font-weight: 900; background: #FDF3D7; color: #7A5200; border-radius: 6px; padding: 1px 6px;">Isi manual</b>Closing TripinAja & Laptopaja · Nayla, Dita · harian</span></div>
<div style="display: flex; flex-direction: column; gap: 6px;"><span style="font-size: 11.5px; font-weight: 900; letter-spacing: 0.08em; color: #5B6573;">PATOKAN BAGUS</span><div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 8px;"><div style="display: flex; flex-direction: column; gap: 2px; padding: 8px 10px; border-radius: 10px; background: #F7F8FA; min-width: 0;"><span style="font-size: 11.5px; font-weight: 800; color: #5B6573;">CPL <b style="font-size: 10px; font-weight: 900; background: #FDF3D7; color: #7A5200; border-radius: 6px; padding: 1px 6px; margin-left: 4px;">Rumus</b></span><strong style="font-size: 13.5px; color: #1D3149;">Bagus: ≤ batas unit</strong><span style="font-size: 12px; font-weight: 800; color: #067A70;">Sekarang rata-rata Rp 21 rb, semua di bawah batas</span></div><div style="display: flex; flex-direction: column; gap: 2px; padding: 8px 10px; border-radius: 10px; background: #F7F8FA; min-width: 0;"><span style="font-size: 11.5px; font-weight: 800; color: #5B6573;">ROAS <b style="font-size: 10px; font-weight: 900; background: #FDF3D7; color: #7A5200; border-radius: 6px; padding: 1px 6px; margin-left: 4px;">Rumus</b></span><strong style="font-size: 13.5px; color: #1D3149;">Bagus: ≥ 8x</strong><span style="font-size: 12px; font-weight: 800; color: #067A70;">Sekarang 12,9x</span></div><div style="display: flex; flex-direction: column; gap: 2px; padding: 8px 10px; border-radius: 10px; background: #F7F8FA; min-width: 0;"><span style="font-size: 11.5px; font-weight: 800; color: #5B6573;">CTR link <b style="font-size: 10px; font-weight: 900; background: #E5EEF9; color: #1E5AA8; border-radius: 6px; padding: 1px 6px; margin-left: 4px;">Industri</b></span><strong style="font-size: 13.5px; color: #1D3149;">Bagus: ≥ 1,7%</strong><span style="font-size: 12px; font-weight: 800; color: #067A70;">Sekarang 2,1% rata-rata campaign</span></div><div style="display: flex; flex-direction: column; gap: 2px; padding: 8px 10px; border-radius: 10px; background: #F7F8FA; min-width: 0;"><span style="font-size: 11.5px; font-weight: 800; color: #5B6573;">Frequency <b style="font-size: 10px; font-weight: 900; background: #DDF5F2; color: #067A70; border-radius: 6px; padding: 1px 6px; margin-left: 4px;">Target Head of Marketing</b></span><strong style="font-size: 13.5px; color: #1D3149;">Bagus: ≤ 2,5 per minggu</strong><span style="font-size: 12px; font-weight: 800; color: #9A3F0A;">Sekarang Laptop bekas 2,7</span></div></div><span style="font-size: 11.5px; color: #5B6573;">Batas CPL = nilai order rata-rata × closing rate ÷ 8 (TripinAja Rp 50 rb, Rentalaja Rp 26 rb, Niagaaja/Laptopaja Rp 25 rb). CTR industri: rata-rata 1,71%, travel 2,76% (WordStream, 2025).</span></div>
</section>

<section aria-label="Angka utama ads" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px;">
<template data-sc="for" list="{{tiles}}" as="t" hint-placeholder-count="6">
<div style="background: #FFFFFF; border: 1px solid #E3E6EB; border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 2px;"><span style="font-size: 12.5px; font-weight: 700; color: #3B4250;">{{t.label}}</span><span style="font-size: 24px; font-weight: 900; color: #1D3149;">{{t.value}}</span><span style="font-size: 12px; font-weight: 800; color: {{t.color}};">{{t.note}}</span></div>
</template>
</section>

<template data-sc="for" list="{{blocks}}" as="b" hint-placeholder-count="4">
<section style="background: #FFFFFF; border: 1px solid #E3E6EB; border-radius: 20px; padding: 18px 20px; display: flex; flex-direction: column; gap: 14px;">
<div style="display: flex; flex-direction: column;"><h2 data-icon-done="1" style="display: flex; align-items: center; gap: 10px; margin: 0; font-size: 18px; font-weight: 900; color: #1D3149;"><span aria-hidden="true" style="width: 28px; height: 28px; flex: none; border-radius: 8px; background: #DDF5F2; color: #067A70; display: inline-flex; align-items: center; justify-content: center;"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{b.ip}}"></path></svg></span>{{b.title}}</h2><span style="font-size: 12.5px; color: #5B6573;">{{b.sub}}</span></div>
<div style="display: flex; flex-wrap: wrap; gap: 18px; align-items: stretch;">
<div style="flex: 1 1 100%; min-width: 0; display: flex; flex-direction: column; gap: 10px;">

<template data-sc="if" value="{{b.isTable}}" hint-placeholder-val="{{ true }}">
<div style="overflow-x: auto;">
<table style="width: 100%; min-width: 760px; border-collapse: collapse; font-size: 13px;">
<thead><tr style="text-align: right; color: #5B6573; font-size: 12px;">
<template data-sc="for" list="{{b.cols}}" as="c" hint-placeholder-count="8"><th scope="col" style="padding: 8px; border-bottom: 1px solid #E3E6EB; font-weight: 800; text-align: {{c.align}};">{{c.label}}</th></template>
</tr></thead>
<tbody>
<template data-sc="for" list="{{b.rows}}" as="r" hint-placeholder-count="8">
<tr style="text-align: right; opacity: {{r.op}};">
<template data-sc="for" list="{{r.cells}}" as="x" hint-placeholder-count="8"><td style="padding: 10px 8px; border-bottom: 1px solid #EEF0F3; text-align: {{x.align}}; color: {{x.color}}; font-weight: {{x.weight}};"><template data-sc="if" value="{{x.dot}}" hint-placeholder-val="{{ false }}"><span style="display: inline-block; width: 9px; height: 9px; border-radius: 5px; background: {{x.dot}}; margin-right: 7px;"></span></template><template data-sc="if" value="{{x.chip}}" hint-placeholder-val="{{ false }}"><span style="font-size: 12px; font-weight: 800; padding: 3px 9px; border-radius: 9px; background: {{x.chipBg}}; color: {{x.chipFg}}; white-space: nowrap;">{{x.v}}</span></template><template data-sc="if" value="{{x.plain}}" hint-placeholder-val="{{ true }}">{{x.v}}</template></td></template>
</tr>
</template>
</tbody>
</table>
</div>
</template>

<template data-sc="if" value="{{b.isBars}}" hint-placeholder-val="{{ false }}">
<template data-sc="for" list="{{b.bars}}" as="p" hint-placeholder-count="4">
<div style="display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center;">
<span style="flex: 0 0 130px; display: inline-flex; align-items: center; gap: 7px; font-weight: 800;"><span style="width: 9px; height: 9px; border-radius: 5px; background: {{p.dot}};"></span>{{p.name}}</span>
<div style="flex: 1 1 180px; position: relative; height: 22px; border-radius: 6px; background: #EEF0F3;"><div style="height: 100%; width: {{p.pct}}; border-radius: 6px; background: {{p.color}};"></div><span title="Ideal hari ke-27 dari 31" style="position: absolute; top: -4px; left: 87%; width: 2px; height: 30px; background: #1D3149;"></span></div>
<span style="flex: 0 1 190px; font-size: 12.5px; color: #3B4250;"><b>{{p.spent}}</b> dari {{p.budget}} · <span style="color: {{p.color}}; font-weight: 800;">{{p.pctText}}</span></span>
</div>
</template>
<span style="font-size: 12px; color: #5B6573;">Garis gelap = ideal hari ke-27 dari 31 (87%). Di kiri garis = belanja lebih lambat dari rencana.</span>
</template>

<template data-sc="if" value="{{b.isSim}}" hint-placeholder-val="{{ false }}">
<div role="group" aria-label="Unit simulasi" style="display: flex; flex-wrap: wrap; gap: 6px;">
<template data-sc="for" list="{{sim.units}}" as="u" hint-placeholder-count="3"><button type="button" onClick="{{u.pick}}" aria-pressed="{{u.pressed}}" style="height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid {{u.border}}; background: {{u.bg}}; color: {{u.fg}}; font-family: inherit; font-size: 13px; font-weight: 800; cursor: pointer;">{{u.label}}</button></template>
</div>
<label for="sim-x" style="font-size: 13px; font-weight: 800; color: #3B4250;">Tambahan budget bulan depan: <span style="color: #1D3149;">{{sim.xText}}</span></label>
<input id="sim-x" type="range" min="0" max="5000000" step="250000" value="{{sim.x}}" onInput="{{sim.onX}}" style="width: 100%; accent-color: #09BEAF;">
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px;">
<template data-sc="for" list="{{sim.out}}" as="o" hint-placeholder-count="4"><div style="background: #F7F8FA; border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column;"><span style="font-size: 12px; font-weight: 700; color: #5B6573;">{{o.label}}</span><span style="font-size: 20px; font-weight: 900; color: {{o.color}};">{{o.value}}</span><span style="font-size: 11.5px; color: #5B6573;">{{o.note}}</span></div></template>
</div>
<span style="font-size: 12px; color: #5B6573;">Makin besar budget, makin mahal tiap chat tambahan. Dihitung dari biaya per lead dan rasio closing Oktober unit itu.</span>
</template>

</div>
<template data-sc="if" value="{{b.hasActs}}" hint-placeholder-val="{{ true }}"><aside style="flex: 1 1 100%; min-width: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 8px; align-items: start;">
<span style="grid-column: 1 / -1; font-size: 13px; font-weight: 900; color: #1D3149;">Langkah berikutnya</span>
<template data-sc="for" list="{{b.acts}}" as="x" hint-placeholder-count="3">
<div style="display: flex; flex-direction: column; gap: 4px; padding: 10px 12px; border-radius: 10px; background: #F7F8FA; border-left: 4px solid #09BEAF;">
<strong style="font-size: 13.5px; color: #1D3149; line-height: 1.3;">{{x.do}}</strong>
<span style="font-size: 12px; color: #3B4250;">{{x.why}}</span>
<div style="display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 2px;">
<span style="font-size: 11.5px; font-weight: 900; color: #067A70;">→ {{x.to}}</span>
<button type="button" onClick="{{x.press}}" style="height: 32px; padding: 0 12px; border-radius: 9px; border: 1px solid #C9D1DB; background: {{x.btnBg}}; color: {{x.btnFg}}; font-family: inherit; font-size: 12px; font-weight: 800; cursor: pointer;">{{x.label}}</button>
</div>
<template data-sc="if" value="{{x.isDone}}" hint-placeholder-val="{{ false }}"><span style="font-size: 11.5px; font-weight: 700; color: #067A70; background: #F0FBF9; border-radius: 8px; padding: 6px 8px;">{{x.doneMsg}}</span></template>
</div>
</template>
</aside></template>
</div>
</section>
</template>

</main>
