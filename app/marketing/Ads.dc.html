<main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 28px 36px 48px; display: flex; flex-direction: column; gap: 22px;">

<header style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px;">
<div style="display: flex; flex-direction: column; gap: 4px;">
<span style="font-size: 13px; color: #5B6573; font-weight: 600;">Oktober 2026 · hari ke-27 dari 31 · Meta Ads (Instagram &amp; Facebook)</span>
<h1 style="margin: 0; font-size: 30px; font-weight: 900; letter-spacing: -0.01em;">Ads</h1>
</div>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px;">
<span style="display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px; border-radius: 18px; background: #DDF5F2; color: #067A70; font-size: 12px; font-weight: 800;"><span style="width: 8px; height: 8px; border-radius: 4px; background: #09BEAF;"></span>Marketing API · sinkron tiap jam</span>
<span style="font-size: 12px; font-weight: 700; color: #5B6573; border: 1px dashed #A9B4C2; border-radius: 18px; padding: 8px 12px;">Data contoh</span>
</div>
</header>

<div role="group" aria-label="Filter unit bisnis" style="display: flex; flex-wrap: wrap; gap: 8px;">
<template data-sc="for" list="{{filters}}" as="f" hint-placeholder-count="4">
<button type="button" onClick="{{f.pick}}" aria-pressed="{{f.pressed}}" style="display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 18px; border-radius: 22px; border: 1px solid {{f.border}}; background: {{f.bg}}; color: {{f.fg}}; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer;"><span style="width: 10px; height: 10px; border-radius: 5px; background: {{f.dot}};"></span>{{f.label}}</button>
</template>
</div>

<section aria-label="Metrik ads" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px;">
<template data-sc="for" list="{{tiles}}" as="t" hint-placeholder-count="10">
<div style="background: #FFFFFF; border: 1px solid #E3E6EB; border-radius: 20px; padding: 16px 18px; display: flex; flex-direction: column; gap: 4px;">
<span style="font-size: 13px; font-weight: 700; color: #3B4250;">{{t.label}}</span>
<span style="font-size: 26px; font-weight: 900; letter-spacing: -0.02em; color: #1D3149;">{{t.value}}</span>
<span style="font-size: 12px; font-weight: 700; color: {{t.color}};">{{t.note}}</span>
</div>
</template>
</section>

<div style="display: flex; flex-wrap: wrap; gap: 22px; align-items: stretch;">
<section aria-labelledby="pace-h" style="flex: 3 1 560px; min-width: 0; background: #FFFFFF; border: 1px solid #E3E6EB; border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 12px;">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 8px;">
<div style="display: flex; flex-direction: column;"><h2 id="pace-h" style="margin: 0; font-size: 18px; font-weight: 800;">Pacing budget</h2><span style="font-size: 13px; color: #5B6573;">Belanja kumulatif dibanding garis ideal (budget dibagi rata 31 hari).</span></div>
<div style="display: flex; gap: 14px; font-size: 12px; font-weight: 700; color: #3B4250;"><span style="display: inline-flex; align-items: center; gap: 6px;"><span style="width: 14px; height: 3px; border-radius: 2px; background: #09BEAF;"></span>Terpakai</span><span style="display: inline-flex; align-items: center; gap: 6px;"><span style="width: 14px; height: 0; border-top: 2px dashed #5B6573;"></span>Ideal</span></div>
</div>
<div style="background: #F3F5F8; border-radius: 10px; padding: 8px 12px; font-size: 13px;"><strong>{{pace.head}}</strong> · {{pace.text}}</div>
<svg viewBox="0 0 640 240" width="100%" role="img" aria-label="{{pace.aria}}" style="display: block;">
<g stroke="#E3E6EB" stroke-width="1">
<line x1="56" y1="200" x2="630" y2="200"></line><line x1="56" y1="155" x2="630" y2="155"></line><line x1="56" y1="110" x2="630" y2="110"></line><line x1="56" y1="65" x2="630" y2="65"></line><line x1="56" y1="20" x2="630" y2="20"></line>
</g>
<g fill="#5B6573" font-size="11" font-family="Nunito, sans-serif" text-anchor="end">
<text x="48" y="204">0</text><text x="48" y="159">{{pace.y1}}</text><text x="48" y="114">{{pace.y2}}</text><text x="48" y="69">{{pace.y3}}</text><text x="48" y="24">{{pace.y4}}</text>
</g>
<g fill="#5B6573" font-size="11" font-family="Nunito, sans-serif" text-anchor="middle">
<text x="75" y="222">1</text><text x="223" y="222">8</text><text x="372" y="222">15</text><text x="520" y="222">22</text><text x="630" y="222">31 Okt</text>
</g>
<path d="{{pace.ideal}}" fill="none" stroke="#5B6573" stroke-width="2" stroke-dasharray="5 4"></path>
<path d="{{pace.area}}" fill="#09BEAF" opacity="0.12"></path>
<path d="{{pace.line}}" fill="none" stroke="#09BEAF" stroke-width="2" stroke-linejoin="round"></path>
<path d="{{pace.dot}}" fill="none" stroke="#FFFFFF" stroke-width="13" stroke-linecap="round"></path>
<path d="{{pace.dot}}" fill="none" stroke="#067A70" stroke-width="9" stroke-linecap="round"></path>
</svg>
</section>

<section aria-labelledby="plc-h" style="flex: 2 1 380px; min-width: 0; background: #FFFFFF; border: 1px solid #E3E6EB; border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 12px;">
<div style="display: flex; flex-direction: column;"><h2 id="plc-h" style="margin: 0; font-size: 18px; font-weight: 800;">Per penempatan</h2><span style="font-size: 13px; color: #5B6573;">Bagian belanja dan biaya per chat. Semua unit.</span></div>
<template data-sc="for" list="{{placements}}" as="p" hint-placeholder-count="4">
<div style="display: grid; grid-template-columns: 120px minmax(0, 1fr) 96px; align-items: center; gap: 10px;">
<span style="font-size: 13px; font-weight: 700;">{{p.name}}</span>
<div style="height: 18px; background: #F3F5F8; border-radius: 5px; overflow: hidden;"><div style="height: 100%; width: {{p.w}}; background: #1D3149; border-radius: 5px;"></div></div>
<span style="font-size: 12px; text-align: right;"><strong>{{p.share}}</strong> · <span style="color: {{p.cplColor}}; font-weight: 800;">{{p.cpl}}</span></span>
</div>
</template>
<div style="border-top: 1px solid #EEF0F3; padding-top: 10px; display: flex; flex-direction: column; gap: 8px;">
<span style="font-size: 13px; font-weight: 800;">Umur yang chat</span>
<template data-sc="for" list="{{ages}}" as="a" hint-placeholder-count="4">
<div style="display: grid; grid-template-columns: 120px minmax(0, 1fr) 40px; align-items: center; gap: 10px;">
<span style="font-size: 12px; color: #3B4250;">{{a.name}}</span>
<div style="height: 12px; background: #F3F5F8; border-radius: 4px; overflow: hidden;"><div style="height: 100%; width: {{a.w}}; background: #09BEAF; border-radius: 4px;"></div></div>
<span style="font-size: 12px; font-weight: 800; text-align: right;">{{a.v}}</span>
</div>
</template>
</div>
</section>
</div>

<div data-island="ads"></div>

<section aria-labelledby="camp-h" style="background: #FFFFFF; border: 1px solid #E3E6EB; border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 12px;">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 8px;">
<div style="display: flex; flex-direction: column;"><h2 id="camp-h" style="margin: 0; font-size: 18px; font-weight: 800;">Kampanye</h2><span style="font-size: 13px; color: #5B6573;">Chat = percakapan WA dimulai (Click-to-WhatsApp). Closing &amp; omzet dicocokkan dari kode di pesan pembuka.</span></div>
<span style="font-size: 12px; color: #5B6573;">Frekuensi &gt; 2,5 = materi mulai jenuh</span>
</div>
<div style="overflow-x: auto;">
<table style="width: 100%; min-width: 1280px; border-collapse: collapse; font-size: 13px;">
<thead><tr style="text-align: right; color: #5B6573; font-size: 12px;">
<th scope="col" style="text-align: left; padding: 8px; border-bottom: 1px solid #E3E6EB; font-weight: 800;">Kampanye</th>
<th scope="col" style="text-align: left; padding: 8px; border-bottom: 1px solid #E3E6EB; font-weight: 800;">Tujuan</th>
<th scope="col" style="padding: 8px; border-bottom: 1px solid #E3E6EB; font-weight: 800;">Budget / hari</th>
<th scope="col" style="padding: 8px; border-bottom: 1px solid #E3E6EB; font-weight: 800;">Terpakai</th>
<th scope="col" style="padding: 8px; border-bottom: 1px solid #E3E6EB; font-weight: 800;">Reach</th>
<th scope="col" style="padding: 8px; border-bottom: 1px solid #E3E6EB; font-weight: 800;">Frekuensi</th>
<th scope="col" style="padding: 8px; border-bottom: 1px solid #E3E6EB; font-weight: 800;">CTR</th>
<th scope="col" style="padding: 8px; border-bottom: 1px solid #E3E6EB; font-weight: 800;">CPM</th>
<th scope="col" style="padding: 8px; border-bottom: 1px solid #E3E6EB; font-weight: 800;">Chat</th>
<th scope="col" style="padding: 8px; border-bottom: 1px solid #E3E6EB; font-weight: 800;">Biaya / chat</th>
<th scope="col" style="padding: 8px; border-bottom: 1px solid #E3E6EB; font-weight: 800;">Closing</th>
<th scope="col" style="padding: 8px; border-bottom: 1px solid #E3E6EB; font-weight: 800;">Omzet</th>
<th scope="col" style="padding: 8px; border-bottom: 1px solid #E3E6EB; font-weight: 800;">ROAS</th>
<th scope="col" style="text-align: left; padding: 8px; border-bottom: 1px solid #E3E6EB; font-weight: 800;">Saran</th>
</tr></thead>
<tbody>
<template data-sc="for" list="{{camps}}" as="c" hint-placeholder-count="8">
<tr style="text-align: right;">
<th scope="row" style="text-align: left; padding: 10px 8px; border-bottom: 1px solid #EEF0F3;"><span style="font-weight: 800;">{{c.name}}</span><br><span style="font-size: 12px; font-weight: 600; color: #5B6573;"><span style="display: inline-block; width: 8px; height: 8px; border-radius: 4px; background: {{c.dot}}; margin-right: 4px;"></span>{{c.unit}} · {{c.status}}</span></th>
<td style="text-align: left; padding: 10px 8px; border-bottom: 1px solid #EEF0F3; color: #3B4250;">{{c.obj}}</td>
<td style="padding: 10px 8px; border-bottom: 1px solid #EEF0F3;">{{c.daily}}</td>
<td style="padding: 10px 8px; border-bottom: 1px solid #EEF0F3;">{{c.spend}}</td>
<td style="padding: 10px 8px; border-bottom: 1px solid #EEF0F3;">{{c.reach}}</td>
<td style="padding: 10px 8px; border-bottom: 1px solid #EEF0F3; font-weight: 800; color: {{c.freqColor}};">{{c.freq}}</td>
<td style="padding: 10px 8px; border-bottom: 1px solid #EEF0F3;">{{c.ctr}}</td>
<td style="padding: 10px 8px; border-bottom: 1px solid #EEF0F3;">{{c.cpm}}</td>
<td style="padding: 10px 8px; border-bottom: 1px solid #EEF0F3;">{{c.chat}}</td>
<td style="padding: 10px 8px; border-bottom: 1px solid #EEF0F3; font-weight: 800; color: {{c.cplColor}};">{{c.cpl}}</td>
<td style="padding: 10px 8px; border-bottom: 1px solid #EEF0F3;">{{c.closing}}</td>
<td style="padding: 10px 8px; border-bottom: 1px solid #EEF0F3; font-weight: 800;">{{c.omzet}}</td>
<td style="padding: 10px 8px; border-bottom: 1px solid #EEF0F3; font-weight: 900;">{{c.roas}}</td>
<td style="text-align: left; padding: 10px 8px; border-bottom: 1px solid #EEF0F3;"><span style="font-size: 12px; font-weight: 800; border-radius: 8px; padding: 2px 8px; background: {{c.vBg}}; color: {{c.vFg}}; white-space: nowrap;">{{c.verdict}}</span></td>
</tr>
</template>
</tbody>
</table>
</div>
</section>

<div style="display: flex; flex-wrap: wrap; gap: 22px; align-items: stretch;">
<section aria-labelledby="unit-h" style="flex: 3 1 560px; min-width: 0; background: #FFFFFF; border: 1px solid #E3E6EB; border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 12px;">
<div style="display: flex; flex-direction: column;"><h2 id="unit-h" style="margin: 0; font-size: 18px; font-weight: 800;">Biaya per chat per unit</h2><span style="font-size: 13px; color: #5B6573;">Garis putus = batas atas Rp 15 rb per chat.</span></div>
<template data-sc="for" list="{{unitBars}}" as="u" hint-placeholder-count="3">
<div style="display: grid; grid-template-columns: 110px minmax(0, 1fr) 200px; align-items: center; gap: 12px;">
<span style="font-size: 13px; font-weight: 800;">{{u.unit}}</span>
<div style="position: relative; height: 22px; background: #F3F5F8; border-radius: 6px;">
<div style="height: 100%; width: {{u.w}}; background: {{u.color}}; border-radius: 6px;"></div>
<div style="position: absolute; top: -4px; bottom: -4px; left: {{limitX}}; border-left: 2px dashed #1D3149;"></div>
</div>
<span style="font-size: 12px; color: #3B4250;"><strong style="color: #1F2933;">{{u.cpl}}</strong> · {{u.chat}} chat · ROAS {{u.roas}}</span>
</div>
</template>
</section>

<section aria-labelledby="act-h" style="flex: 2 1 380px; min-width: 0; background: #1D3149; color: #FFFFFF; border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 12px;">
<div style="display: flex; flex-direction: column;"><span style="font-size: 12px; font-weight: 800; letter-spacing: 0.1em; color: #86DCD3;">LANGKAH 4 HARI TERAKHIR</span><h2 id="act-h" style="margin: 0; font-size: 18px; font-weight: 900;">Sisa budget {{left}}</h2></div>
<template data-sc="for" list="{{actions}}" as="a" hint-placeholder-count="3">
<div style="background: #2C4664; border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 2px;"><span style="font-size: 13px; font-weight: 900; color: #86DCD3;">{{a.title}}</span><span style="font-size: 13px; color: #E3E6EB;">{{a.body}}</span></div>
</template>
</section>
</div>

</main>
</div>
</template>
<div id="dc-root"></div>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":2000}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { unit: 'Semua' };
  }
  renderVals() {
    var self = this;
    var unit = this.state.unit;
    var COLOR = { Rentalaja: '#2F6FD0', TripinAja: '#0FA394', Niagaaja: '#D08A1E' };
    var BUDGET = { Rentalaja: 3400000, TripinAja: 2400000, Niagaaja: 700000 };
    var dec = function (n, d) { return n.toFixed(d).replace('.', ','); };
    var num = function (n) { return Math.round(n).toLocaleString('id-ID'); };
    var rb = function (n) { return n >= 1000 ? dec(n / 1000, 1) + ' rb' : num(n); };
    var rp = function (n) { return n >= 1000000 ? 'Rp ' + dec(n / 1000000, 2).replace(/0$/, '') + ' jt' : 'Rp ' + dec(n / 1000, 1) + ' rb'; };
    var GOOD = '#067A70', BAD = '#9A3F0A';

    var C = [
      { name: 'Sewa motor Garut', unit: 'Rentalaja', obj: 'Pesan WhatsApp', status: 'Aktif', daily: 40000, spend: 1080000, reach: 24000, freq: 2.0, ctr: 2.1, chat: 86, closing: 28, omzet: 14200000 },
      { name: 'iPhone Bandung & Ciputat', unit: 'Rentalaja', obj: 'Pesan WhatsApp', status: 'Aktif', daily: 30000, spend: 820000, reach: 19000, freq: 2.3, ctr: 1.8, chat: 58, closing: 13, omzet: 12600000 },
      { name: 'Ruma Metua akhir pekan', unit: 'Rentalaja', obj: 'Pesan WhatsApp', status: 'Aktif', daily: 20000, spend: 600000, reach: 15000, freq: 1.9, ctr: 1.6, chat: 38, closing: 7, omzet: 11500000 },
      { name: 'Open trip November', unit: 'TripinAja', obj: 'Pesan WhatsApp', status: 'Aktif', daily: 35000, spend: 950000, reach: 24000, freq: 1.7, ctr: 2.6, chat: 52, closing: 9, omzet: 21600000 },
      { name: 'Study tour sekolah', unit: 'TripinAja', obj: 'Pesan WhatsApp', status: 'Aktif', daily: 20000, spend: 450000, reach: 11000, freq: 1.8, ctr: 2.1, chat: 22, closing: 2, omzet: 9400000 },
      { name: 'Glamping Guntur', unit: 'TripinAja', obj: 'Awareness', status: 'Dijeda', daily: 0, spend: 200000, reach: 6200, freq: 2.0, ctr: 0.9, chat: 10, closing: 1, omzet: 3000000 },
      { name: 'Laptop bekas mahasiswa', unit: 'Niagaaja', obj: 'Pesan WhatsApp', status: 'Aktif', daily: 15000, spend: 420000, reach: 9500, freq: 2.7, ctr: 1.5, chat: 34, closing: 7, omzet: 6400000 },
      { name: 'Trade-in laptop', unit: 'Niagaaja', obj: 'Pesan WhatsApp', status: 'Aktif', daily: 8000, spend: 180000, reach: 4500, freq: 2.4, ctr: 1.2, chat: 12, closing: 2, omzet: 2900000 }
    ];
    var inUnit = function (x) { return unit === 'Semua' || x.unit === unit; };
    var cs = C.filter(inUnit);
    var sum = function (f) { return cs.reduce(function (a, c) { return a + c[f]; }, 0); };
    var spend = sum('spend'), reach = sum('reach'), chat = sum('chat'), closing = sum('closing'), omzet = sum('omzet');
    var budget = (unit === 'Semua' ? ['Rentalaja', 'TripinAja', 'Niagaaja'] : [unit]).reduce(function (a, u) { return a + BUDGET[u]; }, 0);
    var impr = cs.reduce(function (a, c) { return a + c.reach * c.freq; }, 0);
    var clicks = cs.reduce(function (a, c) { return a + c.reach * c.freq * c.ctr / 100; }, 0);
    var cpl = spend / chat;

    var tiles = [
      { label: 'Terpakai', value: rp(spend), note: Math.round(spend / budget * 100) + '% dari ' + rp(budget) + ' · waktu 87%', color: spend / budget < 0.8 ? '#7A5200' : GOOD },
      { label: 'Reach', value: rb(reach), note: 'Orang unik yang melihat iklan', color: '#5B6573' },
      { label: 'Tayangan', value: rb(impr), note: 'Frekuensi rata-rata ' + dec(impr / reach, 1), color: '#5B6573' },
      { label: 'CPM', value: rp(spend / impr * 1000), note: 'Biaya per 1.000 tayangan', color: '#5B6573' },
      { label: 'Klik', value: num(clicks), note: 'CTR ' + dec(clicks / impr * 100, 1) + '%', color: '#5B6573' },
      { label: 'Chat WA dimulai', value: num(chat), note: 'Target 300 per bulan', color: chat >= 300 || unit !== 'Semua' ? GOOD : BAD },
      { label: 'Biaya per chat', value: rp(cpl), note: 'Batas atas Rp 15 rb', color: cpl <= 15000 ? GOOD : BAD },
      { label: 'Closing', value: num(closing), note: dec(closing / chat * 100, 1) + '% dari chat', color: '#5B6573' },
      { label: 'Omzet terlacak', value: rp(omzet), note: 'Dari kode di pesan pembuka', color: '#5B6573' },
      { label: 'ROAS', value: dec(omzet / spend, 1) + 'x', note: 'Batas aman 8x', color: omzet / spend >= 8 ? GOOD : BAD }
    ];

    var camps = cs.map(function (c) {
      var cp = c.spend / c.chat, r = c.omzet / c.spend;
      var v;
      if (c.status !== 'Aktif') v = ['Biarkan jeda', '#EEF0F3', '#3B4250'];
      else if (c.freq > 2.5) v = ['Ganti materi', '#FDF3D7', '#7A5200'];
      else if (cp > 20000 || (cp > 15000 && r < 15)) v = ['Uji materi baru', '#FCEBDD', BAD];
      else if (r >= 15) v = ['Naikkan budget', '#DDF5F2', GOOD];
      else v = ['Pertahankan', '#EEF0F3', '#3B4250'];
      return { name: c.name, unit: c.unit, dot: COLOR[c.unit], status: c.status, obj: c.obj, daily: c.daily ? rp(c.daily) : '—', spend: rp(c.spend), reach: rb(c.reach), freq: dec(c.freq, 1), freqColor: c.freq > 2.5 ? BAD : '#1F2933', ctr: dec(c.ctr, 1) + '%', cpm: rp(c.spend / (c.reach * c.freq) * 1000), chat: c.chat, cpl: rp(cp), cplColor: cp <= 15000 ? GOOD : BAD, closing: c.closing, omzet: rp(c.omzet), roas: dec(r, 1) + 'x', verdict: v[0], vBg: v[1], vFg: v[2] };
    });

    var DAYS = 27, X0 = 75, X1 = 630, Y0 = 200, top = budget * 1.05;
    var xd = function (d) { return X0 + (d - 1) / 30 * (X1 - X0); };
    var yv = function (v) { return Y0 - v / top * 180; };
    var cum = [], acc = 0;
    for (var d = 1; d <= DAYS; d++) { var w = 0.75 + 0.5 * (d / DAYS); acc += w; cum.push(acc); }
    cum = cum.map(function (v) { return v / acc * spend; });
    var line = cum.map(function (v, i) { return (i ? 'L' : 'M') + xd(i + 1).toFixed(1) + ' ' + yv(v).toFixed(1); }).join(' ');
    var area = line + ' L' + xd(DAYS).toFixed(1) + ' ' + Y0 + ' L' + X0 + ' ' + Y0 + ' Z';
    var ideal = 'M' + X0 + ' ' + yv(budget / 31) + ' L' + X1 + ' ' + yv(budget);
    var idealNow = budget * DAYS / 31;
    var pace = {
      head: 'Hari 27: ' + rp(spend) + ' dari ideal ' + rp(idealNow),
      text: spend < idealNow ? 'Kurang belanja ' + rp(idealNow - spend) + '. Bisa dipakai untuk kampanye dengan biaya per chat terendah.' : 'Belanja sesuai rencana.',
      aria: 'Grafik belanja iklan kumulatif Oktober: ' + rp(spend) + ' di hari 27, ideal ' + rp(idealNow),
      line: line, area: area, ideal: ideal, dot: 'M' + xd(DAYS).toFixed(1) + ' ' + yv(spend).toFixed(1) + ' h0',
      y1: rp(top / 4), y2: rp(top / 2), y3: rp(top * 3 / 4), y4: rp(top)
    };

    var PL = [['IG Reels', 0.41, 12800], ['IG Feed', 0.24, 15400], ['IG Story', 0.22, 14100], ['FB Feed', 0.13, 21900]];
    var placements = PL.map(function (p) { return { name: p[0], w: (p[1] / 0.41 * 100) + '%', share: Math.round(p[1] * 100) + '%', cpl: rp(p[2]), cplColor: p[2] <= 15000 ? GOOD : BAD }; });
    var AG = [['18–24 tahun', 0.38], ['25–34 tahun', 0.41], ['35–44 tahun', 0.15], ['45+ tahun', 0.06]];
    var ages = AG.map(function (a) { return { name: a[0], w: (a[1] / 0.41 * 100) + '%', v: Math.round(a[1] * 100) + '%' }; });

    var MAXC = 22000;
    var unitBars = ['Rentalaja', 'TripinAja', 'Niagaaja'].filter(function (u) { return unit === 'Semua' || u === unit; }).map(function (u) {
      var us = C.filter(function (c) { return c.unit === u; });
      var sp = us.reduce(function (a, c) { return a + c.spend; }, 0), ch = us.reduce(function (a, c) { return a + c.chat; }, 0), om = us.reduce(function (a, c) { return a + c.omzet; }, 0);
      var v = sp / ch;
      return { unit: u, cpl: rp(v), chat: ch, roas: dec(om / sp, 1) + 'x', w: Math.min(100, v / MAXC * 100) + '%', color: v <= 15000 ? '#09BEAF' : '#F2A33A' };
    });

    var left = budget - spend;
    var actions = [
      { title: 'Naikkan "Open trip November" ke Rp 60 rb/hari', body: 'ROAS 22,7x walau biaya per chat Rp 18,3 rb, karena nilai trip besar. Tambahan 4 hari ≈ Rp 100 rb.' },
      { title: 'Ganti materi "Laptop bekas mahasiswa"', body: 'Frekuensi 2,7: orang yang sama sudah lihat hampir 3 kali. Pakai Reels "cek laptop bekas" yang ER-nya tertinggi.' },
      { title: 'Uji ulang "Study tour sekolah"', body: 'Biaya per chat Rp 20,5 rb. Coba sasaran guru & orang tua 30–45 tahun, bukan siswa.' }
    ];

    var filters = ['Semua', 'Rentalaja', 'TripinAja', 'Niagaaja'].map(function (label) {
      var on = label === unit;
      return { label: label, pressed: on ? 'true' : 'false', bg: on ? '#1D3149' : '#FFFFFF', fg: on ? '#FFFFFF' : '#1D3149', border: on ? '#1D3149' : '#E3E6EB', dot: label === 'Semua' ? '#09BEAF' : COLOR[label], pick: function () { self.setState({ unit: label }); } };
    });

    return { filters: filters, tiles: tiles, camps: camps, pace: pace, placements: placements, ages: ages, unitBars: unitBars, limitX: (15000 / MAXC * 100) + '%', left: rp(Math.max(0, left)), actions: actions };
  }
}
</script>
