<span style="font-size: 14px; color: #3B4250; max-width: 960px;"><b style="color: #067A70;">Ringkasan otomatis:</b> 8 akun, 46 dari 65 konten tayang. Educational paling banyak menghasilkan leads.</span>

<section aria-label="Sumber data dan patokan" style="background: #FFFFFF; border: 1px solid #E3E6EB; border-radius: 16px; padding: 12px 16px; display: flex; flex-direction: column; gap: 10px;">
<div style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center;"><span style="font-size: 11.5px; font-weight: 900; letter-spacing: 0.08em; color: #5B6573; margin-right: 4px;">DATA DARI</span><span style="display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: #1F2933; background: #F7F8FA; border: 1px solid #E3E6EB; border-radius: 10px; padding: 5px 10px;"><b style="font-size: 11.5px; font-weight: 900; background: #DDF5F2; color: #067A70; border-radius: 6px; padding: 1px 6px;">Otomatis</b>Instagram API · 8 akun · 10.42</span><span style="display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: #1F2933; background: #F7F8FA; border: 1px solid #E3E6EB; border-radius: 10px; padding: 5px 10px;"><b style="font-size: 11.5px; font-weight: 900; background: #DDF5F2; color: #067A70; border-radius: 6px; padding: 1px 6px;">Otomatis</b>Leads dari kode tracking WA</span><span style="display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: #1F2933; background: #F7F8FA; border: 1px solid #E3E6EB; border-radius: 10px; padding: 5px 10px;"><b style="font-size: 11.5px; font-weight: 900; background: #FDF3D7; color: #7A5200; border-radius: 6px; padding: 1px 6px;">Isi manual</b>TikTok · PIC akun · Senin 10.00</span><span style="display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: #1F2933; background: #F7F8FA; border: 1px solid #E3E6EB; border-radius: 10px; padding: 5px 10px;"><b style="font-size: 11.5px; font-weight: 900; background: #FCEBDD; color: #9A3F0A; border-radius: 6px; padding: 1px 6px;">Telat</b>TikTok Rentalaja, Laptopaja</span></div>
<div style="display: flex; flex-direction: column; gap: 6px;"><span style="font-size: 11.5px; font-weight: 900; letter-spacing: 0.08em; color: #5B6573;">PATOKAN BAGUS</span><div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 8px;"><div style="display: flex; flex-direction: column; gap: 2px; padding: 8px 10px; border-radius: 10px; background: #F7F8FA; min-width: 0;"><span style="font-size: 11.5px; font-weight: 800; color: #5B6573;">ER per reach <b style="font-size: 10px; font-weight: 900; background: #EEF0F3; color: #3B4250; border-radius: 6px; padding: 1px 6px; margin-left: 4px;">Internal</b></span><strong style="font-size: 13.5px; color: #1D3149;">Bagus: ≥ median 8 minggu akunnya</strong><span style="font-size: 12px; font-weight: 800; color: #067A70;">Sekarang Rentalaja 4,0% vs 3,6%</span></div><div style="display: flex; flex-direction: column; gap: 2px; padding: 8px 10px; border-radius: 10px; background: #F7F8FA; min-width: 0;"><span style="font-size: 11.5px; font-weight: 800; color: #5B6573;">Leads per 1.000 reach <b style="font-size: 10px; font-weight: 900; background: #DDF5F2; color: #067A70; border-radius: 6px; padding: 1px 6px; margin-left: 4px;">Target Head of Marketing</b></span><strong style="font-size: 13.5px; color: #1D3149;">Bagus: ≥ 1,0</strong><span style="font-size: 12px; font-weight: 800; color: #9A3F0A;">Sekarang Rentalaja 0,5 · Wisata Garut 0,5</span></div><div style="display: flex; flex-direction: column; gap: 2px; padding: 8px 10px; border-radius: 10px; background: #F7F8FA; min-width: 0;"><span style="font-size: 11.5px; font-weight: 800; color: #5B6573;">Posting sesuai plan <b style="font-size: 10px; font-weight: 900; background: #DDF5F2; color: #067A70; border-radius: 6px; padding: 1px 6px; margin-left: 4px;">Target Head of Marketing</b></span><strong style="font-size: 13.5px; color: #1D3149;">Bagus: ≥ 90%</strong><span style="font-size: 12px; font-weight: 800; color: #9A3F0A;">Sekarang 71% (46 / 65)</span></div><div style="display: flex; flex-direction: column; gap: 2px; padding: 8px 10px; border-radius: 10px; background: #F7F8FA; min-width: 0;"><span style="font-size: 11.5px; font-weight: 800; color: #5B6573;">Porsi Educational <b style="font-size: 10px; font-weight: 900; background: #EEF0F3; color: #3B4250; border-radius: 6px; padding: 1px 6px; margin-left: 4px;">Internal</b></span><strong style="font-size: 13.5px; color: #1D3149;">Bagus: 30% content plan</strong><span style="font-size: 12px; font-weight: 800; color: #067A70;">Sekarang 33%</span></div></div><span style="font-size: 11.5px; color: #5B6573;">Referensi luar: rata-rata ER Instagram 0,48% per follower; Carousel 0,55%, Reels 0,52% (Socialinsider, 2026). Rumusnya per follower, jadi tidak bisa dibandingkan langsung dengan ER per reach kita. Patokan utama tetap median akun sendiri.</span></div>
</section>

</template>

<div style="display: flex; flex-wrap: wrap; gap: 18px; align-items: stretch;">
<div style="flex: 1 1 100%; min-width: 0; display: flex; flex-direction: column; gap: 8px;">

<template data-sc="if" value="{{b.isTable}}" hint-placeholder-val="{{ true }}">

<table style="width: 100%; min-width: 720px; border-collapse: collapse; font-size: 13px;">
<thead><tr style="text-align: right; color: #5B6573; font-size: 12px;">
<template data-sc="for" list="{{b.cols}}" as="c" hint-placeholder-count="8"><th scope="col" style="padding: 8px; border-bottom: 1px solid #E3E6EB; font-weight: 800; text-align: {{c.align}};">{{c.label}}</th></template>
</tr></thead>
<tbody>
<template data-sc="for" list="{{b.rows}}" as="r" hint-placeholder-count="8">
<tr style="text-align: right;">
<template data-sc="for" list="{{r.cells}}" as="x" hint-placeholder-count="8"><td style="padding: 10px 8px; border-bottom: 1px solid #EEF0F3; text-align: {{x.align}}; color: {{x.color}}; font-weight: {{x.weight}};"><template data-sc="if" value="{{x.dot}}" hint-placeholder-val="{{ false }}"><span style="display: inline-block; width: 9px; height: 9px; border-radius: 5px; background: {{x.dot}}; margin-right: 7px;"></span></template>{{x.v}}</td></template>
</tr>
</template>
</tbody>
</table>
</div>
</template>

<template data-sc="if" value="{{b.isFeed}}" hint-placeholder-val="{{ false }}">
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px;">
<template data-sc="for" list="{{b.posts}}" as="p" hint-placeholder-count="8">
<article style="border: 1px solid #E3E6EB; border-radius: 14px; overflow: hidden; display: flex; flex-direction: column;">
<div role="img" aria-label="Foto postingan, ditarik dari Instagram" style="aspect-ratio: 1 / 1; background: {{p.tint}}; position: relative; display: flex; align-items: center; justify-content: center; color: {{p.dot}}; font-size: 12px; font-weight: 900; flex-direction: column; gap: 6px;"><svg aria-hidden="true" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{p.fip}}"></path></svg>{{p.fmt}}<span style="position: absolute; top: 8px; left: 8px; font-size: 11.5px; font-weight: 900; background: #FFFFFF; color: {{p.vFg}}; border-radius: 8px; padding: 2px 7px;">{{p.verdict}}</span></div>
<div style="padding: 8px 10px 10px; display: flex; flex-direction: column; gap: 3px; border-bottom: 4px solid {{p.flag}};">
