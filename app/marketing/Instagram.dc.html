<a href="WALeads.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-weight: 500; color: #3B4250;"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 01-11.6 7.1L4 20l1-4.6A8 8 0 1121 12z"></path><path d="M9 10.5h6M9 13.5h4"></path></svg><span style="flex-grow: 1;">WA Leads</span><span style="min-width: 22px; height: 22px; border-radius: 11px; background: #C2410C; color: #FFFFFF; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; padding: 0 6px; box-sizing: border-box;">6</span></a>
<a href="WAStory.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-weight: 500; color: #3B4250;"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5" stroke-dasharray="3.2 2.4"></circle><circle cx="12" cy="12" r="3.5"></circle></svg><span style="flex-grow: 1;">WA Story &amp; Broadcast</span></a>

<div style="display: flex; flex-direction: column; gap: 2px;">

<a href="DataInput.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-weight: 500; color: #3B4250;"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="7" ry="3"></ellipse><path d="M5 6v6c0 1.7 3.1 3 7 3s7-1.3 7-3V6M5 12v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6"></path></svg><span style="flex-grow: 1;">Input &amp; Kualitas Data</span></a>
</div>
<div style="display: flex; flex-direction: column; gap: 2px;">

</div>

<main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 28px 36px 48px; display: flex; flex-direction: column; gap: 22px;">

<header style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px;">
<div style="display: flex; flex-direction: column; gap: 4px;">
<span style="font-size: 13px; color: #5B6573; font-weight: 600;">Oktober 2026 · data 1–27 Oktober</span>
<h1 style="margin: 0; font-size: 30px; font-weight: 900; letter-spacing: -0.01em;">Sosial Media · Analisa Feed</h1>
</div>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px;">
<span style="font-size: 12px; font-weight: 700; color: #5B6573; border: 1px dashed #A9B4C2; border-radius: 18px; padding: 8px 12px;">Data contoh</span>
<button type="button" style="height: 44px; padding: 0 16px; border-radius: 10px; border: 1px solid #E3E6EB; background: #FFFFFF; color: #1D3149; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer;">Ekspor CSV</button>
<button type="button" style="height: 44px; padding: 0 18px; border-radius: 10px; border: 0; background: #09BEAF; color: #1D3149; font-family: inherit; font-size: 14px; font-weight: 800; cursor: pointer;">Sinkron sekarang</button>
</div>
</header>

<section aria-label="Status sinkron" style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; background: #FFFFFF; border: 1px solid #E3E6EB; border-radius: 16px; padding: 14px 18px;">
<span style="display: inline-flex; align-items: center; gap: 8px; font-weight: 800; color: #067A70;"><span style="width: 10px; height: 10px; border-radius: 5px; background: #09BEAF;"></span>Instagram API tersambung</span>
<span style="font-size: 13px; color: #3B4250;">3 akun profesional · tarik otomatis tiap hari 05.00 · terakhir 10.42</span>
<span style="font-size: 13px; color: #3B4250;">Token aktif sampai 26 Des 2026 (diperbarui otomatis)</span>
<span style="font-size: 13px; color: #7A5200; font-weight: 700;">◆ Angka 48 jam terakhir masih bisa bertambah</span>
<span style="font-size: 13px; color: #9A3F0A; font-weight: 700;">▲ TikTok: belum tersambung, input manual mingguan</span>
</section>

<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px;">
<div role="group" aria-label="Pilih akun" style="display: flex; flex-wrap: wrap; gap: 8px;">
<template data-sc="for" list="{{accounts}}" as="a" hint-placeholder-count="3">
<button type="button" onClick="{{a.pick}}" aria-pressed="{{a.pressed}}" style="display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 18px; border-radius: 22px; border: 1px solid {{a.border}}; background: {{a.bg}}; color: {{a.fg}}; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer;"><span style="width: 10px; height: 10px; border-radius: 5px; background: {{a.dot}};"></span>{{a.label}}</button>
</template>
</div>
<span style="font-size: 13px; color: #5B6573;">{{acc.followersText}} followers · {{acc.postsText}} postingan bulan ini</span>
</div>

<section aria-label="Metrik akun" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px;">
<template data-sc="for" list="{{tiles}}" as="t" hint-placeholder-count="8">
<div style="background: #FFFFFF; border: 1px solid #E3E6EB; border-radius: 20px; padding: 16px 18px; display: flex; flex-direction: column; gap: 4px;">
<span style="font-size: 13px; font-weight: 700; color: #3B4250;">{{t.label}}</span>
<span style="font-size: 26px; font-weight: 900; letter-spacing: -0.02em; color: #1D3149;">{{t.value}}</span>
<span style="font-size: 12px; font-weight: 700; color: {{t.color}};">{{t.note}}</span>
</div>
</template>
</section>

<section aria-labelledby="grid-h" style="background: #FFFFFF; border: 1px solid #E3E6EB; border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 14px;">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px;">
<div style="display: flex; flex-direction: column;"><h2 id="grid-h" style="margin: 0; font-size: 18px; font-weight: 800;">Feed bulan ini</h2><span style="font-size: 13px; color: #5B6573;">Tampilan seperti di profil. Garis teal = di atas median ER akun, oranye = di bawah.</span></div>
<div role="group" aria-label="Urutkan feed" style="display: flex; flex-wrap: wrap; gap: 6px;">
<template data-sc="for" list="{{sorts}}" as="s" hint-placeholder-count="4">
<button type="button" onClick="{{s.pick}}" aria-pressed="{{s.pressed}}" style="height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid {{s.border}}; background: {{s.bg}}; color: {{s.fg}}; font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer;">{{s.label}}</button>
</template>
</div>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px;">
<template data-sc="for" list="{{grid}}" as="p" hint-placeholder-count="12">
<article style="aspect-ratio: 4 / 5; border-radius: 12px; padding: 12px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; background: {{p.bg}}; color: {{p.ink}}; border-bottom: 4px solid {{p.flag}};">
<div style="display: flex; justify-content: space-between; align-items: center; font-size: 11px; font-weight: 800;"><span>{{p.type}}</span><span>{{p.date}}</span></div>
<div style="display: flex; flex-direction: column; gap: 4px;">
<span style="font-size: 11px; font-weight: 800; opacity: 0.85;">{{p.pillar}}</span>
<span style="font-size: 13px; font-weight: 700; line-height: 1.3;">{{p.caption}}</span>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; font-size: 12px;">
<span><strong>{{p.reachText}}</strong> reach</span>
<span><strong>{{p.erText}}</strong> ER</span>
<span><strong>{{p.saves}}</strong> simpan</span>
<span><strong>{{p.shares}}</strong> bagikan</span>
</div>
</article>
</template>
</div>
</section>

<div style="display: flex; flex-wrap: wrap; gap: 22px; align-items: stretch;">
<section aria-labelledby="fmt-h" style="flex: 1 1 460px; min-width: 0; background: #FFFFFF; border: 1px solid #E3E6EB; border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 12px;">
<div style="display: flex; flex-direction: column;"><h2 id="fmt-h" style="margin: 0; font-size: 18px; font-weight: 800;">Performa per format</h2><span style="font-size: 13px; color: #5B6573;">Bagian dari jumlah konten dibanding bagian dari reach.</span></div>
<template data-sc="for" list="{{formats}}" as="f" hint-placeholder-count="3">
<div style="display: flex; flex-direction: column; gap: 6px; padding: 10px 0; border-bottom: 1px solid #EEF0F3;">
<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 8px;"><span style="font-size: 15px; font-weight: 800;">{{f.name}}</span><span style="font-size: 12px; color: #3B4250;">{{f.n}} post · rata-rata reach <strong>{{f.avgReach}}</strong> · ER <strong>{{f.avgEr}}</strong> · simpan <strong>{{f.avgSaves}}</strong></span></div>
<div style="display: grid; grid-template-columns: 90px minmax(0, 1fr) 44px; align-items: center; gap: 10px; font-size: 12px; color: #5B6573;"><span>Konten</span><div style="height: 10px; background: #EEF0F3; border-radius: 5px; overflow: hidden;"><div style="height: 100%; width: {{f.sharePosts}}; background: #A9B4C2; border-radius: 5px;"></div></div><span style="text-align: right; font-weight: 800; color: #1F2933;">{{f.sharePosts}}</span></div>
<div style="display: grid; grid-template-columns: 90px minmax(0, 1fr) 44px; align-items: center; gap: 10px; font-size: 12px; color: #5B6573;"><span>Reach</span><div style="height: 10px; background: #EEF0F3; border-radius: 5px; overflow: hidden;"><div style="height: 100%; width: {{f.shareReach}}; background: #1D3149; border-radius: 5px;"></div></div><span style="text-align: right; font-weight: 800; color: #1F2933;">{{f.shareReach}}</span></div>
</div>
</template>
</section>

<section aria-labelledby="pil-h" style="flex: 1 1 460px; min-width: 0; background: #FFFFFF; border: 1px solid #E3E6EB; border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 12px;">
<div style="display: flex; flex-direction: column;"><h2 id="pil-h" style="margin: 0; font-size: 18px; font-weight: 800;">Pilar konten</h2><span style="font-size: 13px; color: #5B6573;">Mana yang paling bikin orang berhenti, simpan, dan chat.</span></div>
<div style="overflow-x: auto;">
<table style="width: 100%; min-width: 440px; border-collapse: collapse; font-size: 13px;">
<thead><tr style="text-align: right; color: #5B6573; font-size: 12px;">
<th scope="col" style="text-align: left; padding: 8px; border-bottom: 1px solid #E3E6EB; font-weight: 800;">Pilar</th>
<th scope="col" style="padding: 8px; border-bottom: 1px solid #E3E6EB; font-weight: 800;">Post</th>
<th scope="col" style="padding: 8px; border-bottom: 1px solid #E3E6EB; font-weight: 800;">Reach rata-rata</th>
<th scope="col" style="padding: 8px; border-bottom: 1px solid #E3E6EB; font-weight: 800;">ER</th>
<th scope="col" style="padding: 8px; border-bottom: 1px solid #E3E6EB; font-weight: 800;">Simpan</th>
<th scope="col" style="padding: 8px; border-bottom: 1px solid #E3E6EB; font-weight: 800;">Chat WA</th>
</tr></thead>
<tbody>
<template data-sc="for" list="{{pillars}}" as="r" hint-placeholder-count="5">
<tr style="text-align: right;">
<th scope="row" style="text-align: left; padding: 10px 8px; border-bottom: 1px solid #EEF0F3; font-weight: 800;">{{r.name}}</th>
<td style="padding: 10px 8px; border-bottom: 1px solid #EEF0F3;">{{r.n}}</td>
<td style="padding: 10px 8px; border-bottom: 1px solid #EEF0F3;">{{r.avgReach}}</td>
<td style="padding: 10px 8px; border-bottom: 1px solid #EEF0F3;"><span style="display: inline-block; min-width: 46px; border-radius: 6px; padding: 2px 6px; text-align: center; background: {{r.erBg}}; color: {{r.erFg}}; font-weight: 800;">{{r.er}}</span></td>
<td style="padding: 10px 8px; border-bottom: 1px solid #EEF0F3;">{{r.saves}}</td>
<td style="padding: 10px 8px; border-bottom: 1px solid #EEF0F3; font-weight: 800;">{{r.chats}}</td>
</tr>
</template>
</tbody>
</table>
</div>
</section>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 22px; align-items: stretch;">
<section aria-labelledby="heat-h" style="flex: 3 1 560px; min-width: 0; background: #FFFFFF; border: 1px solid #E3E6EB; border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 12px;">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 8px;">
<div style="display: flex; flex-direction: column;"><h2 id="heat-h" style="margin: 0; font-size: 18px; font-weight: 800;">Jam posting terbaik</h2><span style="font-size: 13px; color: #5B6573;">Persen followers yang online per jam, dari data 30 hari terakhir.</span></div>
<span style="font-size: 13px; font-weight: 800; color: #067A70; background: #DDF5F2; border-radius: 12px; padding: 4px 12px;">Terbaik: {{best}}</span>
</div>
<div style="overflow-x: auto;">
<div style="display: grid; grid-template-columns: 92px repeat(7, minmax(56px, 1fr)); gap: 4px; min-width: 520px;">
<span></span>
<template data-sc="for" list="{{days}}" as="d" hint-placeholder-count="7"><span style="font-size: 12px; font-weight: 800; color: #5B6573; text-align: center;">{{d}}</span></template>
<template data-sc="for" list="{{heat}}" as="row" hint-placeholder-count="6">
<span style="font-size: 12px; font-weight: 700; color: #3B4250; display: flex; align-items: center;">{{row.label}}</span>
<template data-sc="for" list="{{row.cells}}" as="c" hint-placeholder-count="7">
<span title="{{c.tip}}" style="height: 36px; border-radius: 6px; background: {{c.bg}}; color: {{c.ink}}; font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center; box-shadow: {{c.ring}};">{{c.v}}</span>
</template>
</template>

    var days = ['Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab', 'Min'];
    var BLOCKS = ['06–09', '09–12', '12–15', '15–18', '18–21', '21–24'];
    var bf = [0.25, 0.42, 0.55, 0.5, 0.95, 0.7];
    var df = [0.82, 0.78, 0.8, 0.83, 0.92, 1.0, 0.97];
    if (accName === 'TripinAja') { bf = [0.35, 0.5, 0.55, 0.48, 0.9, 0.62]; df = [0.75, 0.72, 0.76, 0.8, 0.95, 1.0, 0.92]; }
    if (accName === 'Niagaaja') { bf = [0.2, 0.38, 0.6, 0.52, 0.88, 0.8]; df = [0.9, 0.88, 0.9, 0.9, 0.85, 0.95, 1.0]; }
    var RAMP = ['#E6F7F5', '#B9EAE4', '#7DD8CE', '#2FBCAD', '#067A70'];
    var bestV = 0, bestLbl = '';
    var heat = BLOCKS.map(function (b, bi) {
      return { label: b, cells: days.map(function (d, di) {
        var v = Math.round(bf[bi] * df[di] * 42);
        if (v > bestV) { bestV = v; bestLbl = d + ' ' + b; }
        return { v: v + '%', raw: v, tip: d + ' ' + b + ': ' + v + '% followers online' };
      }) };
    });
    heat.forEach(function (row) { row.cells.forEach(function (c) {
      var step = Math.min(4, Math.floor(c.raw / 42 * 5));
      c.bg = RAMP[step]; c.ink = step >= 3 ? '#FFFFFF' : '#1D3149';
      c.ring = c.raw === bestV ? '0 0 0 2px #1D3149' : 'none';
    }); });

    var wf = [0.22, 0.24, 0.25, 0.29];
    var maxF = Math.max.apply(null, wf) * A.fol * 1.25;
    var folWeeks = wf.map(function (w, i) {
      var f = Math.round(A.fol * w * 1.2), u = Math.round(A.unf * w);
      return { net: f - u, fH: Math.round(f / maxF * 100) + '%', uH: Math.max(2, Math.round(u / maxF * 100)) + '%', tip: 'Follow ' + f + ' · unfollow ' + u };
    });

    var inter = posts.reduce(function (a, p) { return a + p.likes + p.comments + p.saves + p.shares; }, 0);
    var accEr = inter / totReach * 100;
    var growth = (A.reach - A.reachP) / A.reachP * 100;
    var tiles = [
      { label: 'Reach akun', value: rb(A.reach), note: (growth >= 0 ? '▲ ' : '▼ ') + dec(Math.abs(growth), 0) + '% vs September', color: growth >= 0 ? GOOD : BAD },
      { label: 'Views', value: rb(A.views), note: 'Semua tayangan feed, Reels, Story', color: '#5B6573' },
      { label: 'Followers bersih', value: '+' + num(A.fol - A.unf), note: num(A.fol) + ' follow · ' + num(A.unf) + ' unfollow', color: '#5B6573' },
      { label: 'Engagement rate', value: dec(accEr, 1) + '%', note: accEr >= 4 ? 'Di atas target 4%' : 'Target 4,0%', color: accEr >= 4 ? GOOD : BAD },
      { label: 'Interaksi total', value: rb(inter), note: 'Suka, komentar, simpan, bagikan', color: '#5B6573' },
      { label: 'Klik tombol profil', value: num(A.taps), note: 'WA, telepon, alamat di bio', color: '#5B6573' },
      { label: 'Chat dari bio', value: num(A.chats), note: 'Tautan WA ber-kode di bio', color: '#5B6573' },
      { label: 'Postingan terbit', value: posts.length + ' / ' + A.plan, note: posts.length >= A.plan ? 'Sesuai rencana' : 'Kurang ' + (A.plan - posts.length) + ' dari rencana', color: posts.length >= A.plan ? GOOD : BAD }
    ];

    var comps = [{ name: accName + ' (kita)', fol: num(A.followers), posts: posts.length, likes: num(posts.reduce(function (a, p) { return a + p.likes; }, 0) / posts.length), comments: num(posts.reduce(function (a, p) { return a + p.comments; }, 0) / posts.length), views: rb(posts.filter(function (p) { return p.type === 'Reels'; }).reduce(function (a, p) { return a + p.views; }, 0) / Math.max(1, posts.filter(function (p) { return p.type === 'Reels'; }).length)), er: dec((posts.reduce(function (a, p) { return a + p.likes + p.comments; }, 0) / posts.length) / A.followers * 100, 1) + '%', bg: '#F0FBF9', weight: '900' }].concat(A.comps.map(function (c) {
      return { name: c[0], fol: num(c[1]), posts: c[2], likes: num(c[3]), comments: num(c[4]), views: rb(c[5]), er: dec((c[3] + c[4]) / c[1] * 100, 1) + '%', bg: '#FFFFFF', weight: '700' };
    }));

    var bestFmt = formats.slice().sort(function (a, b) { return b.erVal - a.erVal; })[0];
    var reachFmt = formats.slice().sort(function (a, b) { return (b.reachShare - b.postShare) - (a.reachShare - a.postShare); })[0];
    var bestPil = pillarsRaw.slice().sort(function (a, b) { return b.chats - a.chats; })[0];
    var worstPil = pillarsRaw.slice().sort(function (a, b) { return a.er - b.er; })[0];
    var recs = [
      { title: 'Posting di ' + bestLbl, body: 'Jam paling ramai followers online. Jadwalkan konten terkuat minggu depan di slot ini.' },
      { title: 'Tambah ' + reachFmt.name, body: reachFmt.name + ' baru ' + reachFmt.sharePosts + ' dari konten tapi menyumbang ' + reachFmt.shareReach + ' reach.' },
      { title: 'Ulangi pilar ' + bestPil.name, body: 'Paling banyak menghasilkan chat WA (' + bestPil.chats + ' chat). ' + bestFmt.name + ' punya ER tertinggi, ' + bestFmt.avgEr + '.' },
      { title: 'Perbaiki ' + worstPil.name, body: 'ER rata-rata ' + dec(worstPil.er, 1) + '%, terendah. Coba hook 3 detik pertama atau ganti ke format ' + bestFmt.name + '.' }
    ];

    var accounts = ['Rentalaja', 'TripinAja', 'Niagaaja'].map(function (label) {
      var on = label === accName;
      return { label: label, pressed: on ? 'true' : 'false', bg: on ? '#1D3149' : '#FFFFFF', fg: on ? '#FFFFFF' : '#1D3149', border: on ? '#1D3149' : '#E3E6EB', dot: COLOR[label], pick: function () { self.setState({ acc: label, sort: 'baru' }); } };
    });

    return {
      accounts: accounts, acc: { followersText: num(A.followers), postsText: posts.length }, accUpper: accName.toUpperCase(),
      tiles: tiles, sorts: sorts, grid: sorted.map(fmtPost), posts: posts.map(fmtPost), medianEr: dec(median, 1) + '%',
      formats: formats, pillars: pillars, days: days, heat: heat, best: bestLbl, folWeeks: folWeeks, comps: comps, tt: A.tt, recs: recs
    };
  }
}
</script>
