<main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 28px 36px 48px; display: flex; flex-direction: column; gap: 22px;">

<header style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px;">
<div style="display: flex; flex-direction: column; gap: 4px;">
<span style="font-size: 13px; color: #5B6573; font-weight: 600;">Rencana November 2026 · diperbarui 28 Oktober 13.30</span>
<h1 style="margin: 0; font-size: 30px; font-weight: 900; letter-spacing: -0.01em;">Kalender Konten &amp; Produksi</h1>
</div>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px;">
<span style="font-size: 12px; font-weight: 700; color: #5B6573; border: 1px dashed #A9B4C2; border-radius: 18px; padding: 8px 12px;">Data contoh</span>
<button type="button" style="height: 44px; padding: 0 16px; border-radius: 10px; border: 1px solid #E3E6EB; background: #FFFFFF; color: #1D3149; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer;">Salin pola minggu lalu</button>
<button type="button" style="height: 44px; padding: 0 18px; border-radius: 10px; border: 0; background: #09BEAF; color: #1D3149; font-family: inherit; font-size: 14px; font-weight: 800; cursor: pointer;">+ Ide konten</button>
</div>
</header>

<div role="group" aria-label="Filter unit bisnis" style="display: flex; flex-wrap: wrap; gap: 8px;">
<template data-sc="for" list="{{filters}}" as="f" hint-placeholder-count="4">
<button type="button" onClick="{{f.pick}}" aria-pressed="{{f.pressed}}" style="display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 18px; border-radius: 22px; border: 1px solid {{f.border}}; background: {{f.bg}}; color: {{f.fg}}; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer;"><span style="width: 10px; height: 10px; border-radius: 5px; background: {{f.dot}};"></span>{{f.label}}</button>
</template>
</div>

<section aria-label="Metrik produksi" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px;">
<template data-sc="for" list="{{tiles}}" as="t" hint-placeholder-count="8">
<div style="background: #FFFFFF; border: 1px solid #E3E6EB; border-radius: 20px; padding: 16px 18px; display: flex; flex-direction: column; gap: 4px;">
<span style="font-size: 13px; font-weight: 700; color: #3B4250;">{{t.label}}</span>
<span style="font-size: 26px; font-weight: 900; letter-spacing: -0.02em; color: #1D3149;">{{t.value}}</span>
<span style="font-size: 12px; font-weight: 700; color: {{t.color}};">{{t.note}}</span>
</div>
</template>
</section>

<div data-island="board"></div>

<section aria-labelledby="cal-h" style="background: #FFFFFF; border: 1px solid #E3E6EB; border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 12px;">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 10px;">
<div style="display: flex; flex-direction: column;"><h2 id="cal-h" style="margin: 0; font-size: 18px; font-weight: 800;">November 2026</h2><span style="font-size: 13px; color: #5B6573;">Hari bertitik oranye = belum ada konten terjadwal. Warna kartu = tahap produksi.</span></div>
<div style="display: flex; flex-wrap: wrap; gap: 10px; font-size: 12px; font-weight: 700; color: #3B4250;">
<template data-sc="for" list="{{stageLegend}}" as="s" hint-placeholder-count="5"><span style="display: inline-flex; align-items: center; gap: 6px;"><span style="width: 12px; height: 12px; border-radius: 3px; background: {{s.bg}}; border: 1px solid {{s.border}};"></span>{{s.label}}</span></template>
</div>
</div>
<div style="overflow-x: auto;">
<div style="display: grid; grid-template-columns: repeat(7, minmax(130px, 1fr)); gap: 6px; min-width: 940px;">
<template data-sc="for" list="{{dow}}" as="d" hint-placeholder-count="7"><span style="font-size: 12px; font-weight: 800; color: #5B6573; padding: 0 4px;">{{d}}</span></template>
<template data-sc="for" list="{{cells}}" as="c" hint-placeholder-count="35">
<div style="min-height: 118px; border-radius: 10px; padding: 6px; box-sizing: border-box; background: {{c.bg}}; border: 1px solid {{c.border}}; display: flex; flex-direction: column; gap: 4px;">
<div style="display: flex; justify-content: space-between; align-items: center;"><span style="font-size: 12px; font-weight: 900; color: {{c.numColor}};">{{c.day}}</span><span style="width: 8px; height: 8px; border-radius: 4px; background: {{c.flag}};"></span></div>
<template data-sc="for" list="{{c.items}}" as="i" hint-placeholder-count="2">
<div title="{{i.tip}}" style="border-radius: 6px; padding: 4px 6px; background: {{i.bg}}; border: 1px solid {{i.border}}; display: flex; flex-direction: column; gap: 1px;">
<span style="font-size: 10px; font-weight: 800; color: #3B4250;"><span style="display: inline-block; width: 7px; height: 7px; border-radius: 4px; background: {{i.dot}}; margin-right: 4px;"></span>{{i.fmt}} · {{i.pic}}</span>
<span style="font-size: 11px; font-weight: 700; line-height: 1.25; color: #1F2933;">{{i.title}}</span>
</div>
</template>
</div>
</template>
</div>
</div>
</section>

<section aria-labelledby="kb-h" style="background: #FFFFFF; border: 1px solid #E3E6EB; border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 12px;">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 8px;">
<div style="display: flex; flex-direction: column;"><h2 id="kb-h" style="margin: 0; font-size: 18px; font-weight: 800;">Papan produksi</h2><span style="font-size: 13px; color: #5B6573;">Ide → Brief → Produksi → Review → Revisi → Terjadwal → Tayang. Konten baru dianggap selesai kalau reviewer menyetujui.</span></div>
<span style="font-size: 12px; color: #5B6573;">Garis oranye = lewat tenggat</span>
</div>
<div style="overflow-x: auto;">
<div style="display: grid; grid-template-columns: repeat(7, minmax(160px, 1fr)); gap: 10px; min-width: 1150px; align-items: start;">
<template data-sc="for" list="{{board}}" as="col" hint-placeholder-count="7">
<div style="background: #F3F5F8; border-radius: 14px; padding: 10px; display: flex; flex-direction: column; gap: 8px;">
<div style="display: flex; justify-content: space-between; align-items: center;"><span style="font-size: 13px; font-weight: 800;">{{col.name}}</span><span style="font-size: 12px; font-weight: 800; background: #FFFFFF; border-radius: 10px; padding: 1px 8px; color: {{col.countColor}};">{{col.count}}</span></div>
<template data-sc="for" list="{{col.cards}}" as="k" hint-placeholder-count="3">
<div style="background: #FFFFFF; border-radius: 10px; padding: 9px; display: flex; flex-direction: column; gap: 4px; border: 1px solid {{k.border}};">
<span style="font-size: 12px; font-weight: 800; line-height: 1.3;">{{k.title}}</span>
<span style="font-size: 11px; color: #3B4250;"><span style="display: inline-block; width: 7px; height: 7px; border-radius: 4px; background: {{k.dot}}; margin-right: 4px;"></span>{{k.unit}} · {{k.fmt}} · {{k.pic}}</span>
<span style="font-size: 11px; font-weight: 800; color: {{k.metaColor}};">{{k.meta}}</span>
</div>
</template>
</div>
</template>
</div>
</div>
</section>

<section aria-labelledby="rv-h" style="background: #FFFFFF; border: 1px solid #E3E6EB; border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 12px;">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 8px;">
<div style="display: flex; flex-direction: column;"><h2 id="rv-h" style="margin: 0; font-size: 18px; font-weight: 800;">Review &amp; revisi</h2><span style="font-size: 13px; color: #5B6573;">Revisi otomatis jadi slot KKH pembuatnya. Lewat 2 hari dari tenggat → naik ke Kepala Staf.</span></div>
</div>
<div style="overflow-x: auto;">
<table style="width: 100%; min-width: 1000px; border-collapse: collapse; font-size: 13px;">
<thead><tr style="text-align: left; color: #5B6573; font-size: 12px;">
<th scope="col" style="padding: 8px; border-bottom: 1px solid #E3E6EB; font-weight: 800;">Konten</th>
<th scope="col" style="padding: 8px; border-bottom: 1px solid #E3E6EB; font-weight: 800;">Tahap</th>
<th scope="col" style="padding: 8px; border-bottom: 1px solid #E3E6EB; font-weight: 800;">Catatan reviewer</th>
<th scope="col" style="padding: 8px; border-bottom: 1px solid #E3E6EB; font-weight: 800;">Revisi ke</th>
<th scope="col" style="padding: 8px; border-bottom: 1px solid #E3E6EB; font-weight: 800;">Tenggat</th>
<th scope="col" style="padding: 8px; border-bottom: 1px solid #E3E6EB; font-weight: 800;">Status</th>
</tr></thead>
<tbody>
<template data-sc="for" list="{{reviews}}" as="r" hint-placeholder-count="6">
<tr>
<th scope="row" style="text-align: left; padding: 10px 8px; border-bottom: 1px solid #EEF0F3;"><span style="font-weight: 800;">{{r.title}}</span><br><span style="font-size: 12px; font-weight: 600; color: #5B6573;"><span style="display: inline-block; width: 8px; height: 8px; border-radius: 4px; background: {{r.dot}}; margin-right: 4px;"></span>{{r.unit}} · {{r.fmt}} · {{r.pic}} · tayang {{r.day}} Nov</span></th>
<td style="padding: 10px 8px; border-bottom: 1px solid #EEF0F3;"><span style="font-size: 12px; font-weight: 800; border-radius: 8px; padding: 2px 8px; background: {{r.stBg}}; color: {{r.stFg}};">{{r.stage}}</span></td>
<td style="padding: 10px 8px; border-bottom: 1px solid #EEF0F3; color: #3B4250; max-width: 320px;">{{r.note}}</td>
<td style="padding: 10px 8px; border-bottom: 1px solid #EEF0F3; font-weight: 800;">{{r.rev}}</td>
<td style="padding: 10px 8px; border-bottom: 1px solid #EEF0F3; white-space: nowrap;">{{r.due}}</td>
<td style="padding: 10px 8px; border-bottom: 1px solid #EEF0F3; font-weight: 800; color: {{r.statusColor}};">{{r.status}}</td>
</tr>
</template>
</tbody>
</table>
</div>
</section>

<div style="display: flex; flex-wrap: wrap; gap: 22px; align-items: stretch;">
<section aria-labelledby="pic-h" style="flex: 3 1 560px; min-width: 0; background: #FFFFFF; border: 1px solid #E3E6EB; border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 12px;">
<div style="display: flex; flex-direction: column;"><h2 id="pic-h" style="margin: 0; font-size: 18px; font-weight: 800;">Beban kerja per orang</h2><span style="font-size: 13px; color: #5B6573;">Jumlah konten di tiap tahap · tepat waktu dihitung dari konten Oktober.</span></div>
<div style="overflow-x: auto;">
<table style="width: 100%; min-width: 620px; border-collapse: collapse; font-size: 13px;">
<thead><tr style="text-align: right; color: #5B6573; font-size: 12px;">
<th scope="col" style="text-align: left; padding: 8px; border-bottom: 1px solid #E3E6EB; font-weight: 800;">Orang</th>
<th scope="col" style="padding: 8px; border-bottom: 1px solid #E3E6EB; font-weight: 800;">Ide/Brief</th>
<th scope="col" style="padding: 8px; border-bottom: 1px solid #E3E6EB; font-weight: 800;">Produksi</th>
<th scope="col" style="padding: 8px; border-bottom: 1px solid #E3E6EB; font-weight: 800;">Review</th>
<th scope="col" style="padding: 8px; border-bottom: 1px solid #E3E6EB; font-weight: 800;">Revisi</th>
<th scope="col" style="padding: 8px; border-bottom: 1px solid #E3E6EB; font-weight: 800;">Terjadwal</th>
<th scope="col" style="padding: 8px; border-bottom: 1px solid #E3E6EB; font-weight: 800;">Tepat waktu Okt</th>
<th scope="col" style="padding: 8px; border-bottom: 1px solid #E3E6EB; font-weight: 800;">Revisi per konten</th>
</tr></thead>
<tbody>
<template data-sc="for" list="{{people}}" as="p" hint-placeholder-count="3">
<tr style="text-align: right;">
<th scope="row" style="text-align: left; padding: 10px 8px; border-bottom: 1px solid #EEF0F3; font-weight: 800;">{{p.name}}<br><span style="font-size: 12px; font-weight: 600; color: #5B6573;">{{p.role}}</span></th>
<td style="padding: 10px 8px; border-bottom: 1px solid #EEF0F3;">{{p.idea}}</td>
<td style="padding: 10px 8px; border-bottom: 1px solid #EEF0F3;">{{p.prod}}</td>
<td style="padding: 10px 8px; border-bottom: 1px solid #EEF0F3;">{{p.review}}</td>
<td style="padding: 10px 8px; border-bottom: 1px solid #EEF0F3; font-weight: 800; color: {{p.revColor}};">{{p.revisi}}</td>
<td style="padding: 10px 8px; border-bottom: 1px solid #EEF0F3;">{{p.sched}}</td>
<td style="padding: 10px 8px; border-bottom: 1px solid #EEF0F3; font-weight: 800; color: {{p.otColor}};">{{p.ontime}}</td>
<td style="padding: 10px 8px; border-bottom: 1px solid #EEF0F3;">{{p.rpc}}</td>
</tr>
</template>
</tbody>
</table>
</div>
</section>

<section aria-labelledby="mix-h" style="flex: 2 1 380px; min-width: 0; background: #FFFFFF; border: 1px solid #E3E6EB; border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 12px;">
<div style="display: flex; flex-direction: column;"><h2 id="mix-h" style="margin: 0; font-size: 18px; font-weight: 800;">Campuran pilar November</h2><span style="font-size: 13px; color: #5B6573;">Rencana dibanding komposisi target. Garis = target.</span></div>
<template data-sc="for" list="{{mix}}" as="m" hint-placeholder-count="5">
<div style="display: grid; grid-template-columns: 110px minmax(0, 1fr) 90px; align-items: center; gap: 10px;">
<span style="font-size: 13px; font-weight: 700;">{{m.name}}</span>
<div style="position: relative; height: 16px; background: #F3F5F8; border-radius: 5px;"><div style="height: 100%; width: {{m.w}}; background: {{m.c}}; border-radius: 5px;"></div><div style="position: absolute; top: -3px; bottom: -3px; left: {{m.t}}; border-left: 2px dashed #1D3149;"></div></div>
<span style="font-size: 12px; text-align: right;"><strong>{{m.v}}</strong> · target {{m.target}}</span>
</div>
</template>
<div style="border-top: 1px solid #EEF0F3; padding-top: 12px; display: flex; flex-direction: column; gap: 8px;">
<span style="font-size: 13px; font-weight: 800;">Format</span>
<template data-sc="for" list="{{fmts}}" as="m" hint-placeholder-count="4">
<div style="display: grid; grid-template-columns: 110px minmax(0, 1fr) 44px; align-items: center; gap: 10px;">
<span style="font-size: 12px; color: #3B4250;">{{m.name}}</span>
<div style="height: 12px; background: #F3F5F8; border-radius: 4px; overflow: hidden;"><div style="height: 100%; width: {{m.w}}; background: #1D3149; border-radius: 4px;"></div></div>
<span style="font-size: 12px; font-weight: 800; text-align: right;">{{m.n}}</span>
</div>
</template>
</div>
</section>
</div>

<section aria-labelledby="rule-h" style="background: #1D3149; color: #FFFFFF; border-radius: 20px; padding: 22px 24px; display: flex; flex-direction: column; gap: 14px;">
<div style="display: flex; flex-direction: column;"><span style="font-size: 12px; font-weight: 800; letter-spacing: 0.1em; color: #86DCD3;">ATURAN MAIN PRODUKSI</span><h2 id="rule-h" style="margin: 0; font-size: 20px; font-weight: 900;">Supaya konten jadi tepat waktu dan revisi tidak menggantung</h2></div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px;">
<div style="background: #2C4664; border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 4px;"><span style="font-size: 13px; font-weight: 900; color: #86DCD3;">H-7 sudah terisi</span><span style="font-size: 13px; color: #E3E6EB;">Setiap Jumat, semua slot minggu depan wajib minimal di tahap Brief.</span></div>
<div style="background: #2C4664; border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 4px;"><span style="font-size: 13px; font-weight: 900; color: #86DCD3;">Review maks 1 hari</span><span style="font-size: 13px; color: #E3E6EB;">Kepala Staf atau leader Marketing mereview paling lambat besoknya. CEO tidak jadi reviewer harian.</span></div>
<div style="background: #2C4664; border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 4px;"><span style="font-size: 13px; font-weight: 900; color: #86DCD3;">Revisi = tugas baru</span><span style="font-size: 13px; color: #E3E6EB;">Catatan review otomatis jadi slot KKH dengan tenggat. Tidak bisa ditandai selesai sebelum disetujui ulang.</span></div>
<div style="background: #2C4664; border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 4px;"><span style="font-size: 13px; font-weight: 900; color: #86DCD3;">Tayang = tautan</span><span style="font-size: 13px; color: #E3E6EB;">Konten baru berstatus Tayang setelah tautan postingan ditempel; angka performanya ditarik otomatis dari Instagram.</span></div>
</div>
</section>

</main>
</div>
</template>
<div id="dc-root"></div>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":2500}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { unit: 'Semua' };
  }
  renderVals() {
    var self = this;
    var unit = this.state.unit;
    var UN = { R: 'Rentalaja', T: 'TripinAja', N: 'Niagaaja' };
    var COLOR = { Rentalaja: '#2F6FD0', TripinAja: '#0FA394', Niagaaja: '#D08A1E' };
    var STG = {
      'Ide': ['#F3F5F8', '#C9CED6', '#3B4250'], 'Brief': ['#E5EEF9', '#B9CDEA', '#1E5AA8'], 'Produksi': ['#E5EEF9', '#B9CDEA', '#1E5AA8'],
      'Review': ['#FDF3D7', '#F2D58A', '#7A5200'], 'Revisi': ['#FCEBDD', '#F2B8A0', '#9A3F0A'], 'Terjadwal': ['#DDF5F2', '#9FE0D8', '#067A70'], 'Tayang': ['#DDF5F2', '#9FE0D8', '#067A70']
    };
    var PIL = { P: 'Promo', Pr: 'Produk', E: 'Edukasi', Ts: 'Testimoni', B: 'Di balik layar' };
    var I = [
      [2, 'R', 'Reels', 'Motor ready awal bulan + harga', 'Terjadwal', 'Dita', 'P', 0, 0],
      [3, 'R', 'TikTok', 'Potong ulang: syarat sewa iPhone', 'Revisi', 'Dita', 'E', 2, 1],
      [5, 'R', 'Carousel', '5 rute motor weekend di Garut', 'Review', 'Dita', 'E', 0, 0],
      [7, 'R', 'Reels', 'Unboxing iPhone 15 untuk Ciputat', 'Produksi', 'Dita', 'Pr', 0, 0],
      [9, 'R', 'Foto', 'Testimoni keluarga di Ruma Metua', 'Brief', 'Dita', 'Ts', 0, 0],
      [10, 'R', 'TikTok', 'Sehari bareng CS Garut Kota', 'Brief', 'Dita', 'B', 0, 0],
      [12, 'R', 'Reels', 'Sewa 5 menit: pilih, bayar, ambil', 'Ide', 'Dita', 'E', 0, 0],
      [14, 'R', 'Carousel', 'Bundling motor + iPhone hemat', 'Ide', 'Kevin', 'P', 0, 0],
      [16, 'R', 'Reels', 'Sewa kamera buat wisuda', 'Ide', 'Dita', 'Pr', 0, 0],
      [19, 'R', 'Foto', 'Ruma Metua akhir tahun', 'Ide', 'Dita', 'Pr', 0, 0],
      [21, 'R', 'TikTok', 'Tebak harga sewa', 'Ide', 'Dita', 'E', 0, 0],
      [23, 'R', 'Reels', 'Pelanggan pertama Ciputat', 'Ide', 'Dita', 'Ts', 0, 0],
      [1, 'T', 'Reels', 'Sunrise Papandayan, open trip 9 Nov', 'Terjadwal', 'Mugni', 'P', 0, 0],
      [4, 'T', 'Carousel', 'Itinerary Darajat 1 hari', 'Revisi', 'Mugni', 'Pr', 1, 3],
      [6, 'T', 'Reels', 'Guide briefing sebelum trek', 'Review', 'Mugni', 'B', 0, 0],
      [8, 'T', 'TikTok', 'Sinematik Curug Citiis', 'Produksi', 'Mugni', 'Pr', 0, 0],
      [11, 'T', 'Foto', 'Early bird trip tahun baru', 'Brief', 'Kevin', 'P', 0, 0],
      [13, 'T', 'Reels', 'Paket study tour sekolah', 'Brief', 'Mugni', 'Pr', 0, 0],
      [15, 'T', 'Carousel', 'Estimasi biaya liburan keluarga', 'Ide', 'Mugni', 'E', 0, 0],
      [18, 'T', 'Reels', 'Glamping view Guntur', 'Ide', 'Mugni', 'Pr', 0, 0],
      [20, 'T', 'TikTok', 'Packing list naik Cikuray', 'Ide', 'Mugni', 'E', 0, 0],
      [22, 'T', 'Reels', 'Testimoni rombongan SMA', 'Ide', 'Mugni', 'Ts', 0, 0],
      [25, 'T', 'Carousel', 'Destinasi musim hujan di Garut', 'Ide', 'Mugni', 'E', 0, 0],
      [2, 'N', 'Reels', 'Cek laptop bekas dalam 60 detik', 'Review', 'Kevin', 'E', 0, 0],
      [6, 'N', 'Carousel', 'Stok laptop minggu ini', 'Terjadwal', 'Kevin', 'Pr', 0, 0],
      [9, 'N', 'TikTok', 'Laptop buat kuliah DKV', 'Revisi', 'Kevin', 'E', 1, 0],
      [13, 'N', 'Foto', 'Trade-in laptop lama', 'Produksi', 'Kevin', 'P', 0, 0],
      [17, 'N', 'Reels', 'Garansi toko 30 hari', 'Ide', 'Kevin', 'P', 0, 0],
      [24, 'N', 'Carousel', 'Laptop di bawah 5 jt', 'Ide', 'Kevin', 'Pr', 0, 0],
      [-3, 'R', 'Reels', '3 hal dicek sebelum sewa motor', 'Tayang', 'Dita', 'E', 1, 0],
      [-3, 'T', 'Reels', 'Curug Citiis tersembunyi', 'Tayang', 'Mugni', 'Pr', 0, 0],
      [-4, 'N', 'Reels', 'Garansi toko (versi Oktober)', 'Tayang', 'Kevin', 'P', 2, 0],
      [-5, 'R', 'Foto', 'Tim Garut Kota siap antar', 'Tayang', 'Dita', 'B', 0, 0]
    ].map(function (r) { return { day: r[0], unit: UN[r[1]], fmt: r[2], title: r[3], stage: r[4], pic: r[5], pillar: PIL[r[6]], rev: r[7], late: r[8] }; });
    var inUnit = function (x) { return unit === 'Semua' || x.unit === unit; };
    var items = I.filter(inUnit);
    var nov = items.filter(function (x) { return x.day > 0; });
    var TARGET = { Rentalaja: 21, TripinAja: 19, Niagaaja: 12 };
    var target = unit === 'Semua' ? 52 : TARGET[unit];
    var cnt = function (st) { return nov.filter(function (x) { return x.stage === st; }).length; };
    var lateN = items.filter(function (x) { return x.late > 0; }).length;
    var sched = cnt('Terjadwal');
    var next7 = nov.filter(function (x) { return x.day <= 7; });
    var next7ok = next7.filter(function (x) { return x.stage === 'Terjadwal'; }).length;

    var tiles = [
      { label: 'Rencana November', value: nov.length + ' / ' + target, note: (target - nov.length) + ' slot belum terisi', color: target - nov.length > 5 ? '#9A3F0A' : '#067A70' },
      { label: 'Minggu pertama siap', value: next7ok + ' / ' + next7.length, note: 'Terjadwal untuk 1–7 Nov', color: next7ok === next7.length ? '#067A70' : '#9A3F0A' },
      { label: 'Menunggu review', value: String(cnt('Review')), note: 'Target direview ≤ 1 hari', color: '#7A5200' },
      { label: 'Sedang revisi', value: String(cnt('Revisi')), note: lateN + ' lewat tenggat', color: lateN ? '#9A3F0A' : '#067A70' },
      { label: 'Tepat waktu Oktober', value: '78%', note: 'Target ≥ 90%', color: '#9A3F0A' },
      { label: 'Siklus ide → tayang', value: '6,4 hari', note: 'Median Oktober', color: '#5B6573' },
      { label: 'Revisi per konten', value: '0,7', note: 'Turun dari 1,1 di September', color: '#067A70' },
      { label: 'Tayang 7 hari terakhir', value: String(items.filter(function (x) { return x.stage === 'Tayang'; }).length), note: 'Tautan postingan sudah ditempel', color: '#5B6573' }
    ];

    var dow = ['Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab', 'Min'];
    var cells = [];
    for (var b = 0; b < 6; b++) cells.push({ day: '', items: [], bg: 'transparent', border: 'transparent', flag: 'transparent', numColor: '#5B6573' });
    for (var d = 1; d <= 30; d++) {
      var its = nov.filter(function (x) { return x.day === d; }).map(function (x) {
        var s = STG[x.stage];
        return { fmt: x.fmt, pic: x.pic, title: x.title, bg: s[0], border: s[1], dot: COLOR[x.unit], tip: x.unit + ' · ' + x.pillar + ' · ' + x.stage };
      });
      var empty = its.length === 0;
      cells.push({ day: d, items: its, bg: '#FFFFFF', border: '#E3E6EB', flag: empty ? '#F2A33A' : 'transparent', numColor: '#1F2933' });
    }

    var ORDER = ['Ide', 'Brief', 'Produksi', 'Review', 'Revisi', 'Terjadwal', 'Tayang'];
    var board = ORDER.map(function (st) {
      var cs = items.filter(function (x) { return x.stage === st; }).sort(function (a, b) { return a.day - b.day; }).map(function (x) {
        var meta;
        if (st === 'Tayang') meta = 'Tayang ' + (28 + x.day) + ' Okt' + (x.rev ? ' · ' + x.rev + 'x revisi' : '');
        else if (x.late) meta = 'Revisi ke-' + x.rev + ' · telat ' + x.late + ' hari';
        else if (st === 'Revisi') meta = 'Revisi ke-' + x.rev + ' · tenggat hari ini';
        else meta = 'Tayang ' + x.day + ' Nov';
        return { title: x.title, unit: x.unit, dot: COLOR[x.unit], fmt: x.fmt, pic: x.pic, meta: meta, metaColor: x.late ? '#9A3F0A' : '#5B6573', border: x.late ? '#F2A33A' : '#E3E6EB' };
      });
      return { name: st, count: cs.length, countColor: (st === 'Revisi' && cs.length) ? '#9A3F0A' : '#1F2933', cards: cs };
    });

    var NOTES = {
      'Potong ulang: syarat sewa iPhone': ['Hook 3 detik pertama kurang kuat; tampilkan syarat di layar, bukan hanya suara.', '27 Okt'],
      'Itinerary Darajat 1 hari': ['Harga belum sesuai daftar harga November.', '25 Okt'],
      'Laptop buat kuliah DKV': ['Spesifikasi RAM salah tulis (8 GB, bukan 16 GB).', '28 Okt'],
      '5 rute motor weekend di Garut': ['Dikirim 26 Okt · menunggu reviewer 2 hari', '—'],
      'Guide briefing sebelum trek': ['Dikirim 27 Okt · menunggu reviewer', '—'],
      'Cek laptop bekas dalam 60 detik': ['Dikirim 28 Okt pagi', '—']
    };
    var reviews = items.filter(function (x) { return x.stage === 'Review' || x.stage === 'Revisi'; }).map(function (x) {
      var n = NOTES[x.title] || ['—', '—'];
      var s = STG[x.stage];
      var status, sc;
      if (x.stage === 'Review') { status = x.title.indexOf('rute') >= 0 ? 'Reviewer telat 1 hari' : 'Menunggu review'; sc = x.title.indexOf('rute') >= 0 ? '#9A3F0A' : '#7A5200'; }
      else if (x.late >= 2) { status = 'Telat ' + x.late + ' hari · naik ke Kepala Staf'; sc = '#9A3F0A'; }
      else if (x.late) { status = 'Telat ' + x.late + ' hari'; sc = '#9A3F0A'; }
      else { status = 'Jatuh tempo hari ini'; sc = '#7A5200'; }
      return { title: x.title, unit: x.unit, dot: COLOR[x.unit], fmt: x.fmt, pic: x.pic, day: x.day, stage: x.stage, stBg: s[0], stFg: s[2], note: n[0], rev: x.stage === 'Revisi' ? String(x.rev) : '—', due: n[1], status: status, statusColor: sc };
    });

    var PPL = [['Dita', 'Konten Rentalaja', '81%', '0,8'], ['Mugni', 'Konten TripinAja', '74%', '0,6'], ['Kevin', 'Leader · Niagaaja & materi iklan', '79%', '0,7']];
    var people = PPL.map(function (p) {
      var mine = items.filter(function (x) { return x.pic === p[0]; });
      var c = function (st) { return mine.filter(function (x) { return x.stage === st; }).length; };
      var rv = c('Revisi');
      return { name: p[0], role: p[1], idea: c('Ide') + c('Brief'), prod: c('Produksi'), review: c('Review'), revisi: rv, revColor: rv ? '#9A3F0A' : '#1F2933', sched: c('Terjadwal'), ontime: p[2], otColor: parseInt(p[2], 10) >= 80 ? '#067A70' : '#9A3F0A', rpc: p[3] };
    });

    var MIXT = [['Promo', 0.2], ['Produk', 0.25], ['Edukasi', 0.25], ['Testimoni', 0.15], ['Di balik layar', 0.15]];
    var tot = Math.max(1, nov.length);
    var mix = MIXT.map(function (m) {
      var n = nov.filter(function (x) { return x.pillar === m[0]; }).length;
      var share = n / tot;
      var off = Math.abs(share - m[1]) > 0.07;
      return { name: m[0], v: Math.round(share * 100) + '%', target: Math.round(m[1] * 100) + '%', w: Math.min(100, share / 0.45 * 100) + '%', t: (m[1] / 0.45 * 100) + '%', c: off ? '#F2A33A' : '#09BEAF' };
    });
    var FM = ['Reels', 'Carousel', 'Foto', 'TikTok'];
    var maxF = Math.max.apply(null, FM.map(function (f) { return nov.filter(function (x) { return x.fmt === f; }).length; }).concat([1]));
    var fmts = FM.map(function (f) { var n = nov.filter(function (x) { return x.fmt === f; }).length; return { name: f, n: n, w: (n / maxF * 100) + '%' }; });

    var stageLegend = [['Ide', 'Ide'], ['Brief', 'Brief / Produksi'], ['Review', 'Review'], ['Revisi', 'Revisi'], ['Terjadwal', 'Terjadwal / Tayang']].map(function (s) { var c = STG[s[0]]; return { label: s[1], bg: c[0], border: c[1] }; });

    var filters = ['Semua', 'Rentalaja', 'TripinAja', 'Niagaaja'].map(function (label) {
      var on = label === unit;
      return { label: label, pressed: on ? 'true' : 'false', bg: on ? '#1D3149' : '#FFFFFF', fg: on ? '#FFFFFF' : '#1D3149', border: on ? '#1D3149' : '#E3E6EB', dot: label === 'Semua' ? '#09BEAF' : COLOR[label], pick: function () { self.setState({ unit: label }); } };
    });

    return { filters: filters, tiles: tiles, dow: dow, cells: cells, board: board, reviews: reviews, people: people, mix: mix, fmts: fmts, stageLegend: stageLegend };
  }
}
</script>
</body>
