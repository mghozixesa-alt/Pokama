main > header button[aria-pressed="false"]{background:rgba(255,255,255,.08) !important;color:#FFFFFF !important}

@media (max-width: 760px){main > header{padding:16px !important;border-radius:16px}}
@media (max-width: 760px){table:not(:has(th:nth-child(5))){min-width:0 !important;width:100% !important}}
td[style*="text-align: right"]{white-space:nowrap}
tbody tr:hover td{background:#F9FAFB}
thead th{position:sticky;top:0;background:#FFFFFF}
button:focus-visible,a:focus-visible{outline:2px solid #09BEAF;outline-offset:2px;border-radius:8px}
button{transition:filter .15s}button:hover{filter:brightness(0.97)}
@media (max-width: 760px){
nav[aria-label="Menu utama"]{flex:1 1 100% !important;flex-direction:row !important;align-items:center !important;overflow-x:auto;gap:4px !important;padding:8px 12px !important;border-right:0 !important;border-bottom:1px solid #E3E6EB;position:sticky;top:0;z-index:20;scrollbar-width:none}
nav[aria-label="Menu utama"] > div{flex-direction:row !important;gap:4px !important;padding:0 !important;flex:none !important}
nav[aria-label="Menu utama"] > div > span:first-child{display:none !important}
nav[aria-label="Menu utama"] > div:first-child img{width:84px !important}
nav[aria-label="Menu utama"] > div:first-child span{display:none !important}
nav[aria-label="Menu utama"] a{white-space:nowrap;min-height:36px !important;padding:0 10px !important}
nav[aria-label="Menu utama"] > div[style*="margin-top: auto"]{display:none !important}
main{padding:18px 16px 40px !important}
h1{font-size:24px !important}
}
</style>

</div>
<div style="display: flex; flex-direction: column; gap: 2px;">

<main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 28px 36px 48px; display: flex; flex-direction: column; gap: 22px;">

<header style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px;">
<div style="display: flex; flex-direction: column; gap: 4px; max-width: 960px;">
<span style="font-size: 13px; color: #5B6573; font-weight: 700;">Dipegang Head of Marketing · setiap konten, iklan, dan KOL punya induk campaign</span>
<h1 style="margin: 0; font-size: 28px; font-weight: 900; color: #1D3149;">Campaign</h1>
<span style="font-size: 14px; color: #3B4250; max-width: 900px;">Setiap campaign punya tujuan, target, dan budget, lalu dipecah ke organik, paid ads, KOL, WA, dan SEO.</span>
</div>
<div style="display: flex; gap: 8px; align-items: center;"><span style="font-size: 12px; font-weight: 700; color: #5B6573; border: 1px dashed #A9B4C2; border-radius: 18px; padding: 8px 12px;">Data contoh</span><a href="#brief-baru" style="height: 42px; padding: 0 16px; border-radius: 10px; background: #09BEAF; color: #1D3149; font-size: 13.5px; font-weight: 900; display: flex; align-items: center; text-decoration: none;">+ Campaign baru</a></div>
</header>

<div style="display: flex; flex-wrap: wrap; gap: 22px; align-items: flex-start;">

<aside aria-label="Daftar campaign" style="flex: 1 1 270px; min-width: 0; display: flex; flex-direction: column; gap: 10px;">
<template data-sc="for" list="{{list}}" as="c" hint-placeholder-count="6">
<button type="button" onClick="{{c.pick}}" aria-pressed="{{c.pressed}}" style="text-align: left; font-family: inherit; cursor: pointer; background: {{c.bg}}; border: 1px solid {{c.border}}; border-left: 5px solid {{c.dot}}; border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 4px;">
<span style="font-size: 11.5px; font-weight: 900; color: {{c.stFg}}; background: {{c.stBg}}; border-radius: 7px; padding: 1px 7px; align-self: flex-start;">{{c.status}}</span>
<strong style="font-size: 14.5px; color: #1D3149;">{{c.name}}</strong>
<span style="font-size: 12px; color: #5B6573;">{{c.period}} · {{c.budget}}</span>
<div style="height: 6px; border-radius: 3px; background: #E3E6EB; overflow: hidden;"><div style="height: 100%; width: {{c.goalPct}}; background: {{c.goalBar}};"></div></div>
<span style="font-size: 11.5px; font-weight: 800; color: #3B4250;">{{c.goal}}</span>
</button>
</template>
</aside>

<div style="flex: 4 1 760px; min-width: 0; display: flex; flex-direction: column; gap: 18px;">

<section style="background: #FFFFFF; border: 1px solid #E3E6EB; border-top: 5px solid {{c.dot}}; border-radius: 20px; padding: 18px 20px; display: flex; flex-direction: column; gap: 12px;">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; align-items: flex-start;">
<div style="display: flex; flex-direction: column; gap: 4px;"><span style="font-size: 11.5px; font-weight: 900; color: {{c.stFg}}; background: {{c.stBg}}; border-radius: 7px; padding: 2px 8px; align-self: flex-start;">{{c.status}}</span><h2 style="margin: 0; font-size: 24px; font-weight: 900; color: #1D3149;">{{c.name}}</h2><span style="font-size: 13px; color: #3B4250;">{{c.period}} · tujuan <b>{{c.objective}}</b> · budget <b>{{c.budget}}</b></span></div>
<div style="display: flex; align-items: center; gap: 10px;"><img src="kevin.jpg" alt="Head of Marketing" style="width: 40px; height: 40px; border-radius: 20px; object-fit: cover;"><div style="display: flex; flex-direction: column;"><span style="font-size: 11.5px; color: #5B6573;">Pemilik campaign</span><strong style="font-size: 13.5px; color: #1D3149;">Kevin</strong></div></div>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 6px;">
<template data-sc="for" list="{{c.accs}}" as="a" hint-placeholder-count="3"><span style="display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 800; color: #3B4250; background: #F3F5F8; border-radius: 10px; padding: 4px 10px;"><span style="width: 8px; height: 8px; border-radius: 4px; background: {{a.dot}};"></span>{{a.name}}</span></template>
</div>
</section>

<section style="background: #FFFFFF; border: 1px solid #E3E6EB; border-radius: 20px; padding: 18px 20px; display: flex; flex-direction: column; gap: 12px;">
<div style="display: flex; flex-direction: column;"><h3 data-icon-done="1" style="display: flex; align-items: center; gap: 10px; margin: 0; font-size: 17px; font-weight: 900; color: #1D3149;"><span aria-hidden="true" style="width: 28px; height: 28px; flex: none; border-radius: 8px; background: #DDF5F2; color: #067A70; display: inline-flex; align-items: center; justify-content: center;"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18zM12 7a5 5 0 1 0 0 10a5 5 0 1 0 0-10zM12 11a1 1 0 1 0 0 2a1 1 0 1 0 0-2z"></path></svg></span>1 · Tujuan dan target</h3><span style="font-size: 12.5px; color: #5B6573;">Disetujui Head of Marketing sebelum campaign mulai. Semua angka di bawah dijumlah dari channel.</span></div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px;">
<template data-sc="for" list="{{c.targets}}" as="t" hint-placeholder-count="4">
<div style="background: #F7F8FA; border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 4px;"><span style="font-size: 12px; font-weight: 800; color: #5B6573;">{{t.label}}</span><span style="font-size: 20px; font-weight: 900; color: #1D3149;">{{t.val}}</span><div style="height: 6px; border-radius: 3px; background: #E3E6EB; overflow: hidden;"><div style="height: 100%; width: {{t.pct}}; background: {{t.bar}};"></div></div><span style="font-size: 11.5px; font-weight: 800; color: {{t.noteColor}};">{{t.note}}</span></div>
</template>
</div>
</section>

<section style="background: #FFFFFF; border: 1px solid #E3E6EB; border-radius: 20px; padding: 18px 20px; display: flex; flex-direction: column; gap: 12px;">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px;"><div style="display: flex; flex-direction: column;"><h3 data-icon-done="1" style="display: flex; align-items: center; gap: 10px; margin: 0; font-size: 17px; font-weight: 900; color: #1D3149;"><span aria-hidden="true" style="width: 28px; height: 28px; flex: none; border-radius: 8px; background: #FDF3D7; color: #7A5200; display: inline-flex; align-items: center; justify-content: center;"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.8.8 1 1.5 1 2.5h6c0-1 .2-1.7 1-2.5A6 6 0 0 0 12 3z"></path></svg></span>2 · Strategi</h3><span style="font-size: 12.5px; color: #5B6573;">Positioning dan audiens diambil dari Brand. Campaign hanya memilih pesan dan pillar yang ditonjolkan.</span></div><a href="Brand.dc.html" style="font-size: 12.5px; font-weight: 800; color: #067A70;">Brand &amp; positioning →</a></div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 10px;">
<template data-sc="for" list="{{c.strategy}}" as="s" hint-placeholder-count="6">
<div style="border: 1px solid {{s.border}}; background: {{s.bg}}; border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 4px;"><span style="font-size: 11.5px; font-weight: 900; letter-spacing: 0.06em; color: #5B6573;">{{s.label}}</span><span style="font-size: 13.5px; font-weight: 700; color: #1D3149;">{{s.val}}</span></div>
</template>
</div>
</section>

<section style="background: #FFFFFF; border: 1px solid #E3E6EB; border-radius: 20px; padding: 18px 20px; display: flex; flex-direction: column; gap: 12px;">
<div style="display: flex; flex-direction: column;"><h3 data-icon-done="1" style="display: flex; align-items: center; gap: 10px; margin: 0; font-size: 17px; font-weight: 900; color: #1D3149;"><span aria-hidden="true" style="width: 28px; height: 28px; flex: none; border-radius: 8px; background: #DDF5F2; color: #067A70; display: inline-flex; align-items: center; justify-content: center;"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"></path></svg></span>3 · Rencana per channel</h3><span style="font-size: 12.5px; color: #5B6573;">Setiap baris membuat pekerjaan di halaman channel-nya, dengan tanda campaign ini. Klik nama channel untuk membukanya.</span></div>
<div style="overflow-x: auto;">
<table style="width: 100%; min-width: 720px; border-collapse: collapse; font-size: 13px;">
<thead><tr style="text-align: left; color: #5B6573; font-size: 12px;"><th scope="col" style="padding: 8px; border-bottom: 1px solid #E3E6EB;">Channel</th><th scope="col" style="padding: 8px; border-bottom: 1px solid #E3E6EB;">Rencana</th><th scope="col" style="padding: 8px; border-bottom: 1px solid #E3E6EB;">PIC</th><th scope="col" style="padding: 8px; border-bottom: 1px solid #E3E6EB; text-align: right;">Budget</th><th scope="col" style="padding: 8px; border-bottom: 1px solid #E3E6EB;">Progress</th></tr></thead>
<tbody>
<template data-sc="for" list="{{c.plan}}" as="p" hint-placeholder-count="6">
<tr>
<td style="padding: 10px 8px; border-bottom: 1px solid #EEF0F3;"><a href="{{p.href}}" style="display: inline-flex; align-items: center; gap: 7px; font-weight: 800; color: #1D3149;"><span style="width: 10px; height: 10px; border-radius: 3px; background: {{p.color}};"></span>{{p.ch}}</a></td>
<td style="padding: 10px 8px; border-bottom: 1px solid #EEF0F3; color: #3B4250;">{{p.plan}}</td>
