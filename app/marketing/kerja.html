<style>

body{margin:0;background:#F3F5F8}
a{color:#1D3149}a:hover{color:#0F1D2E}
table{font-variant-numeric:tabular-nums}
main > header{background:radial-gradient(circle at 92% -30%, rgba(9,190,175,.45), transparent 42%),linear-gradient(135deg,#1D3149 0%,#28507A 100%);border-radius:22px;padding:22px 26px;align-items:center !important;box-shadow:0 10px 30px rgba(29,49,73,.18)}
main > header h1{color:#FFFFFF !important}
main > header span{color:#D3E0EC !important}
main > header b{color:#7FF0E2 !important}
main > header span[style*="dashed"]{border-color:rgba(255,255,255,.45) !important}
main > header button{border-color:rgba(255,255,255,.35) !important}
main > header button[aria-pressed="true"]{background:#09BEAF !important;color:#1D3149 !important;border-color:#09BEAF !important}
main > header button[aria-pressed="false"]{background:rgba(255,255,255,.08) !important;color:#FFFFFF !important}
main > header a{color:#1D3149}
main section{transition:box-shadow .2s ease, transform .2s ease}
main section:hover{box-shadow:0 8px 24px rgba(29,49,73,.07)}
main > header span[aria-hidden="true"]{flex:none}
@media (max-width: 760px){[data-desk]{display:none !important}[data-mob]{display:flex !important}}
@media (max-width: 760px){article[style*="grid-template-columns: 36px minmax(0, 1fr) auto"]{grid-template-columns:32px minmax(0,1fr) !important}
article[style*="grid-template-columns: 36px minmax(0, 1fr) auto"] > div:last-child{grid-column:2;flex-direction:row !important;justify-content:space-between;align-items:center !important}}
@media (max-width: 760px){main > header{padding:16px !important;border-radius:16px}}
@media (max-width: 760px){table:not(:has(th:nth-child(5))){min-width:0 !important;width:100% !important}}
td[style*="text-align: right"]{white-space:nowrap}
tbody tr:hover td{background:#F9FAFB}
thead th{position:sticky;top:0;background:#FFFFFF}
button:focus-visible,a:focus-visible{outline:2px solid #09BEAF;outline-offset:2px;border-radius:8px}
button{transition:filter .15s}button:hover{filter:brightness(0.97)}
@media (max-width: 760px){
nav[aria-label="Menu utama"]{flex:1 1 100% !important;flex-direction:row !important;align-items:center !important;overflow-x:auto;gap:4px !important;padding:8px 12px !important;border-right:0 !important;border-bottom:1px solid #E3E6EB;position:sticky;top:0;z-index:20;scrollbar-width:none}
nav[aria-label="Menu utama"] > div{flex-direction:row !important;gap:4px !important;padding:0 !important;flex:none !important}
nav[aria-label="Menu utama"] > div > span:first-child{display:none !important}
nav[aria-label="Menu utama"] > div:first-child img{width:84px !important}
nav[aria-label="Menu utama"] > div:first-child span{display:none !important}
nav[aria-label="Menu utama"] a{white-space:nowrap;min-height:36px !important;padding:0 10px !important}
nav[aria-label="Menu utama"] > div[style*="margin-top: auto"]{display:none !important}
main{padding:18px 16px 40px !important}
h1{font-size:24px !important}
}

</style>
<style>
.btn{height:38px;padding:0 14px;border-radius:10px;border:1px solid #C9D1DB;background:#FFFFFF;color:#1D3149;font-family:inherit;font-size:13.5px;font-weight:800;cursor:pointer;white-space:nowrap}
.btn.pri{background:#09BEAF;border-color:#09BEAF;color:#1D3149}
.btn.warn{border-color:#E9B999;color:#9A3F0A}
.btn.sm{height:32px;padding:0 10px;font-size:12.5px}
main > header .btn{background:rgba(255,255,255,.1);color:#FFFFFF}
main > header .btn.pri{background:#09BEAF;color:#1D3149;border-color:#09BEAF !important}
.who{display:flex;align-items:center;gap:8px}
.who select{height:38px;border:1px solid rgba(255,255,255,.35);border-radius:10px;padding:0 10px;background:rgba(255,255,255,.1);color:#FFFFFF;font-family:inherit;font-weight:800;font-size:13.5px}
.who select option{color:#1D3149}
.sec{background:#FFFFFF;border:1px solid #E3E6EB;border-radius:20px;padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.sec-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:10px}
.sec-h h2{display:flex;align-items:center;gap:10px;margin:0;font-size:18px;font-weight:900;color:#1D3149}
.ib{width:28px;height:28px;flex:none;border-radius:8px;background:#DDF5F2;color:#067A70;display:inline-flex;align-items:center;justify-content:center}
.sub{font-size:12.5px;color:#5B6573}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:#FFFFFF;border:1px solid #E3E6EB;border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.kpi .l{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:#3B4250}
.kpi .v{font-size:26px;font-weight:900;color:#1D3149;line-height:1.1}
.kpi .n{font-size:12px;font-weight:800}
.trk{height:6px;border-radius:3px;background:#E3E6EB;overflow:hidden}.trk i{display:block;height:100%}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{height:34px;padding:0 12px;border-radius:17px;border:1px solid #E3E6EB;background:#FFFFFF;font-family:inherit;font-weight:800;color:#1D3149;display:inline-flex;align-items:center;gap:6px;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:#1D3149;border-color:#1D3149;color:#FFFFFF}
.dot{width:8px;height:8px;border-radius:4px;flex:none;display:inline-block}
.st{font-size:11.5px;font-weight:900;border-radius:6px;padding:2px 7px;white-space:nowrap}
.empty{border:1px dashed #C9D1DB;border-radius:14px;padding:20px;text-align:center;color:#5B6573;font-weight:700}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:12px;border:1px solid #E3E6EB;border-radius:14px;padding:12px 14px;background:#FFFFFF}
.row .grow{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:2px}
.row strong{color:#1D3149;font-size:14.5px}
.row .m{font-size:12.5px;color:#5B6573}
.row.click{cursor:pointer}.row.click:hover{border-color:#BFE9E3;background:#FBFEFE}
.cols{display:flex;flex-wrap:wrap;gap:22px;align-items:flex-start}.cols > *{flex:1 1 380px;min-width:0}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.day{background:#F7F8FA;border:1px solid #E3E6EB;border-radius:14px;min-height:190px;display:flex;flex-direction:column}
.day.today{border-color:#09BEAF;box-shadow:0 0 0 1px #09BEAF;background:#F0FBF9}
.day-h{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-bottom:1px solid #E3E6EB}
.day-h b{color:#1D3149}
.day-b{padding:8px;display:flex;flex-direction:column;gap:6px;flex:1}
.add{border:1px dashed #C9D1DB;background:none;border-radius:10px;height:32px;color:#5B6573;font-family:inherit;font-weight:800;font-size:12.5px;cursor:pointer}
.k{border:1px solid #E3E6EB;border-left:4px solid var(--c,#A9B4C2);border-radius:10px;padding:8px;background:#FFFFFF;text-align:left;display:flex;flex-direction:column;gap:4px;width:100%;font-family:inherit;cursor:pointer}
.k:hover{border-color:#BFE9E3;border-left-color:var(--c)}
.k .t{font-weight:800;color:#1D3149;font-size:13px;line-height:1.3}
.k .m{font-size:11.5px;color:#5B6573;font-weight:700}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:11.5px;font-weight:900;letter-spacing:.04em;color:#5B6573;padding:8px;border-bottom:1px solid #E3E6EB}
.tbl td{padding:9px 8px;border-bottom:1px solid #EEF0F3;color:#1D3149}
.cap{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.capd{border:1px solid #E3E6EB;border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px;background:#FFFFFF}
.scrim{position:fixed;inset:0;background:rgba(29,49,73,.45);z-index:50;display:flex;justify-content:flex-end}
.panel{background:#FFFFFF;width:min(520px,100%);height:100%;overflow:auto;padding:22px;display:flex;flex-direction:column;gap:14px;font-family:'Nunito',system-ui,sans-serif;font-size:14px;color:#1F2933}
.panel.center{margin:auto;height:auto;max-height:92vh;border-radius:18px}
.panel h1{margin:0;font-size:20px;font-weight:900;color:#1D3149}
.panel h2{margin:0;font-size:15px;font-weight:900;color:#1D3149}
.f{display:flex;flex-direction:column;gap:5px}
.f label{font-size:12.5px;font-weight:800;color:#3B4250}
.f input,.f select,.f textarea{border:1px solid #E3E6EB;border-radius:10px;padding:9px 11px;color:#1F2933;background:#FFFFFF;font-family:inherit;font-size:14px}
.f textarea{min-height:84px;resize:vertical}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.box{border:1px solid #E3E6EB;border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.flow{display:flex;gap:4px;flex-wrap:wrap}
.flow span{font-size:11.5px;font-weight:800;padding:3px 8px;border-radius:6px;background:#EEF0F3;color:#5B6573}
.flow span.on{background:#1D3149;color:#FFFFFF}.flow span.done{background:#DDF5F2;color:#067A70}
.hint{font-size:12.5px;border-radius:10px;padding:8px 12px;font-weight:700;background:#F0FBF9;color:#067A70}
.log{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:#3B4250}
.log div{border-left:2px solid #E3E6EB;padding-left:8px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1D3149;color:#FFFFFF;padding:10px 16px;border-radius:12px;font-weight:800;z-index:80;font-family:'Nunito',sans-serif}
.nb{min-width:22px;height:22px;border-radius:11px;background:#C2410C;color:#FFFFFF;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 6px;box-sizing:border-box}
.nb.t{background:none;color:#067A70;padding:0;min-width:0}
@media (max-width: 860px){
 .week{grid-template-columns:1fr}.day{min-height:0}
 .cap{grid-template-columns:repeat(7,minmax(70px,1fr));overflow-x:auto}
 .f2{grid-template-columns:1fr}
 .row{flex-wrap:wrap}
 .chips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px}.chip{flex:none}
 .hide-m{display:none}
}
</style>

  if (g('data-new')) return formNew({ date: g('data-new') });
  if (g('data-brand')) { S.brand = g('data-brand'); save(); render(); return; }
  if (g('data-wk') !== null) { var v = +g('data-wk'); S.week = v === 0 ? 0 : S.week + v; save(); render(); return; }
  if (g('data-use')) { var x = S.ideas.filter(function (i) { return i.id === g('data-use'); })[0]; if (x) formNew({ title: x.title, brand: x.brand, format: x.format, pillar: x.pillar, note: x.note, fromIdea: x.id }); return; }
  if (g('data-delidea')) { S.ideas = S.ideas.filter(function (i) { return i.id !== g('data-delidea'); }); save(); render(); toast('Ide dihapus'); return; }
  if (g('data-cap')) { S.cap = Math.max(1, S.cap + +g('data-cap')); save(); render(); return; }
  if (g('data-prio')) { var it = S.items.filter(function (i) { return i.id === g('data-prio'); })[0]; if (it) { it.priority = it.priority === 'Penting' ? '' : 'Penting'; log(it, it.priority ? 'ditandai penting' : 'tanda penting dihapus'); save(); render(); } }
});
var tries = 0, iv = setInterval(function () {
  var p = window.mkPerson, n = p && (p.nickname || p.name || '');
  if (n) { var m = PEOPLE.filter(function (x) { return n.toLowerCase().indexOf(x.a) >= 0; })[0]; if (m && !S._auto) { S.me = m.n; S._auto = 1; save(); render(); } clearInterval(iv); }
  if (++tries > 20) clearInterval(iv);
}, 300);
render();
})();
</script>
