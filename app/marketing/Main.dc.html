<main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 28px 36px 48px; display: flex; flex-direction: column; gap: 22px;">

<header style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px;">
<div style="display: flex; flex-direction: column; gap: 4px;">
<span style="font-size: 13px; color: #5B6573; font-weight: 600;">Rabu, 28 Oktober 2026 · data 1–27 Oktober</span>
<h1 style="margin: 0; font-size: 30px; font-weight: 900; letter-spacing: -0.01em;">Ringkasan Marketing</h1>
</div>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px;">
<span style="display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px; border-radius: 18px; background: #DDF5F2; color: #067A70; font-size: 12px; font-weight: 800;"><span style="width: 8px; height: 8px; border-radius: 4px; background: #09BEAF;"></span>Sinkron 10.42 · Instagram, Meta Ads, Maps</span>
<span style="font-size: 12px; font-weight: 700; color: #5B6573; border: 1px dashed #A9B4C2; border-radius: 18px; padding: 8px 12px;">Data contoh</span>
<label for="periode" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);">Periode</label>
<select id="periode" style="height: 44px; padding: 0 12px; border-radius: 10px; border: 1px solid #E3E6EB; background: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 700; color: #1D3149;">
<option>Oktober 2026</option>
<option>September 2026</option>
<option>Kuartal 4 2026</option>
</select>
<button type="button" style="height: 44px; padding: 0 18px; border-radius: 10px; border: 0; background: #09BEAF; color: #1D3149; font-family: inherit; font-size: 14px; font-weight: 800; cursor: pointer;">Unduh laporan</button>
</div>
</header>

<div role="group" aria-label="Filter unit bisnis" style="display: flex; flex-wrap: wrap; gap: 8px;">
<template data-sc="for" list="{{filters}}" as="f" hint-placeholder-count="4">
<button type="button" onClick="{{f.pick}}" aria-pressed="{{f.pressed}}" style="display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 18px; border-radius: 22px; border: 1px solid {{f.border}}; background: {{f.bg}}; color: {{f.fg}}; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer;"><span style="width: 10px; height: 10px; border-radius: 5px; background: {{f.dot}};"></span>{{f.label}}</button>
</template>
</div>

<section aria-label="Skor marketing" style="background: #1D3149; color: #FFFFFF; border-radius: 20px; padding: 22px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 28px;">
<div style="flex: 1 1 260px; display: flex; flex-direction: column; gap: 4px;">
<span style="font-size: 12px; font-weight: 800; letter-spacing: 0.1em; color: #86DCD3;">SKOR MARKETING · {{scopeUpper}}</span>
<div style="display: flex; align-items: baseline; gap: 8px;"><span style="font-size: 48px; font-weight: 900; line-height: 1;">{{score}}</span><span style="font-size: 18px; font-weight: 700; color: #C5D3E3;">/ 100</span></div>
<span style="font-size: 13px; color: #C5D3E3;">{{scoreNote}}</span>
</div>
<div style="flex: 3 1 520px; display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 18px;">
<template data-sc="for" list="{{channelScores}}" as="c" hint-placeholder-count="4">
<a href="{{c.href}}" style="display: flex; flex-direction: column; gap: 8px; color: #FFFFFF; text-decoration: none;">
<div style="display: flex; justify-content: space-between; align-items: baseline;"><span style="font-size: 13px; font-weight: 700; color: #C5D3E3;">{{c.label}}</span><span style="font-size: 20px; font-weight: 900;">{{c.score}}</span></div>
<div style="height: 8px; background: #2C4664; border-radius: 4px; overflow: hidden;"><div style="height: 100%; width: {{c.pct}}; background: {{c.bar}}; border-radius: 4px;"></div></div>
<span style="font-size: 12px; color: #C5D3E3;">{{c.note}}</span>
</a>
</template>
</div>
</section>

<section aria-label="Metrik utama" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 14px;">
<template data-sc="for" list="{{tiles}}" as="t" hint-placeholder-count="8">
<div style="background: #FFFFFF; border: 1px solid #E3E6EB; border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 6px;">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 8px;">
<span style="font-size: 13px; font-weight: 700; color: #3B4250;">{{t.label}}</span>
<span style="font-size: 11px; font-weight: 800; color: #5B6573; background: #F3F5F8; border-radius: 6px; padding: 2px 6px;">{{t.src}}</span>
</div>
<span style="font-size: 28px; font-weight: 900; letter-spacing: -0.02em; color: #1D3149;">{{t.value}}</span>
<span style="font-size: 12px; font-weight: 800; color: {{t.deltaColor}};">{{t.delta}} <span style="font-weight: 600; color: #5B6573;">vs September</span></span>
<div style="height: 6px; background: #EEF0F3; border-radius: 3px; overflow: hidden; margin-top: 4px;"><div style="height: 100%; width: {{t.pct}}; background: {{t.barColor}}; border-radius: 3px;"></div></div>
<span style="font-size: 12px; color: #5B6573;">{{t.target}}</span>
</div>
</template>
</section>

<div style="display: flex; flex-wrap: wrap; gap: 22px; align-items: stretch;">
<section aria-labelledby="funnel-h" style="flex: 1 1 460px; min-width: 0; background: #FFFFFF; border: 1px solid #E3E6EB; border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 14px;">
<div style="display: flex; flex-direction: column;"><h2 id="funnel-h" style="margin: 0; font-size: 18px; font-weight: 800;">Corong marketing</h2><span style="font-size: 13px; color: #5B6573;">Dari dilihat orang sampai jadi omzet. Persen = lanjut dari tahap sebelumnya.</span></div>
<template data-sc="for" list="{{funnel}}" as="s" hint-placeholder-count="6">
<div style="display: grid; grid-template-columns: 150px minmax(0, 1fr) 64px; align-items: center; gap: 12px;">
<div style="display: flex; flex-direction: column;"><span style="font-size: 13px; font-weight: 700;">{{s.label}}</span><span style="font-size: 11px; color: #5B6573;">{{s.src}}</span></div>
<div style="height: 30px; background: #F3F5F8; border-radius: 8px; overflow: hidden;"><div style="height: 100%; width: {{s.width}}; background: {{s.color}}; border-radius: 8px; display: flex; align-items: center; padding-left: 10px; box-sizing: border-box; color: {{s.ink}}; font-size: 13px; font-weight: 800; white-space: nowrap;">{{s.value}}</div></div>
<span style="font-size: 13px; font-weight: 800; color: #3B4250; text-align: right;">{{s.conv}}</span>
</div>
</template>
<p style="margin: 0; font-size: 12px; color: #5B6573;">Chat & closing dihitung dari tautan WA ber-UTM dan kode promo. Omzet terlacak = closing yang bisa dirunut ke kanal marketing.</p>
</section>

<section aria-labelledby="trend-h" style="flex: 1 1 460px; min-width: 0; background: #FFFFFF; border: 1px solid #E3E6EB; border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 12px;">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px;">
<div style="display: flex; flex-direction: column;"><h2 id="trend-h" style="margin: 0; font-size: 18px; font-weight: 800;">Chat WA masuk per minggu</h2><span style="font-size: 13px; color: #5B6573;">Arahkan kursor ke minggu untuk melihat angka.</span></div>
<div style="display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; font-weight: 700; color: #3B4250;">
<template data-sc="for" list="{{legend}}" as="l" hint-placeholder-count="3"><span style="display: inline-flex; align-items: center; gap: 6px;"><span style="width: 14px; height: 3px; border-radius: 2px; background: {{l.color}};"></span>{{l.label}}</span></template>
</div>
</div>
<div style="background: #F3F5F8; border-radius: 10px; padding: 8px 12px; font-size: 13px; color: #1F2933;"><strong>{{readout.week}}</strong> · {{readout.text}}</div>
<div style="position: relative;">
<svg viewBox="0 0 600 230" width="100%" role="img" aria-label="Grafik garis chat WhatsApp masuk per minggu per unit bisnis, Oktober 2026" style="display: block;">
<g stroke="#E3E6EB" stroke-width="1">
<line x1="40" y1="190" x2="600" y2="190"></line>
<line x1="40" y1="150" x2="600" y2="150"></line>
<line x1="40" y1="110" x2="600" y2="110"></line>
<line x1="40" y1="70" x2="600" y2="70"></line>
<line x1="40" y1="30" x2="600" y2="30"></line>
</g>
<g fill="#5B6573" font-size="11" font-family="Nunito, sans-serif" text-anchor="end">
<text x="32" y="194">0</text><text x="32" y="154">20</text><text x="32" y="114">40</text><text x="32" y="74">60</text><text x="32" y="34">80</text>
</g>
<g fill="#5B6573" font-size="11" font-family="Nunito, sans-serif" text-anchor="middle">
<text x="110" y="214">1–7 Okt</text><text x="250" y="214">8–14 Okt</text><text x="390" y="214">15–21 Okt</text><text x="530" y="214">22–27 Okt</text>
</g>
<line x1="{{cross}}" y1="24" x2="{{cross}}" y2="190" stroke="#A9B4C2" stroke-width="1" stroke-dasharray="3 3"></line>
<path d="{{lineR}}" fill="none" stroke="#2F6FD0" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" opacity="{{opR}}"></path>
<path d="{{lineT}}" fill="none" stroke="#0FA394" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" opacity="{{opT}}"></path>
<path d="{{lineN}}" fill="none" stroke="#D08A1E" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" opacity="{{opN}}"></path>
<path d="{{dotsR}}" fill="none" stroke="#FFFFFF" stroke-width="13" stroke-linecap="round" opacity="{{opR}}"></path>
<path d="{{dotsR}}" fill="none" stroke="#2F6FD0" stroke-width="9" stroke-linecap="round" opacity="{{opR}}"></path>
<path d="{{dotsT}}" fill="none" stroke="#FFFFFF" stroke-width="13" stroke-linecap="round" opacity="{{opT}}"></path>
<path d="{{dotsT}}" fill="none" stroke="#0FA394" stroke-width="9" stroke-linecap="round" opacity="{{opT}}"></path>
<path d="{{dotsN}}" fill="none" stroke="#FFFFFF" stroke-width="13" stroke-linecap="round" opacity="{{opN}}"></path>
<path d="{{dotsN}}" fill="none" stroke="#D08A1E" stroke-width="9" stroke-linecap="round" opacity="{{opN}}"></path>
</svg>
<div style="position: absolute; left: 6.67%; right: 0; top: 0; bottom: 18px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));">
<template data-sc="for" list="{{weeks}}" as="w" hint-placeholder-count="4">
<button type="button" aria-label="{{w.aria}}" onMouseEnter="{{w.pick}}" onFocus="{{w.pick}}" onClick="{{w.pick}}" style="background: transparent; border: 0; cursor: crosshair; padding: 0;"></button>
</template>
</div>
</div>
</section>
</div>

<section aria-labelledby="unit-h" style="background: #FFFFFF; border: 1px solid #E3E6EB; border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 12px;">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 8px;">
<div style="display: flex; flex-direction: column;"><h2 id="unit-h" style="margin: 0; font-size: 18px; font-weight: 800;">Papan skor per unit bisnis</h2><span style="font-size: 13px; color: #5B6573;">Semua kanal digabung. Baris tebal = unit yang sedang dipilih.</span></div>
<span style="font-size: 12px; color: #5B6573;">Hijau = di atas target · oranye = di bawah target</span>
</div>
<div style="overflow-x: auto;">
<table style="width: 100%; min-width: 1060px; border-collapse: collapse; font-size: 13px;">
<thead>
<tr style="text-align: right; color: #5B6573; font-size: 12px;">
<th scope="col" style="text-align: left; padding: 10px 8px; border-bottom: 1px solid #E3E6EB; font-weight: 800;">Unit</th>
<th scope="col" style="padding: 10px 8px; border-bottom: 1px solid #E3E6EB; font-weight: 800;">Reach</th>
<th scope="col" style="padding: 10px 8px; border-bottom: 1px solid #E3E6EB; font-weight: 800;">Followers baru</th>
<th scope="col" style="padding: 10px 8px; border-bottom: 1px solid #E3E6EB; font-weight: 800;">ER IG</th>
<th scope="col" style="padding: 10px 8px; border-bottom: 1px solid #E3E6EB; font-weight: 800;">Chat WA</th>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":2380}}'>
class Component extends DCLogic {

  renderVals() {

    var COLOR = { Rentalaja: '#2F6FD0', TripinAja: '#0FA394', Niagaaja: '#D08A1E' };
    var D = {
      Rentalaja: { reach: 186400, reachT: 200000, reachP: 160000, inter: 7900, visit: 2880, fol: 410, folT: 450, folP: 380, er: 3.1, chat: 268, chatT: 280, chatP: 240, close: 74, ads: 2500000, kol: 900, spendP: 3000000, budget: 4500000, omzet: 41200000, omzetP: 35500000, rSum: 14.3, rN: 3, mapsOk: 3, mapsAll: 5, rev: 16, score: 74, ch: [75, 58, 76, 62], weekly: [58, 64, 70, 76] },
      TripinAja: { reach: 168900, reachT: 180000, reachP: 140000, inter: 9200, visit: 2610, fol: 620, folT: 600, folP: 560, er: 4.4, chat: 152, chatT: 170, chatP: 136, close: 38, ads: 1600000, kol: 1300, spendP: 2600000, budget: 3800000, omzet: 43600000, omzetP: 38000000, rSum: 4.7, rN: 1, mapsOk: 1, mapsAll: 1, rev: 6, score: 76, ch: [82, 64, 70, 94], weekly: [32, 36, 38, 46] },
      Niagaaja: { reach: 57500, reachT: 70000, reachP: 50000, inter: 1800, visit: 750, fol: 95, folT: 150, folP: 92, er: 2.2, chat: 66, chatT: 70, chatP: 58, close: 19, ads: 600000, kol: 200, spendP: 700000, budget: 1200000, omzet: 11600000, omzetP: 10200000, rSum: 4.5, rN: 1, mapsOk: 1, mapsAll: 1, rev: 1, score: 63, ch: [70, 55, 78, 90], weekly: [14, 16, 17, 19] }
    };
    var UNITS = ['Rentalaja', 'TripinAja', 'Niagaaja'];
    Object.keys(D).forEach(function (k) { D[k].kol = D[k].kol * 1000; D[k].spend = D[k].ads + D[k].kol; });
    var pick = unit === 'Semua' ? UNITS : [unit];
    var sum = function (f) { return pick.reduce(function (s, u) { return s + D[u][f]; }, 0); };
    var dec = function (n, d) { return n.toFixed(d).replace('.', ','); };
    var rb = function (n) { return n >= 1000 ? dec(n / 1000, 1) + ' rb' : String(n); };
    var num = function (n) { return n.toLocaleString('id-ID'); };
    var jt = function (n) { return 'Rp ' + dec(n / 1000000, 1) + ' jt'; };
    var pctOf = function (a, b) { return Math.min(100, Math.round(a / b * 100)); };
    var GOOD = '#067A70', BAD = '#9A3F0A';
    var delta = function (now, prev, lowerBetter) {
      var p = (now - prev) / prev * 100;
      var up = p >= 0;
      var good = lowerBetter ? !up : up;
      return { text: (up ? '▲ ' : '▼ ') + dec(Math.abs(p), 0) + '%', color: good ? GOOD : BAD };
    };

    var reach = sum('reach'), reachT = sum('reachT'), reachP = sum('reachP');
    var fol = sum('fol'), folT = sum('folT'), folP = sum('folP');
    var chat = sum('chat'), chatT = sum('chatT'), chatP = sum('chatP');
    var close = sum('close'), inter = sum('inter'), visit = sum('visit');
    var spend = sum('spend'), budget = sum('budget'), spendP = sum('spendP');
    var omzet = sum('omzet'), omzetP = sum('omzetP');
    var er = pick.reduce(function (s, u) { return s + D[u].er * D[u].reach; }, 0) / reach;
    var rating = sum('rSum') / sum('rN');
    var cpl = spend / chat, cplP = spendP / chatP;
    var roas = omzet / spend, roasP = omzetP / spendP;

    var mk = function (label, src, value, d, pct, target, barColor) {
      return { label: label, src: src, value: value, delta: d.text, deltaColor: d.color, pct: pct + '%', target: target, barColor: barColor || (pct >= 90 ? '#09BEAF' : '#D08A1E') };
    };
    var tiles = [
      mk('Reach total', 'IG · TikTok · Ads', rb(reach), delta(reach, reachP), pctOf(reach, reachT), pctOf(reach, reachT) + '% dari target ' + rb(reachT)),
      mk('Followers baru', 'IG · TikTok', '+' + num(fol), delta(fol, folP), pctOf(fol, folT), pctOf(fol, folT) + '% dari target ' + num(folT)),
      mk('Engagement rate IG', 'Instagram', dec(er, 1) + '%', delta(er, 3.2), pctOf(er, 4), 'Target 4,0% · patokan akun lokal 3–5%'),
      mk('Chat WA dari marketing', 'Link UTM', num(chat), delta(chat, chatP), pctOf(chat, chatT), pctOf(chat, chatT) + '% dari target ' + num(chatT)),
      mk('Biaya terpakai', 'Ads + KOL', jt(spend), delta(spend, spendP, true), pctOf(spend, budget), pctOf(spend, budget) + '% dari budget ' + jt(budget) + ' · hari 27/31', '#1D3149'),
      mk('Biaya per chat', 'Ads + KOL', 'Rp ' + dec(cpl / 1000, 1) + ' rb', delta(cpl, cplP, true), pctOf(15000, cpl), 'Batas atas Rp 15 rb per chat'),

      mk('Rating Google Maps', 'Business Profile', dec(rating, 1) + ' ★', { text: '+' + sum('rev') + ' ulasan', color: GOOD }, pctOf(sum('mapsOk'), sum('mapsAll')), sum('mapsOk') + ' dari ' + sum('mapsAll') + ' lokasi terverifikasi')
    ];

    var score = unit === 'Semua' ? 72 : D[unit].score;
    var chv = unit === 'Semua' ? [78, 60, 74, 71] : D[unit].ch;
    var CH = [
      { label: 'Sosial Media', href: 'Instagram.dc.html', note: 'Konten, reach, engagement' },
      { label: 'KOL', href: 'KOL.dc.html', note: 'Tayang tepat waktu, ROAS' },
      { label: 'Ads', href: 'Ads.dc.html', note: 'Pacing, biaya per chat' },
      { label: 'Google Maps', href: 'Maps.dc.html', note: 'Verifikasi, rating, balasan' }
    ];
    var channelScores = CH.map(function (c, i) {
      return { label: c.label, href: c.href, note: c.note, score: chv[i], pct: chv[i] + '%', bar: chv[i] >= 70 ? '#09BEAF' : '#F2A33A' };
    });
    var low = channelScores.filter(function (c) { return c.score < 70; }).map(function (c) { return c.label; });
    var scoreNote = low.length ? 'Di bawah 70: ' + low.join(' dan ') + '. Skor = rata-rata capaian target tiap kanal.' : 'Semua kanal di atas 70. Skor = rata-rata capaian target tiap kanal.';

    var F = [
      { label: 'Reach', src: 'IG · TikTok · Ads · KOL', v: reach, w: 100 },
      { label: 'Interaksi', src: 'suka, komentar, simpan, bagikan', v: inter, w: 72 },
      { label: 'Kunjungan & klik', src: 'profil, tautan bio, Maps', v: visit, w: 54 },
      { label: 'Chat WA', src: 'tautan ber-UTM', v: chat, w: 38 },
      { label: 'Closing', src: 'dicocokkan kode promo', v: close, w: 26 },
      { label: 'Omzet terlacak', src: 'dari closing di atas', v: omzet, w: 20, money: true }
    ];
    var funnel = F.map(function (s, i) {
      var conv = i === 0 ? '' : (s.money ? 'Rp ' + rb(Math.round(omzet / close)) : dec(s.v / F[i - 1].v * 100, 1) + '%');
      return { label: s.label, src: s.src, value: s.money ? jt(s.v) : (s.v >= 10000 ? rb(s.v) : num(s.v)), width: s.w + '%', conv: conv, color: i < 3 ? '#1D3149' : '#09BEAF', ink: i < 3 ? '#FFFFFF' : '#1D3149' };
    });
    funnel[5].conv = 'per closing';

    var X = [110, 250, 390, 530];
    var y = function (v) { return 190 - v / 80 * 160; };
    var line = function (u) { return D[u].weekly.map(function (v, i) { return (i ? 'L' : 'M') + X[i] + ' ' + y(v); }).join(' '); };
    var dots = function (u) { return D[u].weekly.map(function (v, i) { return 'M' + X[i] + ' ' + y(v) + ' h0'; }).join(' '); };
    var op = function (u) { return unit === 'Semua' || unit === u ? '1' : '0.15'; };
    var WK = ['1–7 Okt', '8–14 Okt', '15–21 Okt', '22–27 Okt'];
    var weeks = WK.map(function (lbl, i) {
      return { aria: 'Minggu ' + lbl + ': Rentalaja ' + D.Rentalaja.weekly[i] + ', TripinAja ' + D.TripinAja.weekly[i] + ', Niagaaja ' + D.Niagaaja.weekly[i], pick: function () { if (self.state.wk !== i) self.setState({ wk: i }); } };
    });
    var readout = { week: WK[wk], text: pick.map(function (u) { return u + ' ' + D[u].weekly[wk]; }).join(' · ') + (pick.length > 1 ? ' · total ' + pick.reduce(function (s, u) { return s + D[u].weekly[wk]; }, 0) : '') };

    var rowFor = function (name, d, isAll) {
      var sel = unit === name || (isAll && unit === 'Semua');
      var sc = d.score;
      return {
        unit: name, dot: isAll ? '#1D3149' : COLOR[name],
        bg: sel ? '#F0FBF9' : '#FFFFFF', weight: sel ? '700' : '500',
        reach: rb(d.reach), fol: '+' + num(d.fol), folColor: d.fol >= d.folT ? GOOD : BAD,

        spend: jt(d.spend), cpl: 'Rp ' + dec(d.spend / d.chat / 1000, 1) + ' rb',
        omzet: jt(d.omzet), roas: dec(d.omzet / d.spend, 1) + 'x',
        score: sc, scoreBg: sc >= 70 ? '#DDF5F2' : '#FCEBDD', scoreFg: sc >= 70 ? GOOD : BAD
      };
    };
    var all = { reach: 412800, fol: 1125, folT: 1200, er: 3.5, chat: 486, chatT: 520, close: 131, spend: 7100000, omzet: 96400000, score: 72 };
    var rows = UNITS.map(function (u) { return rowFor(u, D[u], false); }).concat([rowFor('Semua unit', all, true)]);

    var budgetRows = UNITS.map(function (u) {
      var d = D[u];
      return { unit: u, adsW: (d.ads / 4500000 * 100) + '%', kolW: (d.kol / 4500000 * 100) + '%', adsTip: 'Ads ' + jt(d.ads), kolTip: 'KOL ' + jt(d.kol), total: jt(d.spend), budget: jt(d.budget), omzet: jt(d.omzet) };
    });

    var BADG = { Tinggi: ['#FCEBDD', '#9A3F0A'], Sedang: ['#FDF3D7', '#7A5200'], Info: ['#E5EEF9', '#1E5AA8'] };
    var decisions = [
      { level: 'Tinggi', title: 'Evaluasi fee KOL', body: 'ROAS KOL 6,2x vs ads 17,4x. Dua KOL lewat jadwal tayang — tagih atau alihkan Rp 0,9 jt ke ads.' },
      { level: 'Tinggi', title: 'Klaim Google Maps Wanaraja', body: 'Lokasi belum diklaim; pencarian "rental iphone garut" ke kompetitor.' },
      { level: 'Sedang', title: 'Kejar TikTok', body: 'Baru 5 dari 15 video. Potong ulang 6 Reels terbaik jadi TikTok minggu ini.' },
      { level: 'Sedang', title: 'Balas 9 ulasan Maps', body: '3 di antaranya bintang ≤ 3 dan sudah lebih dari 48 jam.' },
      { level: 'Info', title: 'Geser format ads TripinAja', body: 'Biaya per chat Rp 19,1 rb tertinggi. Carousel destinasi ER-nya 2x lipat single image.' }
    ].map(function (d) { d.bg = BADG[d.level][0]; d.fg = BADG[d.level][1]; return d; });

    var filters = ['Semua', 'Rentalaja', 'TripinAja', 'Niagaaja'].map(function (label) {
      var on = label === unit;
      return { label: label, pressed: on ? 'true' : 'false', bg: on ? '#1D3149' : '#FFFFFF', fg: on ? '#FFFFFF' : '#1D3149', border: on ? '#1D3149' : '#E3E6EB', dot: label === 'Semua' ? '#09BEAF' : COLOR[label], pick: function () { self.setState({ unit: label }); } };
    });
    var legend = UNITS.map(function (u) { return { label: u, color: COLOR[u] }; });

    return {
      filters: filters, scopeUpper: unit === 'Semua' ? 'SEMUA UNIT' : unit.toUpperCase(), score: score, scoreNote: scoreNote,
      channelScores: channelScores, tiles: tiles, funnel: funnel, rows: rows, budget: budgetRows, decisions: decisions, legend: legend,
      weeks: weeks, readout: readout, cross: X[wk],
      lineR: line('Rentalaja'), lineT: line('TripinAja'), lineN: line('Niagaaja'),
      dotsR: dots('Rentalaja'), dotsT: dots('TripinAja'), dotsN: dots('Niagaaja'),
      opR: op('Rentalaja'), opT: op('TripinAja'), opN: op('Niagaaja')
    };
  }
}
