<style>
body{margin:0;background:#F3F5F8}
a{color:#1D3149}a:hover{color:#0F1D2E}
table{font-variant-numeric:tabular-nums}
main > header{background:radial-gradient(circle at 92% -30%, rgba(9,190,175,.45), transparent 42%),linear-gradient(135deg,#1D3149 0%,#28507A 100%);border-radius:22px;padding:22px 26px;align-items:center !important;box-shadow:0 10px 30px rgba(29,49,73,.18)}
main > header h1{color:#FFFFFF !important}
main > header span{color:#D3E0EC !important}
main > header b{color:#7FF0E2 !important}
main > header span[style*="dashed"]{border-color:rgba(255,255,255,.45) !important}
main > header button{border-color:rgba(255,255,255,.35) !important}
main > header button[aria-pressed="true"]{background:#09BEAF !important;color:#1D3149 !important;border-color:#09BEAF !important}
main > header button[aria-pressed="false"]{background:rgba(255,255,255,.08) !important;color:#FFFFFF !important}
main > header a{color:#1D3149}
main section{transition:box-shadow .2s ease, transform .2s ease}
main section:hover{box-shadow:0 8px 24px rgba(29,49,73,.07)}
main > header span[aria-hidden="true"]{flex:none}
@media (max-width: 760px){article[style*="grid-template-columns: 36px minmax(0, 1fr) auto"]{grid-template-columns:32px minmax(0,1fr) !important}
article[style*="grid-template-columns: 36px minmax(0, 1fr) auto"] > div:last-child{grid-column:2;flex-direction:row !important;justify-content:space-between;align-items:center !important}}
@media (max-width: 760px){main > header{padding:16px !important;border-radius:16px}}
@media (max-width: 760px){table:not(:has(th:nth-child(5))){min-width:0 !important;width:100% !important}}
td[style*="text-align: right"]{white-space:nowrap}
tbody tr:hover td{background:#F9FAFB}
thead th{position:sticky;top:0;background:#FFFFFF}
button:focus-visible,a:focus-visible{outline:2px solid #09BEAF;outline-offset:2px;border-radius:8px}
button{transition:filter .15s}button:hover{filter:brightness(0.97)}
@media (max-width: 760px){
nav[aria-label="Menu utama"]{flex:1 1 100% !important;flex-direction:row !important;align-items:center !important;overflow-x:auto;gap:4px !important;padding:8px 12px !important;border-right:0 !important;border-bottom:1px solid #E3E6EB;position:sticky;top:0;z-index:20;scrollbar-width:none}
nav[aria-label="Menu utama"] > div{flex-direction:row !important;gap:4px !important;padding:0 !important;flex:none !important}
nav[aria-label="Menu utama"] > div > span:first-child{display:none !important}
nav[aria-label="Menu utama"] > div:first-child img{width:84px !important}
nav[aria-label="Menu utama"] > div:first-child span{display:none !important}
nav[aria-label="Menu utama"] a{white-space:nowrap;min-height:36px !important;padding:0 10px !important}
nav[aria-label="Menu utama"] > div[style*="margin-top: auto"]{display:none !important}
main{padding:18px 16px 40px !important}
h1{font-size:24px !important}
}
</style>

<a href="kerja.html#editor" data-view="editor" style="display: flex; align-items: center; gap: 10px; min-height: 38px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-weight: 600; color: #3B4250;"><span data-ic style="display: inline-flex; color: #5B6573;"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h14v18H5zM8 8h8M8 12h8M8 16h5"></path></svg></span><span style="flex-grow: 1;">Antrean editor</span><span data-badge="editor"></span></a>

</div>
<div style="display: flex; flex-direction: column; gap: 2px;">
<span style="font-size: 11px; font-weight: 800; letter-spacing: 0.08em; color: #5B6573; padding: 0 12px 4px;">PENGATURAN</span>
<a href="Brand.dc.html" style="display: flex; align-items: center; gap: 10px; min-height: 38px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-weight: 600; color: #3B4250;"><span data-ic style="display: inline-flex; color: #5B6573;"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12V4h8l10 10-8 8zM7.5 7.5h.01"></path></svg></span><span style="flex-grow: 1;">Brand &amp; positioning</span></a>

<main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 28px 36px 48px; display: flex; flex-direction: column; gap: 22px;">

<header style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px;">
<div style="display: flex; align-items: center; gap: 16px;">
<span aria-hidden="true" style="width: 56px; height: 56px; border-radius: 28px; background: #2F6FD0; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 22px;">D</span>
<div style="display: flex; flex-direction: column; gap: 2px;">
<span style="font-size: 13px; color: #5B6573; font-weight: 700;">Kamis, 29 Oktober 2026 · Dita</span>
<h1 style="margin: 0; font-size: 28px; font-weight: 900; color: #1D3149;">Hari ini</h1>
<span style="font-size: 14px; color: #3B4250;">Satu daftar kerja, diurutkan dari yang paling mendesak. Centang kalau sudah selesai.</span>
</div>
</div>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px;">
<span style="font-size: 12px; font-weight: 700; color: #5B6573; border: 1px dashed #A9B4C2; border-radius: 18px; padding: 8px 12px;">Data contoh</span>
<div role="group" aria-label="Tampilkan" style="display: flex; gap: 6px;">
<template data-sc="for" list="{{views}}" as="v" hint-placeholder-count="2">
<button type="button" onClick="{{v.pick}}" aria-pressed="{{v.pressed}}" style="height: 40px; padding: 0 16px; border-radius: 20px; border: 1px solid {{v.border}}; background: {{v.bg}}; color: {{v.fg}}; font-family: inherit; font-size: 13px; font-weight: 800; cursor: pointer;">{{v.label}}</button>
</template>
</div>
</div>
</header>

<template data-sc="if" value="{{mine}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-wrap: wrap; gap: 22px; align-items: flex-start;">

<div style="flex: 2 1 620px; min-width: 0; display: flex; flex-direction: column; gap: 22px;">
<section aria-labelledby="todo-h" style="background: #FFFFFF; border: 1px solid #E3E6EB; border-radius: 20px; padding: 18px 20px; display: flex; flex-direction: column; gap: 10px;">
<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 10px;"><h2 id="todo-h" data-icon-done="1" style="display: flex; align-items: center; gap: 10px; margin: 0; font-size: 18px; font-weight: 900; color: #1D3149;"><span aria-hidden="true" style="width: 28px; height: 28px; flex: none; border-radius: 8px; background: #DDF5F2; color: #067A70; display: inline-flex; align-items: center; justify-content: center;"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"></path></svg></span>Daftar kerja hari ini</h2><span style="font-size: 13px; font-weight: 800; color: #3B4250;">{{doneN}} dari {{total}} selesai</span></div>
<div style="height: 8px; border-radius: 4px; background: #E3E6EB; overflow: hidden;"><div style="height: 100%; width: {{donePct}}; background: #09BEAF;"></div></div>
<template data-sc="for" list="{{tasks}}" as="t" hint-placeholder-count="7">
<article style="display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px; border-radius: 14px; border: 1px solid {{t.border}}; background: {{t.bg}}; opacity: {{t.op}};">
<button type="button" onClick="{{t.toggle}}" aria-label="Tandai selesai" aria-pressed="{{t.pressed}}" style="width: 32px; height: 32px; border-radius: 16px; border: 2px solid {{t.ring}}; background: {{t.checkBg}}; color: #FFFFFF; font-family: inherit; font-size: 15px; font-weight: 900; cursor: pointer; display: flex; align-items: center; justify-content: center;">{{t.mark}}</button>
<div style="display: flex; flex-direction: column; gap: 3px; min-width: 0;">
<strong style="font-size: 15px; color: #1D3149; line-height: 1.3; text-decoration: {{t.strike}};">{{t.title}}</strong>
<span style="font-size: 12px; color: #5B6573;"><span style="display: inline-block; width: 8px; height: 8px; border-radius: 4px; background: {{t.dot}}; margin-right: 6px;"></span>{{t.meta}}</span>
<span style="font-size: 12.5px; color: #3B4250;">{{t.why}}</span>
</div>
<div style="display: flex; flex-direction: column; align-items: flex-end; gap: 6px;">
<span style="font-size: 12px; font-weight: 800; color: {{t.dueColor}}; white-space: nowrap;">{{t.due}}</span>
<button type="button" onClick="{{t.toggle}}" style="height: 36px; padding: 0 14px; border-radius: 10px; border: 0; background: {{t.btnBg}}; color: #1D3149; font-family: inherit; font-size: 13px; font-weight: 800; cursor: pointer; white-space: nowrap;">{{t.action}}</button>
</div>
</article>
</template>
</section>

<section aria-labelledby="wait-h" style="background: #FFFFFF; border: 1px solid #E3E6EB; border-radius: 20px; padding: 16px 20px; display: flex; flex-direction: column; gap: 10px;">
<h2 id="wait-h" data-icon-done="1" style="display: flex; align-items: center; gap: 10px; margin: 0; font-size: 16px; font-weight: 900; color: #1D3149;"><span aria-hidden="true" style="width: 28px; height: 28px; flex: none; border-radius: 8px; background: #FCEBDD; color: #9A3F0A; display: inline-flex; align-items: center; justify-content: center;"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18zM8 12h.01M12 12h.01M16 12h.01"></path></svg></span>Menunggu orang lain</h2>
<template data-sc="for" list="{{waits}}" as="w" hint-placeholder-count="1">
<div style="display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; gap: 12px; align-items: center;">
<img src="{{w.photo}}" alt="{{w.who}}" style="width: 36px; height: 36px; border-radius: 18px; object-fit: cover;">
<div style="display: flex; flex-direction: column;"><strong style="font-size: 14px; color: #1D3149;">{{w.title}}</strong><span style="font-size: 12px; color: #5B6573;">{{w.note}}</span></div>
<button type="button" style="height: 34px; padding: 0 12px; border-radius: 10px; border: 1px solid #C9D1DB; background: #FFFFFF; color: #1D3149; font-family: inherit; font-size: 12.5px; font-weight: 800; cursor: pointer;">Ingatkan</button>
</div>
</template>
</section>
</div>

<aside style="flex: 1 1 300px; min-width: 0; display: flex; flex-direction: column; gap: 22px;">
<section aria-labelledby="akun-h" style="background: #FFFFFF; border: 1px solid #E3E6EB; border-radius: 20px; padding: 18px 20px; display: flex; flex-direction: column; gap: 12px;">
<div style="display: flex; flex-direction: column;"><h2 id="akun-h" data-icon-done="1" style="display: flex; align-items: center; gap: 10px; margin: 0; font-size: 17px; font-weight: 900; color: #1D3149;"><span aria-hidden="true" style="width: 28px; height: 28px; flex: none; border-radius: 8px; background: #FDF0F6; color: #9C2C63; display: inline-flex; align-items: center; justify-content: center;"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v16H4zM12 8.5a3.5 3.5 0 1 0 0 7a3.5 3.5 0 1 0 0-7zM17 7h.01"></path></svg></span>Akun saya</h2><span style="font-size: 12.5px; color: #5B6573;">Slot content plan minggu 1–7 Nov</span></div>
<template data-sc="for" list="{{accounts}}" as="a" hint-placeholder-count="4">
<a href="MingguDepan.dc.html" style="display: flex; flex-direction: column; gap: 6px; text-decoration: none; color: #1F2933; padding: 10px 12px; border-radius: 12px; background: #F7F8FA;">
<div style="display: flex; justify-content: space-between; align-items: center;"><span style="display: inline-flex; align-items: center; gap: 8px; font-weight: 800;"><span style="width: 10px; height: 10px; border-radius: 5px; background: {{a.dot}};"></span>{{a.name}}</span><span style="font-weight: 900; color: #1D3149;">{{a.filled}}</span></div>
<div style="height: 8px; border-radius: 4px; background: #E3E6EB; overflow: hidden;"><div style="height: 100%; width: {{a.pct}}; background: {{a.bar}}; border-radius: 4px;"></div></div>
</a>
</template>
</section>
</aside>
</div>
</template>

<template data-sc="if" value="{{team}}" hint-placeholder-val="{{ false }}">
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px;">
<template data-sc="for" list="{{people}}" as="p" hint-placeholder-count="5">
<section style="background: #FFFFFF; border: 1px solid #E3E6EB; border-radius: 20px; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px;">
<div style="display: flex; align-items: center; gap: 12px;">
<template data-sc="if" value="{{p.photo}}" hint-placeholder-val="{{ true }}"><img src="{{p.photo}}" alt="{{p.name}}" style="width: 44px; height: 44px; border-radius: 22px; object-fit: cover;"></template>
<template data-sc="if" value="{{p.noPhoto}}" hint-placeholder-val="{{ false }}"><span role="img" aria-label="{{p.name}}" style="width: 44px; height: 44px; border-radius: 22px; background: {{p.color}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 900;">{{p.ini}}</span></template>
<div style="display: flex; flex-direction: column; flex-grow: 1;"><strong style="font-size: 15px; color: #1D3149;">{{p.name}}</strong><span style="font-size: 12px; color: #5B6573;">{{p.role}}</span></div>
<div style="display: flex; flex-direction: column; align-items: flex-end;"><span style="font-size: 18px; font-weight: 900; color: #1D3149;">{{p.n}}</span><span style="font-size: 11.5px; font-weight: 800; color: {{p.lateColor}};">{{p.late}}</span></div>
</div>
<template data-sc="for" list="{{p.items}}" as="i" hint-placeholder-count="2"><div style="font-size: 13px; color: #1D3149; padding: 8px 10px; border-radius: 10px; background: #F7F8FA; border-left: 4px solid {{i.c}};">{{i.t}}</div></template>
</section>
</template>
</div>
</template>

</main>

</div>
