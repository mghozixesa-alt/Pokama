body{margin:0;background:#F3F5F8}
a{color:#1D3149}a:hover{color:#0F1D2E}

main > header h1{color:#FFFFFF !important}

main > header button{border-color:rgba(255,255,255,.35) !important}
main > header button[aria-pressed="true"]{background:#09BEAF !important;color:#1D3149 !important;border-color:#09BEAF !important}
main > header button[aria-pressed="false"]{background:rgba(255,255,255,.08) !important;color:#FFFFFF !important}
main > header a{color:#1D3149}
main section{transition:box-shadow .2s ease, transform .2s ease}
main section:hover{box-shadow:0 8px 24px rgba(29,49,73,.07)}
main > header span[aria-hidden="true"]{flex:none}
@media (max-width: 760px){section[aria-label="Papan minggu depan per akun"] > div{min-width:820px !important}
section[aria-label="Papan minggu depan per akun"] > div > div{grid-template-columns:118px repeat(7, minmax(0, 1fr)) !important}
section[aria-label="Papan minggu depan per akun"] > div > div > :first-child{position:sticky;left:-14px;z-index:3;box-shadow:6px 0 8px -6px rgba(29,49,73,.25)}

@media (max-width: 760px){article[style*="grid-template-columns: 36px minmax(0, 1fr) auto"]{grid-template-columns:32px minmax(0,1fr) !important}
article[style*="grid-template-columns: 36px minmax(0, 1fr) auto"] > div:last-child{grid-column:2;flex-direction:row !important;justify-content:space-between;align-items:center !important}}
@media (max-width: 760px){main > header{padding:16px !important;border-radius:16px}}
@media (max-width: 760px){table:not(:has(th:nth-child(5))){min-width:0 !important;width:100% !important}}
td[style*="text-align: right"]{white-space:nowrap}
tbody tr:hover td{background:#F9FAFB}
thead th{position:sticky;top:0;background:#FFFFFF}
button:focus-visible,a:focus-visible{outline:2px solid #09BEAF;outline-offset:2px;border-radius:8px}
button{transition:filter .15s}button:hover{filter:brightness(0.97)}
@media (max-width: 760px){
nav[aria-label="Menu utama"]{flex:1 1 100% !important;flex-direction:row !important;align-items:center !important;overflow-x:auto;gap:4px !important;padding:8px 12px !important;border-right:0 !important;border-bottom:1px solid #E3E6EB;position:sticky;top:0;z-index:20;scrollbar-width:none}
nav[aria-label="Menu utama"] > div{flex-direction:row !important;gap:4px !important;padding:0 !important;flex:none !important}
nav[aria-label="Menu utama"] > div > span:first-child{display:none !important}
nav[aria-label="Menu utama"] > div:first-child img{width:84px !important}
nav[aria-label="Menu utama"] > div:first-child span{display:none !important}
nav[aria-label="Menu utama"] a{white-space:nowrap;min-height:36px !important;padding:0 10px !important}
nav[aria-label="Menu utama"] > div[style*="margin-top: auto"]{display:none !important}
main{padding:18px 16px 40px !important}
h1{font-size:24px !important}
}
</style>

<main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 28px 36px 48px; display: flex; flex-direction: column; gap: 20px;">

<header style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px;">
<div style="display: flex; flex-direction: column; gap: 4px;">
<span style="font-size: 13px; color: #5B6573; font-weight: 700;">Dikunci Jumat 30 Okt 17.00 · perubahan setelahnya lewat Kevin</span>
<h1 style="margin: 0; font-size: 28px; font-weight: 900; color: #1D3149;">Content plan</h1>
<span style="font-size: 14px; color: #3B4250; max-width: 900px;">{{filled}} dari {{target}} slot terisi untuk minggu 1–7 Nov. Setiap slot bertanda campaign induknya.</span>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center;">
<span style="font-size: 12px; font-weight: 700; color: #5B6573; border: 1px dashed #A9B4C2; border-radius: 18px; padding: 8px 12px;">Data contoh</span>
<a href="BankIde.dc.html" style="height: 42px; padding: 0 16px; border-radius: 10px; background: #09BEAF; color: #1D3149; font-weight: 800; display: inline-flex; align-items: center; text-decoration: none;">Isi dari Content bank</a>
</div>
</header>

<div style="display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; justify-content: space-between;">
<div role="group" aria-label="Filter unit bisnis" style="display: flex; flex-wrap: wrap; gap: 8px;">
<template data-sc="for" list="{{filters}}" as="f" hint-placeholder-count="4">
<button type="button" onClick="{{f.pick}}" aria-pressed="{{f.pressed}}" style="display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px; border-radius: 20px; border: 1px solid {{f.border}}; background: {{f.bg}}; color: {{f.fg}}; font-family: inherit; font-size: 13px; font-weight: 800; cursor: pointer;"><span style="width: 9px; height: 9px; border-radius: 5px; background: {{f.dot}};"></span>{{f.label}}</button>
</template>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; font-weight: 700; color: #3B4250;">
<template data-sc="for" list="{{legend}}" as="l" hint-placeholder-count="6"><span style="display: inline-flex; align-items: center; gap: 6px;"><span style="width: 12px; height: 12px; border-radius: 4px; background: {{l.bg}}; border: 1px solid {{l.fg}};"></span>{{l.name}}</span></template>
</div>
</div>

<section aria-label="Papan minggu depan per akun" style="background: #FFFFFF; border: 1px solid #E3E6EB; border-radius: 20px; padding: 14px; overflow-x: auto;">
<div style="min-width: 1080px; display: flex; flex-direction: column; gap: 8px;">
<div style="display: grid; grid-template-columns: 170px repeat(7, minmax(0, 1fr)); gap: 8px;">
<span style="font-size: 12px; font-weight: 800; color: #5B6573; padding: 4px 8px;">Akun · PIC</span>
<template data-sc="for" list="{{days}}" as="d" hint-placeholder-count="7"><div style="display: flex; align-items: baseline; gap: 6px; padding: 4px 8px;"><span style="font-size: 12px; font-weight: 800; color: #5B6573;">{{d.dow}}</span><span style="font-size: 15px; font-weight: 900; color: #1D3149;">{{d.date}}</span><span style="font-size: 11.5px; font-weight: 800; color: #067A70;">{{d.tag}}</span></div></template>
</div>
<template data-sc="for" list="{{rows}}" as="r" hint-placeholder-count="8">
<div style="display: grid; grid-template-columns: 170px repeat(7, minmax(0, 1fr)); gap: 8px; align-items: stretch;">
<div style="display: flex; flex-direction: column; gap: 6px; padding: 10px; border-radius: 12px; background: #F7F8FA; border-left: 4px solid {{r.dot}};">
<strong style="font-size: 13.5px; color: #1D3149; line-height: 1.2;">{{r.name}}</strong>
<div style="display: flex; align-items: center; gap: 6px;">
<template data-sc="if" value="{{r.pic.photo}}" hint-placeholder-val="{{ true }}"><img src="{{r.pic.photo}}" alt="{{r.pic.name}}" style="width: 24px; height: 24px; border-radius: 12px; object-fit: cover;"></template>
<template data-sc="if" value="{{r.pic.ini}}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="width: 24px; height: 24px; border-radius: 12px; background: {{r.pic.color}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 11.5px; font-weight: 900;">{{r.pic.ini}}</span></template>
<span style="font-size: 12px; font-weight: 800; color: {{r.picColor}};">{{r.pic.name}}</span>
</div>
<span style="font-size: 11.5px; font-weight: 800; color: {{r.countColor}};">{{r.count}}</span>
<span style="font-size: 11px; font-weight: 700; color: #5B6573;">Jam upload {{r.jam}}</span>
</div>
<template data-sc="for" list="{{r.cells}}" as="c" hint-placeholder-count="7">
<div style="display: flex; flex-direction: column; gap: 6px; min-height: 92px;">
<template data-sc="for" list="{{c.cards}}" as="k" hint-placeholder-count="1">
<div style="display: flex; flex-direction: column; gap: 5px; padding: 8px; border-radius: 10px; background: {{k.bg}}; border: 1px solid {{k.fg}}33;">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 4px;">
<span style="font-size: 11.5px; font-weight: 900; color: {{k.fg}};">{{k.stage}}</span>
<span style="font-size: 11.5px; font-weight: 800; color: #3B4250; background: #FFFFFF; border-radius: 6px; padding: 0 5px;">{{k.fmt}}</span>
</div>
<span style="font-size: 12px; font-weight: 800; color: #1D3149; line-height: 1.25;">{{k.title}}</span>
<template data-sc="if" value="{{k.why}}" hint-placeholder-val="{{ false }}"><span style="font-size: 11.5px; font-weight: 800; color: #067A70;">{{k.why}}</span></template>
</div>
</template>
<template data-sc="if" value="{{c.empty}}" hint-placeholder-val="{{ false }}">
<button type="button" style="flex-grow: 1; min-height: 76px; border-radius: 10px; border: 1.5px dashed #F2A33A; background: #FFF8EF; color: #9A3F0A; font-family: inherit; font-size: 12px; font-weight: 800; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;"><span>Slot kosong</span><span style="font-weight: 700; color: #7A5200;">+ Isi</span></button>
</template>
</div>
</template>
</div>
</template>
</div>
</section>

<div style="display: flex; flex-wrap: wrap; gap: 22px; align-items: stretch;">

<section aria-labelledby="usul-h" style="flex: 2 1 620px; min-width: 0; background: #FFFFFF; border: 1px solid #E3E6EB; border-radius: 20px; padding: 18px 20px; display: flex; flex-direction: column; gap: 12px;">
<div style="display: flex; flex-direction: column;"><h2 id="usul-h" data-icon-done="1" style="display: flex; align-items: center; gap: 10px; margin: 0; font-size: 17px; font-weight: 900; color: #1D3149;"><span aria-hidden="true" style="width: 28px; height: 28px; flex: none; border-radius: 8px; background: #FDF3D7; color: #7A5200; display: inline-flex; align-items: center; justify-content: center;"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.8.8 1 1.5 1 2.5h6c0-1 .2-1.7 1-2.5A6 6 0 0 0 12 3z"></path></svg></span>Rekomendasi isi slot kosong</h2><span style="font-size: 12.5px; color: #5B6573;">Disusun dari verdict "Repeat" minggu lalu dan Content bank. Tarik ke slot, brief terisi otomatis.</span></div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px;">
<template data-sc="for" list="{{ideas}}" as="i" hint-placeholder-count="4">
<article style="display: flex; flex-direction: column; gap: 6px; padding: 12px; border: 1px solid #E3E6EB; border-radius: 14px;">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 6px;"><span style="font-size: 11.5px; font-weight: 900; padding: 2px 8px; border-radius: 9px; background: {{i.srcBg}}; color: {{i.srcFg}};">{{i.src}}</span><span style="display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 800; color: #3B4250;"><span style="width: 8px; height: 8px; border-radius: 4px; background: {{i.dot}};"></span>{{i.acc}}</span></div>
<strong style="font-size: 14px; color: #1D3149; line-height: 1.3;">{{i.title}}</strong>
<span style="font-size: 12px; color: #3B4250;">{{i.why}}</span>
<button type="button" style="margin-top: auto; align-self: flex-start; height: 36px; padding: 0 14px; border-radius: 10px; border: 0; background: #1D3149; color: #FFFFFF; font-family: inherit; font-size: 12.5px; font-weight: 800; cursor: pointer;">{{i.action}}</button>
</article>
</template>
</div>
</section>
