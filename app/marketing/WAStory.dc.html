<main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 28px 36px 48px; display: flex; flex-direction: column; gap: 22px;">

<header style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px;">
<div style="display: flex; flex-direction: column; gap: 4px;">
<span style="font-size: 13px; color: #5B6573; font-weight: 600;">Oktober 2026 · data 1–27 Oktober · per nomor CS</span>
<h1 style="margin: 0; font-size: 30px; font-weight: 900; letter-spacing: -0.01em;">WA Story &amp; Broadcast</h1>
</div>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px;">
<span style="display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px; border-radius: 18px; background: #EEF0F3; color: #3B4250; font-size: 12px; font-weight: 800;"><span style="width: 8px; height: 8px; border-radius: 4px; background: #A9B4C2;"></span>Input harian · WA Business tidak punya API viewer</span>
<span style="font-size: 12px; font-weight: 700; color: #5B6573; border: 1px dashed #A9B4C2; border-radius: 18px; padding: 8px 12px;">Data contoh</span>
<button type="button" style="height: 44px; padding: 0 18px; border-radius: 10px; border: 0; background: #09BEAF; color: #1D3149; font-family: inherit; font-size: 14px; font-weight: 800; cursor: pointer;">Isi viewer hari ini</button>
</div>
</header>

<div role="group" aria-label="Pilih nomor CS" style="display: flex; flex-wrap: wrap; gap: 8px;">
<template data-sc="for" list="{{accounts}}" as="a" hint-placeholder-count="5">
<button type="button" onClick="{{a.pick}}" aria-pressed="{{a.pressed}}" style="display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 18px; border-radius: 22px; border: 1px solid {{a.border}}; background: {{a.bg}}; color: {{a.fg}}; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer;"><span style="width: 10px; height: 10px; border-radius: 5px; background: {{a.dot}};"></span>{{a.label}}</button>
</template>
</div>

<section aria-label="Target viewer" style="background: #1D3149; color: #FFFFFF; border-radius: 20px; padding: 22px 24px; display: flex; flex-wrap: wrap; gap: 28px; align-items: center;">
<div style="flex: 1 1 260px; display: flex; flex-direction: column; gap: 4px;">
<span style="font-size: 12px; font-weight: 800; letter-spacing: 0.1em; color: #86DCD3;">VIEWER STORY · {{A.upper}}</span>
<div style="display: flex; align-items: baseline; gap: 8px;"><span style="font-size: 48px; font-weight: 900; line-height: 1;">{{A.now}}</span><span style="font-size: 18px; font-weight: 700; color: #C5D3E3;">/ {{A.target}} target</span></div>
<span style="font-size: 13px; color: #C5D3E3;">{{A.note}}</span>
</div>
<div style="flex: 2 1 480px; display: flex; flex-direction: column; gap: 10px;">
<div style="position: relative; height: 14px; background: #2C4664; border-radius: 7px;">
<div style="height: 100%; width: {{A.pct}}; background: #09BEAF; border-radius: 7px;"></div>
<template data-sc="for" list="{{A.marks}}" as="m" hint-placeholder-count="4"><div style="position: absolute; top: -4px; bottom: -4px; left: {{m.x}}; border-left: 2px solid {{m.color}};"></div></template>
</div>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px;">
<template data-sc="for" list="{{A.marks}}" as="m" hint-placeholder-count="4">
<div style="display: flex; flex-direction: column; gap: 2px;"><span style="font-size: 13px; font-weight: 900; color: {{m.color}};">{{m.label}}</span><span style="font-size: 12px; color: #C5D3E3;">{{m.prize}}</span></div>
</template>
</div>
</div>
</section>

<section aria-label="Metrik story" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px;">
<template data-sc="for" list="{{tiles}}" as="t" hint-placeholder-count="8">
<div style="background: #FFFFFF; border: 1px solid #E3E6EB; border-radius: 20px; padding: 16px 18px; display: flex; flex-direction: column; gap: 4px;">
<span style="font-size: 13px; font-weight: 700; color: #3B4250;">{{t.label}}</span>
<span style="font-size: 26px; font-weight: 900; letter-spacing: -0.02em; color: #1D3149;">{{t.value}}</span>
<span style="font-size: 12px; font-weight: 700; color: {{t.color}};">{{t.note}}</span>
</div>
</template>
</section>

<section aria-labelledby="tr-h" style="background: #FFFFFF; border: 1px solid #E3E6EB; border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 12px;">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 8px;">
<div style="display: flex; flex-direction: column;"><h2 id="tr-h" style="margin: 0; font-size: 18px; font-weight: 800;">Viewer story per hari</h2><span style="font-size: 13px; color: #5B6573;">Rata-rata viewer semua story hari itu. Garis putus = target berikutnya.</span></div>
<div style="display: flex; gap: 14px; font-size: 12px; font-weight: 700; color: #3B4250;"><span style="display: inline-flex; align-items: center; gap: 6px;"><span style="width: 14px; height: 3px; border-radius: 2px; background: #09BEAF;"></span>Viewer</span><span style="display: inline-flex; align-items: center; gap: 6px;"><span style="width: 14px; height: 0; border-top: 2px dashed #1D3149;"></span>{{A.nextLabel}}</span><span style="display: inline-flex; align-items: center; gap: 6px;"><span style="width: 3px; height: 12px; background: #F2A33A;"></span>Kampanye simpan nomor mulai</span></div>
</div>
<svg viewBox="0 0 640 230" width="100%" role="img" aria-label="{{chart.aria}}" style="display: block;">
<g stroke="#E3E6EB" stroke-width="1"><line x1="52" y1="190" x2="630" y2="190"></line><line x1="52" y1="145" x2="630" y2="145"></line><line x1="52" y1="100" x2="630" y2="100"></line><line x1="52" y1="55" x2="630" y2="55"></line><line x1="52" y1="10" x2="630" y2="10"></line></g>
<g fill="#5B6573" font-size="11" font-family="Nunito, sans-serif" text-anchor="end"><text x="44" y="194">0</text><text x="44" y="149">{{chart.y1}}</text><text x="44" y="104">{{chart.y2}}</text><text x="44" y="59">{{chart.y3}}</text><text x="44" y="14">{{chart.y4}}</text></g>
<g fill="#5B6573" font-size="11" font-family="Nunito, sans-serif" text-anchor="middle"><text x="70" y="212">1 Okt</text><text x="221" y="212">8</text><text x="372" y="212">15</text><text x="523" y="212">22</text><text x="613" y="212">27 Okt</text></g>
<line x1="{{chart.campX}}" y1="10" x2="{{chart.campX}}" y2="190" stroke="#F2A33A" stroke-width="2"></line>
<line x1="52" y1="{{chart.nextY}}" x2="630" y2="{{chart.nextY}}" stroke="#1D3149" stroke-width="2" stroke-dasharray="5 4"></line>
<path d="{{chart.area}}" fill="#09BEAF" opacity="0.12"></path>
<path d="{{chart.line}}" fill="none" stroke="#09BEAF" stroke-width="2" stroke-linejoin="round"></path>
<path d="{{chart.dot}}" fill="none" stroke="#FFFFFF" stroke-width="13" stroke-linecap="round"></path>
<path d="{{chart.dot}}" fill="none" stroke="#067A70" stroke-width="9" stroke-linecap="round"></path>
</svg>
</section>

<div data-island="story"></div>

<div style="display: flex; flex-wrap: wrap; gap: 22px; align-items: stretch;">
<section aria-labelledby="log-h" style="flex: 3 1 600px; min-width: 0; background: #FFFFFF; border: 1px solid #E3E6EB; border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 12px;">
<div style="display: flex; flex-direction: column;"><h2 id="log-h" style="margin: 0; font-size: 18px; font-weight: 800;">Story terakhir</h2><span style="font-size: 13px; color: #5B6573;">Chat dari story dihitung lewat kode [STORY] di tombol balas cepat.</span></div>
<div style="overflow-x: auto;">
<table style="width: 100%; min-width: 640px; border-collapse: collapse; font-size: 13px;">
<thead><tr style="text-align: right; color: #5B6573; font-size: 12px;">
<th scope="col" style="text-align: left; padding: 8px; border-bottom: 1px solid #E3E6EB; font-weight: 800;">Waktu</th>
<th scope="col" style="text-align: left; padding: 8px; border-bottom: 1px solid #E3E6EB; font-weight: 800;">Jenis</th>
<th scope="col" style="text-align: left; padding: 8px; border-bottom: 1px solid #E3E6EB; font-weight: 800;">Isi</th>
<th scope="col" style="padding: 8px; border-bottom: 1px solid #E3E6EB; font-weight: 800;">Viewer</th>
<th scope="col" style="padding: 8px; border-bottom: 1px solid #E3E6EB; font-weight: 800;">Balasan</th>
<th scope="col" style="padding: 8px; border-bottom: 1px solid #E3E6EB; font-weight: 800;">Chat</th>
<th scope="col" style="padding: 8px; border-bottom: 1px solid #E3E6EB; font-weight: 800;">Closing</th>
</tr></thead>
<tbody>
<template data-sc="for" list="{{stories}}" as="s" hint-placeholder-count="10">
<tr style="text-align: right;">
<td style="text-align: left; padding: 9px 8px; border-bottom: 1px solid #EEF0F3; color: #5B6573; white-space: nowrap;">{{s.when}}</td>
<td style="text-align: left; padding: 9px 8px; border-bottom: 1px solid #EEF0F3;"><span style="font-size: 11px; font-weight: 800; border-radius: 6px; padding: 2px 6px; background: #EEF0F3; color: #1D3149; white-space: nowrap;">{{s.type}}</span></td>
<td style="text-align: left; padding: 9px 8px; border-bottom: 1px solid #EEF0F3; font-weight: 700;">{{s.text}}</td>
<td style="padding: 9px 8px; border-bottom: 1px solid #EEF0F3; font-weight: 800;">{{s.views}}</td>
<td style="padding: 9px 8px; border-bottom: 1px solid #EEF0F3;">{{s.replies}}</td>
<td style="padding: 9px 8px; border-bottom: 1px solid #EEF0F3;">{{s.chats}}</td>
<td style="padding: 9px 8px; border-bottom: 1px solid #EEF0F3;">{{s.close}}</td>
</tr>
</template>
</tbody>
</table>
</div>
</section>

<section aria-labelledby="ty-h" style="flex: 2 1 360px; min-width: 0; background: #FFFFFF; border: 1px solid #E3E6EB; border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 12px;">
<div style="display: flex; flex-direction: column;"><h2 id="ty-h" style="margin: 0; font-size: 18px; font-weight: 800;">Jenis story yang paling jalan</h2><span style="font-size: 13px; color: #5B6573;">Balasan per 100 viewer. Story interaktif bikin orang chat.</span></div>
<template data-sc="for" list="{{types}}" as="t" hint-placeholder-count="5">
<div style="display: grid; grid-template-columns: 120px minmax(0, 1fr) 70px; align-items: center; gap: 10px;">
<span style="font-size: 13px; font-weight: 700;">{{t.name}}</span>
<div style="height: 16px; background: #F3F5F8; border-radius: 5px; overflow: hidden;"><div style="height: 100%; width: {{t.w}}; background: {{t.c}}; border-radius: 5px;"></div></div>
<span style="font-size: 12px; font-weight: 800; text-align: right;">{{t.v}}</span>
</div>
</template>
<div style="border-top: 1px solid #EEF0F3; padding-top: 12px; display: flex; flex-direction: column; gap: 8px;">
<span style="font-size: 13px; font-weight: 800;">Kontak</span>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">
<div style="display: flex; flex-direction: column;"><span style="font-size: 12px; color: #5B6573;">Kontak pelanggan</span><span style="font-size: 20px; font-weight: 900;">{{A.contacts}}</span></div>
<div style="display: flex; flex-direction: column;"><span style="font-size: 12px; color: #5B6573;">Baru disimpan bulan ini</span><span style="font-size: 20px; font-weight: 900; color: #067A70;">{{A.newSaved}}</span></div>
<div style="display: flex; flex-direction: column;"><span style="font-size: 12px; color: #5B6573;">Perkiraan simpan nomor kita</span><span style="font-size: 20px; font-weight: 900;">{{A.savedPct}}</span></div>

<div id="dc-root"></div>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":2100}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { acc: 'Garut Kota' };
  }
  renderVals() {
    var self = this;
    var acc = this.state.acc;
    var COLOR = { Rentalaja: '#2F6FD0', TripinAja: '#0FA394', Niagaaja: '#D08A1E' };
    var dec = function (n, d) { return n.toFixed(d).replace('.', ','); };
    var num = function (n) { return Math.round(n).toLocaleString('id-ID'); };
    var GOOD = '#067A70', BAD = '#9A3F0A';

    var ACC = {
      'Garut Kota': { unit: 'Rentalaja', start: 250, now: 312, peak: 1200, target: 1250, marks: [400, 600, 900, 1250], perDay: 4.2, replies: 61, chats: 58, close: 17, contacts: 4860, newSaved: 186, blocked: 3, camp: 20, seed: 3 },
      'Bandung': { unit: 'Rentalaja', start: 120, now: 148, peak: 380, target: 600, marks: [200, 300, 450, 600], perDay: 3.1, replies: 24, chats: 26, close: 8, contacts: 1940, newSaved: 74, blocked: 1, camp: 20, seed: 5 },
      'Wanaraja': { unit: 'Rentalaja', start: 52, now: 66, peak: 140, target: 250, marks: [100, 150, 200, 250], perDay: 2.0, replies: 9, chats: 12, close: 3, contacts: 610, newSaved: 28, blocked: 0, camp: 20, seed: 7 },
      'TripinAja': { unit: 'TripinAja', start: 360, now: 418, peak: 520, target: 1000, marks: [500, 650, 800, 1000], perDay: 3.4, replies: 38, chats: 32, close: 9, contacts: 3210, newSaved: 121, blocked: 0, camp: 22, seed: 9 },
      'Niagaaja': { unit: 'Niagaaja', start: 104, now: 121, peak: 190, target: 400, marks: [150, 200, 300, 400], perDay: 1.6, replies: 11, chats: 14, close: 4, contacts: 1180, newSaved: 39, blocked: 1, camp: 22, seed: 11 }
    };
    var A = ACC[acc];
    var PRIZES = ['Voucher Rp 25 rb untuk 10 viewer', 'Gratis antar 1 minggu', 'Diskon 15% semua unit', 'Undian sewa gratis 3 hari'];
    var nextIdx = A.marks.findIndex(function (m) { return m > A.now; });
    if (nextIdx < 0) nextIdx = A.marks.length - 1;
    var marks = A.marks.map(function (m, i) { var hit = A.now >= m; return { x: (m / A.target * 100) + '%', label: (hit ? '✓ ' : '') + num(m) + ' viewer', prize: PRIZES[i], color: hit ? '#86DCD3' : (i === nextIdx ? '#F2A33A' : '#C5D3E3') }; });
    var growth = (A.now - A.start) / A.start * 100;
    var Av = {
      upper: ('CS ' + acc).toUpperCase(), now: num(A.now), target: num(A.target), pct: Math.min(100, A.now / A.target * 100) + '%', marks: marks,
      note: 'Puncak dulu ±' + num(A.peak) + ' · awal bulan ' + num(A.start) + ' · naik ' + dec(growth, 0) + '% sejak kampanye simpan nomor. Target berikutnya: ' + num(A.marks[nextIdx]) + '.',
      nextLabel: 'Target berikutnya ' + num(A.marks[nextIdx]),
      contacts: num(A.contacts), newSaved: '+' + num(A.newSaved), savedPct: dec(A.now / A.contacts * 100, 1) + '%', blocked: A.blocked + 'x', blockColor: A.blocked ? BAD : '#1F2933'
    };

    var stories = Math.round(A.perDay * 27);
    var tiles = [
      { label: 'Viewer rata-rata', value: num(A.now), note: '7 hari terakhir · ▲ ' + dec(growth, 0) + '% vs awal bulan', color: GOOD },
      { label: 'Story diunggah', value: num(stories), note: dec(A.perDay, 1) + ' per hari · target 4–6', color: A.perDay >= 4 ? GOOD : BAD },
      { label: 'Balasan story', value: num(A.replies), note: dec(A.replies / stories, 1) + ' per story', color: '#5B6573' },
      { label: 'Chat dari story', value: num(A.chats), note: 'Kode [STORY] / [BC]', color: '#5B6573' },
      { label: 'Closing dari story', value: num(A.close), note: dec(A.close / A.chats * 100, 0) + '% dari chat', color: '#5B6573' },
      { label: 'Kontak baru disimpan', value: '+' + num(A.newSaved), note: 'Target +300 per bulan', color: A.newSaved >= 300 ? GOOD : BAD },
      { label: 'Jangkauan / kontak', value: dec(A.now / A.contacts * 100, 1) + '%', note: 'Viewer dibagi kontak pelanggan', color: '#5B6573' },
      { label: 'Menuju target', value: dec(A.now / A.target * 100, 0) + '%', note: 'Butuh +' + num(A.target - A.now) + ' viewer lagi', color: '#7A5200' }
    ];

    var s = A.seed;
    var rnd = function () { s = (s * 9301 + 49297) % 233280; return s / 233280; };
    var vals = [];
    for (var d = 1; d <= 27; d++) {
      var base = d < A.camp ? A.start + (A.start * 0.04) * (d / A.camp) : A.start * 1.04 + (A.now - A.start * 1.04) * ((d - A.camp) / (27 - A.camp));
      vals.push(Math.round(base * (0.9 + rnd() * 0.2)));
    }
    vals[26] = A.now;
    var nextT = A.marks[nextIdx];
    var top = Math.max(nextT, Math.max.apply(null, vals)) * 1.1;
    var X0 = 70, X1 = 613, Y0 = 190;
    var xd = function (d) { return X0 + (d - 1) / 26 * (X1 - X0); };
    var yv = function (v) { return Y0 - v / top * 180; };
    var line = vals.map(function (v, i) { return (i ? 'L' : 'M') + xd(i + 1).toFixed(1) + ' ' + yv(v).toFixed(1); }).join(' ');
    var chart = {
      line: line, area: line + ' L' + X1 + ' ' + Y0 + ' L' + X0 + ' ' + Y0 + ' Z', dot: 'M' + xd(27).toFixed(1) + ' ' + yv(A.now).toFixed(1) + ' h0',
      campX: xd(A.camp).toFixed(1), nextY: yv(nextT).toFixed(1),
      y1: num(top / 4), y2: num(top / 2), y3: num(top * 3 / 4), y4: num(top),
      aria: 'Grafik viewer story harian CS ' + acc + ' Oktober: dari ' + A.start + ' menjadi ' + A.now + ', target berikutnya ' + nextT
    };

    var ST = [
      ['27 Okt 18.30', 'Interaktif', 'Kuis: tebak lokasi foto ini', 1.12, 0.06, 0.03, 0.009],
      ['27 Okt 12.10', 'Unit ready', 'Unit ready hari ini + harga', 0.98, 0.025, 0.04, 0.012],
      ['27 Okt 08.00', 'Milestone', 'Progres viewer: tinggal sedikit lagi!', 1.04, 0.03, 0.005, 0],
      ['26 Okt 19.00', 'Lelang', 'Lelang Rp 1.000 unit akhir pekan', 1.18, 0.08, 0.05, 0.012],
      ['26 Okt 13.00', 'Testimoni', 'Foto pelanggan liburan keluarga', 0.92, 0.012, 0.006, 0.003],
      ['26 Okt 09.00', 'Promo', 'Sewa 2 hari gratis 1 hari', 0.95, 0.018, 0.03, 0.009],
      ['25 Okt 18.00', 'Interaktif', 'Polling: weekend ke mana?', 1.06, 0.05, 0.02, 0.006],
      ['25 Okt 11.30', 'Unit ready', 'Unit ready Sabtu–Minggu', 0.97, 0.022, 0.035, 0.009],
      ['24 Okt 17.45', 'Di balik layar', 'Tim cek kondisi unit', 0.84, 0.008, 0.003, 0],
      ['24 Okt 09.15', 'Promo', 'Bundling 2 barang hemat 5%', 0.9, 0.015, 0.025, 0.006]
    ];
    var storiesList = ST.map(function (r) { var v = Math.round(A.now * r[3]); return { when: r[0], type: r[1], text: r[2], views: num(v), replies: Math.round(v * r[4]), chats: Math.round(v * r[5]), close: Math.round(v * r[6]) }; });
    var TY = [['Lelang', 8.0], ['Interaktif', 5.5], ['Milestone', 3.0], ['Unit ready', 2.4], ['Promo', 1.7], ['Testimoni', 1.2], ['Di balik layar', 0.8]];
    var types = TY.map(function (t) { return { name: t[0], v: dec(t[1], 1) + ' / 100', w: (t[1] / 8 * 100) + '%', c: t[1] >= 3 ? '#09BEAF' : '#A9B4C2' }; });

    var BC = [
      ['26 Okt', 'Pelanggan lama motor', 'Promo akhir bulan: sewa 3 hari bayar 2', 0.62, 0.81, 0.07, 0.018, 0.004],
      ['22 Okt', 'Pelanggan lama iPhone & kamera', 'Unit iPhone 15 baru ready', 0.48, 0.77, 0.05, 0.012, 0.003],
      ['18 Okt', 'Semua kontak', 'Ajak simpan nomor + kampanye milestone', 1.0, 0.74, 0.04, 0.004, 0.009],
      ['11 Okt', 'Pelanggan lama Ruma Metua', 'Promo menginap 2 malam', 0.18, 0.84, 0.09, 0.024, 0.002]
    ];
    var bcs = BC.map(function (b) { var sent = Math.round(A.contacts * 0.55 * b[3]); var opt = Math.round(sent * b[7]); return { date: b[0], seg: b[1], msg: b[2], sent: num(sent), read: dec(b[4] * 100, 0) + '%', reply: num(sent * b[5]), close: num(sent * b[6]), opt: opt, optColor: opt > 10 ? BAD : '#1F2933' }; });

    var accounts = Object.keys(ACC).map(function (k) { var on = k === acc; return { label: 'CS ' + k, pressed: on ? 'true' : 'false', bg: on ? '#1D3149' : '#FFFFFF', fg: on ? '#FFFFFF' : '#1D3149', border: on ? '#1D3149' : '#E3E6EB', dot: COLOR[ACC[k].unit], pick: function () { self.setState({ acc: k }); } }; });

    return { accounts: accounts, A: Av, tiles: tiles, chart: chart, stories: storiesList, types: types, bcs: bcs };
  }
}
</script>
